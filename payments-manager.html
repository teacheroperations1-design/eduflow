<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المدفوعات - EduFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem;">
    <div class="container flex justify-between items-center">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">EduFlow</h2>
        <span class="text-sm" style="color: var(--text-secondary);">إدارة التحصيل المالي</span>
      </div>
      <a href="assistant-dashboard.html" class="btn btn-outline text-sm">العودة للرئيسية</a>
    </div>
  </header>

  <div class="container" style="margin-top: 1.5rem;">
    <!-- Summary Cards -->
    <div class="flex gap-4" style="flex-wrap: wrap; margin-bottom: 1.5rem;">
      <div class="card" style="flex: 1; min-width: 200px;">
        <div class="text-sm" style="color: var(--text-secondary);">إجمالي المطلوب</div>
        <div style="font-size: 1.75rem; font-weight: 700; margin-top: 0.5rem;" id="totalAmount">0 ج.م</div>
      </div>
      <div class="card" style="flex: 1; min-width: 200px;">
        <div class="text-sm" style="color: var(--text-secondary);">إجمالي المدفوع</div>
        <div style="font-size: 1.75rem; font-weight: 700; margin-top: 0.5rem; color: var(--success);" id="totalPaid">0 ج.م</div>
      </div>
      <div class="card" style="flex: 1; min-width: 200px;">
        <div class="text-sm" style="color: var(--text-secondary);">المتبقي</div>
        <div style="font-size: 1.75rem; font-weight: 700; margin-top: 0.5rem; color: var(--warning);" id="totalRemaining">0 ج.م</div>
      </div>
      <div class="card" style="flex: 1; min-width: 200px;">
        <div class="text-sm" style="color: var(--text-secondary);">متأخرات</div>
        <div style="font-size: 1.75rem; font-weight: 700; margin-top: 0.5rem; color: var(--danger);" id="overdueCount">0</div>
      </div>
    </div>

    <!-- Filters & Actions -->
    <div class="card" style="margin-bottom: 1.5rem;">
      <div class="flex gap-2" style="flex-wrap: wrap; align-items: center;">
        <select id="filterMonth" class="form-select" style="min-width: 150px;" onchange="loadPayments()">
          <option value="">كل الأشهر</option>
          <option value="2026-09">سبتمبر 2026</option>
          <option value="2026-10">أكتوبر 2026</option>
        </select>
        <select id="filterStatus" class="form-select" style="min-width: 150px;" onchange="loadPayments()">
          <option value="">كل الحالات</option>
          <option value="paid">مدفوع</option>
          <option value="partially_paid">مدفوع جزئياً</option>
          <option value="unpaid">غير مدفوع</option>
          <option value="overdue">متأخر</option>
        </select>
        <button onclick="openAddPaymentModal()" class="btn btn-primary" style="margin-right: auto;">+ إضافة دفعة جديدة</button>
      </div>
    </div>

    <!-- Payments List -->
    <div class="card">
      <h3 style="margin-bottom: 1rem;">سجل المدفوعات</h3>
      <div id="paymentsList"></div>
    </div>
  </div>

  <!-- Modal: Add Payment -->
  <div id="addPaymentModal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
      <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
        <h3>تسجيل دفعة جديدة</h3>
        <button onclick="closeModal()" class="btn btn-outline text-sm">✕</button>
      </div>
      <form id="paymentForm">
        <div class="form-group">
          <label class="form-label">الطالب</label>
          <select id="payStudent" class="form-select" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">الشهر</label>
          <input type="month" id="payMonth" class="form-input" required value="2026-09">
        </div>
        <div class="flex gap-2">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">المبلغ المطلوب</label>
            <input type="number" id="payAmount" class="form-input" required min="0">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">المبلغ المدفوع الآن</label>
            <input type="number" id="payPaidAmount" class="form-input" value="0" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">طريقة الدفع</label>
          <select id="payMethod" class="form-select" required>
            <option value="cash">نقدي</option>
            <option value="vodafone_cash">فودافون كاش</option>
            <option value="bank_transfer">تحويل بنكي</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ملاحظات</label>
          <textarea id="payNotes" class="form-input" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ الدفعة</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    if (!AuthService.requireRole(['super_admin', 'assistant'])) { /* redirected */ }

    const currentUser = AuthService.getCurrentUser();

    function loadSummary() {
      const summary = DataService.getPaymentSummary();
      document.getElementById('totalAmount').textContent = `${summary.total.toLocaleString()} ج.م`;
      document.getElementById('totalPaid').textContent = `${summary.paid.toLocaleString()} ج.م`;
      document.getElementById('totalRemaining').textContent = `${summary.remaining.toLocaleString()} ج.م`;
      document.getElementById('overdueCount').textContent = summary.overdue;
    }

    function loadStudents() {
      const students = DataService._getData().users.filter(u => u.role === 'student');
      const select = document.getElementById('payStudent');
      select.innerHTML = '<option value="">-- اختر الطالب --</option>';
      students.forEach(s => {
        select.innerHTML += `<option value="${s.id}">${s.name} (${s.studentId})</option>`;
      });
    }

    function loadPayments() {
      const filters = {};
      const month = document.getElementById('filterMonth').value;
      const status = document.getElementById('filterStatus').value;
      if (month) filters.month = month;
      if (status) filters.status = status;

      const payments = DataService.getPayments(filters);
      const container = document.getElementById('paymentsList');
      const data = DataService._getData();

      if (payments.length === 0) {
        container.innerHTML = '<p class="text-center" style="padding: 2rem; color: var(--text-secondary);">لا توجد مدفوعات.</p>';
        return;
      }

      container.innerHTML = payments.map(pay => {
        const student = data.users.find(u => u.id === pay.studentId);
        const group = data.groups.find(g => g.id === pay.groupId);
        const statusBadge = {
          'paid': '<span class="badge badge-success">مدفوع</span>',
          'partially_paid': '<span class="badge badge-warning">مدفوع جزئياً</span>',
          'unpaid': '<span class="badge badge-danger">غير مدفوع</span>',
          'overdue': '<span class="badge badge-danger">متأخر</span>'
        }[pay.status];

        return `
          <div class="card" style="margin-bottom: 1rem; border-right: 4px solid ${pay.status === 'paid' ? 'var(--success)' : 'var(--warning)'};">
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <div>
                <h4>${student?.name || 'طالب'} - ${pay.month}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">${group?.name || 'مجموعة'} | ${student?.studentId}</p>
              </div>
              ${statusBadge}
            </div>
            <div class="flex gap-4 text-sm" style="margin: 0.5rem 0;">
              <span>المطلوب: <strong>${pay.amount} ج.م</strong></span>
              <span>المدفوع: <strong style="color: var(--success);">${pay.paidAmount} ج.م</strong></span>
              <span>المتبقي: <strong style="color: var(--warning);">${pay.amount - pay.paidAmount} ج.م</strong></span>
            </div>
            ${pay.paidAmount < pay.amount ? `<button onclick="openRecordPaymentModal('${pay.id}')" class="btn btn-primary btn-block" style="margin-top: 0.5rem;">تسجيل دفعة</button>` : ''}
          </div>
        `;
      }).join('');
    }

    function openAddPaymentModal() {
      document.getElementById('addPaymentModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('addPaymentModal').classList.add('hidden');
    }

    document.getElementById('paymentForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const studentId = document.getElementById('payStudent').value;
      const student = DataService._getData().users.find(u => u.id === studentId);
      if (!student) return;

      const paymentData = {
        studentId: studentId,
        groupId: student.groupId,
        month: document.getElementById('payMonth').value,
        amount: parseInt(document.getElementById('payAmount').value),
        paidAmount: parseInt(document.getElementById('payPaidAmount').value),
        status: 'unpaid',
        paymentMethod: document.getElementById('payMethod').value,
        notes: document.getElementById('payNotes').value,
        createdBy: currentUser.id
      };

      if (paymentData.paidAmount >= paymentData.amount) {
        paymentData.status = 'paid';
      } else if (paymentData.paidAmount > 0) {
        paymentData.status = 'partially_paid';
      }

      const result = DataService.addPayment(paymentData);
      if (result.success) {
        alert('تم حفظ الدفعة بنجاح.');
        closeModal();
        e.target.reset();
        loadSummary();
        loadPayments();
      }
    });

    function openRecordPaymentModal(paymentId) {
      const amount = prompt('أدخل مبلغ الدفعة:');
      if (!amount || isNaN(amount) || amount <= 0) return;

      const method = prompt('طريقة الدفع (cash / vodafone_cash / bank_transfer):', 'cash');
      if (!method) return;

      const notes = prompt('ملاحظات (اختياري):', '') || '';

      const result = DataService.recordPayment(paymentId, parseInt(amount), method, notes);
      if (result.success) {
        alert('تم تسجيل الدفعة.');
        loadSummary();
        loadPayments();
      }
    }

    // Init
    loadSummary();
    loadStudents();
    loadPayments();
  </script>
</body>
</html>
