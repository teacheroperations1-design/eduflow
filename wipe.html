<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسح البيانات - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .wipe-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px}
    .wipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:440px;width:100%;text-align:center;backdrop-filter:blur(20px)}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <div class="wipe-wrap">
    <div class="wipe-card">
      <div style="font-size:56px;">🧹</div>
      <h2 style="margin:12px 0 4px;">مسح كل البيانات</h2>
      <p class="text-sm text-muted" style="margin-bottom:20px;">هيتم حذف كل البيانات المخزنة محلياً (طلاب، مدرسين، حضور، واجبات، إعدادات...) والبدء من الصفر</p>
      <button class="btn btn-danger w-full btn-lg" onclick="doWipe()">🗑️ امسح كل حاجة وابدأ نضيف</button>
      <a href="index.html" class="btn btn-ghost w-full" style="margin-top:8px;">إلغاء</a>
    </div>
  </div>
  <script>
    function doWipe(){
      if(!confirm('تحذير: هيتم حذف كل البيانات نهائياً ولا يمكن التراجع. متابعة؟')) return;
      // امسح كل مفاتيح localStorage اللي بتبدأ بـ eduflow
      Object.keys(localStorage).forEach(k=>{ if(k.startsWith('eduflow')) localStorage.removeItem(k); });
      // امسح sessionStorage (الجلسات)
      sessionStorage.clear();
      alert('✅ تم مسح كل البيانات. هتحوّل لصفحة الإعداد...');
      location.href = 'setup.html';
    }
  </script>
</body>
</html>
