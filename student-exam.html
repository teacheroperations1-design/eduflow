<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .exam-topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .countdown{font-family:var(--font-en);font-size:20px;font-weight:900;color:var(--primary);background:var(--primary-soft);padding:4px 14px;border-radius:8px}
    .countdown.danger{color:var(--danger);background:var(--danger-bg);animation:blink 1s infinite}
    @keyframes blink{50%{opacity:.5}}
    .viol-badge{background:var(--danger);color:#fff;border-radius:9999px;padding:3px 12px;font-size:11px;font-weight:800;font-family:var(--font-en)}
    .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .q-card.flagged{border-color:var(--warning)}
    .q-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-en);margin-inline-end:8px}
    .q-opt{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all var(--t)}
    .q-opt:hover{border-color:var(--primary)}
    .q-opt.selected{border-color:var(--primary);background:var(--primary-bg)}
    .q-time-warn{font-size:10px;color:var(--warning);font-weight:700}
    .anti-cheat-banner{background:var(--warning-bg);border:1px solid var(--warning);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--warning);margin-bottom:14px;line-height:1.8}
    .gate-card{max-width:480px;margin:60px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:28px;text-align:center}
    .result-hero{background:var(--grad);color:#fff;border-radius:var(--radius-xl);padding:30px;text-align:center;margin:20px 0}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="exam-topbar" id="topbar" style="display:none;">
    <div style="flex:1;min-width:0;"><strong id="exTitle">🎓 الامتحان</strong><div class="text-xs text-muted" id="exMeta"></div></div>
    <span class="viol-badge" id="violBadge" style="display:none;">⚠️ 0/3</span>
    <span class="countdown" id="countdown">--:--</span>
  </div>
  <div style="max-width:760px;margin:0 auto;padding:16px;position:relative;z-index:1;">
    <div id="exArea"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>

  <script>
    const db=()=>DataService?._getData()||{};
    let currentUser=null, exam=null, started=false, submitted=false;
    let violations=0, suspicious=[], qStart=Date.now(), qWarnedAt={};
    let endTime=0, countdownInt=null;
    const MAX_V=3, Q_WARN_MS=120000, Q_FLAG_MS=240000;

    (async function boot(){
      try{
        if(typeof DataService?.init==='function') await DataService.init();
        currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
        if(!currentUser || currentUser.role!=='student'){
          document.getElementById('exArea').innerHTML='<div class="gate-card"><div style="font-size:44px;">🔐</div><p>سجّل دخول كطالب أولاً</p><a class="btn btn-primary w-full" href="login.html">دخول</a></div>';
          return;
        }
        const exId = new URLSearchParams(location.search).get('ex');
        if(!exId){ window.renderExList(); return; }
        exam = DataService?.getExamById ? DataService.getExamById(exId) : null;
        if(!exam){ document.getElementById('exArea').innerHTML='<div class="gate-card">الامتحان غير موجود</div>'; return; }

        // محاولات سابقة؟
        const myAtt = DataService.getExamAttempts({studentId:currentUser.id,examId:exam.id});
        if(myAtt.length>=(exam.maxAttempts||1)){
          document.getElementById('exArea').innerHTML=`<div class="result-hero"><div style="font-size:52px;">🔒</div><h2>تم تسليم امتحانك</h2><p style="opacity:.9;">النتيجة عند الإدارة — مش بتظهر للطالب</p></div><a href="student-dashboard.html" class="btn btn-secondary w-full">→ العودة</a>`;
          return;
        }
        // بوابة كود الدخول لامتحان الحصة
        if(exam.mode==='class'){
          document.getElementById('exArea').innerHTML=`<div class="gate-card">
            <div style="font-size:44px;"></div><h3>امتحان حصة</h3>
            <p class="text-sm text-muted" style="margin:8px 0;">اكتب كود الدخول اللي قاله الأستاذ</p>
            <div class="form-group"><input type="text" id="entryCode" class="form-input" placeholder="EXAM-XXXX" style="text-align:center;font-family:var(--font-en);letter-spacing:2px;"></div>
            <button class="btn btn-primary w-full" onclick="window.checkEntryCode()">🔓 دخول الامتحان</button>
          </div>`;
          return;
        }
        window.renderGate();
      }catch(err){
        console.error(err);
        document.getElementById('exArea').innerHTML='<div class="gate-card">خطأ: '+err.message+'</div>';
      }
    })();

    window.renderExList=function(){
      try{
        const teachers = DataService.getStudentTeachers(currentUser.id);
        const list = DataService.getExams().filter(e=>teachers.some(t=>t.group?.id===e.groupId));
        document.getElementById('exArea').innerHTML = list.length ? list.map(e=>{
          const att = DataService.getExamAttempts({studentId:currentUser.id}).find(a=>a.examId===e.id);
          const modeLabel=e.mode==='home'?'🏠 منزلي':e.mode==='class'?'🏫 حصة (بكود)':'📝 ورقي';
          return `<div class="q-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div><strong>${e.title}</strong><div class="text-xs text-muted">${modeLabel} · ⏱️ ${e.duration||60}د</div></div>
            ${e.mode==='offline'?'<span class="badge badge-muted">يُعمل في الحصة</span>':att?'<span class="badge badge-success">تم التسليم 🔒</span>':`<button class="btn btn-primary btn-sm" onclick="location.href='student-exam.html?ex=${e.id}'">🎮 دخول</button>`}
          </div>`;
        }).join('') : '<div class="gate-card">لا امتحانات متاحة</div>';
      }catch(e){console.error(e);}
    };

    window.checkEntryCode=function(){
      try{
        const val=(document.getElementById('entryCode')?.value||'').trim().toUpperCase();
        const correct=(exam.backupCode||'').toUpperCase();
        if(!correct||val!==correct){
          if(typeof ThemeManager?.toast==='function') ThemeManager.toast('❌ الكود غير صحيح','error');
          return;
        }
        window.renderGate();
      }catch(e){console.error(e);}
    };

    window.renderGate=function(){
      try{
        document.getElementById('exArea').innerHTML=`<div class="gate-card">
          <div style="font-size:44px;">🎓</div>
          <h3>${exam.title}</h3>
          <div class="text-sm text-muted" style="margin:10px 0;line-height:1.9;">
            ❓ ${(exam.questions||[]).length} سؤال · ⏱️ ${exam.duration||60} دقيقة<br>
            🛡️ حماية غش مفعّلة + ملء شاشة إجباري<br>
            🔒 النتيجة بتظهر للإدارة فقط
          </div>
          <button class="btn btn-primary btn-lg w-full" onclick="window.startExam()">▶️ ابدأ الامتحان</button>
        </div>`;
      }catch(e){console.error(e);}
    };

    window.startExam=function(){
      try{
        started=true;
        // ملء الشاشة
        try{ document.documentElement.requestFullscreen?.(); }catch(e){}
        document.getElementById('topbar').style.display='flex';
        document.getElementById('exTitle').textContent='🎓 '+exam.title;
        document.getElementById('exMeta').textContent=(exam.questions||[]).length+' سؤال';
        // مؤقّت
        endTime = Date.now()+(exam.duration||60)*60000;
        countdownInt=setInterval(window.tickCountdown,1000);
        window.tickCountdown();
        // خلط الأسئلة لو مطلوب
        let qs=[...(exam.questions||[])];
        if(exam.randomizeQuestions) qs.sort(()=>Math.random()-0.5);
        exam._renderQs=qs;
        document.getElementById('exArea').innerHTML=`
          <div class="anti-cheat-banner">🛡️ <strong>تحذير:</strong> الخروج من الصفحة/ملء الشاشة = تحذير، وعند 3 تحذيرات أو انتهاء الوقت بيتم التسليم تلقائياً. النتيجة مش بتظهرلك — بتظهر للإدارة.</div>
          ${qs.map((q,i)=>{
            const opts = q.type==='mcq'?(q.options||[]):q.type==='truefalse'?['صح','خطأ']:null;
            return `<div class="q-card" data-q="${q.id}">
              <div style="margin-bottom:10px;"><span class="q-num">${i+1}</span><strong>${q.text||''}</strong> <span class="q-time-warn" id="qw_${q.id}"></span></div>
              ${opts?opts.map((o,oi)=>{const val=q.type==='mcq'?oi:(oi===0?'true':'false');return `<label class="q-opt" onclick="window.pickOpt('${q.id}',this)"><input type="radio" name="q_${q.id}" value="${val}" style="accent-color:var(--primary);"><span>${o||''}</span></label>`;}).join(''):`<textarea class="form-textarea" rows="3" data-short="${q.id}"></textarea>`}
            </div>`;
          }).join('')}
          <button class="btn btn-success btn-lg w-full" onclick="window.submitExamNow()">📤 تسليم نهائي</button>`;
        window.bindAntiCheat();
        window.startQTimer();
      }catch(e){console.error(e);}
    };

    window.pickOpt=function(qid,el){
      try{
        el.closest('.q-card').querySelectorAll('.q-opt').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected'); el.querySelector('input').checked=true;
        qStart=Date.now();
      }catch(e){}
    };

    window.tickCountdown=function(){
      try{
        const left=endTime-Date.now();
        const el=document.getElementById('countdown');
        if(left<=0){ el.textContent='00:00'; if(!submitted){ if(typeof ThemeManager?.toast==='function')ThemeManager.toast('⏰ انتهى الوقت — تسليم تلقائي','warning'); window.submitExamNow(true);} return; }
        const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
        el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        el.classList.toggle('danger',left<60000);
      }catch(e){}
    };

    window.startQTimer=function(){
      setInterval(()=>{
        if(!started||submitted)return;
        const elapsed=Date.now()-qStart;
        document.querySelectorAll('.q-card[data-q]').forEach(c=>{
          const qid=c.dataset.q;
          const warnEl=document.getElementById('qw_'+qid);
          if(c.contains(document.activeElement)||c.querySelector('input:checked')){
            if(elapsed>Q_FLAG_MS){ c.classList.add('flagged'); if(warnEl)warnEl.textContent='🚩 وقت طويل جداً'; if(!qWarnedAt[qid+'_f']){qWarnedAt[qid+'_f']=1;suspicious.push({type:'long_time',question:qid,at:new Date().toISOString()});} }
            else if(elapsed>Q_WARN_MS){ c.classList.add('flagged'); if(warnEl)warnEl.textContent='⏰ وقت طويل على السؤال'; }
          }
        });
      },5000);
    };

    window.bindAntiCheat=function(){
      document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!submitted) window.registerViolation('الخروج من صفحة الامتحان'); });
      window.addEventListener('blur',()=>{ if(!submitted) window.registerViolation('الخروج من نافذة الامتحان'); });
      document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&started&&!submitted) window.registerViolation('الخروج من ملء الشاشة'); });
      document.addEventListener('contextmenu',e=>{ if(started&&!submitted)e.preventDefault(); });
      document.addEventListener('keydown',e=>{
        if(!submitted&&((e.ctrlKey&&['c','v','u'].includes(e.key.toLowerCase()))||e.key==='F12')){ e.preventDefault(); window.registerViolation('محاولة نسخ/أدوات مطور'); }
      });
    };

    window.registerViolation=function(reason){
      violations++;
      suspicious.push({type:'violation',reason,at:new Date().toISOString()});
      const badge=document.getElementById('violBadge');
      if(badge){badge.style.display='inline-block';badge.textContent='⚠️ '+violations+'/'+MAX_V;}
      if(violations>=MAX_V){ window.submitExamNow(true); }
      else if(typeof ThemeManager?.toast==='function') ThemeManager.toast('⚠️ تحذير '+violations+'/'+MAX_V+': '+reason,'error');
    };

    window.submitExamNow=async function(auto){
      try{
        if(submitted)return;
        submitted=true;
        if(countdownInt)clearInterval(countdownInt);
        const answers=[];
        (exam._renderQs||exam.questions||[]).forEach(q=>{
          if(q.type==='short'){ const ta=document.querySelector(`textarea[data-short="${q.id}"]`); answers.push({questionId:q.id,answer:ta?ta.value.trim():''}); }
          else{ const sel=document.querySelector(`input[name="q_${q.id}"]:checked`); answers.push({questionId:q.id,answer:sel?sel.value:''}); }
        });
        await DataService.submitExamAttempt({
          examId:exam.id, studentId:currentUser.id, answers,
          startTime:new Date(endTime-(exam.duration||60)*60000).toISOString(),
          suspiciousActivities:suspicious.concat([{type:'summary',violations,autoSubmitted:!!auto}])
        });
        document.getElementById('topbar').style.display='none';
        document.getElementById('exArea').innerHTML=`<div class="result-hero">
          <div style="font-size:52px;">${auto?'⏰':'🎉'}</div>
          <h2>تم تسليم الامتحان${auto?' (تلقائياً)':''}!</h2>
          <p style="opacity:.95;margin-top:8px;">🔒 درجتك مش هتظهر هنا — النتيجة عند الإدارة بس</p>
          ${violations>0?`<p style="opacity:.8;font-size:12px;margin-top:8px;">⚠️ تم تسجيل ${violations} ملاحظة حماية على محاولتك</p>`:''}
        </div>
        <a href="student-dashboard.html" class="btn btn-secondary w-full">→ العودة للداشبورد</a>`;
      }catch(e){
        submitted=false;
        console.error(e);
        if(typeof ThemeManager?.toast==='function') ThemeManager.toast('خطأ في التسليم','error');
      }
    };
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
