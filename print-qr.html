<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة وتصدير باركودات الطلاب | EduFlow</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --primary:#6366f1;--primary-light:#818cf8;--primary-dark:#4f46e5;
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;
  --bg:#f8fafc;--surface:#ffffff;--surface-hover:#f1f5f9;--border:#e2e8f0;
  --text:#0f172a;--text-secondary:#475569;--text-muted:#94a3b8;
  --font-en:'Fira Code','Courier New',monospace;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0/.05);
  --shadow-md:0 4px 6px -1px rgb(0 0 0/.05),0 2px 4px -2px rgb(0 0 0/.05);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0/.05),0 4px 6px -4px rgb(0 0 0/.05);
  --cols:4; --qr-size:30mm; --sheet-gap:10px;
}
[data-theme="dark"]{--bg:#0b1120;--surface:#1e293b;--surface-hover:#334155;--border:#334155;--text:#f8fafc;--text-secondary:#cbd5e1;--text-muted:#64748b;}
body{font-family:'Cairo',sans-serif;background:var(--bg);background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:24px 24px;color:var(--text);margin:0;min-height:100vh;}
body[data-shape="vertical"]{--qr-size:30mm;}
body[data-shape="square"]{--qr-size:34mm;}
body[data-shape="landscape"]{--qr-size:26mm;}
.page-container{max-width:1400px;margin:0 auto;padding:24px;}
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;margin-bottom:30px;box-shadow:var(--shadow-lg);position:relative;overflow:hidden;}
.toolbar::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary),#8b5cf6,#ec4899);}
.toolbar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
.toolbar-title{display:flex;align-items:center;gap:14px;}
.toolbar-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--primary),#8b5cf6);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;}
.toolbar-title h1{margin:0;font-size:20px;font-weight:800;}
.toolbar-title p{margin:3px 0 0;font-size:12px;color:var(--text-muted);}
.filters-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px;}
.filter-box{background:var(--surface-hover);border:1px solid var(--border);border-radius:14px;padding:12px;}
.filter-box label{display:block;font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:6px;}
.print-settings{background:linear-gradient(135deg,rgba(99,102,241,.06),rgba(139,92,246,.06));border:1px solid var(--primary-light);border-radius:18px;padding:18px;margin-bottom:16px;}
.print-settings-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;margin-bottom:14px;color:var(--primary-dark);}
[data-theme="dark"] .print-settings-title{color:var(--primary-light);}
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;}
.setting-group{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;}
.setting-label{font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.shape-options,.size-options{display:flex;gap:6px;flex-wrap:wrap;}
.shape-btn,.size-btn{padding:8px 12px;background:var(--surface-hover);border:2px solid var(--border);border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;color:var(--text-secondary);flex:1;min-width:60px;font-family:inherit;transition:all .2s;}
.shape-btn:hover,.size-btn:hover{border-color:var(--primary);color:var(--primary);}
.shape-btn.active,.size-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;}
.slider-container{display:flex;align-items:center;gap:10px;}
.slider-container input[type="range"]{flex:1;height:6px;background:var(--surface-hover);border-radius:3px;outline:none;-webkit-appearance:none;}
.slider-container input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--primary);border-radius:50%;cursor:pointer;}
.slider-container input[type="range"]:disabled{opacity:.4;}
.slider-value{background:var(--primary);color:#fff;padding:3px 10px;border-radius:8px;font-weight:800;font-family:var(--font-en);font-size:13px;min-width:36px;text-align:center;}
.switch-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:12px;margin-bottom:7px;}
.switch-input{position:absolute;opacity:0;width:0;height:0;}
.switch{position:relative;width:40px;height:22px;background:var(--surface-hover);border:2px solid var(--border);border-radius:11px;transition:all .2s;flex-shrink:0;}
.switch::after{content:'';position:absolute;top:2px;right:2px;width:14px;height:14px;background:var(--text-muted);border-radius:50%;transition:all .2s;}
.switch-input:checked + .switch{background:var(--primary);border-color:var(--primary);}
.switch-input:checked + .switch::after{right:20px;background:#fff;}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.stat-pill{background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:12px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;}
.stat-pill strong{color:var(--primary);font-family:var(--font-en);font-size:15px;font-weight:800;}
.stat-pill.highlight{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(139,92,246,.12));border-color:var(--primary-light);}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn-action{padding:11px 20px;border-radius:12px;font-weight:700;font-size:13px;border:none;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;transition:all .2s;}
.btn-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.btn-primary-action{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;}
.btn-success-action{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-warning-action{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;}
.btn-pdf-action{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;}
.btn-ghost-action{background:var(--surface);color:var(--text-secondary);border:1px solid var(--border);}
/* 📄 الأوراق */
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin:0 auto 22px;box-shadow:var(--shadow-lg);}
.sheet-hidden{display:none!important;}
.sheet-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:800;color:var(--text-secondary);background:var(--surface-hover);border:1px dashed var(--border);border-radius:8px;padding:5px 10px;margin-bottom:10px;flex-wrap:wrap;}
.sheet-grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:var(--sheet-gap);align-content:start;}
body.compact-print .sheet-grid{gap:6px;}
.qr-card{position:relative;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;height:auto;color:var(--text);}
.qr-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.2);}
body[data-shape="landscape"] .qr-card{flex-direction:row;text-align:right;gap:10px;padding:8px 10px;align-items:center;}
.qr-wrap{background:#fff;border:1px solid var(--border);border-radius:8px;padding:4px;flex-shrink:0;line-height:0;}
.qr-wrap img{display:block;width:var(--qr-size);height:var(--qr-size);}
.card-txt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;}
body[data-shape="landscape"] .card-txt{align-items:flex-start;}
.card-name{font-size:12px;font-weight:800;line-height:1.3;margin:0;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-code{font-family:var(--font-en);font-size:11px;font-weight:800;letter-spacing:1px;color:var(--primary);background:var(--surface-hover);border:1px dashed var(--border);border-radius:99px;padding:1px 10px;}
.card-meta{font-size:9px;color:var(--text-muted);margin:0;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-brand{font-size:8px;color:var(--text-muted);opacity:.85;margin:0;}
.card-checkwrap{position:absolute;top:4px;left:4px;z-index:3;}
body[data-shape="landscape"] .card-checkwrap{top:4px;left:auto;right:4px;}
.card-checkwrap input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;}
.cm{position:absolute;width:9px;height:9px;pointer-events:none;display:none;z-index:4;}
body.show-cut-marks .cm{display:block;}
.cm-tl{top:-1px;left:-1px;border-top:2px dashed var(--text-muted);border-left:2px dashed var(--text-muted);}
.cm-tr{top:-1px;right:-1px;border-top:2px dashed var(--text-muted);border-right:2px dashed var(--text-muted);}
.cm-bl{bottom:-1px;left:-1px;border-bottom:2px dashed var(--text-muted);border-left:2px dashed var(--text-muted);}
.cm-br{bottom:-1px;right:-1px;border-bottom:2px dashed var(--text-muted);border-right:2px dashed var(--text-muted);}
/* 📥 وضع التقاط PDF */
body.pdf-capture .sheet-label,body.pdf-capture .card-checkwrap,body.pdf-capture .pager-bar,body.pdf-capture .toolbar{display:none!important;}
body.pdf-capture .sheet{box-shadow:none!important;border:none!important;margin:0!important;padding:0!important;background:#fff!important;border-radius:0!important;}
body.pdf-capture .sheet-hidden{display:block!important;}
body.pdf-capture .sheet-grid{gap:2.5mm!important;}
body.pdf-capture .qr-card{background:#fff!important;border:0.4pt solid #aaa!important;color:#000!important;border-radius:2.5mm!important;}
body.pdf-capture .card-name{color:#000!important;}
body.pdf-capture .card-code{color:#000!important;background:none!important;border:none!important;}
body.pdf-capture .card-meta{color:#444!important;}
body.pdf-capture .card-brand{color:#888!important;}
body.pdf-capture .qr-wrap{border:none!important;padding:0!important;}
body.pdf-capture .cm{display:block!important;border-style:solid!important;border-color:#000!important;}
/* 📄 ترقيم الصفحات */
.pager-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-bottom:14px;position:sticky;top:8px;z-index:60;box-shadow:var(--shadow-md);}
.pg-btn{padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface-hover);color:var(--text);cursor:pointer;font-weight:800;font-size:12px;font-family:inherit;}
.pg-btn:disabled{opacity:.4;cursor:not-allowed;}
.pg-num{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-hover);cursor:pointer;font-weight:800;font-family:var(--font-en);font-size:12px;color:var(--text);}
.pg-num.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.pg-dot{opacity:.55;font-weight:900;}
#pgInfo{font-size:11px;color:var(--text-muted);font-weight:700;margin-inline-start:auto;}
.empty-state{text-align:center;padding:60px 20px;background:var(--surface);border:1px dashed var(--border);border-radius:16px;}
.empty-state-icon{font-size:56px;margin-bottom:12px;opacity:.5;}
.form-select,.form-input{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600;color:var(--text);width:100%;font-family:inherit;}
.form-select:focus,.form-input:focus{outline:none;border-color:var(--primary);}
.btn{padding:8px 14px;border-radius:10px;font-weight:700;font-size:12px;border:none;cursor:pointer;font-family:inherit;}
.btn-sm{padding:6px 10px;font-size:11px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-secondary);}
.btn-icon{padding:7px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);z-index:9999;padding:24px;overflow-y:auto;}
.modal-content{max-width:900px;margin:36px auto;background:var(--surface);border-radius:22px;padding:28px;border:1px solid var(--border);}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-height:60vh;overflow-y:auto;padding:12px;background:var(--surface-hover);border-radius:14px;}
/* 🖨️ PRINT */
@media print{
  @page{margin:6mm;}
  body{background:#fff!important;background-image:none!important;color:#000!important;margin:0;padding:0;}
  .no-print,.toolbar,.sheet-label,.card-checkwrap,.pager-bar{display:none!important;}
  .page-container{max-width:100%!important;padding:0!important;margin:0!important;}
  .sheet{display:block!important;border:none!important;box-shadow:none!important;padding:0!important;margin:0!important;background:#fff!important;border-radius:0!important;break-after:page;page-break-after:always;color:#000!important;}
  .sheet:last-of-type{break-after:auto;page-break-after:auto;}
  .sheet-grid{gap:2.5mm!important;}
  body.compact-print .sheet-grid{gap:1.5mm!important;}
  .qr-card{background:#fff!important;border:0.4pt solid #aaa!important;border-radius:2.5mm!important;padding:1.6mm 1.2mm!important;height:auto!important;break-inside:avoid;page-break-inside:avoid;color:#000!important;box-shadow:none!important;transform:none!important;}
  .qr-wrap{border:none!important;padding:0!important;background:#fff!important;}
  .card-name{color:#000!important;font-size:9.5pt!important;}
  .card-code{color:#000!important;background:none!important;border:none!important;padding:0!important;font-size:8.5pt!important;}
  .card-meta{color:#444!important;font-size:6.8pt!important;}
  .card-brand{color:#888!important;font-size:5.8pt!important;margin-top:1mm!important;font-weight:600;}
  .cm{width:4.5mm;height:4.5mm;}
  body.show-cut-marks .cm{display:block!important;border-style:solid!important;border-color:#000!important;}
  .cm-tl{top:-2.2mm;left:-2.2mm;border-top:0.5pt solid #000;border-left:0.5pt solid #000;border-bottom:none;border-right:none;}
  .cm-tr{top:-2.2mm;right:-2.2mm;border-top:0.5pt solid #000;border-right:0.5pt solid #000;border-bottom:none;border-left:none;}
  .cm-bl{bottom:-2.2mm;left:-2.2mm;border-bottom:0.5pt solid #000;border-left:0.5pt solid #000;border-top:none;border-right:none;}
  .cm-br{bottom:-2.2mm;right:-2.2mm;border-bottom:0.5pt solid #000;border-right:0.5pt solid #000;border-top:none;border-left:none;}
}
</style>
</head>
<body data-theme="dark" data-shape="vertical" data-page="a4">

<div class="page-container">
  <div class="toolbar no-print">
    <div class="toolbar-header">
      <div class="toolbar-title">
        <div class="toolbar-icon">🖨️</div>
        <div><h1>الطباعة الذكية للباركودات</h1><p>فلاتر متتابعة ذكية + تعبئة تلقائية + تصدير PDF</p></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-ghost" onclick="window.goBack()">← رجوع</button>
        <button class="btn btn-secondary" id="themeToggle">🌓</button>
      </div>
    </div>

    <div class="filters-grid">
      <div class="filter-box"><label>🏢 السنتر</label>
        <select id="prCenter" class="form-select" onchange="window.onFilterChange()"><option value="">كل السناتر</option></select>
      </div>
      <div class="filter-box"><label>🎓 المرحلة</label>
        <select id="prStage" class="form-select" onchange="window.onFilterChange()"><option value="">كل المراحل</option></select>
      </div>
      <div class="filter-box"><label>📚 الصف</label>
        <select id="prGrade" class="form-select" onchange="window.onFilterChange()"><option value="">كل الصفوف</option></select>
      </div>
      <div class="filter-box"><label>👥 المجموعة</label>
        <select id="prGroup" class="form-select" onchange="window.onFilterChange()"><option value="all">🌍 كل الطلاب</option></select>
        <input type="text" id="prGroupSearch" class="form-input" style="margin-top:6px;padding:6px 10px;font-size:11px;" placeholder="🔍 ابحث داخل المجموعات..." oninput="window.onGroupSearch()">
      </div>
      <div class="filter-box"><label>🎯 نوع البطاقات</label>
        <select id="prType" class="form-select" onchange="window.onFilterChange()">
          <option value="students">🎓 طلاب فقط</option>
          <option value="all">الكل + واتساب</option>
          <option value="groups">💬 واتساب جروبات</option>
        </select>
      </div>
      <div class="filter-box"><label>🔍 بحث طالب</label>
        <input type="text" id="prSearch" class="form-input" placeholder="اسم أو كود..." oninput="window.onSearchChange()">
      </div>
    </div>

    <div class="print-settings">
      <div class="print-settings-title"><span>⚙️</span><span>محرك الطباعة الذكي</span></div>
      <div class="settings-grid">
        <div class="setting-group">
          <div class="setting-label">📐 شكل الكارت</div>
          <div class="shape-options">
            <button class="shape-btn active" data-shape="vertical" onclick="window.setShape('vertical',this)">📄 عمودي</button>
            <button class="shape-btn" data-shape="square" onclick="window.setShape('square',this)">⬛ مربع</button>
            <button class="shape-btn" data-shape="landscape" onclick="window.setShape('landscape',this)">💳 بطاقة</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">🤖 التعبئة الذكية <span class="slider-value" id="cardsPerPageValue">-</span></div>
          <label class="switch-label"><input type="checkbox" class="switch-input" id="autoFillToggle" checked onchange="window.toggleAutoFill(this.checked)"><span class="switch"></span><span>ملء الورقة تلقائياً</span></label>
          <div class="slider-container">
            <span style="font-size:11px;">2</span>
            <input type="range" id="cardsPerPageSlider" min="2" max="40" value="12" oninput="window.updateCardsPerPage(this.value)">
            <span style="font-size:11px;">40</span>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">📃 حجم الورقة</div>
          <div class="size-options">
            <button class="size-btn active" data-size="a4" onclick="window.setPageSize('a4',this)">A4</button>
            <button class="size-btn" data-size="a5" onclick="window.setPageSize('a5',this)">A5</button>
            <button class="size-btn" data-size="a3" onclick="window.setPageSize('a3',this)">A3</button>
            <button class="size-btn" data-size="letter" onclick="window.setPageSize('letter',this)">Letter</button>
          </div>
        </div>
        <div class="setting-group">
          <div class="setting-label">✨ خيارات</div>
          <label class="switch-label"><input type="checkbox" class="switch-input" id="cutMarksToggle" checked onchange="window.toggleCutMarks(this.checked)"><span class="switch"></span><span>✂️ علامات القص</span></label>
          <label class="switch-label"><input type="checkbox" class="switch-input" id="compactPrintToggle" onchange="window.toggleCompact(this.checked)"><span class="switch"></span><span>🗜️ طباعة مضغوطة</span></label>
        </div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-pill">📊 الإجمالي: <strong id="totalCount">0</strong></div>
      <div class="stat-pill">🎓 طلاب: <strong id="studentsCount">0</strong></div>
      <div class="stat-pill">💬 جروبات: <strong id="groupsCount">0</strong></div>
      <div class="stat-pill highlight">📄 صفحات: <strong id="pagesCount">0</strong></div>
      <div class="stat-pill highlight">🤖 كارت/صفحة: <strong id="perPageCount">0</strong></div>
      <div class="stat-pill highlight" style="margin-inline-start:auto;">✅ مختار: <strong id="selectedCount">0</strong></div>
    </div>

    <div class="actions-row">
      <button class="btn-action btn-primary-action" onclick="window.printAll()">🖨️ طباعة الكل</button>
      <button class="btn-action btn-primary-action" onclick="window.printSelected()">🎯 طباعة المختارة</button>
      <button class="btn-action btn-pdf-action" onclick="window.downloadPDF()">📥 تحميل PDF</button>
      <button class="btn-action btn-ghost-action" onclick="window.showPreview()">👁️ معاينة</button>
      <button class="btn-action btn-warning-action" onclick="window.downloadAllAsZip()">📦 ZIP</button>
      <button class="btn-action btn-success-action" onclick="window.exportCSV()">📊 CSV</button>
      <button class="btn-action btn-ghost-action" onclick="window.selectAll()">✅ تحديد الكل</button>
      <button class="btn-action btn-ghost-action" onclick="window.deselectAll()">❌ إلغاء</button>
    </div>
  </div>

  <div class="pager-bar no-print" id="pagerBar">
    <button class="pg-btn" id="pgPrev" onclick="window.pgGo(window._curPage-1)">السابق ›</button>
    <div id="pgNums" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;"></div>
    <button class="pg-btn" id="pgNext" onclick="window.pgGo(window._curPage+1)">‹ التالي</button>

<script>
const SITE_BASE='https://eduflow-nine-dusky.vercel.app/';
const qrData=(code,type='student')=>{
  if(type==='teacher')return SITE_BASE+'teacher-dashboard.html';
  if(type==='group')return SITE_BASE;
  return SITE_BASE+'student-qr.html?code='+encodeURIComponent(code);
};
const qrImg=(code,size,type='student')=>{
  const url=type==='group'?(allCards.find(c=>c.code===code)?.whatsappLink||SITE_BASE):qrData(code,type);
  return 'https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(url)+'&bgcolor=ffffff&color=0f172a&margin=12';
};
let currentUser=null,currentShape='vertical',currentPageSize='a4',autoFill=true,manualPerPage=12,cardsPerPage=12;
let selectedCards=new Set(),allCards=[],sheetsCount=0,branding={};
window._curPage=1; window._viewAll=false; window._overrideList=null; window.__tmpAll=0;
function toast(m,t){ if(typeof ThemeManager?.toast==='function') ThemeManager.toast(m,t||'info'); }
function val(id){ var e=document.getElementById(id); return e?e.value:''; }
function norm(s){ return String(s==null?'':s).toLowerCase().replace(/[\u064B-\u0652]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim(); }
function uniq(a){ return a.filter(function(x,i){ return a.indexOf(x)===i; }); }
function stageLabel(k){ try{ return ((typeof EduFlowConfig!=='undefined'?EduFlowConfig.educationLevels:{})[k]||{}).nameAr||k; }catch(e){ return k; } }
function brandLine(){
  try{
    var b=null;
    try{ if(window.DataService&&DataService.getBranding) b=DataService.getBranding(); }catch(e){}
    if(!b||!b.name){ try{ b=JSON.parse(localStorage.getItem('eduflow_branding')||'null'); }catch(e){} }
    return '🎓 '+((b&&b.name)||'EduFlow')+' · by Habbash Group';
  }catch(e){ return '🎓 EduFlow · by Habbash Group'; }
}
function paperDims(){ return {a4:[198,285],a5:[136,198],a3:[285,408],letter:[204,267]}[currentPageSize]||[198,285]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function colsAuto(){
  var W=paperDims()[0];
  if(currentShape==='landscape') return clamp(Math.round(W/72),1,4);
  if(currentShape==='square') return clamp(Math.round(W/52),2,5);
  return clamp(Math.round(W/48),2,5);
}
function colsManual(n){
  if(currentShape==='landscape') return n<=6?2:(n<=12?3:4);
  if(currentShape==='square') return n<=9?3:(n<=16?4:5);
  return n<=6?3:(n<=16?4:(n<=25?5:6));
}
function setCols(c){ document.documentElement.style.setProperty('--cols',c); }
function gapMM(){ return document.body.classList.contains('compact-print')?1.5:2.5; }
function measureCardMM(){
  var el=document.querySelector('#sheetsHost .sheet:not(.sheet-hidden) .qr-card')||document.querySelector('#sheetsHost .qr-card');
  if(!el) return 60;
  return el.offsetHeight*(25.4/96);
}
function chunk(list,n){ var out=[]; for(var i=0;i<list.length;i+=n) out.push(list.slice(i,i+n)); return out; }
function scopeGroups(){
  var gs=(DataService.getGroups?DataService.getGroups():[]);
  try{
    if(currentUser&&window.Ops&&Ops.groupsInScope&&(currentUser.role==='assistant'||currentUser.role==='teacher')) gs=Ops.groupsInScope(currentUser.id)||gs;
  }catch(e){}
  return gs;
}
function stuCount(gid){ try{ return (DataService.getStudentsByGroup?DataService.getStudentsByGroup(gid):[]).length; }catch(e){ return 0; } }
function centersOfStudent(sid){
  try{
    var ts=(DataService.getStudentTeachers?DataService.getStudentTeachers(sid):[])||[];
    var out=[]; ts.forEach(function(t){ if(t.group&&t.group.center&&out.indexOf(t.group.center)<0) out.push(t.group.center); });
    return out;
  }catch(e){ return []; }
}
/* ============ 🧠 الفلاتر المتتابعة الذكية ============ */
function fillSel(id,items,cur,allLabel){
  var sel=document.getElementById(id); if(!sel) return cur;
  var h=(allLabel!=null)?'<option value="">'+allLabel+'</option>':'';
  h+=items.map(function(it){ return '<option value="'+it.v+'">'+it.l+'</option>'; }).join('');
  sel.innerHTML=h;
  var ok=items.some(function(it){ return String(it.v)===String(cur); });
  var nv;
  if(id==='prGroup') nv=(cur==='all'||!ok)?'all':cur;
  else nv=ok?cur:(allLabel!=null?'':(items[0]?items[0].v:''));
  sel.value=nv;
  return nv;
}
window.refreshSmartFilters=function(){
  var gs=scopeGroups();
  var fc=val('prCenter'),fs=val('prStage'),fg=val('prGrade'),fq=norm(val('prGroupSearch')),fgid=val('prGroup');
  /* 1) السنتر المتاح حسب المرحلة+الصف */
  var gSG=gs.filter(function(g){ return (!fs||(g.stage||'')===fs)&&(!fg||(g.grade||'')===fg); });
  var centers=uniq(gSG.map(function(g){return g.center||'';}).filter(Boolean));
  fc=fillSel('prCenter',centers.map(function(c){ return {v:c,l:'🏢 '+c+' · '+gSG.filter(function(g){return g.center===c;}).length+' مجموعة'}; }),fc,'كل السناتر');
  /* 2) المرحلة المتاحة حسب السنتر */
  var gC=gs.filter(function(g){ return !fc||(g.center||'')===fc; });
  var stages=uniq(gC.map(function(g){return g.stage||'';}).filter(Boolean));
  fs=fillSel('prStage',stages.map(function(s){ return {v:s,l:'🎓 '+stageLabel(s)+' · '+gC.filter(function(g){return g.stage===s;}).length+' مجموعة'}; }),fs,'كل المراحل');
  /* 3) الصف: لو مرحلة مختارة → صفوفها من إعدادات المنصة، غير كده → الموجود فعلياً */
  var gCS=gC.filter(function(g){ return !fs||(g.stage||'')===fs; });
  var existing=uniq(gCS.map(function(g){return g.grade||'';}).filter(Boolean));
  var grades=existing;
  if(fs){
    try{
      var cfg=((typeof EduFlowConfig!=='undefined'?EduFlowConfig.educationLevels:{})[fs]||{}).grades||[];
      if(cfg.length) grades=cfg.filter(function(gr){ return !existing.length||existing.indexOf(gr)>=0; });
    }catch(e){}
  }
  fg=fillSel('prGrade',grades.map(function(gr){ return {v:gr,l:'📚 '+gr+' · '+gCS.filter(function(g){return g.grade===gr;}).length+' مجموعة'}; }),fg,'كل الصفوف');
  /* 4) المجموعات حسب الكل + بحث الاسم */
  var gCSG=gCS.filter(function(g){ return !fg||(g.grade||'')===fg; });
  var gQ=gCSG.filter(function(g){ return !fq||norm(g.name).indexOf(fq)>=0||norm(g.center||'').indexOf(fq)>=0; });
  var totalStu=gCSG.reduce(function(a,g){ return a+stuCount(g.id); },0);
  var items=[{v:'all',l:'🌍 كل الطلاب ('+totalStu+')'}].concat(gQ.map(function(g){
    return {v:g.id,l:g.name+' · 👥 '+stuCount(g.id)+(g.center?' · 🏢 '+g.center:'')+(g.grade?' · 📚 '+g.grade:'')};
  }));
  fillSel('prGroup',items,fgid,null);
};
window.onFilterChange=function(){ window.refreshSmartFilters(); refresh(true); };
window.onGroupSearch=function(){ window.refreshSmartFilters(); };
var _qT=null;
window.onSearchChange=function(){ clearTimeout(_qT); _qT=setTimeout(function(){ refresh(true); },250); };
/* ============ 📦 بناء البطاقات ============ */
function buildCards(){
  if(window._overrideList) return window._overrideList;
  var gid=val('prGroup')||'all', fc=val('prCenter'), fs=val('prStage'), fg=val('prGrade');
  var q=norm(val('prSearch')), type=val('prType')||'students';
  var cards=[];
  if(type==='students'||type==='all'){
    var list;
    if(gid!=='all') list=(DataService.getStudentsByGroup?DataService.getStudentsByGroup(gid):[]);
    else list=(DataService.getStudents?DataService.getStudents():[]);
    if(fs) list=list.filter(function(s){ return (s.stage||'')===fs; });
    if(fg) list=list.filter(function(s){ return (s.grade||'')===fg; });
    if(fc) list=list.filter(function(s){ return centersOfStudent(s.id).indexOf(fc)>=0; });
    if(q) list=list.filter(function(s){ return norm(s.name).indexOf(q)>=0||norm(s.code).indexOf(q)>=0; });
    list=list.filter(function(s){ return s.code; });
    list.forEach(function(s){
      var cs=centersOfStudent(s.id);
      var sl=stageLabel(s.stage);
      var meta='';
      if(sl||s.grade) meta='🎓 '+sl+(s.grade?' - '+s.grade:'');
      if(cs[0]) meta+=(meta?' · ':'')+'🏢 '+cs[0];
      cards.push({type:'student',id:s.id,code:s.code,name:s.name,meta:meta});
    });
  }
  if(type==='groups'||type==='all'){
    scopeGroups().filter(function(g){ return g.whatsappLink&&(!fc||(g.center||'')===fc)&&(!fs||(g.stage||'')===fs)&&(!fg||(g.grade||'')===fg); }).forEach(function(g){
      cards.push({type:'group',id:g.id,code:g.id,name:g.name,meta:'💬 جروب واتساب'+(g.center?' · 🏢 '+g.center:''),whatsappLink:g.whatsappLink});
    });
  }
  return cards;
}
function cardHtml(card){
  var safe=(card.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  var sel=selectedCards.has(card.id);
  return '<div class="qr-card'+(sel?' selected':'')+'" data-id="'+card.id+'">'+
    '<span class="cm cm-tl"></span><span class="cm cm-tr"></span><span class="cm cm-bl"></span><span class="cm cm-br"></span>'+
    '<span class="card-checkwrap no-print"><input type="checkbox" '+(sel?'checked':'')+' onchange="window.toggleSelection(\''+card.id+'\',this.checked)" title="تحديد"></span>'+
    '<div class="qr-wrap"><img src="'+qrImg(card.code,300,card.type)+'" crossorigin="anonymous" alt="'+card.code+'"></div>'+
    '<div class="card-txt"><div class="card-name">'+safe+'</div><span class="card-code">'+card.code+'</span>'+
    (card.meta?'<div class="card-meta">'+card.meta+'</div>':'')+
    '<div class="card-brand">'+brandLine()+'</div></div></div>';
}
function sheetHtml(sh,i,total){
  var shapeLabel={vertical:'عمودي',square:'مربع',landscape:'بطاقة'}[currentShape];
  return '<div class="sheet" data-sheet="'+(i+1)+'">'+
    '<div class="sheet-label no-print"><span>📄 صفحة '+(i+1)+' من '+total+'</span><span>'+currentPageSize.toUpperCase()+' · '+sh.length+' كارت · '+shapeLabel+(autoFill?' · 🤖 ذكي':'')+'</span></div>'+
    '<div class="sheet-grid">'+sh.map(cardHtml).join('')+'</div></div>';
}
function paint(sheets){
  var host=document.getElementById('sheetsHost'); if(!host) return;
  sheetsCount=sheets.length;
  if(!sheets.length||!sheets[0].length){ host.innerHTML='<div class="empty-state"><div class="empty-state-icon">📭</div><strong>لا توجد بطاقات مطابقة</strong><div style="font-size:13px;color:var(--text-muted);margin-top:6px;">وسّع الفلاتر أو امسح البحث</div></div>'; return; }
  host.innerHTML=sheets.map(function(sh,i){ return sheetHtml(sh,i,sheets.length); }).join('');
}
/* ============ 🧠 المحرك: يدوي أو ذكي ============ */
function refresh(resetPage){
  try{
    allCards=buildCards();
    var sheets;
    if(autoFill){
      var cols=colsAuto(); setCols(cols);
      paint(chunk(allCards,cols));
      applyPager();
      var mm=measureCardMM();
      var g=gapMM(), H=paperDims()[1];
      var rows=Math.max(1,Math.floor((H+g)/(mm+g+1.2)));
      cardsPerPage=cols*rows;
      sheets=chunk(allCards,cardsPerPage);
    }else{
      cardsPerPage=manualPerPage;
      setCols(colsManual(cardsPerPage));
      sheets=chunk(allCards,cardsPerPage);
    }
    paint(sheets);
    if(resetPage!==false) window._curPage=1;
    if(window._curPage>sheets.length) window._curPage=1;
    updateStats(); applyPager();
  }catch(e){ console.error('refresh',e); }
}
function updateStats(){
  document.getElementById('totalCount').textContent=allCards.length;
  document.getElementById('studentsCount').textContent=allCards.filter(function(c){return c.type==='student';}).length;
  document.getElementById('groupsCount').textContent=allCards.filter(function(c){return c.type==='group';}).length;
  document.getElementById('pagesCount').textContent=sheetsCount;
  document.getElementById('perPageCount').textContent=cardsPerPage;
  document.getElementById('cardsPerPageValue').textContent=(autoFill?'🤖':'')+cardsPerPage;
  document.getElementById('selectedCount').textContent=selectedCards.size;
  var sl=document.getElementById('cardsPerPageSlider');
  if(sl){ sl.disabled=autoFill; sl.value=Math.min(40,cardsPerPage); }
}
/* ============ 📄 الترقيم ============ */
function pgNumsHtml(cur,total){
  if(total<=7){ var h=''; for(var i=1;i<=total;i++) h+='<button class="pg-num '+(i===cur?'active':'')+'" onclick="window.pgGo('+i+')">'+i+'</button>'; return h; }
  var items=[1];
  if(cur>3) items.push('…');
  for(var j=cur-1;j<=cur+1;j++){ if(j>1&&j<total) items.push(j); }
  if(cur<total-2) items.push('…');
  items.push(total);
  return items.map(function(it){ return it==='…'?'<span class="pg-dot">…</span>':'<button class="pg-num '+(it===cur?'active':'')+'" onclick="window.pgGo('+it+')">'+it+'</button>'; }).join('');
}
function applyPager(){
  var host=document.getElementById('sheetsHost'); if(!host) return;
  var els=Array.prototype.slice.call(host.querySelectorAll('.sheet'));
  var total=els.length;
  if(window._curPage>total) window._curPage=1;
  var showAll=window._viewAll||window.__tmpAll;
  els.forEach(function(el,i){ el.classList.toggle('sheet-hidden',!showAll&&i!==window._curPage-1); });
  var nums=document.getElementById('pgNums'); if(nums) nums.innerHTML=pgNumsHtml(window._curPage,total);
  var prev=document.getElementById('pgPrev'),next=document.getElementById('pgNext');
  if(prev) prev.disabled=(window._curPage<=1)||showAll;
  if(next) next.disabled=(window._curPage>=total)||showAll;
  var info=document.getElementById('pgInfo');
  if(info) info.textContent=total?('📄 صفحة '+window._curPage+' من '+total+' · '+allCards.length+' كارت'):'📄 0 صفحة';
  var all=document.getElementById('pgAll'); if(all) all.checked=!!window._viewAll;
}
window.pgGo=function(n){ window._curPage=clamp(n,1,Math.max(1,sheetsCount)); applyPager(); var bar=document.getElementById('pagerBar'); if(bar) bar.scrollIntoView({behavior:'smooth',block:'start'}); };
window.pgSetViewAll=function(on){ window._viewAll=!!on; applyPager(); };
/* ============ ⚙️ التحكم ============ */
window.setShape=function(s,btn){
  currentShape=s; document.body.setAttribute('data-shape',s);
  document.querySelectorAll('.shape-btn').forEach(function(b){b.classList.toggle('active',b.dataset.shape===s);});
  try{localStorage.setItem('qrPrintShape',s);}catch(e){}
  refresh(false);
};
window.setPageSize=function(p,btn){
  currentPageSize=p; document.body.setAttribute('data-page',p);
  document.querySelectorAll('.size-btn').forEach(function(b){b.classList.toggle('active',b.dataset.size===p);});
  try{localStorage.setItem('qrPrintSize',p);}catch(e){}
  refresh(false);
};
window.toggleAutoFill=function(on){
  autoFill=!!on;
  try{localStorage.setItem('qrPrintAuto',autoFill?'1':'0');}catch(e){}
  refresh(false);
  toast(autoFill?'🤖 التعبئة الذكية شغالة':'✋ وضع يدوي','info');
};
window.updateCardsPerPage=function(v){
  manualPerPage=parseInt(v)||12;
  try{localStorage.setItem('qrPrintCards',manualPerPage);}catch(e){}
  if(!autoFill) refresh(false);
};
window.toggleCutMarks=function(on){ document.body.classList.toggle('show-cut-marks',!!on); try{localStorage.setItem('qrPrintCut',on?'1':'0');}catch(e){} };
window.toggleCompact=function(on){ document.body.classList.toggle('compact-print',!!on); try{localStorage.setItem('qrPrintCompact',on?'1':'0');}catch(e){} refresh(false); };
window.toggleSelection=function(id,on){ if(on)selectedCards.add(id);else selectedCards.delete(id); var el=document.querySelector('.qr-card[data-id="'+id+'"]'); if(el)el.classList.toggle('selected',on); updateStats(); };
window.selectAll=function(){ allCards.forEach(function(c){selectedCards.add(c.id);}); document.querySelectorAll('.card-checkwrap input').forEach(function(i){i.checked=true;}); document.querySelectorAll('.qr-card').forEach(function(c){c.classList.add('selected');}); updateStats(); };
window.deselectAll=function(){ selectedCards.clear(); document.querySelectorAll('.card-checkwrap input').forEach(function(i){i.checked=false;}); document.querySelectorAll('.qr-card').forEach(function(c){c.classList.remove('selected');}); updateStats(); };
window.goBack=function(){ if(document.referrer&&document.referrer.includes(location.origin))history.back(); else location.href=(currentUser?.role==='teacher'?'teacher-dashboard.html':'assistant-dashboard.html'); };
document.getElementById('themeToggle').onclick=function(){
  var cur=document.body.getAttribute('data-theme')==='dark'?'light':'dark';
  document.body.setAttribute('data-theme',cur);
  try{localStorage.setItem('qrPrintTheme',cur);}catch(e){}
};
/* ============ 🖨️ الطباعة ============ */
window.waitForImages=function(){
  return new Promise(function(res){
    var imgs=document.querySelectorAll('.qr-card img'), loaded=0, total=imgs.length;
    if(!total){ res(); return; }
    imgs.forEach(function(im){
      var done=function(){ loaded++; if(loaded>=total) res(); };
      if(im.complete) done(); else { im.addEventListener('load',done,{once:true}); im.addEventListener('error',done,{once:true}); }
    });
    setTimeout(res,6000);
  });
};
window.printAll=async function(){
  if(!allCards.length) return;
  toast('⏳ جاري تجهيز الأوراق...','info');
  window.__tmpAll=1; applyPager();
  await window.waitForImages();
  var restore=function(){ window.__tmpAll=0; applyPager(); window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore);
  setTimeout(function(){ window.print(); setTimeout(restore,1200); },250);
};
window.printSelected=async function(){
  if(!selectedCards.size){ toast('حدد بطاقات أولاً','warning'); return; }
  var list=allCards.filter(function(c){return selectedCards.has(c.id);});
  window._overrideList=list; refresh(true);
  window.__tmpAll=1; applyPager();
  await window.waitForImages();
  var restore=function(){ window._overrideList=null; window.__tmpAll=0; refresh(true); window.removeEventListener('afterprint',restore); };
  window.addEventListener('afterprint',restore);
  setTimeout(function(){ window.print(); setTimeout(restore,1200); },250);
};
window.printFromPreview=function(){ window.closePreview(); selectedCards.size?window.printSelected():window.printAll(); };
/* ============ 📥 تحميل PDF ============ */
window.downloadPDF=async function(){
  if(typeof window.html2canvas==='undefined'||typeof window.jspdf==='undefined'){ toast('❌ مكتبات PDF مش محملة — اتأكد من الإنترنت','error'); return; }
  var host=document.getElementById('sheetsHost');
  var sheets=Array.prototype.slice.call(host.querySelectorAll('.sheet'));
  if(!sheets.length){ toast('مفيش بطاقات للتصدير','warning'); return; }
  toast('📥 جاري تجهيز '+sheets.length+' صفحة PDF...','info');
  var prevTheme=document.body.getAttribute('data-theme');
  var prevViewAll=window._viewAll;
  document.body.setAttribute('data-theme','light');
  window._viewAll=true; applyPager();
  document.body.classList.add('pdf-capture');
  await window.waitForImages();
  try{
    var fmt={a4:'a4',a5:'a5',a3:'a3',letter:'letter'}[currentPageSize]||'a4';
    var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:fmt});
    var pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    var m=6;
    for(var i=0;i<sheets.length;i++){
      var canvas=await html2canvas(sheets[i],{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
      var img=canvas.toDataURL('image/png');
      if(i>0) pdf.addPage(fmt,'portrait');
      var iw=pw-2*m, ih=canvas.height*iw/canvas.width;
      var maxH=ph-2*m;
      if(ih>maxH){ ih=maxH; iw=canvas.width*ih/canvas.height; }
      pdf.addImage(img,'PNG',(pw-iw)/2,m,iw,ih);
      toast('⏳ PDF: صفحة '+(i+1)+' من '+sheets.length,'info');
    }
    pdf.save('EduFlow_Barcodes_'+new Date().toISOString().split('T')[0]+'.pdf');
    toast('✅ تم تحميل PDF بنجاح','success');
  }catch(e){ console.error(e); toast('❌ خطأ في PDF: '+e.message,'error'); }
  document.body.classList.remove('pdf-capture');
  document.body.setAttribute('data-theme',prevTheme||'dark');
  window._viewAll=prevViewAll; applyPager();
};
/* ============ 👁️ معاينة + ZIP + CSV ============ */
window.showPreview=function(){
  var cards=selectedCards.size?allCards.filter(function(c){return selectedCards.has(c.id);}):allCards;
  if(!cards.length) return;
  document.getElementById('previewContainer').innerHTML=cards.map(function(c){
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;">'+
      '<div style="font-weight:800;font-size:12px;margin-bottom:6px;">'+c.name+'</div>'+
      '<img src="'+qrImg(c.code,150,c.type)+'" crossorigin="anonymous" style="width:100px;height:100px;margin:4px auto;display:block;border-radius:6px;">'+
      '<div style="font-family:var(--font-en);font-weight:800;color:var(--primary);font-size:12px;">'+c.code+'</div>'+
      (c.meta?'<div style="font-size:9px;color:var(--text-muted);margin-top:3px;">'+c.meta+'</div>':'')+'</div>';
  }).join('');
  document.getElementById('previewModal').style.display='block';
};
window.closePreview=function(){ document.getElementById('previewModal').style.display='none'; };
document.getElementById('previewModal')?.addEventListener('click',function(e){ if(e.target===this) window.closePreview(); });
window.downloadAllAsZip=async function(){
  if(!allCards.length||typeof JSZip==='undefined') return;
  toast('📦 جاري تجهيز '+allCards.length+' صورة...','info');
  try{
    var zip=new JSZip(), folder=zip.folder('EduFlow_QR_Cards');
    for(var i=0;i<allCards.length;i++){
      var c=allCards[i];
      try{
        var blob=await generateCardImage(c);
        folder.file(c.type+'_'+c.code+'_'+(c.name||'').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,'_')+'.png',blob);
      }catch(e){}
    }
    var content=await zip.generateAsync({type:'blob'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(content);
    a.download='EduFlow_Cards_'+new Date().toISOString().split('T')[0]+'.zip';
    document.body.appendChild(a); a.click(); a.remove();
    toast('✅ تم تحميل ZIP','success');
  }catch(e){ toast('خطأ في ZIP','error'); }
};
async function generateCardImage(card){
  return new Promise(function(resolve,reject){
    var W,H;
    if(currentShape==='landscape'){W=1000;H=631;} else if(currentShape==='square'){W=820;H=820;} else {W=760;H=1000;}
    var cv=document.createElement('canvas'); cv.width=W; cv.height=H;
    var x=cv.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    x.strokeStyle='#e2e8f0'; x.lineWidth=6; x.strokeRect(3,3,W-6,H-6);
    x.direction='rtl'; x.textAlign='center';
    var img=new Image(); img.crossOrigin='anonymous';
    img.src=qrImg(card.code,500,card.type);
    img.onload=function(){
      if(currentShape==='landscape'){
        var qs=420; x.drawImage(img,60,(H-qs)/2,qs,qs);
        x.textAlign='right';
        x.fillStyle='#0f172a'; x.font='800 52px Cairo,Tahoma'; x.fillText(card.name||'-',W-70,240);
        x.fillStyle='#4f46e5'; x.font='800 46px "Fira Code",monospace'; x.fillText(card.code,W-70,320);
        x.fillStyle='#64748b'; x.font='30px Cairo,Tahoma'; x.fillText((card.meta||'').replace(/<br>/g,' · '),W-70,390);
        x.fillStyle='#94a3b8'; x.font='22px Cairo,Tahoma'; x.fillText(brandLine(),W-70,H-50);
      }else{
        var qs2=currentShape==='square'?430:460, top=currentShape==='square'?70:60;
        x.fillStyle='#f8fafc'; x.fillRect((W-qs2)/2-16,top-16,qs2+32,qs2+32);
        x.drawImage(img,(W-qs2)/2,top,qs2,qs2);
        var y=top+qs2+80;
        x.fillStyle='#0f172a'; x.font='800 50px Cairo,Tahoma'; x.fillText(card.name||'-',W/2,y); y+=70;
        x.fillStyle='#4f46e5'; x.font='800 44px "Fira Code",monospace'; x.fillText(card.code,W/2,y); y+=58;
        x.fillStyle='#64748b'; x.font='28px Cairo,Tahoma'; x.fillText((card.meta||'').replace(/<br>/g,' · '),W/2,y);
        x.fillStyle='#94a3b8'; x.font='22px Cairo,Tahoma'; x.fillText(brandLine(),W/2,H-40);
      }
      cv.toBlob(function(b){resolve(b);},'image/png');
    };
    img.onerror=function(){reject(new Error('فشل تحميل الباركود'));};
  });
}
window.exportCSV=function(){
  if(!allCards.length) return;
  var headers=['النوع','الاسم','الكود','البيانات','الرابط'];
  var rows=allCards.map(function(c){return [c.type,c.name,c.code,(c.meta||'').replace(/<br>/g,' '),qrData(c.code,c.type)];});
  var csv='\uFEFF'+[headers].concat(rows).map(function(r){return r.map(function(cell){return '"'+String(cell).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='EduFlow_Codes_'+new Date().toISOString().split('T')[0]+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
};
/* ============ 🚀 الإقلاع ============ */
(async function boot(){
  try{
    if(typeof DataService?.init==='function') await DataService.init();
    currentUser=AuthService?.getCurrentUser?AuthService.getCurrentUser():null;
    if(!currentUser){ location.href='login.html'; return; }
    try{ branding=typeof DataService?.getBranding==='function'?DataService.getBranding():{}; }catch(e){}
    var ss,sp,sc,sa,scm,scp,th;
    try{
      ss=localStorage.getItem('qrPrintShape'); sp=localStorage.getItem('qrPrintSize');
      sc=localStorage.getItem('qrPrintCards'); sa=localStorage.getItem('qrPrintAuto');
      scm=localStorage.getItem('qrPrintCut'); scp=localStorage.getItem('qrPrintCompact'); th=localStorage.getItem('qrPrintTheme');
    }catch(e){}
    if(ss) currentShape=ss;
    if(sp) currentPageSize=sp;
    if(sc) manualPerPage=parseInt(sc)||12;
    if(sa==='0') autoFill=false;
    document.body.setAttribute('data-shape',currentShape);
    document.body.setAttribute('data-page',currentPageSize);
    document.getElementById('autoFillToggle').checked=autoFill;
    document.getElementById('cardsPerPageSlider').value=manualPerPage;
    document.getElementById('cutMarksToggle').checked=(scm!=='0');
    if(scm!=='0') document.body.classList.add('show-cut-marks');
    document.getElementById('compactPrintToggle').checked=(scp==='1');
    if(scp==='1') document.body.classList.add('compact-print');
    if(th) document.body.setAttribute('data-theme',th);
    document.querySelectorAll('.shape-btn').forEach(function(b){b.classList.toggle('active',b.dataset.shape===currentShape);});
    document.querySelectorAll('.size-btn').forEach(function(b){b.classList.toggle('active',b.dataset.size===currentPageSize);});
    var q=new URLSearchParams(location.search).get('search');
    if(q){ var el=document.getElementById('prSearch'); if(el) el.value=q; }
    window.refreshSmartFilters();
    refresh(true);
  }catch(e){ console.error('boot',e); }
})();
</script>
