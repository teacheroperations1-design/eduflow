<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طباعة باركودات الطلاب - EduFlow by Habbash Group</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
body{padding:20px;}
.toolbar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
.toolbar-header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.toolbar-title{display:flex;align-items:center;gap:10px;}
.toolbar-title-icon{font-size:28px;}
.toolbar-title h2{margin:0;font-size:18px;}
.toolbar-title p{margin:2px 0 0 0;font-size:12px;color:var(--text-muted);}
.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap;}
.filters-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
@media(max-width:640px){.filters-row{grid-template-columns:1fr;}}
.filter-group{display:flex;flex-direction:column;gap:4px;}
.filter-group label{font-size:11px;font-weight:700;color:var(--text-muted);}
.size-options{display:flex;gap:6px;flex-wrap:wrap;padding:10px;background:var(--surface-hover);border-radius:8px;margin-bottom:12px;}
.size-opt{padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:6px;}
.size-opt:hover{border-color:var(--primary-border);}
.size-opt.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.size-opt .size-icon{font-size:16px;}
.stats-bar{display:flex;gap:12px;flex-wrap:wrap;padding:10px;background:var(--info-bg);border:1px solid var(--info-border);border-radius:8px;margin-bottom:12px;font-size:12px;color:var(--info);}
.stats-bar strong{font-family:var(--font-en);font-size:14px;}
.action-buttons{display:flex;gap:8px;flex-wrap:wrap;}
.btn-xl{padding:12px 20px;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:8px;}
.btn-export{background:linear-gradient(135deg,#10b981,#059669);color:#fff;}
.btn-export:hover{background:linear-gradient(135deg,#059669,#047857);}
.btn-zip{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;}
.btn-zip:hover{background:linear-gradient(135deg,#d97706,#b45309);}
.btn-preview{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;}
.btn-preview:hover{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
.qr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.qr-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;transition:all .2s;break-inside:avoid;page-break-inside:avoid;}
.qr-card:hover{border-color:var(--primary-border);box-shadow:var(--shadow-sm);}
.qr-card.teacher-card{border:2px solid var(--primary);background:linear-gradient(135deg,var(--surface),var(--primary-bg));}
.qr-card.group-card{border:2px solid #25d366;background:linear-gradient(135deg,var(--surface),rgba(37,211,102,.08));}
.qr-card-type{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:9999px;background:var(--primary);color:#fff;}
.qr-card-type.teacher{background:var(--primary);}
.qr-card-type.group{background:#25d366;}
.qr-card-type.student{background:var(--info);}
.qr-name{font-size:14px;font-weight:800;margin-bottom:6px;color:var(--text);}
.qr-card img{width:100%;max-width:140px;aspect-ratio:1;border-radius:8px;margin:6px auto;display:block;background:#fff;padding:4px;}
.qr-codeline{font-family:var(--font-en);font-size:14px;font-weight:800;letter-spacing:2px;color:var(--primary);margin:6px 0;}
.qr-brand{font-size:10px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:4px;}
.qr-brand .dot{width:4px;height:4px;border-radius:50%;background:var(--primary);}
.qr-meta{font-size:10px;color:var(--text-muted);margin-top:4px;line-height:1.4;}
.card-actions{display:flex;gap:4px;justify-content:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}
.card-actions .btn{font-size:10px;padding:4px 8px;}
.selection-check{position:absolute;top:8px;left:8px;width:20px;height:20px;cursor:pointer;}
.selection-check input{width:100%;height:100%;cursor:pointer;}
/* Preview Modal */
.preview-container{max-height:70vh;overflow-y:auto;padding:16px;background:var(--surface-hover);border-radius:8px;}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media(max-width:768px){.preview-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:480px){.preview-grid{grid-template-columns:1fr;}}
/* Print Styles */
@media print{
  body{padding:0;background:#fff;}
  .toolbar,.no-print,.card-actions,.selection-check{display:none!important;}
  .qr-grid{grid-template-columns:repeat(4,1fr);gap:8px;}
  .qr-card{border:1px solid #ccc;page-break-inside:avoid;padding:8px;}
  .qr-card img{max-width:3.2cm;}
  .qr-name{font-size:9pt;}
  .qr-codeline{font-size:10pt;}
  .qr-brand,.qr-meta{font-size:7pt;}
  @page{margin:1cm;}
}
/* Print size variants */
@media print{
  body.print-small .qr-grid{grid-template-columns:repeat(6,1fr);}
  body.print-small .qr-card img{max-width:2.2cm;}
  body.print-small .qr-card{padding:4px;}
  body.print-small .qr-name{font-size:7pt;}
  body.print-small .qr-codeline{font-size:8pt;}
  body.print-large .qr-grid{grid-template-columns:repeat(3,1fr);}
  body.print-large .qr-card img{max-width:4.5cm;}
  body.print-large .qr-card{padding:12px;}
  body.print-large .qr-name{font-size:11pt;}
  body.print-large .qr-codeline{font-size:12pt;}
  body.print-pocket .qr-grid{grid-template-columns:repeat(2,1fr);}
  body.print-pocket .qr-card{padding:14px;min-height:12cm;}
  body.print-pocket .qr-card img{max-width:6cm;}
  body.print-pocket .qr-name{font-size:14pt;}
  body.print-pocket .qr-codeline{font-size:16pt;}
  body.print-a3 .qr-grid{grid-template-columns:repeat(6,1fr);}
  body.print-a3 .qr-card img{max-width:4cm;}
  @page size-a3{size:A3;}
  @page size-a4{size:A4;}
  @page size-letter{size:letter;}
}
/* Empty State */
.empty-state{text-align:center;padding:60px 20px;grid-column:1/-1;}
.empty-state-icon{font-size:64px;margin-bottom:12px;opacity:.5;}
.empty-state-title{font-size:18px;font-weight:800;margin-bottom:6px;}
.empty-state-text{font-size:13px;color:var(--text-muted);}
</style>
</head>
<body data-theme="dark">
<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="toolbar no-print">
  <div class="toolbar-header">
    <div class="toolbar-title">
      <div class="toolbar-title-icon">🖨️</div>
      <div>
        <h2>طباعة باركودات الطلاب</h2>
        <p>كل باركود بيفتح بطاقة الطالب على الموقع — اطبع أو صدّر</p>
      </div>
    </div>
    <div class="toolbar-actions">
      <button class="btn btn-ghost btn-sm" onclick="window.goBack()">← رجوع</button>
      <button class="btn btn-secondary btn-sm" id="themeToggle">🌓</button>
    </div>
  </div>
  
  <div class="filters-row">
    <div class="filter-group">
      <label>👥 المجموعة</label>
      <select id="prGroup" class="form-select" onchange="window.renderGrid()">
        <option value="all">🌍 كل الطلاب</option>
      </select>
    </div>
    <div class="filter-group">
      <label>🔍 بحث (اسم / كود)</label>
      <input type="text" id="prSearch" class="form-input" placeholder="ابحث عن طالب..." onkeyup="window.renderGrid()">
    </div>
    <div class="filter-group">
      <label>🎯 نوع البطاقات</label>
      <select id="prType" class="form-select" onchange="window.renderGrid()">
        <option value="students">🎓 طلاب فقط</option>
        <option value="all">🎓 طلاب + 👨‍🏫 مدرس + 💬 واتساب</option>
        <option value="teachers">👨‍🏫 مدرس فقط</option>
        <option value="groups">💬 واتساب جروبات</option>
      </select>
    </div>
  </div>
  
  <div class="size-options">
    <span style="align-self:center;font-weight:700;font-size:12px;color:var(--text-muted);margin-left:4px;">📏 حجم الطباعة:</span>
    <button class="size-opt active" data-size="a4" onclick="window.setPrintSize('a4',this)">
      <span class="size-icon">📄</span> A4 قياسي (4×4)
    </button>
    <button class="size-opt" data-size="small" onclick="window.setPrintSize('small',this)">
      <span class="size-icon">🏷️</span> صغيرة (6×4)
    </button>
    <button class="size-opt" data-size="large" onclick="window.setPrintSize('large',this)">
      <span class="size-icon">📋</span> كبيرة (3×3)
    </button>
    <button class="size-opt" data-size="pocket" onclick="window.setPrintSize('pocket',this)">
      <span class="size-icon">💳</span> جيب (2×2)
    </button>
    <button class="size-opt" data-size="a3" onclick="window.setPrintSize('a3',this)">
      <span class="size-icon">📰</span> A3 (6×6)
    </button>
  </div>
  
  <div class="stats-bar" id="statsBar">
    <span>📊 <strong id="totalCount">0</strong> بطاقة</span>
    <span>🎓 <strong id="studentsCount">0</strong> طالب</span>
    <span>👨‍🏫 <strong id="teachersCount">0</strong> مدرس</span>
    <span>💬 <strong id="groupsCount">0</strong> جروب</span>
    <span style="margin-inline-start:auto;">✅ <strong id="selectedCount">0</strong> مختار</span>
  </div>
  
  <div class="action-buttons">
    <button class="btn btn-primary btn-xl" onclick="window.printSelected()">
      🖨️ طباعة المختارة
    </button>
    <button class="btn btn-primary btn-xl" onclick="window.printAll()">
      🖨️ طباعة الكل
    </button>
    <button class="btn btn-preview btn-xl" onclick="window.showPreview()">
      👁️ معاينة قبل الطباعة
    </button>
    <button class="btn btn-export btn-xl" onclick="window.exportCSV()">
      📊 تصدير CSV
    </button>
    <button class="btn btn-zip btn-xl" onclick="window.downloadAllAsZip()">
      📦 تحميل ZIP
    </button>
    <button class="btn btn-secondary btn-xl" onclick="window.selectAll()">
      ✅ تحديد الكل
    </button>
    <button class="btn btn-ghost btn-xl" onclick="window.deselectAll()">
      ❌ إلغاء التحديد
    </button>
  </div>
</div>

<div class="qr-grid" id="qrGrid"></div>

<!-- Preview Modal -->
<div id="previewModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;padding:20px;overflow-y:auto;">
  <div style="max-width:1200px;margin:0 auto;background:var(--surface);border-radius:16px;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h3 style="margin:0;">👁️ معاينة الطباعة</h3>
      <button class="btn btn-ghost btn-icon" onclick="window.closePreview()">✕</button>
    </div>
    <div class="preview-container" id="previewContainer"></div>
    <div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end;">
      <button class="btn btn-ghost" onclick="window.closePreview()">إلغاء</button>
      <button class="btn btn-primary" onclick="window.printFromPreview()">🖨️ طباعة الآن</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/drive-service.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/auth-service.js"></script>

<script>
const SITE_BASE = 'https://eduflow-nine-dusky.vercel.app/';
const qrData = (code, type='student') => {
  if(type === 'teacher') return SITE_BASE + 'teacher-dashboard.html';
  if(type === 'group') return SITE_BASE; // أو رابط واتساب
  return SITE_BASE + 'student-qr.html?code=' + encodeURIComponent(code);
};
const qrImg = (code, size, type='student') => 
  'https://api.qrserver.com/v1/create-qr-code/?size=' + size + 'x' + size + 
  '&data=' + encodeURIComponent(qrData(code, type)) +
  '&bgcolor=ffffff&color=6366f1&margin=8';

let currentUser = null;
let currentPrintSize = 'a4';
let selectedCards = new Set();
let allCards = [];

(async function boot(){
  try{
    if(typeof DataService?.init === 'function') await DataService.init();
    currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
    if(!currentUser){ window.location.href='login.html'; return; }
    
    window.buildGroupSelect();
    
    // استعلام البحث من URL
    const s = new URLSearchParams(location.search).get('search');
    if(s){ const el = document.getElementById('prSearch'); if(el) el.value = s; }
    
    window.renderGrid();
  }catch(err){
    console.error('Boot error', err);
    const grid = document.getElementById('qrGrid');
    if(grid) grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">خطأ في التحميل</div><div class="empty-state-text">'+err.message+'</div></div>';
  }
})();

window.goBack = function(){
  if(document.referrer && document.referrer.includes(location.origin)){
    history.back();
  } else {
    window.location.href = currentUser?.role === 'teacher' ? 'teacher-dashboard.html' : 'assistant-dashboard.html';
  }
};

window.buildGroupSelect = function(){
  try{
    const sel = document.getElementById('prGroup');
    if(!sel) return;
    let groups = [];
    if(currentUser && typeof Ops?.groupsInScope === 'function') groups = Ops.groupsInScope(currentUser.id) || [];
    if(!groups.length) groups = typeof DataService?.getGroups === 'function' ? DataService.getGroups() : [];
    sel.innerHTML = '<option value="all">🌍 كل الطلاب</option>' + 
      groups.map(g => '<option value="' + g.id + '">' + g.name + '</option>').join('');
  }catch(e){ console.error('buildGroupSelect error', e); }
};

window.setPrintSize = function(size, btn){
  currentPrintSize = size;
  document.querySelectorAll('.size-opt').forEach(b => b.classList.remove('active'));
  btn?.classList.add('active');
  
  // تنظيف الكلاسات القديمة
  document.body.classList.remove('print-small','print-large','print-pocket','print-a3');
  if(size !== 'a4') document.body.classList.add('print-' + size);
  
  if(typeof ThemeManager?.toast === 'function'){
    const labels = {
      a4:'📄 A4 قياسي (4×4)',
      small:'🏷️ صغيرة (6×4)',
      large:'📋 كبيرة (3×3)',
      pocket:'💳 جيب (2×2)',
      a3:'📰 A3 كبيرة (6×6)'
    };
    ThemeManager.toast(labels[size], 'info');
  }
};

window.renderGrid = function(){
  try{
    const sel = document.getElementById('prGroup');
    const q = (document.getElementById('prSearch')?.value || '').toLowerCase();
    const gid = sel ? sel.value : 'all';
    const type = document.getElementById('prType')?.value || 'students';
    
    let students = gid === 'all'
      ? (DataService?.getStudents ? DataService.getStudents() : [])
      : (DataService?.getStudentsByGroup ? DataService.getStudentsByGroup(gid) : []);
    
    // فلترة حسب Scope
    if(currentUser && typeof Ops?.studentsInScope === 'function'){
      const scopedIds = Ops.studentsInScope(currentUser.id).map(s => s.id);
      students = students.filter(s => scopedIds.includes(s.id));
    }
    
    if(q) students = students.filter(s => 
      (s.name||'').toLowerCase().includes(q) || 
      (s.code||'').toLowerCase().includes(q)
    );
    students = students.filter(s => s.code);
    
    allCards = [];
    
    // إضافة الطلاب
    if(type === 'students' || type === 'all'){
      students.forEach(s => {
        allCards.push({
          type: 'student',
          id: s.id,
          code: s.code,
          name: s.name,
          meta: (s.grade || '') + (s.phone ? ' · ' + s.phone : '')
        });
      });
    }
    
    // إضافة المدرس
    if(type === 'teachers' || type === 'all'){
      if(currentUser && currentUser.role === 'teacher'){
        allCards.push({
          type: 'teacher',
          id: currentUser.id,
          code: currentUser.code || currentUser.id,
          name: currentUser.name,
          meta: 'مدرس · ' + (currentUser.subject || '')
        });
      }
    }
    
    // إضافة جروبات الواتساب
    if(type === 'groups' || type === 'all'){
      let groups = gid === 'all'
        ? (DataService?.getGroups ? DataService.getGroups() : [])
        : (DataService?.getGroups ? DataService.getGroups().filter(g => g.id === gid) : []);
      
      if(currentUser && typeof Ops?.groupsInScope === 'function'){
        const scopedGroupIds = Ops.groupsInScope(currentUser.id).map(g => g.id);
        groups = groups.filter(g => scopedGroupIds.includes(g.id));
      }
      
      groups.filter(g => g.whatsappLink).forEach(g => {
        allCards.push({
          type: 'group',
          id: g.id,
          code: g.id,
          name: g.name,
          meta: '💬 واتساب جروب',
          whatsappLink: g.whatsappLink
        });
      });
    }
    
    // تحديث الإحصائيات
    const studentsCount = allCards.filter(c => c.type === 'student').length;
    const teachersCount = allCards.filter(c => c.type === 'teacher').length;
    const groupsCount = allCards.filter(c => c.type === 'group').length;
    
    document.getElementById('totalCount').textContent = allCards.length;
    document.getElementById('studentsCount').textContent = studentsCount;
    document.getElementById('teachersCount').textContent = teachersCount;
    document.getElementById('groupsCount').textContent = groupsCount;
    updateSelectedCount();
    
    const grid = document.getElementById('qrGrid');
    if(!grid) return;
    
    if(!allCards.length){
      grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-title">لا توجد بطاقات</div><div class="empty-state-text">جرب تغيير الفلتر أو البحث</div></div>';
      return;
    }
    
    grid.innerHTML = allCards.map(card => {
      const safeName = (card.name||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
      const qrUrl = card.type === 'group' ? card.whatsappLink : qrData(card.code, card.type);
      const imgSrc = qrImg(card.code, 140, card.type);
      const cardClass = card.type === 'teacher' ? 'teacher-card' : card.type === 'group' ? 'group-card' : '';
      const typeLabel = card.type === 'teacher' ? 'مدرس' : card.type === 'group' ? 'واتساب' : 'طالب';
      
      return '<div class="qr-card ' + cardClass + '" data-id="' + card.id + '" data-type="' + card.type + '">' +
        '<label class="selection-check no-print"><input type="checkbox" ' + (selectedCards.has(card.id) ? 'checked' : '') + ' onchange="window.toggleSelection(\'' + card.id + '\', this.checked)"></label>' +
        '<span class="qr-card-type ' + card.type + '">' + typeLabel + '</span>' +
        '<div class="qr-name">' + safeName + '</div>' +
        '<img src="' + imgSrc + '" alt="' + card.code + '" loading="lazy">' +
        '<div class="qr-codeline">' + card.code + '</div>' +
        '<div class="qr-meta">' + (card.meta || '') + '</div>' +
        '<div class="qr-brand">EduFlow <span class="dot"></span> Habbash Group</div>' +
        '<div class="card-actions no-print">' +
          '<button class="btn btn-secondary btn-sm" onclick="window.printSingleCard(\'' + card.id + '\')">🖨️</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="window.downloadSingleCard(\'' + card.id + '\')">⬇️</button>' +
        '</div>' +
      '</div>';
    }).join('');
  }catch(e){
    console.error('renderGrid error', e);
    const grid = document.getElementById('qrGrid');
    if(grid) grid.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-title">خطأ في التحميل</div></div>';
  }
};

window.toggleSelection = function(id, checked){
  if(checked) selectedCards.add(id);
  else selectedCards.delete(id);
  updateSelectedCount();
};

window.updateSelectedCount = function(){
  const el = document.getElementById('selectedCount');
  if(el) el.textContent = selectedCards.size;
};

window.selectAll = function(){
  allCards.forEach(c => selectedCards.add(c.id));
  document.querySelectorAll('.selection-check input').forEach(cb => cb.checked = true);
  updateSelectedCount();
  if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم تحديد الكل', 'success');
};

window.deselectAll = function(){
  selectedCards.clear();
  document.querySelectorAll('.selection-check input').forEach(cb => cb.checked = false);
  updateSelectedCount();
};

window.printSingleCard = function(id){
  const card = allCards.find(c => c.id === id);
  if(!card) return;
  
  const w = window.open('', '_blank', 'width=500,height=700');
  if(!w){ if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('اسمح بالنوافذ المنبثقة','warning'); return; }
  
  const d = w.document;
  d.documentElement.setAttribute('dir','rtl');
  d.title = card.name;
  
  const st = d.createElement('style');
  st.textContent = `

window.downloadSingleCard = async function(id){
  const card = allCards.find(c => c.id === id);
  if(!card) return;
  
  try{
    const r = await fetch(qrImg(card.code, 300, card.type));
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'QR_' + card.type + '_' + card.code + '_' + (card.name||'').replace(/\s+/g,'_') + '.png';
    document.body.appendChild(a); 
    a.click(); 
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم تحميل الباركود','success');
  }catch(e){
    window.open(qrImg(card.code, 300, card.type), '_blank');
  }
};

window.printAll = function(){
  if(!allCards.length){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد بطاقات للطباعة','warning');
    return;
  }
  selectedCards.clear();
  allCards.forEach(c => selectedCards.add(c.id));
  document.querySelectorAll('.selection-check input').forEach(cb => cb.checked = true);
  updateSelectedCount();
  setTimeout(() => window.print(), 100);
};

window.printSelected = function(){
  if(!selectedCards.size){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('حدد بطاقات أولاً','warning');
    return;
  }
  // إخفاء غير المحددة للطباعة
  document.querySelectorAll('.qr-card').forEach(card => {
    const id = card.dataset.id;
    card.style.display = selectedCards.has(id) ? '' : 'none';
  });
  setTimeout(() => {
    window.print();
    // إعادة الإظهار بعد الطباعة
    setTimeout(() => {
      document.querySelectorAll('.qr-card').forEach(card => card.style.display = '');
    }, 500);
  }, 100);
};

window.showPreview = function(){
  const cards = selectedCards.size 
    ? allCards.filter(c => selectedCards.has(c.id))
    : allCards;
  
  if(!cards.length){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد بطاقات للمعاينة','warning');
    return;
  }
  
  const container = document.getElementById('previewContainer');
  container.innerHTML = cards.map(card => {
    const typeLabels = {student:'طالب',teacher:'مدرس',group:'واتساب'};
    return '<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;">' +
      '<div style="font-size:10px;color:var(--primary);font-weight:700;margin-bottom:4px;">' + typeLabels[card.type] + '</div>' +
      '<div style="font-weight:800;margin-bottom:6px;">' + card.name + '</div>' +
      '<img src="' + qrImg(card.code, 120, card.type) + '" style="width:100px;height:100px;margin:6px auto;display:block;">' +
      '<div style="font-family:monospace;font-weight:800;color:var(--primary);font-size:12px;">' + card.code + '</div>' +
      '<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">' + (card.meta || '') + '</div>' +
    '</div>';
  }).join('');
  
  document.getElementById('previewModal').style.display = 'block';
};

window.closePreview = function(){
  document.getElementById('previewModal').style.display = 'none';
};

window.printFromPreview = function(){
  window.closePreview();
  if(selectedCards.size){
    window.printSelected();
  } else {
    window.printAll();
  }
};

window.exportCSV = function(){
  if(!allCards.length){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد بيانات للتصدير','warning');
    return;
  }
  
  const headers = ['النوع','الاسم','الكود','المرحلة/الصف','الهاتف','الرابط'];
  const rows = allCards.map(c => {
    const typeLabels = {student:'طالب',teacher:'مدرس',group:'واتساب جروب'};
    return [
      typeLabels[c.type],
      c.name,
      c.code,
      c.meta || '',
      '',
      qrData(c.code, c.type)
    ];
  });
  
  const csv = '\uFEFF' + [headers, ...rows]
    .map(row => row.map(cell => '"' + String(cell).replace(/"/g,'""') + '"').join(','))
    .join('\n');
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'EduFlow_Codes_' + new Date().toISOString().split('T')[0] + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  
  if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم تصدير ' + allCards.length + ' بطاقة','success');
};

window.downloadAllAsZip = async function(){
  if(!allCards.length){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد بطاقات للتحميل','warning');
    return;
  }
  
  if(typeof JSZip === 'undefined'){
    if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('مكتبة JSZip غير محملة','error');
    return;
  }
  
  if(typeof ThemeManager?.toast === 'function'){
    ThemeManager.toast('📦 جاري تجهيز ' + allCards.length + ' باركود...','info');
  }
  
  try{
    const zip = new JSZip();
    const folder = zip.folder('EduFlow_QR_Codes');
    
    // إضافة CSV
    const csvHeaders = ['النوع','الاسم','الكود','الرابط'];
    const csvRows = allCards.map(c => {
      const typeLabels = {student:'طالب',teacher:'مدرس',group:'واتساب'};
      return [typeLabels[c.type], c.name, c.code, qrData(c.code, c.type)];
    });
    const csv = '\uFEFF' + [csvHeaders, ...csvRows]
      .map(row => row.map(cell => '"' + String(cell).replace(/"/g,'""') + '"').join(','))
      .join('\n');
    folder.file('codes.csv', csv);
    
    // تحميل كل الباركودات
    for(let i = 0; i < allCards.length; i++){
      const card = allCards[i];
      try{
        const response = await fetch(qrImg(card.code, 300, card.type));
        const blob = await response.blob();
        const fileName = card.type + '_' + card.code + '_' + (card.name||'').replace(/[^a-zA-Z0-9\u0600-\u06FF]/g,'_') + '.png';
        folder.file(fileName, blob);
        
        if(typeof ThemeManager?.toast === 'function' && (i+1) % 5 === 0){
          ThemeManager.toast('⏳ جاري التحميل... ' + (i+1) + '/' + allCards.length, 'info');
        }
      }catch(e){
        console.error('Error downloading card', card.id, e);
      }
    }
    
    const content = await zip.generateAsync({type: 'blob'});
    const url = URL.createObjectURL(content);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'EduFlow_QR_Codes_' + new Date().toISOString().split('T')[0] + '.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    
    if(typeof ThemeManager?.toast === 'function'){
      ThemeManager.toast('✅ تم تحميل ' + allCards.length + ' باركود في ملف ZIP','success');
    }
  }catch(e){
    console.error('ZIP error', e);
    if(typeof ThemeManager?.toast === 'function'){
      ThemeManager.toast('خطأ في إنشاء ملف ZIP: ' + e.message,'error');
    }
  }
};

// إغلاق المودال عند الضغط على الخلفية
document.getElementById('previewModal')?.addEventListener('click', function(e){
  if(e.target === this) window.closePreview();
});

// اختصارات الكيبورد
document.addEventListener('keydown', function(e){
  if(e.ctrlKey && e.key === 'p'){
    e.preventDefault();
    window.printAll();
  }
  if(e.key === 'Escape'){
    window.closePreview();
  }
});
