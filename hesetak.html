<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة حصتك - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .hero-section{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:24px;text-align:center}
    .hero-card{max-width:720px;width:100%}
    .hesetak-logo{width:120px;height:120px;border-radius:30px;background:linear-gradient(135deg,#38bdf8,#6366f1,#a855f7);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 24px;font-size:56px;box-shadow:0 20px 60px rgba(56,189,248,.4);animation:float 3s ease-in-out infinite;overflow:hidden}
    .hesetak-logo img{width:100%;height:100%;object-fit:cover}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .hesetak-title{font-size:52px;font-weight:900;margin:0 0 12px;background:linear-gradient(135deg,#38bdf8,#6366f1,#a855f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-1px}
    .hesetak-subtitle{font-size:18px;color:var(--text-secondary);line-height:1.7;margin-bottom:32px}
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}
    .stat-pill{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 12px}
    .stat-pill-value{font-size:28px;font-weight:900;font-family:var(--font-en);color:var(--primary)}
    .stat-pill-label{font-size:11px;color:var(--text-muted);margin-top:2px}
    .features-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:32px}
    .feature-pill{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:right;transition:all var(--t)}
    .feature-pill:hover{border-color:var(--primary-border);transform:translateY(-2px)}
    .feature-pill-icon{font-size:24px;margin-bottom:6px}
    .feature-pill-title{font-size:13px;font-weight:800;margin-bottom:4px}
    .feature-pill-desc{font-size:11px;color:var(--text-muted);line-height:1.4}
    .cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:16px 32px;background:linear-gradient(135deg,#38bdf8,#6366f1,#a855f7);color:#fff;border-radius:14px;font-size:16px;font-weight:800;text-decoration:none;box-shadow:0 12px 40px rgba(99,102,241,.4);transition:all var(--t)}
    .cta-btn:hover{transform:translateY(-3px);box-shadow:0 20px 50px rgba(99,102,241,.5);color:#fff}
    .back-btn{display:inline-block;margin-top:20px;font-size:13px;color:var(--text-muted);text-decoration:none}
    .theme-float{position:fixed;top:20px;left:20px;z-index:100}
    @media (max-width:640px){.hesetak-title{font-size:38px}.stats-row{gap:6px}.stat-pill{padding:12px 6px}.stat-pill-value{font-size:22px}}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <button class="icon-btn theme-float" id="themeToggle"></button>
  <div class="hero-section">
    <div class="hero-card">
      <div class="hesetak-logo" id="hLogo">📚</div>
      <h1 class="hesetak-title" id="hTitle">منصة حصتك</h1>
      <p class="hesetak-subtitle" id="hSubtitle">منصتك التعليمية الشاملة</p>
      <div class="stats-row" id="hStats"></div>
      <div class="features-row" id="hFeatures"></div>
      <a href="#" id="hCta" target="_blank" rel="noopener" class="cta-btn">🚀 اذهب إلى منصة حصتك <span style="font-size:20px;">←</span></a>
      <br><a href="login.html" class="back-btn">→ العودة إلى EduFlow</a>
    </div>
  </div>

  <script src="js/config.js"></script><script src="js/firebase-service.js"></script><script src="js/data-service.js"></script><script src="js/ui-helpers.js"></script><script src="js/drive-service.js"></script><script src="js/theme-manager.js"></script>
  <script>
    (async function(){
      await DataService.init();
      ThemeManager.applyBranding();
      const h=(DataService.getHesetak&&DataService.getHesetak())||EduFlowConfig.hesetak;
      document.getElementById('hTitle').textContent=h.title||'منصة حصتك';
      document.getElementById('hSubtitle').textContent=h.subtitle||'';
      document.getElementById('hCta').href=h.url||EduFlowConfig.hesetak.url;
      document.title=(h.title||'منصة حصتك')+' - EduFlow';
      if(h.logo)document.getElementById('hLogo').innerHTML=UI.driveImg(h.logo);
      document.getElementById('hStats').innerHTML=(h.stats||[]).map(s=>`<div class="stat-pill"><div class="stat-pill-value">${s.v}</div><div class="stat-pill-label">${s.l}</div></div>`).join('');
      document.getElementById('hFeatures').innerHTML=(h.features||[]).map(f=>`<div class="feature-pill"><div class="feature-pill-icon">${f.i}</div><div class="feature-pill-title">${f.t}</div><div class="feature-pill-desc">${f.d}</div></div>`).join('');
    })();
  </script>
</body>
</html>
