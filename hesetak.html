<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>منصة حصتك - Habbash Group</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    /* 🎨 تكامل مع ثيم EduFlow الأساسي + تحسينات متقدمة */
    body { 
      overflow-x: hidden; 
      background: var(--bg);
      min-height: 100vh;
    }

    /* ✨ كرات الإضاءة المتحركة في الخلفية (Blobs) */
    .bg-blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      animation: blob-float 25s infinite alternate ease-in-out;
      mix-blend-mode: screen;
    }
    [data-theme="light"] .blob { opacity: 0.15; mix-blend-mode: multiply; }
    .blob-1 { width: 600px; height: 600px; background: var(--primary); top: -15%; left: -10%; animation-delay: 0s; }
    .blob-2 { width: 500px; height: 500px; background: #8b5cf6; bottom: -15%; right: -10%; animation-delay: -7s; }
    .blob-3 { width: 400px; height: 400px; background: #ec4899; top: 40%; left: 60%; animation-delay: -14s; }

    @keyframes blob-float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(80px, -60px) scale(1.15); }
      66% { transform: translate(-50px, 50px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* 🌟 الجزيئات المتطايرة (Particles) */
    .particles {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .particle {
      position: absolute;
      background: var(--primary);
      border-radius: 50%;
      pointer-events: none;
      animation: float-particle linear infinite;
      box-shadow: 0 0 8px var(--primary);
      opacity: 0;
    }
    @keyframes float-particle {
      0% { transform: translateY(100vh) translateX(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(-20vh) translateX(100px); opacity: 0; }
    }

    .hesetak-wrap {
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      position: relative; 
      z-index: 1; 
      padding: 40px 20px;
    }

    /* 🃏 البطاقة الرئيسية (Premium Glassmorphism + 3D Tilt) */
    .hesetak-card {
      max-width: 1000px; 
      width: 100%;
      background: var(--surface);
      backdrop-filter: blur(40px) saturate(150%); 
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border: 1px solid var(--border); 
      border-radius: 32px;
      padding: 56px 48px; 
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      position: relative; 
      overflow: hidden; 
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out, box-shadow 0.3s ease;
      animation: card-entrance 1.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    [data-theme="light"] .hesetak-card {
      box-shadow: 
        0 30px 60px -15px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 0 rgba(255, 255, 255, 0.8);
    }

    @keyframes card-entrance {
      0% { opacity: 0; transform: scale(0.92) translateY(50px); filter: blur(12px); }
      100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }

    /* ✨ تأثير الإضاءة الخلفية المتحركة داخل البطاقة */
    .hesetak-card::before {
      content: ''; 
      position: absolute; 
      top: -50%; 
      right: -50%;
      width: 200%; 
      height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--primary-bg), transparent 30%);
      opacity: 0.4;
      animation: rotate 20s linear infinite; 
      pointer-events: none;
      z-index: 0;
    }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 🏷️ شارة المجموعة */
    .brand-badge {
      display: inline-flex; 
      align-items: center; 
      gap: 8px;
      padding: 8px 20px; 
      border-radius: 9999px;
      background: var(--primary-bg);
      border: 1px solid var(--primary-border);
      color: var(--primary); 
      font-size: 14px; 
      font-weight: 800;
      margin-bottom: 32px; 
      position: relative; 
      z-index: 1;
      animation: badge-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
    }
    @keyframes badge-pop {
      0% { opacity: 0; transform: scale(0.5) translateY(-20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* 🎨 اللوجو مع توهج نابض */
    .hesetak-logo-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto 32px;
      z-index: 1;
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
    }
    .hesetak-logo {
      width: 100%; 
      height: 100%; 
      border-radius: 32px;
      background: var(--grad);
      display: flex; 
      align-items: center; 
      justify-content: center;
      color: #fff; 
      font-size: 60px;
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.4); 
      position: relative; 
      z-index: 2;
      border: 4px solid var(--surface);
      outline: 1px solid var(--border);
      animation: float 6s ease-in-out infinite;
      overflow: hidden;
    }
    .hesetak-logo img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      border-radius: 28px; 
    }
    .hesetak-logo-wrap::after {
      content: '';
      position: absolute;
      inset: -15px;
      border-radius: 40px;
      background: var(--grad);
      filter: blur(25px);
      opacity: 0.6;
      z-index: 1;
      animation: pulse-glow 4s infinite alternate ease-in-out;
    }
    @keyframes float { 
      0%, 100% { transform: translateY(0) rotate(0deg); } 
      50% { transform: translateY(-12px) rotate(2deg); } 
    }
    @keyframes pulse-glow {
      0% { opacity: 0.4; transform: scale(0.9); }
      100% { opacity: 0.8; transform: scale(1.1); }
    }

    /* 📝 العناوين مع تأثير لمعان */
    .hesetak-title {
      font-size: 48px; 
      font-weight: 900; 
      margin: 0 0 16px;
      background: linear-gradient(90deg, var(--primary), #8b5cf6, #ec4899, var(--primary));
      background-size: 300% auto;
      -webkit-background-clip: text; 
      background-clip: text;
      -webkit-text-fill-color: transparent; 
      letter-spacing: -1px;
      position: relative; 
      z-index: 1;
      animation: shimmer 5s linear infinite, fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.5s both;
    }
    @keyframes shimmer {
      0% { background-position: 0% center; }
      100% { background-position: 300% center; }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hesetak-subtitle {
      font-size: 18px; 
      color: var(--text-secondary); 
      line-height: 1.9;
      margin-bottom: 48px; 
      max-width: 650px; 
      margin-left: auto; 
      margin-right: auto;
      position: relative; 
      z-index: 1;
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.6s both;
    }

    /* 🎯 شبكة المميزات (3D Hover + Staggered Entrance) */
    .features-grid {
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px; 
      margin-bottom: 48px; 
      position: relative; 
      z-index: 1;
      perspective: 1000px;
    }

    .feature-card {
      background: var(--surface-hover); 
      border: 1px solid var(--border);
      border-radius: 20px; 
      padding: 28px 20px; 
      text-align: center;
      position: relative;
      opacity: 0;
      animation: slide-up-fade 0.7s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-style: preserve-3d;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s, border-color 0.4s;
      overflow: hidden;
    }
    
    .feature-card:nth-child(1) { animation-delay: 0.7s; }
    .feature-card:nth-child(2) { animation-delay: 0.8s; }
    .feature-card:nth-child(3) { animation-delay: 0.9s; }
    .feature-card:nth-child(4) { animation-delay: 1.0s; }

    @keyframes slide-up-fade {
      from { opacity: 0; transform: translateY(40px) rotateX(15deg); }
      to { opacity: 1; transform: translateY(0) rotateX(0); }
    }

    /* Gradient Border on Hover */
    .feature-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 20px;
      padding: 2px;
      background: linear-gradient(135deg, var(--primary), #8b5cf6, transparent);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
      pointer-events: none;
    }
    
    .feature-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: transparent;
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
      background: var(--surface);
    }
    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-icon-wrap {
      width: 68px; 
      height: 68px; 
      border-radius: 18px;
      background: var(--primary-bg);
      border: 1px solid var(--primary-border);
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 32px; 
      margin: 0 auto 20px;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      z-index: 1;
    }
    
    .feature-card:hover .feature-icon-wrap {
      background: var(--grad);
      border-color: transparent;
      transform: scale(1.15) rotateZ(8deg);
      box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
    }
    
    .feature-card:hover .feature-icon-wrap span {
      filter: brightness(0) invert(1);
      animation: icon-bounce 0.6s ease;
    }
    @keyframes icon-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .feature-title { 
      font-size: 16px; 
      font-weight: 800; 
      margin-bottom: 10px; 
      color: var(--text); 
      position: relative;
      z-index: 1;
    }
    
    .feature-desc { 
      font-size: 14px; 
      color: var(--text-muted); 
      line-height: 1.7; 
      position: relative;
      z-index: 1;
    }

    /* 🚀 زر الانطلاق (CTA) مع تأثير ضوئي */
    .cta-wrap { 
      position: relative; 
      z-index: 1; 
      margin-top: 24px; 
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1.1s both;
    }
    
    .cta-btn {
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 14px;
      padding: 20px 56px; 
      background: linear-gradient(135deg, var(--primary), #8b5cf6); 
      color: #fff;
      border-radius: 16px; 
      font-size: 18px; 
      font-weight: 800;
      text-decoration: none; 
      box-shadow: 0 15px 40px rgba(99, 102, 241, 0.4), inset 0 1px 0 rgba(255,255,255,0.2);
      transition: all .4s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    
    .cta-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      transition: left 0.7s;
      z-index: -1;
    }
    
    .cta-btn:hover { 
      transform: translateY(-6px) scale(1.03); 
      box-shadow: 0 25px 50px rgba(99, 102, 241, 0.6), inset 0 1px 0 rgba(255,255,255,0.3); 
      color: #fff; 
    }
    .cta-btn:hover::before {
      left: 100%;
    }
    
    .cta-arrow { 
      font-size: 24px; 
      transition: transform .4s cubic-bezier(0.4, 0, 0.2, 1); 
    }
    .cta-btn:hover .cta-arrow { 
      transform: translateX(-8px) scale(1.2); 
    }

    /* 🔗 الروابط الثانوية */
    .secondary-links {
      display: flex; 
      gap: 16px; 
      justify-content: center; 
      margin-top: 32px;
      flex-wrap: wrap; 
      position: relative; 
      z-index: 1;
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1.2s both;
    }
    
    .sec-link {
      padding: 10px 20px;
      font-size: 15px; 
      font-weight: 600; 
      color: var(--text-secondary);
      text-decoration: none; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px; 
      border-radius: 12px;
      transition: all 0.3s;
      border: 1px solid transparent;
      position: relative;
    }
    
    .sec-link::after {
      content: '';
      position: absolute;
      bottom: 6px;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: all 0.3s;
      transform: translateX(-50%);
      border-radius: 2px;
    }
    
    .sec-link:hover { 
      color: var(--primary); 
      background: var(--primary-bg);
      border-color: var(--primary-border);
      transform: translateY(-2px);
    }
    .sec-link:hover::after {
      width: 60%;
    }

    /* 📌 الفوتر */
    .footer-brand {
      margin-top: 56px; 
      font-size: 13px; 
      color: var(--text-muted);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 10px;
      position: relative; 
      z-index: 1; 
      padding-top: 32px; 
      border-top: 1px solid var(--border);
      animation: fadeInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1.3s both;
    }
    .footer-brand strong { 
      color: var(--primary); 
      font-weight: 800;
    }

    /* 🌙 زر تبديل الثيم */
    .theme-toggle-fixed {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 100;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(10px);
    }
    .theme-toggle-fixed:hover {
      background: var(--surface-hover);
      border-color: var(--primary-border);
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    /* 📱 الاستجابة للشاشات الصغيرة */
    @media (max-width: 768px) {
      .hesetak-card { padding: 40px 24px; border-radius: 24px; }
      .hesetak-title { font-size: 36px; }
      .hesetak-subtitle { font-size: 16px; }
      .features-grid { grid-template-columns: 1fr 1fr; gap: 16px; }
      .feature-card { padding: 24px 16px; }
      .feature-icon-wrap { width: 56px; height: 56px; font-size: 28px; }
      .cta-btn { padding: 18px 36px; font-size: 16px; }
    }
    
    @media (max-width: 480px) {
      .hesetak-title { font-size: 28px; }
      .features-grid { grid-template-columns: 1fr; }
      .cta-btn { width: 100%; padding: 18px 24px; font-size: 16px; }
      .brand-badge { font-size: 12px; padding: 6px 14px; }
    }
  </style>
</head>
<body data-theme="dark">
  <!-- 🌌 خلفية EduFlow القياسية -->
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  
  <!-- ✨ كرات إضاءة متحركة في الخلفية (Blobs) -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- 🌟 جزيئات متطايرة (Particles) -->
  <div class="particles" id="particles"></div>

  <!-- 🌙 زر تبديل المظهر -->
  <button class="theme-toggle-fixed" id="themeToggle" onclick="if(typeof ThemeManager?.toggleTheme==='function')ThemeManager.toggleTheme()" title="تبديل المظهر">🌙</button>

  <div class="hesetak-wrap">
    <div class="hesetak-card" id="hesetakCard">
      <div class="brand-badge">
        <span>🏢</span>
        <span>Habbash Group</span>
      </div>

      <div class="hesetak-logo-wrap">
        <div class="hesetak-logo" id="hLogo">📚</div>
      </div>
      <h1 class="hesetak-title" id="hTitle">منصة حصتك</h1>
      <p class="hesetak-subtitle" id="hSubtitle">منصتك التعليمية الشاملة للمراجعة، الشرح، والمتابعة المستمرة. كل ما يحتاجه الطالب للنجاح في مكان واحد.</p>
      
      <div class="features-grid" id="hFeatures"></div>
      
      <div class="cta-wrap">
        <a href="#" id="hCta" target="_blank" rel="noopener" class="cta-btn">
          🚀 اذهب إلى منصة حصتك
          <span class="cta-arrow">←</span>
        </a>
      </div>
      
      <div class="secondary-links">
        <a href="about.html" class="sec-link">
          <span>ℹ️</span> من نحن
        </a>
        <a href="login.html" class="sec-link">
          <span>→</span> العودة لتسجيل الدخول
        </a>
      </div>

      <div class="footer-brand">
        <span>Powered by</span>
        <strong>EduFlow</strong>
        <span>•</span>
        <span>Habbash Group</span>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/footer-injector.js"></script>

  <script>
    // 🛠️ دالة معالجة صور Drive
    window.driveThumb = function(url) { 
      try { 
        if(!url) return ''; 
        const u = String(url); 
        const m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/) || u.match(/^([\w-]{20,})$/); 
        return m ? ('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400') : u; 
      } catch(e) { return url || ''; } 
    };

    // 🌟 توليد الجزيئات المتطايرة (Particles)
    (function(){
      const container = document.getElementById('particles');
      if(!container) return;
      const count = window.innerWidth < 768 ? 15 : 35;
      for(let i=0; i<count; i++){
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (Math.random() * 4 + 2) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (Math.random() * 20 + 15) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        container.appendChild(p);
      }
    })();

    // 🎯 تأثير 3D Tilt للبطاقة الرئيسية
    (function(){
      const card = document.getElementById('hesetakCard');
      if(!card || window.innerWidth < 1024) return; // تعطيل على الموبايل
      
      card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = (y - centerY) / 40;
        const rotateY = (centerX - x) / 40;
        
        requestAnimationFrame(() => {
          card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.01, 1.01, 1.01)`;
        });
      });
      
      card.addEventListener('mouseleave', () => {
        card.style.transition = 'transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1)';
        card.style.transform = 'perspective(1200px) rotateX(0) rotateY(0) scale3d(1, 1, 1)';
      });
      
      card.addEventListener('mouseenter', () => {
        card.style.transition = 'none';
      });
    })();

    // 🚀 التهيئة (Boot)
    (async function(){
      try {
        if (typeof DataService?.init === 'function') await DataService.init();
        if (typeof ThemeManager?.applyBranding === 'function') ThemeManager.applyBranding();
        
        const h = (typeof DataService?.getHesetak === 'function' ? DataService.getHesetak() : null) || 
                  (window.EduFlowConfig?.hesetak) || {};
        
        const title = h.title || 'منصة حصتك';
        const subtitle = h.subtitle || 'منصتك التعليمية الشاملة للمراجعة، الشرح، والمتابعة المستمرة. كل ما يحتاجه الطالب للنجاح في مكان واحد.';
        const url = h.url || '#';

        document.getElementById('hTitle').textContent = title;
        document.getElementById('hSubtitle').textContent = subtitle;
        document.getElementById('hCta').href = url;
        document.title = title + ' - Habbash Group';
        
        if (h.logo) {
          document.getElementById('hLogo').innerHTML = `<img src="${window.driveThumb(h.logo)}" alt="Logo" onerror="this.style.display='none'; this.parentElement.textContent='📚';">`;
        }

        // 🎯 المميزات
        const features = h.features || [
          { i: '🎬', t: 'شروحات مسجلة', d: 'مكتبة فيديوهات منظمة حسب المنهج الدراسي' },
          { i: '📝', t: 'امتحانات تجريبية', d: 'قيّم مستواك واكتشف نقاط ضعفك قبل الامتحان الفعلي' },
          { i: '📊', t: 'تقارير أداء', d: 'تابع تقدمك الدراسي ونقاط قوتك وضعفك بدقة' },
          { i: '💬', t: 'تفاعل مباشر', d: 'اطرح أسئلتك واحصل على إجابات فورية من المدرسين' }
        ];
        
        document.getElementById('hFeatures').innerHTML = features.map(f => 
          `<div class="feature-card">
            <div class="feature-icon-wrap"><span>${f.i}</span></div>
            <div class="feature-title">${f.t}</div>
            <div class="feature-desc">${f.d}</div>
          </div>`
        ).join('');

      } catch(err) {
        console.error('Hesetak boot error:', err);
      }
    })();

    // 🌙 تهيئة زر الثيم
    (function(){
      const saved = localStorage.getItem('eduflow_theme');
      const btn = document.getElementById('themeToggle');
      if(saved && btn){
        document.body.setAttribute('data-theme', saved);
        btn.textContent = saved === 'dark' ? '🌙' : '☀️';
      }
      
      if(btn) {
        btn.addEventListener('click', () => {
          setTimeout(() => {
            const currentTheme = document.body.getAttribute('data-theme');
            btn.textContent = currentTheme === 'dark' ? '🌙' : '☀️';
          }, 100);
        });
      }
    })();
  </script>
</body>
</html>
