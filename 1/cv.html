              )
            )
          )
        ),

        h("div", { className: "grid grid-cols-2 gap-4" },
          h("div", { className: "space-y-3" },
            h("div", null,
              h(PreviewSectionTitle, { icon: Icons.graduation, title: "التعليم الأكاديمي", theme }),
              h("div", { className: "space-y-2" },
                data.education.map((edu) =>
                  h("div", { key: edu.id, className: "rounded-md border border-zinc-200 bg-white p-2.5" },
                    h("div", { className: "font-bold text-[11px] text-zinc-900" }, edu.degree),
                    h("div", { className: "text-[10px] text-zinc-500 font-semibold mt-0.5" }, edu.uni, " • ", edu.period),
                    h("div", { className: "text-[10px] leading-5 text-zinc-600 mt-1" }, edu.note)
                  )
                )
              )
            ),
            h("div", null,
              h(PreviewSectionTitle, { icon: Icons.edit, title: "الدورات والشهادات", theme }),
              h("div", { className: "rounded-md border border-zinc-200 bg-zinc-50/50 p-2 space-y-1" },
                data.courses.map((course, idx) =>
                  h("div", { key: idx, className: "flex gap-2 items-start text-[10px] leading-5" },
                    h("span", { className: "mt-2 w-1 h-1 rounded-full shrink-0", style: { background: theme.primary } }),
                    h("span", { className: "font-semibold text-zinc-700" }, course)
                  )
                )
              )
            )
          ),

          h("div", { className: "space-y-3" },
            h("div", null,
              h(PreviewSectionTitle, { icon: Icons.code, title: "المهارات التقنية", theme }),
              h("div", { className: "space-y-1.5" },
                skillsList.map((skill) =>
                  h("div", { key: skill.k, className: "rounded-md border border-zinc-200 bg-white p-2" },
                    h("div", { className: "flex items-center gap-1.5 font-bold text-[10.5px] text-zinc-800" },
                      h("span", null, skill.icon), skill.k
                    ),
                    h("div", { className: "mt-0.5 text-[10px] leading-5 text-zinc-600" }, skill.v)
                  )
                )
              )
            ),
            h("div", null,
              h(PreviewSectionTitle, { icon: Icons.book, title: "اللغات", theme }),
              h("div", { className: "space-y-2" },
                data.languages.map((lang, idx) =>
                  h("div", { key: idx, className: "flex items-center gap-2" },
                    h("div", { className: "w-20" },
                      h("div", { className: "font-bold text-[10.5px]" }, lang.lang),
                      h("div", { className: "text-[9px] text-zinc-500" }, lang.level)
                    ),
                    h("div", { className: "flex-1 h-1.5 rounded-full bg-zinc-100 overflow-hidden" },
                      h("div", { className: "h-full rounded-full", style: { width: `${lang.pct}%`, background: theme.primary } })
                    ),
                    h("div", { className: "text-[9px] font-bold w-7 text-left text-zinc-600" }, lang.pct, "%")
                  )
                )
              )
            )
          )
        ),

        h("div", { className: "pt-3 border-t border-zinc-200 flex items-center justify-between text-[9px] text-zinc-400" },
          h("span", null, "تم إنشاء السيرة باحترافية • ", new Date().toLocaleDateString("ar-EG")),
          h("span", { className: "font-bold", style: { color: theme.primary } }, data.name, " • ", data.email)
        )
      )
    )
  );
};

/* ============================================================
   7️⃣ المكون الرئيسي
   ============================================================ */
const App = () => {
  const [themeId, setThemeId] = useState("purple");
  const [fontId, setFontId] = useState("cairo");
  const [fontSize, setFontSize] = useState(14);
  const [changeCount, setChangeCount] = useState(0);

  const [data, setData] = useState({
    ...DEFAULT_DATA,
    avatar: null,
    avatarShape: "circle"
  });

  const currentTheme = THEMES.find(t => t.id === themeId) || THEMES[0];
  const currentFont = FONTS.find(f => f.id === fontId) || FONTS[0];

  const handleUploadImage = (imageUrl) => {
    setData({ ...data, avatar: imageUrl });
    setChangeCount(c => c + 1);
  };

  const handleThemeChange = (id) => {
    setThemeId(id);
    setChangeCount(c => c + 1);
  };

  const handleExportPDF = async () => {
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    overlay.classList.remove('hidden');
    loadingText.textContent = 'جاري إنشاء PDF...';
    
    try {
      // ✅ انتظار تحميل الخطوط
      await document.fonts.ready;
      
      const element = document.getElementById('cv-content');
      const canvas = await html2canvas(element, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        allowTaint: true,
        foreignObjectRendering: true
      });
      
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'portrait',
        unit: 'mm',
        format: 'a4'
      });
      
      const pdfWidth = 210;
      const pdfHeight = 297;
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save(`${data.name.replace(/\s+/g, '_')}_CV.pdf`);
    } catch (err) {
      console.error(err);
      alert('حدث خطأ أثناء إنشاء PDF');
    } finally {
      overlay.classList.add('hidden');
    }
  };

  const handleExportImage = async () => {
    const overlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');
    overlay.classList.remove('hidden');
    loadingText.textContent = 'جاري إنشاء الصورة...';
    
    try {
      // ✅ انتظار تحميل الخطوط
      await document.fonts.ready;
      
      const element = document.getElementById('cv-content');
      const canvas = await html2canvas(element, {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        allowTaint: true,
        foreignObjectRendering: true
      });
      
      const link = document.createElement('a');
      link.download = `${data.name.replace(/\s+/g, '_')}_CV.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    } catch (err) {
      console.error(err);
      alert('حدث خطأ أثناء إنشاء الصورة');
    } finally {
      overlay.classList.add('hidden');
    }
  };

  return h("div", {
    dir: "rtl",
    className: "min-h-screen bg-[#F8F7FF] text-zinc-900",
    style: { fontFamily: currentFont.family }
  },
    h(Header, {
      theme: themeId,
      setThemeId: handleThemeChange,
      fontId,
      setFontId,
      fontSize,
      setFontSize,
      onUploadImage: handleUploadImage,
      onExportPDF: handleExportPDF,
      onExportImage: handleExportImage,
      currentTheme,
      changeCount
    }),
    h("div", { className: "mx-auto max-w-[1600px] flex flex-col lg:flex-row min-h-[calc(100vh-64px)]" },
      h(Sidebar, { data, setData, theme: currentTheme }),
      h(Preview, { data, theme: currentTheme, fontSize })
    )
  );
};

createRoot(document.getElementById("root")).render(h(App));
</script>

</body>
