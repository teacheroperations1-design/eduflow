    function cx(...classes) {
      return classes.filter(Boolean).join(" ");
    }

    function makeId(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function makeGameCode() {
      const part = Math.random().toString(36).slice(2, 6).toUpperCase();
      const stamp = Date.now().toString().slice(-3);
      return `H-${part}-${stamp}`;
    }

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function ParticleBackground() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        let animationFrame;

        const particles = Array.from({ length: 80 }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 0.5,
          vy: (Math.random() - 0.5) * 0.5,
          r: Math.random() * 2 + 0.5,
          hue: 250 + Math.random() * 80
        }));

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };

        resize();
        window.addEventListener("resize", resize);

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
          gradient.addColorStop(0, "rgba(10, 5, 25, 1)");
          gradient.addColorStop(0.5, "rgba(18, 8, 35, 1)");
          gradient.addColorStop(1, "rgba(30, 15, 5, 1)");
          ctx.fillStyle = gradient;
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;

            if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
            if (p.y < 0 || p.y > canvas.height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, 0.75)`;
            ctx.fill();
          });

          animationFrame = requestAnimationFrame(draw);
        };

        draw();

        return () => {
          cancelAnimationFrame(animationFrame);
          window.removeEventListener("resize", resize);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />;
    }

    function Background() {
      return (
        <div className="fixed inset-0 pointer-events-none">
          <ParticleBackground />
          <div
            className="absolute inset-0 opacity-40"
            style={{
              background: "radial-gradient(900px 600px at 14% 12%, rgba(139,92,246,0.22), transparent), radial-gradient(700px 500px at 88% 84%, rgba(245,158,11,0.16), transparent)"
            }}
          />
        </div>
      );
    }

    function GamePlayer({ game, lab, questions, onClose, showToast }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [score, setScore] = useState(0);
      const [lives, setLives] = useState(game.general.lives);
      const [attemptsLeft, setAttemptsLeft] = useState(
        typeof game.general.attempts === "number" ? game.general.attempts : Infinity
      );
      const [combo, setCombo] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [timeLeft, setTimeLeft] = useState(
        game.general.timerEnabled ? game.general.timerSeconds : 0
      );

      const question = questions[currentIndex];
      const gameType = getGameType(game.gameId);

      useEffect(() => {
        if (!game.general.timerEnabled) return;

        const timer = setInterval(() => {
          setTimeLeft(prev => Math.max(0, prev - 1));
        }, 1000);

        return () => clearInterval(timer);
      }, [game.general.timerEnabled]);

      useEffect(() => {
        if (game.general.timerEnabled && timeLeft === 0) {
          showToast("انتهى الوقت ⏱️");
          onClose();
        }
      }, [timeLeft]);

      if (!question) {
        return null;
      }

      const answer = optionIndex => {
        if (feedback) return;

        const isCorrect = optionIndex === question.correct;
        let gained = 0;
        let nextLives = lives;
        let nextAttempts = attemptsLeft;

        if (isCorrect) {
          const bonus = game.general.speedBonus && game.general.timerEnabled
            ? Math.max(0, Math.floor(timeLeft / 15))
            : 0;

          gained = game.general.points + bonus;
          setScore(s => s + gained);
          setCombo(c => c + 1);
          setFeedback("correct");
          showToast(`إجابة صحيحة +${gained} ⭐`);
        } else {
          nextLives = lives - 1;
          nextAttempts = typeof game.general.attempts === "number" ? attemptsLeft - 1 : Infinity;

          setCombo(0);
          setLives(nextLives);
          setAttemptsLeft(nextAttempts);
          setFeedback("wrong");
          showToast("إجابة خاطئة ❌");
        }

        setTimeout(() => {
          setFeedback(null);

          if (!isCorrect) {
            if (nextLives <= 0) {
              showToast("انتهت الأرواح 💔");
              onClose();
              return;
            }

            if (typeof game.general.attempts === "number" && nextAttempts <= 0) {
              showToast("انتهت المحاولات ❌");
              onClose();
              return;
            }
          }

          if (currentIndex < questions.length - 1) {
            setCurrentIndex(i => i + 1);
          } else {
            const finalScore = score + gained;
            showToast(`انتهت اللعبة 🎉 نتيجتك: ${finalScore}`);
            onClose();
          }
        }, 750);
      };

      return (
        <div className="fixed inset-0 z-[80] bg-[#05020D] flex flex-col">
          {/* شريط علوي */}
          <div className="h-16 backdrop-blur-xl bg-black/30 border-b border-amber-500/15 flex items-center justify-between px-5 shrink-0 relative z-10">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center text-black font-black text-xl">
                {gameType.emoji}
              </div>
              <div>
                <div className="font-bold text-[13px]">
                  {game.title} • {lab?.name}
                </div>
                <div className="text-[11px] text-white/50">
                  {gameType.name} • {game.general.mode} • {game.code}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <div className="px-3 py-1 rounded-full bg-black/40 border border-white/10 text-[11px]">
                ⏱️ {game.general.timerEnabled ? `${timeLeft}ث` : "∞"}
              </div>
              <div className="px-3 py-1 rounded-full bg-black/40 border border-white/10 text-[11px]">
                💖 {lives}
              </div>
              <div className="px-3 py-1 rounded-full bg-amber-500/15 border border-amber-500/20 text-amber-300 text-[11px]">
                ⭐ {score}
              </div>
              <button
                onClick={onClose}
                className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center"
              >
                ✕
              </button>
            </div>
          </div>

          {/* جسم اللعبة */}
          <div className="flex-1 relative overflow-hidden">
            <Background />

            <div className="relative z-10 h-full flex flex-col p-5 max-w-[760px] mx-auto w-full">
              <div className="flex items-center justify-between mb-4">
                <div className="flex gap-2">
                  <span className="px-3 py-1 rounded-full bg-black/40 border border-white/10 text-[11px]">
                    {currentIndex + 1}/{questions.length}
                  </span>
                  <span className="px-3 py-1 rounded-full bg-black/40 border border-white/10 text-[11px]">
                    كومبو {combo} {combo >= 3 ? "🔥" : ""}
                  </span>
                </div>

                <div className="flex gap-1">
                  {Array.from({ length: lives }).map((_, i) => (
                    <span key={i} className="text-[16px]">❤️</span>
                  ))}
                </div>
              </div>

              {/* شريط تقدم القطار فقط كمثال */}
              {game.gameId === "train" && (
                <div className="mb-4">
                  <div className="h-[4px] rounded-full bg-white/10 overflow-hidden">
                    <div
                      className="h-full bg-gradient-to-r from-amber-400 to-orange-500"
                      style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }}
                    />
                  </div>
                  <div className="flex gap-1 mt-2">
                    {Array.from({ length: Math.min(game.specific.cars || 5, currentIndex + 1) }).map((_, i) => (
                      <div
                        key={i}
                        className="w-10 h-6 rounded bg-violet-500/40 border border-white/10 flex items-center justify-center text-[10px]"
                      >
                        📦
                      </div>
                    ))}
                  </div>
                </div>
              )}

              <div className="rounded-[24px] bg-[#120E24]/90 border border-amber-500/15 p-6 backdrop-blur-xl shadow-2xl">
                <div className="text-[10px] text-amber-300 mb-2 tracking-widest flex items-center gap-2">
                  <span>{gameType.emoji}</span>
                  <span>{gameType.name}</span>
                  {game.general.visual && <span>• اهتزاز بصري</span>}
                </div>

                <h3 className="text-[18px] md:text-[20px] font-bold leading-relaxed">
                  {question.text}
                </h3>

                {game.general.hints && (
                  <div className="mt-3 p-2 rounded-[10px] bg-violet-500/10 border border-violet-500/20 text-[11px] text-violet-200">
                    💡 تلميح: الإجابة الصحيحة تبدأ بـ "{question.options[question.correct].slice(0, 2)}..."
                  </div>
                )}

                <div className="grid gap-2.5 mt-5">
                  {question.options.map((option, index) => (
                    <button
                      key={index}
                      onClick={() => answer(index)}
                      className={cx(
                        "h-[52px] rounded-full font-bold text-[14px] px-5 text-right flex items-center justify-between transition-all shadow hover:scale-[1.02]",
                        feedback === null && "bg-white text-[#0F0A1E] hover:bg-white/90",
                        feedback !== null && index === question.correct && "bg-emerald-500 text-white",
                        feedback === "wrong" && index !== question.correct && "bg-red-500/20 text-red-200",
                        feedback === "correct" && index !== question.correct && "bg-white/20 text-white/60"
                      )}
                    >
                      <span>{option}</span>
                      <span className="w-7 h-7 rounded-full bg-black/10 flex items-center justify-center text-[11px]">
                        {String.fromCharCode(65 + index)}
                      </span>
                    </button>
                  ))}
                </div>
              </div>

              <div className="mt-auto pt-6 flex justify-between text-[11px] text-white/40">
                <span>
                  محاولات {typeof game.general.attempts === "number" ? attemptsLeft : "∞"} • نقاط {game.general.points} لكل سؤال
                </span>
                <span>
                  {game.categoryIds.length} قسم • {game.general.qCount} سؤال
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

      const [general, setGeneral] = useState(editingGame?.general || getDefaultGameSettings());
      const [specific, setSpecific] = useState(editingGame?.specific || getSpecificSettings("train"));
      const [qCount, setQCount] = useState(editingGame?.general?.qCount || 8);

      const labCategories = categories.filter(c => c.labId === labId);
      const availableQuestions = questions.filter(q =>
        categoryIds.length
          ? categoryIds.includes(q.categoryId)
          : q.labId === labId
      );

      const changeGameId = id => {
        setGameId(id);
        setSpecific(getSpecificSettings(id));
      };

      const updateGeneral = (key, value) => {
        setGeneral(prev => ({ ...prev, [key]: value }));
      };

      const updateSpecific = (key, value) => {
        setSpecific(prev => ({ ...prev, [key]: value }));
      };

      const toggleCategory = id => {
        setCategoryIds(prev =>
          prev.includes(id)
            ? prev.filter(x => x !== id)
            : [...prev, id]
        );
      };

      const handleSave = () => {
        if (!labId) {
          showToast("اختر المختبر أولاً");
          return;

        if (!categoryIds.length) {
          showToast("اختر قسم واحد على الأقل");
          return;
        }

          showToast("لا توجد أسئلة كافية في الأقسام المختارة");
          return;
        }

        onSave({
          labId,
          categoryIds,
          gameId,
          general: {
            ...general,
            qCount
          },
          specific
        });
      };

    /* =========================================================
       7) التطبيق الرئيسي
    ========================================================= */

    function App() {
      /* -----------------------------
         الحالة العامة
      ----------------------------- */

      const [subjects, setSubjects] = useState(DEFAULT_SUBJECTS);
      const [categories, setCategories] = useState(INITIAL_CATEGORIES);
      const [questions, setQuestions] = useState(INITIAL_QUESTIONS);
      const [games, setGames] = useState([]);
      const [challenges, setChallenges] = useState([]);

      const [activeLabId, setActiveLabId] = useState(null);
      const [tab, setTab] = useState("sections");
      const [toast, setToast] = useState("");

      const [isLabModalOpen, setLabModalOpen] = useState(false);
      const [newLabName, setNewLabName] = useState("");

      const [isCategoryModalOpen, setCategoryModalOpen] = useState(false);
      const [editingCategory, setEditingCategory] = useState(null);
      const [categoryForm, setCategoryForm] = useState({
        name: "",
        color: "#8B5CF6",
        desc: ""
      });

      const [isQuestionModalOpen, setQuestionModalOpen] = useState(false);
      const [editingQuestion, setEditingQuestion] = useState(null);
      const [questionForm, setQuestionForm] = useState({
        categoryId: "",
        text: "",
        options: ["", "", "", ""],
        correct: 0
      });

      const [isBuilderOpen, setBuilderOpen] = useState(false);
      const [editingGame, setEditingGame] = useState(null);
      const [playerState, setPlayerState] = useState(null);
      const [categoryFilter, setCategoryFilter] = useState("all");

      const toastTimer = useRef(null);

      /* -----------------------------
         بيانات مشتقة
      ----------------------------- */

      const activeLab = subjects.find(s => s.id === activeLabId) || null;

      const labCategories = useMemo(() =>
        activeLabId ? categories.filter(c => c.labId === activeLabId) : [],
        [categories, activeLabId]
      );

      const labQuestions = useMemo(() =>
        activeLabId ? questions.filter(q => q.labId === activeLabId) : [],
        [questions, activeLabId]
      );

      const filteredQuestions = useMemo(() =>
        categoryFilter === "all"
          ? labQuestions
          : labQuestions.filter(q => q.categoryId === categoryFilter),
        [labQuestions, categoryFilter]
      );

      const labGames = useMemo(() =>
        activeLabId ? games.filter(g => g.labId === activeLabId) : [],
        [games, activeLabId]
      );

      /* -----------------------------
         دوال مساعدة داخل التطبيق
      ----------------------------- */

      const showToast = message => {
        setToast(message);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 2300);
      };

      const enterLab = id => {
        setActiveLabId(id);
        setTab("sections");
        setCategoryFilter("all");
        showToast(`دخول ${subjects.find(s => s.id === id)?.name || "المختبر"}`);

        setTimeout(() => {
          document.getElementById("lab-studio")?.scrollIntoView({ behavior: "smooth" });
        }, 100);
      };

      const createLab = () => {
        if (!newLabName.trim()) {
          showToast("اكتب اسم المختبر");
          return;
        }

        const id = makeId("lab");
        const index = subjects.length % LAB_GRADIENTS.length;

        setSubjects(prev => [
          ...prev,
          {
            id,
            name: newLabName.trim(),
            icon: "FlaskConical",
            color: LAB_COLORS[index],
            gradient: LAB_GRADIENTS[index]
          }
        ]);

        setNewLabName("");
        setLabModalOpen(false);
        showToast("تم إنشاء المختبر ✨");
      };

      const saveCategory = () => {
        if (!activeLabId || !categoryForm.name.trim()) {
          showToast("اكتب اسم القسم");
          return;
        }

        if (editingCategory) {
          setCategories(prev =>
            prev.map(c =>
              c.id === editingCategory.id
                ? { ...c, ...categoryForm }
                : c
            )
          );
          showToast("تم تعديل القسم ✓");
        } else {
          setCategories(prev => [
            ...prev,
            {
              id: makeId("cat"),
              labId: activeLabId,
              icon: "Layers",
              createdAt: Date.now(),
              ...categoryForm
            }
          ]);
          showToast("تم حفظ القسم 📚");
        }

        setCategoryModalOpen(false);
        setEditingCategory(null);
        setCategoryForm({ name: "", color: "#8B5CF6", desc: "" });
      };

      const deleteCategory = id => {
        setCategories(prev => prev.filter(c => c.id !== id));
        setQuestions(prev => prev.filter(q => q.categoryId !== id));
        showToast("تم حذف القسم");
      };

      const saveQuestion = () => {
        if (!activeLabId) return;

        if (!questionForm.categoryId || !questionForm.text.trim() || questionForm.options.some(o => !o.trim())) {
          showToast("أكمل كل الحقول");
          return;
        }

        if (editingQuestion) {
          setQuestions(prev =>
            prev.map(q =>
              q.id === editingQuestion.id
                ? { ...q, ...questionForm }
                : q
            )
          );
          showToast("تم تعديل السؤال ✓");
        } else {
          setQuestions(prev => [
            ...prev,
            {
              id: makeId("q"),
              labId: activeLabId,
              ...questionForm
            }
          ]);
          showToast("تمت إضافة السؤال 🎉");
        }

        setQuestionModalOpen(false);
        setEditingQuestion(null);
        setQuestionForm({
          categoryId: "",
          text: "",
          options: ["", "", "", ""],
          correct: 0
        });
      };

      const deleteQuestion = id => {
        setQuestions(prev => prev.filter(q => q.id !== id));
        showToast("تم حذف السؤال");
      };

      const openBuilder = (game = null) => {
        setEditingGame(game);
        setBuilderOpen(true);
      };

      const saveBuiltGame = data => {
        const code = editingGame?.code || makeGameCode();

        const game = {
          id: editingGame?.id || makeId("bg"),
          createdAt: editingGame?.createdAt || Date.now(),
          code,
          title: data.general.title,
          desc: data.general.desc,
          ...data
        };

        if (editingGame) {
          setGames(prev => prev.map(g => g.id === editingGame.id ? game : g));
          showToast("تم تحديث اللعبة 🛠️");
        } else {
          setGames(prev => [...prev, game]);
          showToast(`تم إنشاء اللعبة 🚀 كود ${code}`);
        }

        setBuilderOpen(false);
        setEditingGame(null);
        setTab("mygames");
      };

      const startGame = game => {
        let qs = questions.filter(q => game.categoryIds.includes(q.categoryId));

        if (game.general.shuffle) {
          qs = shuffleArray(qs);
        }

        qs = qs.slice(0, game.general.qCount);

        if (!qs.length) {
          showToast("لا توجد أسئلة كافية في الأقسام المختارة");
          return;
        }

        setPlayerState({
          game,
          questions: qs,
          lab: subjects.find(s => s.id === game.labId)
        });
      };

      const createChallenge = game => {
        setChallenges(prev => [
          ...prev,
          {
            id: makeId("ch"),
            gameId: game.id,
            code: game.code,
            plays: 0
          }
        ]);

        showToast(`تم إنشاء التحدي 🏆 كود ${game.code}`);
      };

      const copyCode = code => {
        navigator.clipboard?.writeText(code);
        showToast(`تم نسخ الكود: ${code}`);
      };

      /* -----------------------------
         الواجهة
      ----------------------------- */

      return (
        <div className="min-h-screen text-white overflow-clip">
          <Background />

            <div className="max-w-[1280px] mx-auto h-[72px] px-6 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-12 h-12 rounded-[14px] bg-gradient-to-br from-violet-600 to-indigo-700 flex items-center justify-center font-black shadow-lg border border-amber-400/20 relative overflow-hidden">
                  <span className="relative z-10">H</span>
                </div>

                <div className="leading-none">
                  <div className="text-[10px] tracking-[0.28em] gold-text font-black">
                    HABASH ULTRA STUDIO
                  </div>
                  <div className="font-black text-[17px] flex items-center gap-1">
                    مختبرات هباش
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500 text-black">
                      نسخة منظمة
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => openBuilder()}
                  className="hidden md:flex h-10 px-5 rounded-full bg-gradient-to-l from-amber-400 to-orange-500 text-black text-[13px] font-black items-center gap-2 shadow-lg"
                >
                  🎮 إنشاء لعبة درس
                </button>

                <div className="h-10 px-4 rounded-full glass-gold flex items-center gap-2 text-[11px]">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  {subjects.length} مختبر • {questions.length} سؤال • {games.length} لعبة
                </div>

                {activeLabId && (
                  <button
                    onClick={() => setActiveLabId(null)}
                    className="h-10 px-4 rounded-full bg-white text-black text-[13px] font-bold"
                  >
                    ← الرئيسية
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* Main */}
          <main className="relative max-w-[1280px] mx-auto px-4 md:px-6">
            {/* Hero */}
            <section className="pt-12 pb-10 text-center relative">
              <div className="inline-flex items-center gap-2 px-5 py-2 rounded-full glass-gold text-[11px] mb-6">
                👑 منصة تعليمية فاخرة • نسخة قابلة للتعديل
              </div>

              <h1 className="text-[44px] md:text-[70px] font-black tracking-tight leading-[0.95]">
                اختار <span className="gold-text">المادة</span> لتبدأ
              </h1>

              <p className="mt-5 text-white/50 text-[15px] md:text-[18px] max-w-[720px] mx-auto">

              </p>
            </section>

            {/* Labs */}
            <section className="grid grid-cols-1 md:grid-cols-2 gap-6 pb-8">
              {subjects.map(subject => {
                const questionCount = questions.filter(q => q.labId === subject.id).length;
                const categoryCount = categories.filter(c => c.labId === subject.id).length;
                const gameCount = games.filter(g => g.labId === subject.id).length;
                const active = activeLabId === subject.id;

                return (
                  <button
                    key={subject.id}
                    onClick={() => enterLab(subject.id)}
                    className={cx(
                      "group text-right relative rounded-[30px] border p-7 md:p-8 flex items-center gap-6 backdrop-blur-xl transition-all duration-300 overflow-hidden",
                      active

                        : "bg-[#120E24]/80 border-amber-500/15 hover:border-amber-400/30 hover:-translate-y-1.5"
                    )}
                  >
                    <div className={cx(
                      "w-[90px] h-[90px] rounded-[22px] flex items-center justify-center shadow-xl shrink-0 bg-gradient-to-br border border-white/10 text-4xl",
                      subject.gradient
                    )}>
                      {getSubjectIconEmoji(subject.icon)}
                    </div>

                    <div className="flex-1 min-w-0 relative">
                      <div className="font-black text-[24px] md:text-[28px] leading-none flex items-center gap-2">

                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>

                </Field>

                {questionForm.options.map((option, index) => (
                  <div key={index} className="flex items-center gap-3">
                    <button
                      onClick={() => setQuestionForm({ ...questionForm, correct: index })}
                      className={cx(
                        "w-10 h-10 rounded-full border-2 flex items-center justify-center font-black transition",
                        questionForm.correct === index
                          ? "bg-emerald-500 border-emerald-500 text-white shadow-lg"
                          : "bg-white/5 border-white/10 text-white/40 hover:border-white/20"
                      )}
                    >
                      {questionForm.correct === index ? "✓" : String.fromCharCode(65 + index)}
                    </button>

                    <input
                      value={option}
                      onChange={e => {
                        const options = [...questionForm.options];
                        options[index] = e.target.value;
                        setQuestionForm({ ...questionForm, options });
                      }}
                      placeholder={`اختيار ${index + 1}`}
                      className="flex-1 h-12 rounded-full bg-white/[0.06] border border-white/10 px-5 text-[14px] focus:outline-none"
                    />
                  </div>
                ))}

                <button
                  onClick={saveQuestion}
                  className="w-full h-[56px] rounded-full bg-gradient-to-l from-violet-600 to-indigo-600 text-white font-black text-[16px] shadow-lg hover:scale-[1.01] transition"
                >
                  💾 حفظ السؤال
                </button>
              </div>
            </Modal>
          )}

          {/* Game builder */}
          {isBuilderOpen && (
            <GameBuilder
              subjects={subjects}
              categories={categories}
              questions={questions}
              editingGame={editingGame}
              onClose={() => {
                setBuilderOpen(false);
                setEditingGame(null);
              }}
              onSave={saveBuiltGame}
              showToast={showToast}
            />
          )}

          {/* Game player */}
          {playerState && (
            <GamePlayer
              game={playerState.game}
              lab={playerState.lab}
              questions={playerState.questions}
              onClose={() => setPlayerState(null)}
              showToast={showToast}
            />
          )}

          {/* Toast */}
          <Toast message={toast} />
        </div>
      );
    }

    /* =========================================================
       8) تشغيل التطبيق
    ========================================================= */

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
