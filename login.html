<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px}.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:440px;width:100%;backdrop-filter:blur(20px)}.auth-tabs{display:flex;gap:4px;background:var(--surface-hover);border-radius:var(--radius-sm);padding:4px;margin-bottom:20px}.auth-tab{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:var(--text-secondary);font-weight:600;cursor:pointer}.auth-tab.active{background:var(--primary);color:#fff}</style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <div class="auth-wrap"><div class="auth-card">
    <div style="text-align:center;margin-bottom:20px;"><div style="font-size:40px;">🔐</div><h2 style="margin:8px 0;">تسجيل الدخول</h2></div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="tab('main',this)"> دخول</button>
      <button class="auth-tab" onclick="tab('parent',this)">👨👩 ولي أمر</button>
    </div>
    <form id="mainForm" onsubmit="return doLogin(event)">
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="email" class="form-input" required></div>
      <div class="form-group"><label>كلمة المرور</label><input type="password" id="pass" class="form-input" required></div>
      <button class="btn btn-primary w-full btn-lg">دخول</button>
    </form>
    <form id="parentForm" style="display:none" onsubmit="return doParent(event)">
      <div class="form-group"><label>كود الابن (EDU-XXXX)</label><input type="text" id="pCode" class="form-input" required></div>
      <div class="form-group"><label>كلمة مرور ولي الأمر</label><input type="password" id="pPass" class="form-input" required></div>
      <button class="btn btn-primary w-full btn-lg">متابعة الابن</button>
    </form>
    <div class="text-center" style="margin-top:16px;"><span class="text-sm text-muted">حساب جديد؟</span> <a href="register.html" class="text-sm" style="color:var(--primary);font-weight:700;">سجّل بكود تفعيل</a></div>
  </div></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    function tab(t,btn){document.querySelectorAll('.auth-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.getElementById('mainForm').style.display=t==='main'?'block':'none';document.getElementById('parentForm').style.display=t==='parent'?'block':'none';}
    async function doLogin(e){e.preventDefault();const r=await AuthService.login(document.getElementById('email').value,document.getElementById('pass').value);if(r.success){ThemeManager.toast('أهلاً ✓','success');setTimeout(()=>AuthService.redirectToDashboard(r.user.role),500);}else ThemeManager.toast(r.message,'error');return false;}
    async function doParent(e){e.preventDefault();const r=await AuthService.loginParent(document.getElementById('pCode').value,document.getElementById('pPass').value);if(r.success){setTimeout(()=>AuthService.redirectToDashboard('parent'),400);}else ThemeManager.toast(r.message,'error');return false;}
  </script>
</body>
</html>
