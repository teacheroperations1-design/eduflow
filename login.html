<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px}
    .auth-card{background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(20px);border:1px solid var(--border-strong);border-radius:var(--radius-xl);padding:32px;max-width:480px;width:100%;box-shadow:var(--shadow-lg)}
    .brand-logo{width:72px;height:72px;border-radius:20px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 16px;font-size:32px;box-shadow:var(--glow);overflow:hidden}
    .brand-logo img{width:100%;height:100%;object-fit:cover}
    .hesetak-banner{margin-top:20px;padding:14px;border-radius:12px;background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(99,102,241,.1));border:1px solid var(--info-border);display:flex;align-items:center;gap:12px;text-decoration:none;transition:all var(--t)}
    .hesetak-banner:hover{transform:translateY(-2px);border-color:var(--info)}
    .support-box{background:var(--info-bg);border:1px solid var(--info-border);border-radius:12px;padding:20px;text-align:center}
    .support-phone{font-family:var(--font-en);font-size:26px;font-weight:800;color:var(--info);margin:10px 0;letter-spacing:1px}
    .theme-float{position:fixed;top:20px;left:20px;z-index:100}
    .hint-box{background:var(--info-bg);border:1px solid var(--info-border);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--info);line-height:1.7}
    .warn-banner{background:var(--warning-bg);border:1px solid var(--warning);border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--warning);display:flex;gap:10px;align-items:center}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <button class="icon-btn theme-float" id="themeToggle"></button>
  <div class="auth-wrap">
    <div class="auth-card">
      <div style="text-align:center;margin-bottom:20px;">
        <div class="brand-logo" id="brandLogo">🎓</div>
        <div style="font-size:24px;font-weight:900;color:var(--primary);" id="brandName">EduFlow</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">منصة إدارة المراكز التعليمية</div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="window.tab('main',this)">🔐 دخول عام</button>
        <button class="tab" onclick="window.tab('parent',this)">👨‍👩‍ ولي أمر</button>
      </div>

      <form id="mainForm" onsubmit="return window.doMainLogin(event)">
        <div class="hint-box">
          💡 تقدر تدخل باستخدام: <strong>الإيميل</strong> / <strong>كود الطالب EDU-XXXX</strong> / <strong>رقم الهاتف</strong>
        </div>
        <div class="form-group"><label>البريد / الكود / رقم الهاتف</label><input type="text" id="mainId" class="form-input" placeholder="mail / EDU-XXXX / 01xxxxxxxxx" required autocomplete="username"></div>
        <div class="form-group"><label>كلمة المرور</label><input type="password" id="mainPass" class="form-input" required autocomplete="current-password"></div>
        <button class="btn btn-primary w-full btn-lg">دخول</button>
        <div style="text-align:center;margin-top:12px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
          <a href="register.html" class="text-sm" style="color:var(--primary);font-weight:700;">تسجيل طالب جديد</a>
          <a href="#" onclick="window.openRecovery();return false;" class="text-sm" style="color:var(--text-muted);">نسيت كلمة المرور؟</a>
        </div>
      </form>

      <form id="parentForm" style="display:none" onsubmit="return window.doParentLogin(event)">
        <div class="hint-box">
          👨‍👩‍👧 ولي الأمر يمكنه الدخول بـ: <strong>كود الابن EDU-XXXX</strong> أو <strong>رقم هاتفه</strong> المسجّل كنسبة لولي الأمر
        </div>
        <div class="form-group"><label>كود الابن أو رقم هاتف ولي الأمر</label><input type="text" id="parentCode" class="form-input" placeholder="EDU-1001 أو 01xxxxxxxxx" required></div>
        <div class="form-group"><label>كلمة المرور (نفس كلمة مرور الابن)</label><input type="password" id="parentPass" class="form-input" required></div>
        <button class="btn btn-primary w-full btn-lg">متابعة الأبناء</button>
        <a href="#" onclick="window.openRecovery();return false;" class="text-sm" style="color:var(--text-muted);display:block;text-align:center;margin-top:10px;">نسيت كلمة المرور؟</a>
      </form>

      <a href="hesetak.html" class="hesetak-banner">
        <div style="width:40px;height:40px;border-radius:10px;background:var(--info);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0;">📚</div>
        <div style="flex:1;"><strong style="display:block;font-size:13px;">منصة حصتك</strong><span style="font-size:11px;color:var(--text-muted);">منصتنا التعليمية الشاملة</span></div>
        <span style="color:var(--text-muted);">←</span>
      </a>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>

  <script>
    (async function(){
      try{
        await DataService.init();
        if(typeof ThemeManager?.applyBranding === 'function') ThemeManager.applyBranding();
        const u = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
        if(u && typeof AuthService?.redirectToDashboard === 'function') AuthService.redirectToDashboard(u.role);
      }catch(e){ console.error('Boot error', e); }
    })();

    window.tab = function(t,btn){
      try{
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        btn?.classList.add('active');
        const mf = document.getElementById('mainForm');
        const pf = document.getElementById('parentForm');
        if(mf) mf.style.display = t==='main' ? 'block' : 'none';
        if(pf) pf.style.display = t==='parent' ? 'block' : 'none';
      }catch(e){ console.error('tab error', e); }
    };

    // تنبيه خاص بكلمة المرور الافتراضية 1234
    function warnDefaultPassword(u){
      try{
        if(u?.role==='student' && u?.password==='1234'){
          setTimeout(()=>{
            if(typeof ThemeManager?.toast === 'function'){
              ThemeManager.toast('⚠️ كلمة المرور الافتراضية! غيّرها من الصفحة الشخصية للأمان','warning',6000);
            }
          }, 1500);
        }
      }catch(e){}
    }

    function enter(u, tag){
      try{
        sessionStorage.setItem('eduflow_user', JSON.stringify(u));
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('أهلاً '+u.name,'success');
        warnDefaultPassword(u);
        setTimeout(()=>{
          if(typeof AuthService?.redirectToDashboard === 'function') AuthService.redirectToDashboard(u.role);
        }, 600);
      }catch(e){
        console.error('enter error', e);
        window.location.href = (u?.role==='student'?'student-dashboard.html':'login.html');
      }
    }

    // 🔐 الدخول العام (ذكي): إيميل / كود / هاتف الطالب / هاتف ولي الأمر
    window.doMainLogin = async function(e){
      e.preventDefault();
      try{
        const idEl = document.getElementById('mainId');
        const passEl = document.getElementById('mainPass');
        const id = idEl ? idEl.value.trim() : '';
        const pass = passEl ? passEl.value : '';

        if(!id || !pass){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('أكمل كل الحقول','error');
          return false;
        }

        // 1) لو ولي أمر يحاول الدخول برقمه من "دخول عام" → نوجهه تلقائياً كولي أمر
        const digits = id.replace(/\D/g,'');
        if(digits && digits.length >= 10){
          const children = (typeof DataService?.getStudents === 'function' ? DataService.getStudents() : []).filter(s=>{
            return (s.parentPhone||'').replace(/\D/g,'') === digits;
          });
          if(children.length > 0){
            // الدخول بكلمة مرور الابن (أي ابن — كلها نفس الكلمة عادةً)
            const matchChild = children.find(c => String(c.password) === String(pass));
            if(matchChild){
              const parent = {
                id: 'parent_' + matchChild.id,
                role: 'parent',
                name: 'ولي أمر ' + matchChild.name,
                phone: matchChild.parentPhone,
                studentIds: children.map(c=>c.studentId || c.id),
                viaParentPhone: true
              };
              enter(parent, 'ولي أمر');
              return false;
            }
          }
        }

        // 2) دخول ذكي عادي (إيميل / كود / هاتف الطالب)
        if(typeof DataService?.authenticateSmart === 'function'){
          const u = DataService.authenticateSmart(id, pass);
          if(u){
            if(typeof DataService?.logActivity === 'function') await DataService.logActivity(u.id, u.name, 'تسجيل دخول', id);
            enter(u);
            return false;
          }
        }

        // 3) Fallback للأنظمة القديمة
        if(typeof DataService?.findStudentByCode === 'function' && id.toUpperCase().startsWith('EDU-')){
          const s = DataService.findStudentByCode(id);
          if(s && String(s.password)===String(pass)){ enter(s); return false; }
        }
        if(typeof DataService?.authenticate === 'function'){
          const u = DataService.authenticate(id, pass);
          if(u){ enter(u); return false; }
        }

        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('بيانات الدخول غير صحيحة','error');
      }catch(err){
        console.error('doMainLogin error', err);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ: '+err.message,'error');
      }
      return false;
    };

    // 👨‍👩‍👧 دخول ولي الأمر: كود الابن أو رقم هاتف ولي الأمر
    window.doParentLogin = async function(e){
      e.preventDefault();
      try{
        const codeEl = document.getElementById('parentCode');
        const passEl = document.getElementById('parentPass');
        const code = codeEl ? codeEl.value.trim() : '';
        const pass = passEl ? passEl.value : '';

        if(!code || !pass){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('أكمل كل الحقول','error');
          return false;
        }

        // 1) كود الابن EDU-XXXX
        if(code.toUpperCase().startsWith('EDU-') && typeof DataService?.findStudentByCode === 'function'){
          const s = DataService.findStudentByCode(code);
          if(!s){
            if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('كود الابن غير صحيح','error');
            return false;
          }
          if(String(s.password) !== String(pass)){
            if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('كلمة المرور غير صحيحة','error');
            return false;
          }
          const parent = {
            id: 'parent_' + s.id,
            role: 'parent',
            name: 'ولي أمر ' + s.name,
            phone: s.parentPhone,
            studentIds: [s.studentId || s.id],
            viaChildCode: true
          };
          if(typeof DataService?.logActivity === 'function') await DataService.logActivity(s.id, 'ولي أمر ' + s.name, 'دخول ولي أمر عبر كود الابن', code);
          enter(parent, 'ولي أمر');
          return false;
        }

        // 2) رقم هاتف ولي الأمر — نبحث عن كل الطلاب اللي ليهم رقم ولي الأمر ده
        const digits = code.replace(/\D/g,'');
        if(digits && digits.length >= 10){
          const children = (typeof DataService?.getStudents === 'function' ? DataService.getStudents() : []).filter(s=>{
            return (s.parentPhone||'').replace(/\D/g,'') === digits;
          });
          if(children.length === 0){
            if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا يوجد أبناء مسجلين بهذا الرقم','error');
            return false;
          }
          const matchChild = children.find(c => String(c.password) === String(pass));
          if(!matchChild){
            if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('كلمة المرور غير صحيحة','error');
            return false;
          }
          const parent = {
            id: 'parent_' + matchChild.id,
            role: 'parent',
            name: 'ولي أمر ' + matchChild.name,
            phone: matchChild.parentPhone,
            studentIds: children.map(c=>c.studentId || c.id),
            viaParentPhone: true
          };
          if(typeof DataService?.logActivity === 'function') await DataService.logActivity(matchChild.id, 'ولي أمر ' + matchChild.name, 'دخول ولي أمر برقم الهاتف', digits);
          enter(parent, 'ولي أمر');
          return false;
        }

        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('صيغة غير صحيحة: استخدم EDU-XXXX أو رقم الهاتف','error');
      }catch(err){
        console.error('doParentLogin error', err);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ: '+err.message,'error');
      }
      return false;
    };

    window.openRecovery = function(){
      try{
        const b = typeof DataService?.getBranding === 'function' ? DataService.getBranding() : {};
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header">
              <h3 class="modal-title">🔑 استرجاع كلمة المرور</h3>
              <button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button>
            </div>
            <div class="modal-body">
              <div class="support-box">
                <div style="font-size:36px;">📞</div>
                <p style="margin:8px 0 0;">تواصل مع الدعم لإعادة التعيين</p>
                <div class="support-phone">${b.supportPhone||b.whatsappSupport||'غير محدد'}</div>
                ${b.whatsappSupport?`<a class="btn btn-success w-full" href="https://wa.me/2${String(b.whatsappSupport).replace(/\D/g,'')}" target="_blank">💬 واتساب الدعم</a>`:''}
                <p class="text-xs" style="margin-top:12px;color:var(--text-muted);">كلمة المرور الافتراضية للطلاب الجدد هي: <strong style="font-family:var(--font-en);color:var(--primary);">1234</strong></p>
              </div>
            </div>
          `,'modal-sm');
        }
      }catch(e){ console.error('openRecovery error', e); }
    };
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
