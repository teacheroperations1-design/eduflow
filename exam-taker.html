<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أداء الامتحان - EduFlow by Habbash Group</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    * { box-sizing: border-box; }
    body { overflow-x: hidden; }

    /* ===== Top Bar ===== */
    .exam-topbar {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .exam-topbar .title-area { flex: 1; min-width: 0; }
    .exam-topbar .ex-title { font-size: 15px; font-weight: 800; }
    .exam-topbar .ex-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .progress-wrap {
      flex: 1; min-width: 140px; max-width: 300px;
      height: 8px; background: var(--surface-hover); border-radius: 999px; overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
      position: relative; overflow: hidden;
    }
    .progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0%{transform:translateX(-100%);} 100%{transform:translateX(100%);} }

    .countdown {
      font-family: var(--font-en); font-size: 20px; font-weight: 900;
      color: var(--primary); background: var(--primary-bg);
      padding: 6px 14px; border-radius: 10px; letter-spacing: 1px;
      display: inline-flex; align-items: center; gap: 6px;
      border: 1.5px solid transparent; transition: all 0.3s;
    }
    .countdown.danger { color: var(--danger); background: var(--danger-bg); animation: blink 1s infinite; border-color: var(--danger); }
    .countdown .ico { font-size: 14px; }
    @keyframes blink { 50% { opacity: 0.6; } }

    .viol-badge {
      background: var(--danger); color: #fff; border-radius: 9999px;
      padding: 4px 12px; font-size: 12px; font-weight: 800; font-family: var(--font-en);
      display: none;
    }
    .viol-badge.show { display: inline-block; animation: pulseBadge 0.5s; }
    @keyframes pulseBadge { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }

    /* ===== Question Card ===== */
    .q-stage {
      max-width: 800px; margin: 0 auto; padding: 20px 16px; position: relative; z-index: 1;
      min-height: calc(100vh - 80px);
    }

    .q-progress-dots {
      display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      margin-bottom: 20px;
    }
    .q-dot {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--surface-hover); border: 2px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-family: var(--font-en); font-size: 11px; font-weight: 800;
      color: var(--text-muted); cursor: pointer; transition: all 0.3s;
      position: relative;
    }
    .q-dot:hover { transform: translateY(-2px); }
    .q-dot.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; border-color: transparent; transform: scale(1.15);
      box-shadow: 0 6px 16px rgba(99,102,241,0.4);
    }
    .q-dot.answered { background: var(--success); color: #fff; border-color: transparent; }
    .q-dot.flagged::after {
      content: '🚩'; position: absolute; top: -4px; right: -4px; font-size: 12px;
    }

    .q-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 24px; margin-bottom: 16px;
      animation: qEnter 0.5s cubic-bezier(0.16,1,0.3,1);
      position: relative; overflow: hidden;
    }
    @keyframes qEnter {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .q-card::before {
      content: ''; position: absolute; top: 0; inset-inline-start: 0; width: 6px; height: 100%;
      background: linear-gradient(to bottom, var(--primary), var(--accent));
    }
    [data-hw="1"] .q-card::before { background: linear-gradient(to bottom, var(--success), #059669); }
    [data-hw="1"] .q-num { background: linear-gradient(135deg, var(--success), #059669); }
    [data-hw="1"] .progress-fill { background: linear-gradient(90deg, var(--success), #059669); }
    [data-hw="1"] .result-hero { background: linear-gradient(135deg, var(--success), #059669); }
    [data-hw="1"] .countdown { color: var(--success); background: var(--success-bg); }
    .q-card.flagged { border-color: var(--warning); }

    .q-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .q-num {
      display: inline-flex; width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
      align-items: center; justify-content: center;
      font-weight: 900; font-family: var(--font-en); font-size: 16px;
      flex-shrink: 0; box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .q-text-area { flex: 1; }
    .q-type-badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      font-size: 10px; font-weight: 700; margin-bottom: 6px;
      background: var(--primary-bg); color: var(--primary);
    }
    .q-text { font-size: 17px; font-weight: 700; line-height: 1.8; color: var(--text); }
    .q-image { width: 100%; max-height: 280px; object-fit: contain; border-radius: 12px; margin: 14px 0; background: var(--surface-hover); padding: 8px; }

    .q-timer {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      background: var(--warning-bg); color: var(--warning);
      border-radius: 999px; font-size: 12px; font-weight: 800; font-family: var(--font-en);
      margin-top: 6px;
    }
    .q-timer.critical { background: var(--danger-bg); color: var(--danger); animation: pulse 0.6s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

    /* ===== MCQ Options ===== */
    .mcq-options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
    .mcq-opt {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      background: var(--surface-hover); border: 2px solid var(--border);
      border-radius: 14px; cursor: pointer; transition: all 0.25s;
      position: relative; overflow: hidden;
    }
    .mcq-opt::before {
      content: ''; position: absolute; inset: 0; opacity: 0;
      background: linear-gradient(135deg, var(--primary-bg), transparent);
      transition: opacity 0.3s;
    }
    .mcq-opt:hover { border-color: var(--primary); transform: translateX(-4px); }
    .mcq-opt:hover::before { opacity: 1; }
    .mcq-opt.selected {
      border-color: var(--primary); background: var(--primary-bg);
      box-shadow: 0 4px 16px rgba(99,102,241,0.2);
    }
    .mcq-opt.selected .mcq-letter { background: var(--primary); color: #fff; }
    .mcq-letter {
      width: 34px; height: 34px; border-radius: 10px;
      background: var(--surface); border: 2px solid var(--border);
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 900; font-family: var(--font-en); font-size: 14px;
      color: var(--text); transition: all 0.3s; flex-shrink: 0;
      position: relative; z-index: 1;
    }
    .mcq-text { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.5; position: relative; z-index: 1; }

    /* ===== True/False ===== */
    .tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
    .tf-btn {
      padding: 28px 16px; border-radius: 18px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: var(--surface-hover); border: 2.5px solid var(--border);
      transition: all 0.3s cubic-bezier(0.16,1,0.3,1); position: relative; overflow: hidden;
    }
    .tf-btn .tf-ico { font-size: 40px; transition: transform 0.4s; }
    .tf-btn .tf-lbl { font-size: 18px; font-weight: 800; }
    .tf-btn:hover { transform: translateY(-4px); }
    .tf-btn:hover .tf-ico { transform: scale(1.15); }
    .tf-btn.true-btn.selected {
      background: linear-gradient(135deg, #10b981, #059669); color: #fff; border-color: transparent;
      box-shadow: 0 8px 24px rgba(16,185,129,0.35);
    }
    .tf-btn.false-btn.selected {
      background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff; border-color: transparent;
      box-shadow: 0 8px 24px rgba(239,68,68,0.35);
    }
    .tf-btn.selected .tf-ico { transform: scale(1.2) rotate(-8deg); }

    /* ===== Essay ===== */
    .essay-area { margin-top: 14px; }
    .essay-ta {
      width: 100%; min-height: 160px; padding: 16px; border-radius: 14px;
      background: var(--surface-hover); border: 2px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 15px; line-height: 1.7;
      resize: vertical; transition: border-color 0.2s;
    }
    .essay-ta:focus { outline: none; border-color: var(--primary); }

    .upload-zone {
      margin-top: 12px; border: 2px dashed var(--border); border-radius: 14px;
      padding: 20px; text-align: center; cursor: pointer;
      background: var(--surface-hover); transition: all 0.25s;
    }
    .upload-zone:hover { border-color: var(--primary); background: var(--primary-bg); transform: scale(1.01); }
    .upload-zone input[type="file"] { display: none; }
    .upload-zone .up-icon { font-size: 32px; }
    .upload-zone .up-text { font-size: 13px; color: var(--text-muted); margin-top: 6px; font-weight: 600; }

    .img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 8px; margin-top: 10px; }
    .img-thumb {
      position: relative; width: 100%; aspect-ratio: 1;
      border-radius: 10px; overflow: hidden; border: 2px solid var(--border);
      animation: popIn 0.3s;
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-thumb .rm {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--danger); color: #fff;
      border: none; cursor: pointer; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px;
    }

    /* ===== Nav Buttons ===== */
    .q-nav {
      display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;
    }
    .q-nav .btn { flex: 1; min-width: 120px; padding: 14px; font-size: 15px; font-weight: 800; }
    .q-nav .btn-prev { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
    .q-nav .btn-prev:hover { background: var(--surface); }

    /* ===== Gate / Result Cards ===== */
    .gate-card, .result-hero {
      max-width: 600px; margin: 40px auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-xl); padding: 32px; text-align: center;
      animation: qEnter 0.6s;
    }
    .result-hero {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; padding: 40px 24px;
    }
    .result-hero h2 { margin-bottom: 16px; font-size: 24px; }
    .parent-company-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px;
      border-radius: 9999px; background: linear-gradient(135deg, #fbbf24, #f59e0b);
      color: #fff; font-size: 11px; font-weight: 700; margin-bottom: 16px;
    }
    .dua-box {
      background: rgba(255,255,255,0.15); padding: 20px; border-radius: 12px;
      margin: 20px 0; font-size: 16px; font-weight: 700; line-height: 1.8;
    }
    .result-score {
      font-family: var(--font-en); font-size: 64px; font-weight: 900;
      margin: 20px 0; text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .anti-cheat-banner {
      background: var(--warning-bg); border: 1.5px solid var(--warning);
      border-radius: 14px; padding: 16px; font-size: 13px; color: var(--warning);
      margin-bottom: 20px; line-height: 1.8; display: flex; gap: 12px;
    }
    .anti-cheat-banner .ico { font-size: 24px; flex-shrink: 0; }

    @media (max-width: 640px) {
      .exam-topbar { padding: 10px; font-size: 13px; }
      .countdown { font-size: 16px; padding: 4px 10px; }
      .q-card { padding: 18px; }
      .q-text { font-size: 15px; }
      .tf-btn { padding: 22px 12px; }
      .tf-btn .tf-ico { font-size: 32px; }
      .q-dot { width: 24px; height: 24px; font-size: 10px; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>

  <div class="exam-topbar" id="topbar" style="display:none;">
    <div class="title-area">
      <div class="ex-title" id="exTitle">🎓 الامتحان</div>
      <div class="ex-meta" id="exMeta"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <span class="viol-badge" id="violBadge">⚠️ 0/3</span>
    <span class="countdown" id="countdown"><span class="ico">⏱️</span><span id="cdText">--:--</span></span>
  </div>

  <div class="q-stage" id="exArea"></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>

  <script>
    window.driveThumb = function(url){ try{ if(!url) return ''; const u=String(url); const m=u.match(/\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/)||u.match(/^([\w-]{20,})$/); return m?('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w400'):u; }catch(e){ return url||''; } };
    const safeToast = (msg, type='info') => { try{ if(typeof ThemeManager?.toast==='function') ThemeManager.toast(msg,type); }catch(e){} };

    /* ============ 🎯 تصحيح درجة الامتحان من المصدر (قبل ما data-service يخربها) ============ */
    (function(){
      function gradeExamLenient(ex, answers){
        var qs=ex.questions||[];
        if(!qs.length) return null;
        var any=qs.some(function(q){return q.points;});
        var w=(!any&&ex.totalPoints)?(ex.totalPoints/qs.length):null;
        var score=0, max=0;
        qs.forEach(function(q){
          var pts=(w!=null)?w:(q.points||1);
          max+=pts;
          if(q.type==='essay'||q.type==='short') return; /* المقالي للأستاذ */
          var a=(answers||[]).find(function(x){return x.questionId===q.id;});
          if(!a||a.answer==null||a.answer==='') return;
          var av=String(a.answer).trim();
          var corr=(q.correct!=null&&q.correct!=='')?q.correct:q.correctAnswer;
          var ok= av===String(corr).trim()
            || (q.options&&q.options[corr]&&av===String(q.options[corr]).trim())
            || (q.type==='truefalse'&&((av==='true'&&(corr===true||corr==='true'))||(av==='false'&&(corr===false||corr==='false'))));
          if(ok) score+=pts;
        });
        if(!any&&ex.totalPoints) max=ex.totalPoints;
        return { score:Math.round(score*100)/100, max:Math.round(max*100)/100 };
      }
      function waitDS(){
        if(!window.DataService||typeof DataService.submitExamAttempt!=='function'){ setTimeout(waitDS,300); return; }
        if(DataService.__examGradeFixed) return;
        DataService.__examGradeFixed=1;
        var orig=DataService.submitExamAttempt.bind(DataService);
        DataService.submitExamAttempt=async function(payload){
          var ex=null, calc=null;
          try{ ex=(DataService._getData().exams||[]).find(function(x){return x.id===payload.examId;}); }catch(e){}
          if(ex) calc=gradeExamLenient(ex, payload.answers||[]);
          if(calc){ payload.score=calc.score; payload.maxScore=calc.max; payload.autoGraded=true; }
          var res=await orig(payload);
          /* 🛡️ كتابة فوق أي درجة غلط خزنها data-service */
          try{
            var d=DataService._getData();
            var att=(d.examAttempts||[]).filter(function(a){return a.examId===payload.examId&&a.studentId===payload.studentId;})
              .sort(function(a,b){return String(b.submittedAt||b.endTime||'').localeCompare(String(a.submittedAt||a.endTime||''));})[0];
            if(att&&calc){
              att.score=calc.score; att.maxScore=calc.max; att.autoGraded=true;
              DataService._saveData(d);
              if(window.FirebaseService&&FirebaseService._db) FirebaseService.saveDoc('examAttempts',att.id,att);
            }
          }catch(e){}
          return res;
        };
      }
      waitDS();
    })();

    let currentUser = null, exam = null, started = false, submitted = false;
    let violations = 0, suspicious = [];
    let endTime = 0, countdownInt = null;
    let currentIndex = 0;
    let answers = {};        // { qid: { value, images:[], startedAt, focusedMs } }
    let qRenderedAt = 0;     // when current Q rendered
    let qTimerInt = null;
    let renderQs = [];       // actual questions (possibly randomized)
    const MAX_V = 3;

    /* ============ BOOT ============ */
    (async function boot(){
      try {
        if (typeof DataService?.init === 'function') await DataService.init();
        currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;

        if (!currentUser || currentUser.role !== 'student') {
          renderGate('auth');
          return;
        }

        const params = new URLSearchParams(location.search);
        const exId = params.get('ex');
        const hwId = params.get('hw');
        if (!exId && !hwId) { renderExList(); return; }

        if (hwId) {
          const h = (DataService._getData().homework||[]).find(x=>x.id===hwId);
          if (!h) { renderGate('missing'); return; }
          exam = { id:h.id, title:h.title, questions:h.questions||[], duration:h.duration||30,
            totalPoints:h.totalPoints||20, maxAttempts:h.maxAttempts||1, perQuestionSec:h.perQuestionSec||0,
            randomizeQuestions:!!h.randomizeQuestions, releasePolicy:'instant', isHomework:true,
            allowImages:h.allowImages, imageUrl:h.imageUrl, groupId:h.groupId, deadline:h.deadline };
          document.body.setAttribute('data-hw','1');
        } else {
          exam = DataService?.getExamById ? DataService.getExamById(exId) : null;
          if (!exam) { renderGate('missing'); return; }
        }

        const myAtt = exam.isHomework
          ? (DataService._getData().submissions||[]).filter(s=>s.homeworkId===exam.id&&s.studentId===currentUser.id)
          : (DataService.getExamAttempts ? DataService.getExamAttempts({studentId: currentUser.id, examId: exam.id}) : []);
        const maxAtt = exam.maxAttempts || 1;

        if (myAtt.length >= maxAtt) {
          renderAlreadyDone(myAtt[myAtt.length-1]);
          return;
        }

        if (exam.mode === 'class') { renderGate('class'); return; }

        renderGate('ready');
      } catch(err) {
        console.error(err);
        document.getElementById('exArea').innerHTML = `<div class="gate-card">حدث خطأ: ${err.message}</div>`;
      }
    })();

    /* ============ EXAM LIST ============ */
    window.renderExList = function(){
      try {
        const teachers = DataService.getStudentTeachers ? DataService.getStudentTeachers(currentUser.id) : [];
        const gids = teachers.map(t => t.group?.id).filter(Boolean);
        const list = (DataService.getExams ? DataService.getExams() : []).filter(e => gids.includes(e.groupId));
        const hwList = (DataService._getData().homework||[]).filter(h => gids.includes(h.groupId) && !h.paper && (h.questions||[]).length);
        const mySubs = DataService._getData().submissions||[];

        document.getElementById('exArea').innerHTML = `
          <div class="gate-card" style="max-width:760px; text-align:right; padding:24px;">
            <div class="parent-company-badge"><span>🏢</span><span>Habbash Group</span></div>
            <h3 style="margin-bottom:16px;">📋 الامتحانات المتاحة</h3>
            ${list.length ? list.map(e => {
              const att = (DataService.getExamAttempts?DataService.getExamAttempts({studentId:currentUser.id}):[]).find(a => a.examId === e.id);
              const modeLabel = e.mode==='home'?'🏠 منزلي':e.mode==='class'?'🏫 حصة (بكود)':'📝 ورقي';
              return `<div class="q-card" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;">
                <div><strong>${e.title}</strong>
                  <div class="text-xs text-muted" style="margin-top:4px;">${modeLabel} · ⏱️ ${e.duration||60} دقيقة · ❓ ${(e.questions||[]).length} سؤال</div>
                </div>
                ${e.mode==='offline' ? '<span class="badge badge-muted">يُعمل في الحصة</span>' :
                  att ? '<span class="badge badge-success">تم التسليم 🔒</span>' :
                  `<button class="btn btn-primary btn-sm" onclick="location.href='exam-taker.html?ex=${e.id}'">🎮 دخول</button>`}
              </div>`;
            }).join('') : '<div style="text-align:center; padding:20px; color:var(--text-muted);">لا توجد امتحانات متاحة</div>'}
            ${hwList.length ? '<h3 style="margin:18px 0 12px;">📝 واجبات أونلاين</h3>' + hwList.map(h => {
              const sub = mySubs.find(s=>s.homeworkId===h.id&&s.studentId===currentUser.id);
              return `<div class="q-card" style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; border-color:var(--success);">
                <div><strong>${h.title}</strong>
                  <div class="text-xs text-muted" style="margin-top:4px;">📝 واجب · ⏱️ ${h.duration||30} دقيقة · ❓ ${(h.questions||[]).length} سؤال${h.deadline?' · 📅 '+h.deadline:''}</div>
                </div>
                ${sub ? `<span class="badge badge-success">تم التسليم ${sub.score!=null?('· '+sub.score+'/'+(sub.maxScore||h.totalPoints)):''} 🔒</span>` :
                  `<button class="btn btn-success btn-sm" onclick="location.href='exam-taker.html?hw=${h.id}'">📝 حل الواجب</button>`}
              </div>`;
            }).join('') : ''}
            <a href="student-dashboard.html" class="btn btn-ghost w-full" style="margin-top:16px;">→ العودة للداشبورد</a>
          </div>`;
      } catch(e) { console.error(e); }
    };

    /* ============ GATES ============ */
    function renderGate(kind){
      const host = document.getElementById('exArea');
      if (kind === 'auth') {
        host.innerHTML = `<div class="gate-card">
          <div class="parent-company-badge"><span>🏢</span><span>Habbash Group</span></div>
          <div style="font-size:48px;">🔐</div>
          <h3>يجب تسجيل الدخول كطالب</h3>
          <p class="text-muted" style="margin:8px 0 20px;">الصفحة للطلاب فقط.</p>
          <a class="btn btn-primary w-full" href="login.html">تسجيل الدخول</a>
        </div>`;
        return;
      }
      if (kind === 'missing') {
        host.innerHTML = `<div class="gate-card">
          <div style="font-size:48px;">❌</div><h3>الامتحان غير موجود</h3>
          <a href="student-dashboard.html" class="btn btn-secondary w-full" style="margin-top:16px;">العودة</a>
        </div>`;
        return;
      }
      if (kind === 'class') {
        host.innerHTML = `<div class="gate-card">
          <div class="parent-company-badge"><span>🏢</span><span>Habbash Group</span></div>
          <div style="font-size:48px;">🏫</div><h3>امتحان حصة</h3>
          <p class="text-sm text-muted" style="margin:12px 0;">أدخل كود الدخول من الأستاذ</p>
          <div class="form-group">
            <input type="text" id="entryCode" class="form-input" placeholder="EXAM-XXXX" style="text-align:center; font-family:var(--font-en); letter-spacing:3px; text-transform:uppercase; font-size:18px; font-weight:800;">
          </div>
          <button class="btn btn-primary w-full btn-lg" onclick="window.checkEntryCode()">🔓 دخول</button>
          <a href="student-dashboard.html" class="btn btn-ghost w-full" style="margin-top:8px;">إلغاء</a>
        </div>`;
        return;
      }
      // ready
      const pqSec = exam.perQuestionSec || 0;
      host.innerHTML = `<div class="gate-card">
        <div class="parent-company-badge"><span>🏢</span><span>Habbash Group</span></div>
        <div style="font-size:56px;">🎓</div>
        <h3 style="margin-top:12px;">${exam.title}</h3>
        <div class="text-sm text-muted" style="margin:20px 0; line-height:2.2; text-align:right;">
          ❓ عدد الأسئلة: <strong>${(exam.questions||[]).length}</strong><br>
          ⏱️ المدة الكلية: <strong>${exam.duration||60} دقيقة</strong><br>
          ${pqSec > 0 ? `⏳ زمن كل سؤال: <strong>${pqSec} ثانية</strong> (ينتقل تلقائياً بعده)<br>` : ''}
          🔁 عدد المحاولات: <strong>${exam.maxAttempts||1}</strong><br>
          🛡️ حماية الغش: <strong>مفعّلة</strong>
        </div>
        <button class="btn btn-primary w-full btn-lg" onclick="window.startExam()">▶️ ابدأ الامتحان</button>
        <a href="student-dashboard.html" class="btn btn-ghost w-full" style="margin-top:8px;">إلغاء</a>
      </div>`;
    }

    window.checkEntryCode = function(){
      const val = (document.getElementById('entryCode')?.value || '').trim().toUpperCase();
      const correct = (exam.backupCode || '').toUpperCase();
      if (!correct || val !== correct) { safeToast('❌ كود غير صحيح', 'error'); return; }
      renderGate('ready');
    };

    /* ============ START ============ */
    window.startExam = function(){
      try {
        started = true;
        try { const el = document.documentElement; if (el.requestFullscreen) el.requestFullscreen(); else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen(); } catch(e) {}

        document.getElementById('topbar').style.display = 'flex';
        document.getElementById('exTitle').textContent = '🎓 ' + exam.title;
        document.getElementById('exMeta').textContent = (exam.questions||[]).length + ' سؤال';

        endTime = Date.now() + (exam.duration || 60) * 60000;
        countdownInt = setInterval(tickCountdown, 1000); tickCountdown();

        renderQs = [...(exam.questions || [])];
        if (exam.randomizeQuestions) renderQs.sort(() => Math.random() - 0.5);

        // init answers
        answers = {};
        renderQs.forEach(q => { answers[q.id] = { value: '', images: [], startedAt: Date.now(), focusedMs: 0 }; });

        currentIndex = 0;
        renderQuestion();
        bindAntiCheat();
      } catch(e) {
        console.error(e);
        safeToast('خطأ في بدء الامتحان', 'error');
      }
    };

    /* ============ RENDER QUESTION ============ */
    function renderQuestion(){
      const q = renderQs[currentIndex];
      if (!q) return;
      qRenderedAt = Date.now();
      if (answers[q.id] && !answers[q.id].startedAt) answers[q.id].startedAt = Date.now();

      const total = renderQs.length;
      const pct = Math.round(((currentIndex + 1) / total) * 100);
      document.getElementById('progressFill').style.width = pct + '%';

      // Dots
      let dotsHtml = renderQs.map((qq, i) => {
        const a = answers[qq.id];
        const answered = a && (a.value !== '' || (a.images && a.images.length));
        return `<div class="q-dot ${i===currentIndex?'active':''} ${answered?'answered':''}" onclick="window.jumpTo(${i})">${i+1}</div>`;
      }).join('');

      const typeLabel = q.type === 'mcq' ? '📋 اختيار من متعدد' : q.type === 'truefalse' ? '✔️ صح أو خطأ' : '✍️ سؤال مقالي';
      const imgHtml = q.imageUrl ? `<img src="${window.driveThumb(q.imageUrl)}" class="q-image" onerror="this.style.display='none'">` : '';

      // Per-question timer
      const pqSec = exam.perQuestionSec || 0;
      const timerHtml = pqSec > 0 ? `<div class="q-timer" id="qTimer"><span>⏳</span><span id="qTimerText">${pqSec}</span></div>` : '';

      let bodyHtml = '';
      if (q.type === 'mcq') {
        const letters = ['أ','ب','ج','د','هـ','و'];
        bodyHtml = `<div class="mcq-options">
          ${(q.options||[]).map((o, oi) => {
            const sel = answers[q.id].value === String(oi);
            return `<div class="mcq-opt ${sel?'selected':''}" onclick="window.pickMCQ('${q.id}', ${oi})">
              <span class="mcq-letter">${letters[oi] || (oi+1)}</span>
              <span class="mcq-text">${o || ''}</span>
            </div>`;
          }).join('')}
        </div>`;
      } else if (q.type === 'truefalse') {
        const cur = answers[q.id].value;
        bodyHtml = `<div class="tf-row">
          <div class="tf-btn true-btn ${cur==='true'?'selected':''}" onclick="window.pickTF('${q.id}', 'true')">
            <span class="tf-ico">✓</span><span class="tf-lbl">صح</span>
          </div>
          <div class="tf-btn false-btn ${cur==='false'?'selected':''}" onclick="window.pickTF('${q.id}', 'false')">
            <span class="tf-ico">✗</span><span class="tf-lbl">خطأ</span>
          </div>
        </div>`;
      } else {
        // essay/short
        const cur = answers[q.id].value || '';
        const imgs = answers[q.id].images || [];
        bodyHtml = `<div class="essay-area">
          <textarea class="essay-ta" placeholder="اكتب إجابتك التفصيلية هنا..." oninput="window.essayInput('${q.id}', this.value)">${cur}</textarea>
          <label class="upload-zone">
            <input type="file" accept="image/*" multiple onchange="window.attachExamImages('${q.id}', this)">
            <div class="up-icon">📷</div>
            <div class="up-text">ارفع صورة إجابتك الورقية (اختياري)</div>
          </label>
          <div class="img-grid" id="imgGrid_${q.id}">
            ${imgs.map((u,i) => `<div class="img-thumb">
              <img src="${window.driveThumb(u)}">
              <button class="rm" onclick="event.stopPropagation();window.removeExamImg('${q.id}', ${i})">✕</button>
            </div>`).join('')}
          </div>
        </div>`;
      }

      document.getElementById('exArea').innerHTML = `
        <div class="q-progress-dots">${dotsHtml}</div>
        <div class="q-card">
          <div class="q-header">
            <span class="q-num">${currentIndex + 1}</span>
            <div class="q-text-area">
              <span class="q-type-badge">${typeLabel}</span>
              <div class="q-text">${q.text || ''}</div>
              ${timerHtml}
            </div>
          </div>
          ${imgHtml}
          ${bodyHtml}
        </div>
        <div class="q-nav">
          ${currentIndex > 0 ? `<button class="btn btn-prev" onclick="window.prevQ()">→ السابق</button>` : ''}
          ${currentIndex < total - 1
            ? `<button class="btn btn-primary" onclick="window.nextQ()">التالي ←</button>`
            : `<button class="btn btn-success" onclick="window.confirmSubmit()">📤 تسليم الامتحان</button>`}
        </div>
      `;

      // start per-question timer
      if (qTimerInt) clearInterval(qTimerInt);
      if (pqSec > 0) startQTimer(pqSec);
    }

    function startQTimer(sec){
      const left0 = sec;
      const tick = () => {
        const el = document.getElementById('qTimerText');
        const wrap = document.getElementById('qTimer');
        if (!el) return;
        const elapsed = Math.floor((Date.now() - qRenderedAt) / 1000);
        const remain = Math.max(0, left0 - elapsed);
        el.textContent = remain;
        if (wrap) wrap.classList.toggle('critical', remain <= 10);
        if (remain <= 0) {
          clearInterval(qTimerInt);
          // register long-time / auto-advance
          const q = renderQs[currentIndex];
          if (q) {
            suspicious.push({ type: 'auto_advance', question: q.id, at: new Date().toISOString() });
            if (!answers[q.id].flagged) { answers[q.id].flagged = true; }
          }
          if (currentIndex < renderQs.length - 1) {
            safeToast('⏳ انتهى زمن السؤال — الانتقال للتالي', 'warning');
            window.nextQ();
          } else {
            safeToast('⏳ انتهى زمن آخر سؤال', 'warning');
          }
        }
      };
      tick();
      qTimerInt = setInterval(tick, 500);
    }

    window.jumpTo = function(i){ currentIndex = i; renderQuestion(); };
    window.prevQ = function(){ if (currentIndex > 0) { currentIndex--; renderQuestion(); } };
    window.nextQ = function(){ if (currentIndex < renderQs.length - 1) { currentIndex++; renderQuestion(); } };

    window.pickMCQ = function(qid, idx){
      answers[qid].value = String(idx);
      renderQuestion();
    };
    window.pickTF = function(qid, val){
      answers[qid].value = val;
      renderQuestion();
    };
    window.essayInput = function(qid, val){
      answers[qid].value = val;
      // update dot only
      const dot = document.querySelectorAll('.q-dot')[currentIndex];
      if (dot && (val || (answers[qid].images && answers[qid].images.length))) dot.classList.add('answered');
    };

    window.attachExamImages = function(qid, input){
      try {
        const files = Array.from(input.files || []);
        if (!files.length) return;
        answers[qid].images = answers[qid].images || [];
        files.forEach(f => {
          const push = url => {
            answers[qid].images.push(url);
            renderQuestion();
          };
          if (typeof DriveService !== 'undefined' && DriveService && typeof DriveService.uploadImage === 'function') {
            DriveService.uploadImage(f).then(push).catch(() => {
              const r = new FileReader(); r.onload = e => push(e.target.result); r.readAsDataURL(f);
            });
          } else {
            const r = new FileReader(); r.onload = e => push(e.target.result); r.readAsDataURL(f);
          }
        });
        safeToast('📷 تم إرفاق الصور', 'success');
      } catch(e) { console.error(e); }
    };

    window.removeExamImg = function(qid, idx){
      answers[qid].images.splice(idx, 1);
      renderQuestion();
    };

    /* ============ COUNTDOWN ============ */
    function tickCountdown(){
      try {
        const left = endTime - Date.now();
        const cdText = document.getElementById('cdText');
        if (left <= 0) {
          cdText.textContent = '00:00';
          if (!submitted) { safeToast('⏰ انتهى الوقت! تسليم تلقائي...', 'warning'); submitExam(true); }
          return;
        }
        const m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
        cdText.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
        document.getElementById('countdown').classList.toggle('danger', left < 60000);
      } catch(e) {}
    }

    /* ============ ANTI-CHEAT ============ */
    function bindAntiCheat(){
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && !submitted) registerViolation('الخروج من صفحة الامتحان');
      });
      window.addEventListener('blur', () => { if (!submitted) registerViolation('الخروج من نافذة الامتحان'); });
      document.addEventListener('fullscreenchange', () => {
        if (!document.fullscreenElement && started && !submitted) {
          registerViolation('الخروج من ملء الشاشة');
          try { document.documentElement.requestFullscreen(); } catch(e) {}
        }
      });
      document.addEventListener('contextmenu', e => {
        if (started && !submitted) { e.preventDefault(); registerViolation('محاولة الزر الأيمن'); }
      });
      document.addEventListener('keydown', e => {
        if (!submitted) {
          const cp = e.ctrlKey && ['c','v','u','a'].includes(e.key.toLowerCase());
          const insp = e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'i');
          if (cp || insp) { e.preventDefault(); registerViolation('محاولة نسخ/أدوات المطور'); }
        }
      });
    }

    function registerViolation(reason){
      violations++;
      suspicious.push({ type: 'violation', reason, at: new Date().toISOString() });
      const b = document.getElementById('violBadge');
      if (b) { b.classList.add('show'); b.textContent = '⚠️ ' + violations + '/' + MAX_V; }
      if (violations >= MAX_V) {
        safeToast('🚨 تسليم تلقائي بسبب المخالفات!', 'error');
        submitExam(true);
      } else {
        safeToast('⚠️ تحذير ' + violations + '/' + MAX_V + ': ' + reason, 'error');
      }
    }

    /* ============ SUBMIT ============ */
    window.confirmSubmit = function(){
      const answered = renderQs.filter(q => {
        const a = answers[q.id];
        return a && (a.value !== '' || (a.images && a.images.length));
      }).length;
      const total = renderQs.length;
      if (answered < total) {
        if (!confirm(`أجبت على ${answered} من ${total} سؤال.\nهل تريد التسليم الآن؟`)) return;
      } else {
        if (!confirm('تسليم الامتحان الآن؟')) return;
      }
      submitExam(false);
    };

    async function submitExam(auto){
      try {
        if (submitted) return;
        submitted = true;
        if (countdownInt) clearInterval(countdownInt);
        if (qTimerInt) clearInterval(qTimerInt);

        const finalAnswers = renderQs.map(q => {
          const a = answers[q.id] || {};
          if (q.type === 'essay' || q.type === 'short') {
            return { questionId: q.id, answer: (a.value || '').trim(), answerImages: a.images || [] };
          } else {
            return { questionId: q.id, answer: a.value || '' };
          }
        });

        const calc = autoScore(finalAnswers, renderQs);
        if (exam.isHomework) {
          const d = DataService._getData(); d.submissions = d.submissions || [];
          const ex0 = d.submissions.find(s=>s.homeworkId===exam.id&&s.studentId===currentUser.id);
          const sub = ex0 || { id:'sub_'+exam.id+'_'+currentUser.id, homeworkId:exam.id, studentId:currentUser.id };
          sub.answers = finalAnswers;
          sub.answerImages = finalAnswers.reduce((a2,x)=>a2.concat(x.answerImages||[]),[]);
          sub.score = calc.score; sub.maxScore = calc.maxScore; sub.autoGraded = true;
          sub.status = 'graded'; sub.gradedBy = 'auto';
          sub.submittedAt = new Date().toISOString(); sub.releasedAt = sub.submittedAt;
          if(!ex0) d.submissions.push(sub);
          DataService._saveData(d);
          try{ if(window.FirebaseService&&FirebaseService._db) FirebaseService.saveDoc('submissions', sub.id, sub); }catch(e){}
          try{
            const g=(DataService.getGroups?DataService.getGroups():[]).find(x=>x.id===exam.groupId);
            const tid=g&&g.teacherId;
            if(tid&&!sub.nTf){ sub.nTf=1;
              DataService.addNotification({targetUserId:tid,title:'📝 تسليم واجب: '+exam.title,message:(currentUser.name||'طالب')+' سلّم — درجة تلقائية '+calc.score+'/'+calc.maxScore,type:'homework',meta:{event:'hw_submit',refId:exam.id+'_'+currentUser.id}});
              DataService._saveData(d);
            }
          }catch(e){}
        } else {
          await DataService.submitExamAttempt({
            examId: exam.id,
            studentId: currentUser.id,
            answers: finalAnswers,
            startTime: new Date(endTime - (exam.duration || 60) * 60000).toISOString(),
            endTime: new Date().toISOString(),
            suspiciousActivities: suspicious.concat([{ type: 'summary', violations, autoSubmitted: !!auto }])
          });
          /* 🎯 إعادة تصحيح فورية متسامحة — تصلح درجة الـ 0 من المصدر */
          try{
            const d2 = DataService._getData();
            const att = (d2.examAttempts||[]).filter(a=>a.examId===exam.id&&a.studentId===currentUser.id)
              .sort((a,b)=>String(b.submittedAt||'').localeCompare(String(a.submittedAt||'')))[0];
            if(att){ att.score=calc.score; att.maxScore=calc.maxScore; att.autoGraded=true;
              DataService._saveData(d2);
              if(window.FirebaseService&&FirebaseService._db) FirebaseService.saveDoc('examAttempts', att.id, att);
            }
          }catch(e){}
        }

        document.getElementById('topbar').style.display = 'none';

        // 🆕 حساب الدرجة تلقائياً لو releasePolicy === 'instant'
        if (exam.isHomework || (exam.releasePolicy || 'approve') === 'instant') {
          showInstantResult(calc, auto);
        } else {
          showApprovalPending(auto);
        }

        try { if (document.fullscreenElement) document.exitFullscreen(); } catch(e) {}
      } catch(e) {
        submitted = false;
        console.error(e);
        safeToast('خطأ في التسليم، حاول مرة أخرى', 'error');
      }
    }

        function autoScore(finalAnswers, qs){
      const any = qs.some(q => q.points);
      const w = (!any && qs.length && exam.totalPoints) ? (exam.totalPoints / qs.length) : null;
      let score = 0, maxScore = 0;
      qs.forEach(q => {
        const pts = (w != null) ? w : (q.points || 1);
        maxScore += pts;
        if(q.type === 'essay' || q.type === 'short') return;
        const a = finalAnswers.find(x => x.questionId === q.id);
        if(!a || a.answer == null || a.answer === '') return;
        const av = String(a.answer).trim();
        const corr = (q.correct != null && q.correct !== '') ? q.correct : q.correctAnswer;
        const ok = av === String(corr).trim() || (q.options && q.options[corr] && av === String(q.options[corr]).trim()) || (q.type === 'truefalse' && ((av==='true'&&(corr===true||corr==='true'))||(av==='false'&&(corr===false||corr==='false'))));
        if(ok) score += pts;
      });
      return { score: Math.round(score*100)/100, maxScore: Math.round(maxScore*100)/100 };
    }

    function showInstantResult(scored, auto){
      const pct = scored.maxScore > 0 ? Math.round(scored.score / scored.maxScore * 100) : 0;
      const emoji = pct >= 85 ? '🏆' : pct >= 70 ? '🌟' : pct >= 50 ? '👍' : '💪';
      document.getElementById('exArea').innerHTML = `
        <div class="result-hero">
          <div style="font-size:64px;">${emoji}</div>
          <h2>نتيجة الامتحان${auto?' (تسليم تلقائي)':''}</h2>
          <div class="result-score">${scored.score} / ${scored.maxScore}</div>
          <div style="font-size:22px; font-weight:800; opacity:.9;">${pct}%</div>
          ${violations > 0 ? `<div style="background:rgba(239,68,68,0.2); border:1px solid var(--danger); padding:12px; border-radius:8px; margin-top:16px; font-size:14px; color:#fca5a5;">⚠️ تم تسجيل ${violations} ملاحظة أمان.</div>` : ''}
          <p style="opacity:.8; margin-top:16px; font-size:14px;">📝 الأسئلة المقالية (إن وجدت) تحتاج مراجعة الأستاذ وقد تغيّر النتيجة.</p>
        </div>
        <a href="student-dashboard.html" class="btn btn-secondary w-full btn-lg" style="margin-top:16px;">→ العودة للداشبورد</a>
      `;
    }

    function showApprovalPending(auto){
      document.getElementById('exArea').innerHTML = `
        <div class="result-hero">
          <div style="font-size:64px;">🤲</div>
          <h2>تم تسليم إجابتك بنجاح${auto?' (تلقائياً)':''}!</h2>
          <div class="dua-box">
            "رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي * وَاحْلُلْ عُقْدَةً مِّن لِّسَانِي * يَفْقَهُوا قَوْلِي"
            <br><br>
            <span style="font-size:15px; opacity:.9;">نسأل الله لك التوفيق ونتيجة مشرفة.</span>
          </div>
          ${violations > 0 ? `<div style="background:rgba(239,68,68,0.2); border:1px solid var(--danger); padding:12px; border-radius:8px; margin-top:16px; font-size:14px; color:#fca5a5;">⚠️ تم تسجيل ${violations} ملاحظة أمان.</div>` : ''}
          <p style="opacity:.8; margin-top:16px; font-size:14px;">🔒 النتيجة قيد المراجعة من الإدارة.</p>
        </div>
        <a href="student-dashboard.html" class="btn btn-secondary w-full btn-lg" style="margin-top:16px;">→ العودة للداشبورد</a>
      `;
    }

    function renderAlreadyDone(att){
      const policy = exam.releasePolicy || 'approve';
      const showScore = policy === 'instant' && att && att.score != null;
      document.getElementById('exArea').innerHTML = `
        <div class="result-hero">
          <div style="font-size:56px;">🤲</div>
          <h2>تم تسليم هذا الامتحان مسبقاً</h2>
          ${showScore ? `
            <div class="result-score">${att.score} / ${att.maxScore || exam.totalPoints || 100}</div>
            <div style="font-size:18px; opacity:.9;">درجتك النهائية</div>
          ` : `
            <div class="dua-box">
              "رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي"
              <br><br>
              <span style="font-size:14px; opacity:.9;">نسأل الله لك التوفيق.</span>
            </div>
            <p style="opacity:.8; font-size:13px; margin-top:8px;">🔒 النتيجة قيد المراجعة.</p>
          `}
        </div>
        <a href="student-dashboard.html" class="btn btn-secondary w-full btn-lg" style="margin-top:16px;">→ العودة للداشبورد</a>
      `;
    }
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
