<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حل واجب - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .exam-topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .viol-badge{background:var(--danger);color:#fff;border-radius:9999px;padding:3px 12px;font-size:11px;font-weight:800;font-family:var(--font-en)}
    .q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
    .q-card.flagged{border-color:var(--warning)}
    .q-num{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;align-items:center;justify-content:center;font-weight:800;font-family:var(--font-en);margin-inline-end:8px}
    .q-opt{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-hover);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all var(--t)}
    .q-opt:hover{border-color:var(--primary)}
    .q-opt.selected{border-color:var(--primary);background:var(--primary-bg)}
    .q-time-warn{font-size:10px;color:var(--warning);font-weight:700}
    .anti-cheat-banner{background:var(--warning-bg);border:1px solid var(--warning);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--warning);margin-bottom:14px;line-height:1.8}
    .result-hero{background:var(--grad);color:#fff;border-radius:var(--radius-xl);padding:30px;text-align:center;margin:20px 0}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="exam-topbar">
    <div style="flex:1;min-width:0;"><strong id="hwTitle">📝 الواجب</strong><div class="text-xs text-muted" id="hwMeta"></div></div>
    <span class="viol-badge" id="violBadge" style="display:none;">⚠️ 0/3</span>
    <button class="btn btn-primary btn-sm" id="submitBtn" onclick="window.submitHomeworkNow()" style="display:none;">📤 تسليم</button>
  </div>
  <div style="max-width:760px;margin:0 auto;padding:16px;position:relative;z-index:1;">
    <div id="hwArea"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>

  <script>
    const db=()=>DataService?._getData()||{};
    const save=d=>DataService?._saveData(d);
    let currentUser=null, hw=null, started=false, submitted=false;
    let violations=0, suspicious=[], qStart=Date.now(), qWarnedAt={};
    const MAX_V=3, Q_WARN_MS=120000, Q_FLAG_MS=240000;

    (async function boot(){
      try{
        if(typeof DataService?.init==='function') await DataService.init();
        currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
        if(!currentUser || currentUser.role!=='student'){
          document.getElementById('hwArea').innerHTML='<div class="card" style="text-align:center;padding:30px;"><div style="font-size:44px;">🔐</div><p>سجّل دخول كطالب أولاً</p><a class="btn btn-primary" href="login.html">دخول</a></div>';
          return;
        }
        const hwId = new URLSearchParams(location.search).get('hw');
        if(!hwId){ window.renderHwList(); return; }
        hw = DataService?.getHomeworkById ? DataService.getHomeworkById(hwId) : null;
        if(!hw){ document.getElementById('hwArea').innerHTML='<div class="card">الواجب غير موجود</div>'; return; }

        // التحقق من المحاولات
        const mySubs = DataService.getSubmissions({studentId:currentUser.id,homeworkId:hwId});
        const maxAtt = hw.maxAttempts||2;
        if(mySubs.length>=maxAtt){
          const last=mySubs[mySubs.length-1];
          document.getElementById('hwArea').innerHTML=`<div class="result-hero"><div style="font-size:44px;">${last.status==='graded'?'📊':''}</div><h2>${last.status==='graded'?'تم تصحيح واجبك':'بانتظار التصحيح'}</h2><p style="opacity:.9;">استهلكت كل محاولاتك (${maxAtt})</p></div><a href="student-dashboard.html" class="btn btn-secondary w-full">→ العودة</a>`;
          return;
        }
        window.renderHw(hw);
        window.bindAntiCheat();
      }catch(err){
        console.error(err);
        document.getElementById('hwArea').innerHTML='<div class="card">خطأ: '+err.message+'</div>';
      }
    })();

    // قائمة الواجبات المتاحة (لو مفيش ?hw=)
    window.renderHwList=function(){
      try{
        const teachers = DataService.getStudentTeachers(currentUser.id);
        const list = DataService.getHomework().filter(h=>teachers.some(t=>t.group?.id===h.groupId));
        document.getElementById('hwTitle').textContent='📝 واجباتي';
        document.getElementById('hwArea').innerHTML = list.length ? list.map(h=>{
          const sub = DataService.getSubmissions({studentId:currentUser.id}).find(s=>s.homeworkId===h.id);
          return `<div class="q-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <div><strong>${h.title}</strong><div class="text-xs text-muted">📅 ${h.deadline||'-'} ${h.paper?'· 📝 ورقي (يُسلّم في الحصة)':''}</div></div>
            ${h.paper?'<span class="badge badge-muted">ورقي</span>':sub?'<span class="badge badge-success">تم التسليم</span>':`<button class="btn btn-primary btn-sm" onclick="location.href='student-homework.html?hw=${h.id}'">✍️ حل</button>`}
          </div>`;
        }).join('') : '<div class="card">لا واجبات متاحة</div>';
      }catch(e){console.error(e);}
    };

    window.renderHw=function(h){
      try{
        document.getElementById('hwTitle').textContent='📝 '+h.title;
        document.getElementById('hwMeta').textContent=(h.questions||[]).length+' سؤال · الموعد: '+(h.deadline||'-');
        document.getElementById('submitBtn').style.display='inline-block';
        const imgHtml = h.imageUrl ? `<div class="card" style="margin-bottom:12px;"><img src="${typeof UI?.driveImg==='function'?UI.driveImg(h.imageUrl):h.imageUrl}" style="width:100%;border-radius:8px;" onerror="this.style.display='none'"></div>` : '';
        document.getElementById('hwArea').innerHTML = `
          <div class="anti-cheat-banner">🛡️ <strong>نظام حماية مفعّل:</strong> الخروج من الصفحة أو التبديل بينTabs هيحسب تحذير، وعند 3 تحذيرات بيتم التسليم تلقائياً وتسجيل ملاحظة للإدارة.</div>
          ${imgHtml}
          ${(h.questions||[]).map((q,i)=>{
            const opts = q.type==='mcq' ? (q.options||[]) : q.type==='truefalse' ? ['صح','خطأ'] : null;
            return `<div class="q-card" id="qc_${q.id}" data-q="${q.id}">
              <div style="margin-bottom:10px;"><span class="q-num">${i+1}</span><strong>${q.text||''}</strong> <span class="q-time-warn" id="qw_${q.id}"></span></div>
              ${opts ? opts.map((o,oi)=>{
                const val = q.type==='mcq' ? oi : (oi===0?'true':'false');
                return `<label class="q-opt" onclick="window.pickOpt('${q.id}',${oi},'${val}',this)"><input type="radio" name="q_${q.id}" value="${val}" style="accent-color:var(--primary);"><span>${o||('خيار '+(oi+1))}</span></label>`;
              }).join('') : `<textarea class="form-textarea" rows="3" data-short="${q.id}" placeholder="اكتب إجابتك هنا..." onfocus="window.qFocus('${q.id}')"></textarea>`}
            </div>`;
          }).join('')}
          <button class="btn btn-primary w-full btn-lg" onclick="window.submitHomeworkNow()">📤 تسليم الواجب</button>`;
        window.startQTimer();
      }catch(e){console.error(e);}
    };

    window.pickOpt=function(qid,oi,val,el){
      try{
        el.closest('.q-card').querySelectorAll('.q-opt').forEach(o=>o.classList.remove('selected'));
        el.classList.add('selected');
        el.querySelector('input').checked=true;
        window.qFocus(qid);
      }catch(e){}
    };
    window.qFocus=function(qid){ qStart=Date.now(); };

    // ⏱️ مؤقّت وقت السؤال (تحذير لو طال)
    window.startQTimer=function(){
      setInterval(()=>{
        if(!started||submitted) return;
        const active = document.querySelector('.q-card[data-q]:has(input:checked), .q-card textarea:focus');
        const elapsed = Date.now()-qStart;
        const cards = document.querySelectorAll('.q-card[data-q]');
        cards.forEach(c=>{
          const qid=c.dataset.q;
          const warnEl=document.getElementById('qw_'+qid);
          if(c.contains(document.activeElement)||c.querySelector('input:checked')){
            if(elapsed>Q_FLAG_MS){ c.classList.add('flagged'); if(warnEl)warnEl.textContent='🚩 وقت طويل جداً'; if(!qWarnedAt[qid+'_f']){qWarnedAt[qid+'_f']=1;suspicious.push({type:'long_time',question:qid,at:new Date().toISOString()});} }
            else if(elapsed>Q_WARN_MS){ c.classList.add('flagged'); if(warnEl)warnEl.textContent='⏰ خدت وقت طويل في السؤال ده'; }
          }
        });
      },5000);
    };

    // 🛡️ حماية الغش
    window.bindAntiCheat=function(){
      started=true;
      document.addEventListener('visibilitychange',()=>{ if(document.hidden&&!submitted) window.registerViolation('الخروج من الصفحة'); });
      window.addEventListener('blur',()=>{ if(!submitted) window.registerViolation('الخروج من نافذة الواجب'); });
      document.addEventListener('contextmenu',e=>{ if(started&&!submitted)e.preventDefault(); });
      document.addEventListener('keydown',e=>{
        if(!submitted&&((e.ctrlKey&&['c','v','u'].includes(e.key.toLowerCase()))||e.key==='F12')){ e.preventDefault(); window.registerViolation('محاولة نسخ/أدوات مطور'); }
      });
    };

    window.registerViolation=function(reason){
      violations++;
      suspicious.push({type:'violation',reason,at:new Date().toISOString()});
      const badge=document.getElementById('violBadge');
      if(badge){badge.style.display='inline-block';badge.textContent='⚠️ '+violations+'/'+MAX_V;}
      if(violations>=MAX_V){
        if(typeof ThemeManager?.toast==='function') ThemeManager.toast('🚨 تم التسليم تلقائياً بسبب تكرار المخالفات','error');
        window.submitHomeworkNow(true);
      }else{
        if(typeof ThemeManager?.toast==='function') ThemeManager.toast('⚠️ تحذير '+violations+'/'+MAX_V+': '+reason,'error');
      }
    };

    window.submitHomeworkNow=async function(auto){
      try{
        if(submitted) return;
        submitted=true;
        const answers=[];
        (hw.questions||[]).forEach(q=>{
          if(q.type==='short'){
            const ta=document.querySelector(`textarea[data-short="${q.id}"]`);
            answers.push({questionId:q.id,answer:ta?ta.value.trim():''});
          }else{
            const sel=document.querySelector(`input[name="q_${q.id}"]:checked`);
            answers.push({questionId:q.id,answer:sel?sel.value:''});
          }
        });
        const sub = await DataService.submitHomework({homeworkId:hw.id,studentId:currentUser.id,answers,attemptNumber:(DataService.getSubmissions({studentId:currentUser.id,homeworkId:hw.id}).length+1)});
        // تسجيل ملاحظات الحماية مع التسليم
        try{
          const d=db();
          const rec=(d.submissions||[]).find(x=>x.id===sub.id);
          if(rec){ rec.suspiciousActivities=suspicious; rec.violations=violations; rec.autoSubmitted=!!auto; save(d); }
        }catch(e){}
        const hasManual=(hw.questions||[]).some(q=>q.type==='short');
        document.getElementById('hwArea').innerHTML = hasManual
          ? `<div class="result-hero"><div style="font-size:52px;">📤</div><h2>تم التسليم!</h2><p style="opacity:.9;">فيه أسئلة مقالية — درجتك هتظهر بعد تصحيح المدرس</p></div><a href="student-dashboard.html" class="btn btn-secondary w-full">→ العودة للداشبورد</a>`
          : `<div class="result-hero"><div style="font-size:52px;">🎉</div><h2>تم التسليم والتصحيح!</h2><div style="font-size:44px;font-weight:900;font-family:var(--font-en);margin:10px 0;">${sub.score||0}%</div><p style="opacity:.9;">درجتك في الواجب</p></div><a href="student-dashboard.html" class="btn btn-secondary w-full">→ العودة للداشبورد</a>`;
        document.getElementById('submitBtn').style.display='none';
      }catch(e){
        submitted=false;
        console.error(e);
        if(typeof ThemeManager?.toast==='function') ThemeManager.toast('خطأ في التسليم: '+e.message,'error');
      }
    };
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
