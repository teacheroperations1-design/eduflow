<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حل الواجب - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .hw-topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;backdrop-filter:blur(20px)}
    .q-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
    .q-num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700;font-size:14px;margin-bottom:10px}
    .opt-btn{display:block;width:100%;text-align:right;padding:12px 16px;background:var(--surface-hover);border:2px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;transition:all .2s;font-size:14px}
    .opt-btn:hover{border-color:var(--primary)}
    .opt-btn.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary);font-weight:600}
    .tf-wrap{display:flex;gap:10px}
    .tf-btn{flex:1;padding:14px;text-align:center;background:var(--surface-hover);border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-weight:600;font-size:15px;transition:all .2s}
    .tf-btn.selected{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
    .result-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;text-align:center}
    .result-score{font-size:56px;font-weight:800;color:var(--primary);font-family:var(--font-en)}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>

  <div class="hw-topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <a href="student-dashboard.html" class="btn btn-ghost btn-sm">→ رجوع</a>
      <strong id="hwTitle">الواجب</strong>
    </div>
    <span class="badge badge-primary" id="hwMeta"></span>
  </div>

  <div style="max-width:800px;margin:24px auto;padding:0 16px;position:relative;z-index:1;">
    <div id="questionsWrap"></div>
    <button class="btn btn-primary btn-lg w-full" id="submitBtn" onclick="submitHomework()">📤 تسليم الواجب</button>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    AuthService.requireRole(['student']);
    const currentUser = AuthService.getCurrentUser();

    const params = new URLSearchParams(location.search);
    const hwId = params.get('hw');
    if (!hwId) { location.href = 'student-dashboard.html'; }

    const hw = DataService.getHomeworkById(hwId);
    if (!hw) { alert('الواجب غير موجود'); location.href = 'student-dashboard.html'; }

    document.getElementById('hwTitle').textContent = hw.title;
    document.getElementById('hwMeta').textContent = hw.questions.length + ' سؤال · الموعد: ' + hw.deadline;

    const answers = {};

    // ✅ بناء الأسئلة
    window.renderQuestions = function() {
      const wrap = document.getElementById('questionsWrap');
      wrap.innerHTML = hw.questions.map((q, i) => {
        let body = '';
        if (q.type === 'mcq') {
          body = q.options.map((o, oi) =>
            `<button type="button" class="opt-btn" onclick="pick('${q.id}', ${oi}, this)">${o}</button>`
          ).join('');
        } else if (q.type === 'truefalse') {
          body = `<div class="tf-wrap">
            <button type="button" class="tf-btn" onclick="pick('${q.id}', true, this)">✓ صح</button>
            <button type="button" class="tf-btn" onclick="pick('${q.id}', false, this)">✗ خطأ</button>
          </div>`;
        } else {
          body = `<textarea class="form-textarea" rows="4" placeholder="اكتب إجابتك هنا..." oninput="answers['${q.id}']=this.value"></textarea>`;
        }
        return `<div class="q-block">
          <div class="q-num">${i+1}</div>
          <p style="margin-bottom:12px;font-weight:600;">${q.text} <span class="badge badge-muted">${q.points} نقطة</span></p>
          ${body}
        </div>`;
      }).join('');
    };

    window.pick = function(qid, val, btn) {
      answers[qid] = val;
      const block = btn.closest('.q-block');
      block.querySelectorAll('.opt-btn, .tf-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };

    // ✅ تسليم الواجب
    window.submitHomework = function() {
      const ansList = hw.questions.map(q => ({ questionId: q.id, answer: answers[q.id] }));
      const res = DataService.submitHomework({ homeworkId: hw.id, studentId: currentUser.id, answers: ansList });

      if (!res.success) { alert(res.message || 'حدث خطأ'); return; }

      DataService.logActivity(currentUser.id, currentUser.name, 'تسليم واجب', hw.title);

      // عرض النتيجة
      let html = '';
      if (res.score !== null) {
        html = `<div class="result-box">
          <div style="font-size:48px;">${res.score >= hw.passingScore ? '🎉' : '📚'}</div>
          <div class="result-score">${res.score}%</div>
          <p class="text-muted" style="margin:12px 0;">${res.score >= hw.passingScore ? 'أحسنت! تجاوزت درجة النجاح' : 'لم تصل لدرجة النجاح ('+hw.passingScore+'%)'}</p>
          <a href="student-dashboard.html" class="btn btn-primary">العودة للوحة</a>
        </div>`;
      } else {
        html = `<div class="result-box">
          <div style="font-size:48px;">✅</div>
          <h3 style="margin:12px 0;">تم استلام واجبك</h3>
          <p class="text-muted">الأسئلة المقالية بانتظار مراجعة المساعد. ستظهر درجتك لاحقاً.</p>
          <a href="student-dashboard.html" class="btn btn-primary">العودة للوحة</a>
        </div>`;
      }
      document.querySelector('body > div[style*="max-width"]').innerHTML = html;
    };

    renderQuestions();
  </script>
</body>
</html>
