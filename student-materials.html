<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المواد والطلبات - EduFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem;">
    <div class="container flex justify-between items-center">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">EduFlow</h2>
        <span class="text-sm" style="color: var(--text-secondary);">المواد والطلبات</span>
      </div>
      <a href="student-dashboard.html" class="btn btn-outline text-sm">الرئيسية</a>
    </div>
  </header>

  <div class="container" style="margin-top: 1.5rem;">
    <!-- Tabs -->
    <div class="flex gap-2" style="margin-bottom: 1.5rem; overflow-x: auto;">
      <button class="btn btn-primary tab-btn" data-tab="available">📚 المواد المتاحة</button>
      <button class="btn btn-outline tab-btn" data-tab="myorders">📦 طلباتي</button>
    </div>

    <!-- Tab: Available Materials -->
    <div id="tab-available" class="tab-content">
      <div id="materialsGrid" class="flex gap-4" style="flex-wrap: wrap;"></div>
    </div>

    <!-- Tab: My Orders -->
    <div id="tab-myorders" class="tab-content hidden">
      <div id="myOrdersList"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    if (!AuthService.requireRole(['student'])) { /* redirected */ }

    const currentUser = AuthService.getCurrentUser();

    // --- Tabs ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('btn-primary', btn.dataset.tab === tabId);
        btn.classList.toggle('btn-outline', btn.dataset.tab !== tabId);
      });
      if (tabId === 'available') loadAvailableMaterials();
      if (tabId === 'myorders') loadMyOrders();
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // --- Available Materials ---
    function loadAvailableMaterials() {
      const materials = DataService.getMaterials({ subject: currentUser.subject });
      const container = document.getElementById('materialsGrid');

      if (materials.length === 0) {
        container.innerHTML = '<div class="card text-center" style="width: 100%; padding: 2rem;"><p style="color: var(--text-secondary);">لا توجد مواد متاحة حالياً.</p></div>';
        return;
      }

      container.innerHTML = materials.map(mat => {
        const availabilityBadge = {
          'available': '<span class="badge badge-success">متوفر</span>',
          'out_of_stock': '<span class="badge badge-danger">غير متوفر</span>',
          'coming_soon': '<span class="badge badge-warning">قريباً</span>'
        }[mat.availability];

        const orderButton = mat.availability === 'available' 
          ? `<button onclick="placeOrder('${mat.id}')" class="btn btn-primary btn-block">طلب الآن</button>`
          : `<button class="btn btn-outline btn-block" disabled>غير متاح للطلب</button>`;

        return `
          <div class="card" style="flex: 1; min-width: 280px; max-width: 400px;">
            ${mat.imageUrl ? `<img src="${mat.imageUrl}" alt="${mat.name}" style="width: 100%; height: 150px; object-fit: cover; border-radius: var(--radius); margin-bottom: 1rem;">` : ''}
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <h4 style="font-size: 1.05rem;">${mat.name}</h4>
              ${availabilityBadge}
            </div>
            <p class="text-sm" style="color: var(--text-secondary); margin-bottom: 0.5rem;">${mat.description || 'لا يوجد وصف'}</p>
            <div style="font-size: 1.5rem; font-weight: 700; color: var(--primary); margin: 1rem 0;">${mat.price} ج.م</div>
            ${orderButton}
          </div>
        `;
      }).join('');
    }

    function placeOrder(materialId) {
      if (!confirm('هل أنت متأكد من طلب هذه المادة؟')) return;

      const result = DataService.placeOrder({
        materialId: materialId,
        studentId: currentUser.id,
        quantity: 1
      });

      if (result.success) {
        alert('تم تقديم طلبك بنجاح! سيتواصل معك المساعد لاستلام المادة.');
        switchTab('myorders');
      } else {
        alert(`خطأ: ${result.message}`);
      }
    }

    // --- My Orders ---
    function loadMyOrders() {
      const orders = DataService.getOrders({ studentId: currentUser.id });
      const container = document.getElementById('myOrdersList');

      if (orders.length === 0) {
        container.innerHTML = '<div class="card text-center" style="padding: 2rem;"><p style="color: var(--text-secondary);">لم تقدم أي طلبات بعد.</p></div>';
        return;
      }

      container.innerHTML = orders.map(ord => {
        const material = DataService.getMaterialById(ord.materialId);
        const statusBadge = {
          'pending': '<span class="badge badge-warning">قيد الانتظار</span>',
          'preparing': '<span class="badge" style="background: #E0E7FF; color: #3730A3;">جاري التجهيز</span>',
          'ready': '<span class="badge badge-success">جاهز للاستلام</span>',
          'delivered': '<span class="badge badge-success">تم التسليم</span>',
          'cancelled': '<span class="badge badge-danger">ملغي</span>'
        }[ord.status];

        return `
          <div class="card" style="margin-bottom: 1rem;">
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <div>
                <h4>${material?.name || 'مادة'}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">الكمية: ${ord.quantity} | السعر: ${ord.totalPrice} ج.م</p>
              </div>
              ${statusBadge}
            </div>
            <p class="text-sm" style="color: var(--text-secondary);">تاريخ الطلب: ${new Date(ord.createdAt).toLocaleDateString('ar-EG')}</p>
          </div>
        `;
      }).join('');
    }

    // Init
    loadAvailableMaterials();
  </script>
</body>
</html>
