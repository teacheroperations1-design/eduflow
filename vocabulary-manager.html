<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المفردات - EduFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem;">
    <div class="container flex justify-between items-center">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">EduFlow</h2>
        <span class="text-sm" style="color: var(--text-secondary);">إدارة بنك المفردات (Vocabulary)</span>
      </div>
      <a href="assistant-dashboard.html" class="btn btn-outline text-sm">العودة للرئيسية</a>
    </div>
  </header>

  <div class="container" style="margin-top: 1.5rem;">
    <div class="flex gap-4" style="flex-wrap: wrap; align-items: flex-start;">
      
      <!-- Form to Add Word -->
      <div class="card" style="flex: 1; min-width: 300px;">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">➕ إضافة كلمة جديدة</h3>
        <form id="vocabForm">
          <div class="form-group">
            <label class="form-label">الكلمة (Word)</label>
            <input type="text" id="word" class="form-input" required placeholder="e.g., Ambitious">
          </div>
          <div class="form-group">
            <label class="form-label">المعنى (Meaning)</label>
            <input type="text" id="meaning" class="form-input" required placeholder="e.g., طموح">
          </div>
          <div class="form-group">
            <label class="form-label">مثال (Example)</label>
            <textarea id="example" class="form-input" rows="2" required placeholder="e.g., He is an ambitious student."></textarea>
          </div>
          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">الوحدة (Unit)</label>
              <input type="text" id="unit" class="form-input" placeholder="Unit 1">
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">الدرس (Lesson)</label>
              <input type="text" id="lesson" class="form-input" placeholder="Lesson 1">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">رابط التسجيل الصوتي (Audio URL)</label>
            <input type="url" id="audioUrl" class="form-input" placeholder="https://example.com/audio.mp3">
            <p class="text-sm" style="color: var(--text-secondary); margin-top: 0.25rem;">
              * في النسخة التجريبية، استخدم رابطاً مباشراً لملف MP3. في الإنتاج، سيتم الرفع على Firebase Storage.
            </p>
          </div>
          <button type="submit" class="btn btn-primary btn-block">حفظ الكلمة</button>
        </form>
      </div>

      <!-- List of Words -->
      <div class="card" style="flex: 2; min-width: 300px;">
        <h3 style="margin-bottom: 1rem; font-size: 1.1rem;">📚 بنك الكلمات الحالي</h3>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>الكلمة</th>
                <th>المعنى</th>
                <th>الوحدة/الدرس</th>
                <th>صوت</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="vocabTableBody">
              <!-- سيتم الملء بالجافاسكريبت -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    if (!AuthService.requireRole(['super_admin', 'assistant', 'teacher'])) { /* redirected */ }

    function loadVocabulary() {
      const currentUser = AuthService.getCurrentUser();
      // جلب الكلمات الخاصة بمادة المدرس أو كل الكلمات للمساعد
      const filter = currentUser.role === 'teacher' ? { subject: currentUser.subject } : {};
      const vocabs = DataService.getVocabulary(filter);
      
      const tbody = document.getElementById('vocabTableBody');
      if (vocabs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="padding: 2rem; color: var(--text-secondary);">لا توجد كلمات مضافة بعد.</td></tr>';
        return;
      }

      tbody.innerHTML = vocabs.map(v => `
        <tr>
          <td><strong style="color: var(--primary); font-size: 1.1rem;">${v.word}</strong></td>
          <td>${v.meaning}</td>
          <td class="text-sm">${v.unit || '-'} / ${v.lesson || '-'}</td>
          <td>
            ${v.audioUrl ? 
              `<audio controls style="height: 32px; width: 150px;" src="${v.audioUrl}"></audio>` : 
              '<span class="text-sm" style="color: var(--text-secondary);">لا يوجد صوت</span>'}
          </td>
          <td>
            <button onclick="deleteVocab('${v.id}')" class="btn btn-danger text-sm" style="padding: 0.25rem 0.5rem;">حذف</button>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('vocabForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const currentUser = AuthService.getCurrentUser();
      const vocabData = {
        word: document.getElementById('word').value,
        meaning: document.getElementById('meaning').value,
        example: document.getElementById('example').value,
        unit: document.getElementById('unit').value,
        lesson: document.getElementById('lesson').value,
        audioUrl: document.getElementById('audioUrl').value,
        subject: currentUser.subject || "English", // افتراضي للإنجليزية إذا لم يحدد
        groupId: "", // يمكن تطويره لاحقاً لربطه بمجموعة محددة
        createdBy: currentUser.id
      };

      DataService.addVocabulary(vocabData);
      alert('تم إضافة الكلمة بنجاح!');
      e.target.reset();
      loadVocabulary();
    });

    function deleteVocab(id) {
      if (confirm('هل أنت متأكد من حذف هذه الكلمة؟')) {
        DataService.deleteVocabulary(id);
        loadVocabulary();
      }
    }

    loadVocabulary();
  </script>
</body>
</html>
