<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكواد التفعيل - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px;">
    <div class="card" style="max-width:560px;width:100%;max-height:92vh;overflow-y:auto;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="margin:0;">🔑 أكواد التفعيل</h2>
        <a href="admin-dashboard.html" class="btn btn-ghost btn-sm">→ الأدمن</a>
      </div>

      <div class="card" style="background:var(--surface-hover);margin-bottom:16px;">
        <div class="form-group"><label>الدور</label>
          <select id="acRole" class="form-select">
            <option value="student">طالب</option>
            <option value="teacher">مدرس</option>
            <option value="assistant">مساعد</option>
          </select>
        </div>
        <button class="btn btn-primary w-full" onclick="genCode()">+ توليد كود</button>
      </div>

      <div id="codesList"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    (async function(){
      await DataService.init();
      if (!AuthService.requireRole(['super_admin','assistant'])) return;
      loadCodes();
    })();

    async function genCode(){
      const role = document.getElementById('acRole').value;
      const code = 'ACT-' + Math.random().toString(36).slice(2,6).toUpperCase();
      const d = DataService._getData();
      if (!d.activationCodes) d.activationCodes = [];
      d.activationCodes.push({ code, role, used:false, createdBy:AuthService.getCurrentUser().id, createdAt:new Date().toISOString() });
      DataService._saveData(d);
      if (window.FirebaseService?.initialized) await FirebaseService.saveDoc('activationCodes', code, { code, role, used:false });
      ThemeManager.toast('تم توليد: '+code,'success');
      loadCodes();
    }

    function loadCodes(){
      const list = (DataService._getData().activationCodes||[]).slice().reverse();
      document.getElementById('codesList').innerHTML = list.length ? list.map(c => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--surface-hover);border-radius:8px;margin-bottom:8px;">
          <div>
            <strong style="font-family:var(--font-en);letter-spacing:2px;color:var(--primary);">${c.code}</strong>
            <span class="badge badge-info" style="margin-right:8px;">${c.role}</span>
            <div class="text-xs text-muted">${c.used?'مستخدم':'غير مستخدم'} · ${new Date(c.createdAt).toLocaleDateString('ar-EG')}</div>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="navigator.clipboard.writeText('${c.code}').then(()=>ThemeManager.toast('تم النسخ ✓','success'))">📋 نسخ</button>
        </div>
      `).join('') : '<p class="text-muted text-center">لا أكواد بعد</p>';
    }
  </script>
</body>
</html>
