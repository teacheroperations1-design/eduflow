<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أكواد التفعيل - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>.wrap{max-width:700px;margin:24px auto;padding:0 16px;position:relative;z-index:1}.code-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:8px}.code-val{font-family:var(--font-en);font-weight:800;color:var(--primary);letter-spacing:2px}</style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <div class="wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2>🔑 أكواد التفعيل</h2>
      <a href="admin-dashboard.html" class="btn btn-ghost btn-sm">→ الرجوع للأدمن</a>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h3 class="card-title" style="margin-bottom:12px;">توليد كود جديد</h3>
      <div style="display:flex;gap:8px;">
        <select id="roleSel" class="form-select">
          <option value="teacher">مدرس</option>
          <option value="student">طالب</option>
          <option value="parent">ولي أمر</option>
          <option value="assistant">مساعد</option>
        </select>
        <button class="btn btn-primary" onclick="genCode()">+ توليد كود</button>
      </div>
      <p class="text-sm text-muted" style="margin-top:10px;">سلّم الكود للشخص، وهيسجل بيه من صفحة <code>register.html</code></p>
    </div>

    <div class="card">
      <h3 class="card-title" style="margin-bottom:12px;">الأكواد غير المستخدمة</h3>
      <div id="codesList"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    AuthService.requireRole(['super_admin']);
    const db = firebase.firestore();

    async function genCode(){
      const role = document.getElementById('roleSel').value;
      let code;
      do { code = 'ACT-' + Math.random().toString(36).slice(2,6).toUpperCase(); } while(false);
      await db.collection('activationCodes').doc(code).set({ code, role, used:false, createdAt:new Date().toISOString() });
      ThemeManager.toast('تم توليد: '+code,'success');
      loadCodes();
    }

    function loadCodes(){
      db.collection('activationCodes').where('used','==',false).get().then(snap=>{
        document.getElementById('codesList').innerHTML = snap.docs.map(d=>{
          const c=d.data();
          return `<div class="code-row"><div><span class="code-val">${c.code}</span> <span class="badge badge-primary">${roleAr(c.role)}</span></div>
          <button class="btn btn-ghost btn-sm" onclick="navigator.clipboard.writeText('${c.code}').then(()=>ThemeManager.toast('تم النسخ ✓','success'))">📋 نسخ</button></div>`;
        }).join('') || '<p class="text-muted">لا أكواد</p>';
      });
    }
    function roleAr(r){return {teacher:'مدرس',student:'طالب',parent:'ولي أمر',assistant:'مساعد'}[r]||r;}
    loadCodes();
  </script>
</body>
</html>
