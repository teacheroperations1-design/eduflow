<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <script>
    (function() {
      const u = sessionStorage.getItem('eduflow_user');
      if (u) {
        try {
          const user = JSON.parse(u);
          const map = {
            super_admin: 'admin-dashboard.html',
            assistant: 'assistant-dashboard.html',
            teacher: 'teacher-dashboard.html',
            student: 'student-dashboard.html',
            parent: 'parent-dashboard.html'
          };
          const dest = map[user.role];
          if (dest) { location.replace(dest); return; }
        } catch(e) {}
      }
      location.replace('login.html');
    })();
  </script>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div>
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;">
    <div class="card" style="text-align:center;padding:40px;">
      <div style="font-size:48px;">🎓</div>
      <h1 style="margin:12px 0;">EduFlow</h1>
      <p class="text-muted">جاري التحميل...</p>
    </div>
  </div>
</body>
</html>
