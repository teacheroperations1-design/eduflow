<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة الواجبات - EduFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem;">
    <div class="container flex justify-between items-center">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">EduFlow</h2>
        <span class="text-sm" style="color: var(--text-secondary);">إدارة الواجبات (Homework)</span>
      </div>
      <a href="assistant-dashboard.html" class="btn btn-outline text-sm">العودة للرئيسية</a>
    </div>
  </header>

  <div class="container" style="margin-top: 1.5rem;">
    <!-- Tabs -->
    <div class="flex gap-2" style="margin-bottom: 1.5rem; overflow-x: auto;">
      <button class="btn btn-primary tab-btn" data-tab="create">➕ إنشاء واجب</button>
      <button class="btn btn-outline tab-btn" data-tab="list">📋 الواجبات</button>
      <button class="btn btn-outline tab-btn" data-tab="review">✏️ تصحيح التسليمات</button>
    </div>

    <!-- Tab 1: Create Homework -->
    <div id="tab-create" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">معلومات الواجب</h3>
        <form id="homeworkForm">
          <div class="form-group">
            <label class="form-label">عنوان الواجب</label>
            <input type="text" id="hwTitle" class="form-input" required placeholder="مثال: Unit 1 - Vocabulary Quiz">
          </div>
          <div class="form-group">
            <label class="form-label">الوصف</label>
            <textarea id="hwDescription" class="form-input" rows="2" placeholder="تعليمات إضافية للطلاب..."></textarea>
          </div>

          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">المجموعة</label>
              <select id="hwGroup" class="form-select" required></select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">الدرس</label>
              <input type="text" id="hwLesson" class="form-input" placeholder="Lesson 1">
            </div>
          </div>

          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">تاريخ الفتح</label>
              <input type="date" id="hwOpenDate" class="form-input" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">الموعد النهائي</label>
              <input type="date" id="hwDeadline" class="form-input" required>
            </div>
          </div>

          <div class="flex gap-2">
            <div class="form-group" style="flex: 1;">
              <label class="form-label">عدد المحاولات المسموح</label>
              <input type="number" id="hwMaxAttempts" class="form-input" value="1" min="1" required>
            </div>
            <div class="form-group" style="flex: 1;">
              <label class="form-label">درجة النجاح (%)</label>
              <input type="number" id="hwPassingScore" class="form-input" value="60" min="0" max="100" required>
            </div>
          </div>

          <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border);">

          <h3 style="margin-bottom: 1rem;">الأسئلة</h3>
          <div id="questionsContainer"></div>

          <div class="flex gap-2" style="margin-top: 1rem; flex-wrap: wrap;">
            <button type="button" class="btn btn-outline" onclick="addQuestion('mcq')">+ MCQ</button>
            <button type="button" class="btn btn-outline" onclick="addQuestion('truefalse')">+ True/False</button>
            <button type="button" class="btn btn-outline" onclick="addQuestion('short')">+ Short Answer</button>
            <button type="button" class="btn btn-outline" onclick="addQuestion('essay')">+ Essay</button>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">نشر الواجب</button>
        </form>
      </div>
    </div>

    <!-- Tab 2: Homework List -->
    <div id="tab-list" class="tab-content hidden">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">قائمة الواجبات</h3>
        <div id="homeworkList"></div>
      </div>
    </div>

    <!-- Tab 3: Review Submissions -->
    <div id="tab-review" class="tab-content hidden">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">التسليمات التي تحتاج تصحيحاً يدوياً</h3>
        <div id="pendingSubmissions"></div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    if (!AuthService.requireRole(['super_admin', 'assistant', 'teacher'])) { /* redirected */ }

    const currentUser = AuthService.getCurrentUser();
    let questions = [];
    let questionCounter = 0;

    // --- Tabs ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('btn-primary', btn.dataset.tab === tabId);
        btn.classList.toggle('btn-outline', btn.dataset.tab !== tabId);
      });
      if (tabId === 'list') loadHomeworkList();
      if (tabId === 'review') loadPendingSubmissions();
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // --- Load Groups ---
    function loadGroups() {
      const data = DataService._getData();
      const select = document.getElementById('hwGroup');
      const groups = currentUser.role === 'teacher' 
        ? DataService.getGroupsByTeacher(currentUser.id)
        : data.groups;
      select.innerHTML = groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    }

    // --- Questions Builder ---
    function addQuestion(type) {
      questionCounter++;
      const q = { id: `new_${questionCounter}`, type, text: '', points: 10 };
      if (type === 'mcq') { q.options = ['', '', '', '']; q.correctAnswer = 0; }
      if (type === 'truefalse') q.correctAnswer = true;
      if (type === 'short' || type === 'essay') q.requiresManualReview = true;
      questions.push(q);
      renderQuestions();
    }

    function removeQuestion(id) {
      questions = questions.filter(q => q.id !== id);
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      if (questions.length === 0) {
        container.innerHTML = '<p class="text-sm" style="color: var(--text-secondary); text-align: center; padding: 1rem;">لم تضف أي أسئلة بعد. استخدم الأزرار أعلاه لإضافة أسئلة.</p>';
        return;
      }

      container.innerHTML = questions.map((q, idx) => {
        let questionHTML = `
          <div class="card" style="margin-bottom: 1rem; background: var(--background);">
            <div class="flex justify-between items-center" style="margin-bottom: 0.75rem;">
              <strong>سؤال ${idx + 1} (${q.type.toUpperCase()})</strong>
              <button type="button" class="btn btn-danger text-sm" style="padding: 0.25rem 0.5rem;" onclick="removeQuestion('${q.id}')">حذف</button>
            </div>
            <div class="form-group">
              <label class="form-label">نص السؤال</label>
              <textarea class="form-input q-text" data-id="${q.id}" rows="2" required>${q.text}</textarea>
            </div>
            <div class="form-group">
              <label class="form-label">الدرجة</label>
              <input type="number" class="form-input q-points" data-id="${q.id}" value="${q.points}" min="1" style="max-width: 120px;">
            </div>
        `;

        if (q.type === 'mcq') {
          questionHTML += `
            <div class="form-group">
              <label class="form-label">الخيارات (اختر الإجابة الصحيحة)</label>
              ${q.options.map((opt, i) => `
                <div class="flex gap-2 items-center" style="margin-bottom: 0.5rem;">
                  <input type="radio" name="correct_${q.id}" value="${i}" ${q.correctAnswer === i ? 'checked' : ''} onchange="updateCorrectAnswer('${q.id}', ${i})">
                  <input type="text" class="form-input q-option" data-qid="${q.id}" data-idx="${i}" value="${opt}" placeholder="خيار ${i + 1}">
                </div>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'truefalse') {
          questionHTML += `
            <div class="form-group">
              <label class="form-label">الإجابة الصحيحة</label>
              <select class="form-select q-correct-tf" data-id="${q.id}" style="max-width: 200px;">
                <option value="true" ${q.correctAnswer === true ? 'selected' : ''}>True</option>
                <option value="false" ${q.correctAnswer === false ? 'selected' : ''}>False</option>
              </select>
            </div>
          `;
        } else {
          questionHTML += `<p class="text-sm" style="color: var(--text-secondary);">⚠️ هذا السؤال يتطلب تصحيحاً يدوياً من المساعد.</p>`;
        }

        questionHTML += `</div>`;
        return questionHTML;
      }).join('');

      // ربط الأحداث
      document.querySelectorAll('.q-text').forEach(el => {
        el.addEventListener('input', e => {
          const q = questions.find(q => q.id === e.target.dataset.id);
          if (q) q.text = e.target.value;
        });
      });
      document.querySelectorAll('.q-points').forEach(el => {
        el.addEventListener('input', e => {
          const q = questions.find(q => q.id === e.target.dataset.id);
          if (q) q.points = parseInt(e.target.value) || 0;
        });
      });
      document.querySelectorAll('.q-option').forEach(el => {
        el.addEventListener('input', e => {
          const q = questions.find(q => q.id === e.target.dataset.qid);
          if (q) q.options[parseInt(e.target.dataset.idx)] = e.target.value;
        });
      });
      document.querySelectorAll('.q-correct-tf').forEach(el => {
        el.addEventListener('change', e => {
          const q = questions.find(q => q.id === e.target.dataset.id);
          if (q) q.correctAnswer = e.target.value === 'true';
        });
      });
    }

    function updateCorrectAnswer(qId, idx) {
      const q = questions.find(q => q.id === qId);
      if (q) q.correctAnswer = idx;
    }

    // --- Submit Homework ---
    document.getElementById('homeworkForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (questions.length === 0) {
        alert('يجب إضافة سؤال واحد على الأقل.');
        return;
      }
      if (questions.some(q => !q.text)) {
        alert('يجب كتابة نص كل سؤال.');
        return;
      }

      const groupId = document.getElementById('hwGroup').value;
      const group = DataService._getData().groups.find(g => g.id === groupId);

      const homeworkData = {
        title: document.getElementById('hwTitle').value,
        description: document.getElementById('hwDescription').value,
        groupId: groupId,
        subject: group.subject,
        lesson: document.getElementById('hwLesson').value,
        openDate: document.getElementById('hwOpenDate').value,
        deadline: document.getElementById('hwDeadline').value,
        maxAttempts: parseInt(document.getElementById('hwMaxAttempts').value),
        passingScore: parseInt(document.getElementById('hwPassingScore').value),
        createdBy: currentUser.id,
        questions: questions
      };

      const result = DataService.addHomework(homeworkData);
      if (result.success) {
        alert('تم نشر الواجب بنجاح!');
        e.target.reset();
        questions = [];
        renderQuestions();
        loadGroups();
      }
    });

    // --- Homework List ---
    function loadHomeworkList() {
      const filter = currentUser.role === 'teacher' ? { subject: currentUser.subject } : {};
      const homeworks = DataService.getHomework(filter);
      const container = document.getElementById('homeworkList');

      if (homeworks.length === 0) {
        container.innerHTML = '<p class="text-center" style="padding: 2rem; color: var(--text-secondary);">لا توجد واجبات.</p>';
        return;
      }

      container.innerHTML = homeworks.map(hw => {
        const submissions = DataService.getSubmissions({ homeworkId: hw.id });
        return `
          <div class="card" style="margin-bottom: 1rem;">
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <div>
                <h4 style="font-size: 1.05rem;">${hw.title}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">${hw.lesson || 'بدون درس'} | الموعد: ${hw.deadline}</p>
              </div>
              <button class="btn btn-danger text-sm" style="padding: 0.25rem 0.5rem;" onclick="deleteHW('${hw.id}')">حذف</button>
            </div>
            <div class="flex gap-4 text-sm" style="margin-top: 0.5rem;">
              <span>📝 ${hw.questions.length} أسئلة</span>
              <span>👥 ${submissions.length} تسليم</span>
              <span>🔄 ${hw.maxAttempts} محاولة</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function deleteHW(id) {
      if (confirm('هل أنت متأكد من حذف هذا الواجب وجميع تسليماته؟')) {
        DataService.deleteHomework(id);
        loadHomeworkList();
      }
    }

    // --- Review Submissions ---
    function loadPendingSubmissions() {
      const pending = DataService.getSubmissions({ status: 'pending_review' });
      const container = document.getElementById('pendingSubmissions');

      if (pending.length === 0) {
        container.innerHTML = '<p class="text-center" style="padding: 2rem; color: var(--text-secondary);">✅ لا توجد تسليمات تحتاج تصحيحاً.</p>';
        return;
      }

      const data = DataService._getData();
      container.innerHTML = pending.map(sub => {
        const hw = DataService.getHomeworkById(sub.homeworkId);
        const student = data.users.find(u => u.id === sub.studentId);
        return `
          <div class="card" style="margin-bottom: 1rem; border-right: 4px solid var(--warning);">
            <div class="flex justify-between items-start" style="margin-bottom: 0.75rem;">
              <div>
                <h4>${student?.name || 'طالب'} - ${hw?.title || 'واجب'}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">المحاولة #${sub.attemptNumber} | تم التسليم: ${new Date(sub.submittedAt).toLocaleDateString('ar-EG')}</p>
              </div>
              <span class="badge badge-warning">بانتظار التصحيح</span>
            </div>
            <p class="text-sm" style="margin-bottom: 0.75rem;">الدرجة التلقائية: <strong>${sub.autoScore}/${sub.totalAutoPoints}</strong></p>
            <button class="btn btn-primary btn-block" onclick="openReviewModal('${sub.id}')">مراجعة وتصحيح</button>
          </div>
        `;
      }).join('');
    }

    function openReviewModal(submissionId) {
      const sub = DataService.getSubmissionById(submissionId);
      const hw = DataService.getHomeworkById(sub.homeworkId);
      const data = DataService._getData();
      const student = data.users.find(u => u.id === sub.studentId);

      const manualQuestions = hw.questions.filter(q => q.requiresManualReview);
      const answersHTML = manualQuestions.map(q => {
        const ans = sub.answers.find(a => a.questionId === q.id);
        return `
          <div class="card" style="margin-bottom: 0.75rem; background: var(--background);">
            <p><strong>السؤال:</strong> ${q.text}</p>
            <p style="margin-top: 0.5rem;"><strong>إجابة الطالب:</strong></p>
            <p style="background: white; padding: 0.5rem; border-radius: var(--radius); margin-top: 0.25rem;">${ans?.answer || '(لا توجد إجابة)'}</p>
          </div>
        `;
      }).join('');

      const finalScore = prompt(
        `مراجعة تسليم: ${student?.name}\n\n${answersHTML}\n\nالدرجة التلقائية: ${sub.autoScore}/${sub.totalAutoPoints}\n\nأدخل الدرجة النهائية (0-100):`,
        sub.autoScore
      );

      if (finalScore !== null && !isNaN(finalScore)) {
        const notes = prompt('ملاحظات للطالب (اختياري):', '') || '';
        const result = DataService.gradeSubmission(submissionId, parseInt(finalScore), currentUser.id, notes);
        if (result.success) {
          alert('تم حفظ التصحيح.');
          loadPendingSubmissions();
        }
      }
    }

    // --- Init ---
    loadGroups();
    renderQuestions();
  </script>
</body>
</html>
