<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل طالب - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .reg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px}
    .reg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:520px;width:100%;backdrop-filter:blur(20px);box-shadow:var(--shadow-lg);max-height:92vh;overflow-y:auto}
    .code-result{background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:var(--radius);padding:28px;text-align:center;color:#fff;margin:16px 0}
    .code-result .big{font-family:var(--font-en);font-size:40px;font-weight:800;letter-spacing:3px;margin:8px 0}
    .copy-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 18px;border-radius:9999px;cursor:pointer;font-weight:700}
    .copy-btn:hover{background:rgba(255,255,255,.3)}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <button class="icon-btn" id="themeToggle" style="position:fixed;top:20px;left:20px;z-index:100;"></button>

  <div class="reg-wrap">
    <div class="reg-card">

      <!-- نموذج التسجيل -->
      <div id="regForm">
        <div style="text-align:center;margin-bottom:16px;">
          <div style="font-size:40px;">🎓</div>
          <h2 style="margin:8px 0;">تسجيل طالب جديد</h2>
          <p class="text-sm text-muted">سجّل بياناتك وهتستلم كود خاص بيك وبولي أمرك</p>
        </div>
        <form onsubmit="return doRegister(event)">
          <div class="form-group"><label>الاسم الكامل</label><input type="text" id="rName" class="form-input" required></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label>رقم موبايلك</label><input type="tel" id="rPhone" class="form-input" required></div>
            <div class="form-group"><label>رقم ولي الأمر</label><input type="tel" id="rParent" class="form-input" required></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label>صلة القرابة</label><select id="rRel" class="form-select"><option>الأب</option><option>الأم</option><option>الأخ</option><option>أخرى</option></select></div>
            <div class="form-group"><label>الواتساب على</label><select id="rWa" class="form-select"><option value="parent">رقم ولي الأمر</option><option value="student">رقمي</option></select></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div class="form-group"><label>المرحلة</label><select id="rStage" class="form-select"><option>Primary</option><option>Preparatory</option><option selected>Secondary</option></select></div>
            <div class="form-group"><label>الصف</label><input type="text" id="rGrade" class="form-input" value="Secondary 1"></div>
          </div>
          <div class="form-group"><label>البريد (اختياري — لو مفيش هتدخل برقمك)</label><input type="email" id="rEmail" class="form-input"></div>
          <div class="form-group"><label>كلمة المرور</label><input type="password" id="rPass" class="form-input" minlength="6" required></div>
          <div class="form-group"><label>المدرس</label><select id="rTeacher" class="form-select" onchange="loadGroupsFor()"><option value="">-- اختر --</option></select></div>
          <div class="form-group"><label>المجموعة</label><select id="rGroup" class="form-select"><option value="">-- اختر المدرس أولاً --</option></select></div>
          <div class="form-group"><label>عندك كود تسجيل من المركز؟</label><select id="rHasCode" class="form-select" onchange="toggleCode()"><option value="no">لا</option><option value="yes">نعم</option></select></div>
          <div class="form-group" id="codeBox" style="display:none;"><label>كود التسجيل</label><input type="text" id="rCode" class="form-input" placeholder="REG-XXXX"></div>
          <button class="btn btn-primary w-full btn-lg">✅ تسجيل</button>
        </form>
        <div class="text-center" style="margin-top:16px;"><span class="text-sm text-muted">عندك حساب؟</span> <a href="login.html" class="text-sm" style="color:var(--primary);font-weight:700;">سجّل دخول</a></div>
      </div>

      <!-- شاشة النجاح + الكود -->
      <div id="regDone" style="display:none;text-align:center;">
        <div style="font-size:56px;">🎉</div>
        <h2 style="margin:12px 0 4px;">تم تسجيلك بنجاح!</h2>
        <p class="text-sm text-muted">احتفظ بالكود ده — <strong>ولي الأمر هيستخدمه عشان يدخل ويتابعك</strong></p>
        <div class="code-result">
          <div style="font-size:13px;opacity:.9;">كود الطالب الخاص بيك</div>
          <div class="big" id="doneCode">EDU-0000</div>
          <div style="font-size:13px;opacity:.9;">Student ID: <span id="doneId">STU-0000</span></div>
          <div style="margin-top:12px;display:flex;gap:8px;justify-content:center;">
            <button class="copy-btn" onclick="copyCode()">📋 نسخ الكود</button>
          </div>
        </div>
        <p class="text-sm" style="color:var(--warning);margin-bottom:16px;">⚠️ صوّر الكود أو انسخه وابعتوا لولي الأمر — مش هيظهر تاني!</p>
        <a href="login.html" class="btn btn-primary w-full">🔐 الذهاب لتسجيل الدخول</a>
      </div>

    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script>
    let lastCode = '';

    // تحميل المدرسين
    (function(){
      document.getElementById('rTeacher').innerHTML = '<option value="">-- اختر --</option>' +
        DataService.getTeachers().map(t=>`<option value="${t.id}">${t.name} (${t.subject})</option>`).join('');
    })();

    function loadGroupsFor(){
      const tid = document.getElementById('rTeacher').value;
      const g = document.getElementById('rGroup');
      if (!tid) { g.innerHTML = '<option value="">-- اختر المدرس أولاً --</option>'; return; }
      g.innerHTML = '<option value="">-- اختر --</option>' +
        DataService.getGroupsByTeacher(tid).map(x=>`<option value="${x.id}">${x.name} (${x.day} ${x.time})</option>`).join('');
    }

    function toggleCode(){
      document.getElementById('codeBox').style.display = document.getElementById('rHasCode').value==='yes' ? 'block' : 'none';
    }

    function doRegister(e){
      e.preventDefault();
      const hasCode = document.getElementById('rHasCode').value==='yes';
      const code = document.getElementById('rCode').value.trim();

      // لو عنده كود، نتحقق منه الأول
      if (hasCode && code) {
        const ok = DataService.validateRegistrationCode(code);
        if (!ok) { ThemeManager.toast('كود التسجيل غير صحيح أو مستخدم','error'); return false; }
      }

      const r = DataService.registerStudent({
        name:document.getElementById('rName').value,
        phone:document.getElementById('rPhone').value,
        parentPhone:document.getElementById('rParent').value,
        parentRelation:document.getElementById('rRel').value,
        whatsappOn:document.getElementById('rWa').value,
        stage:document.getElementById('rStage').value,
        grade:document.getElementById('rGrade').value,
        email:document.getElementById('rEmail').value,
        password:document.getElementById('rPass').value,
        teacherId:document.getElementById('rTeacher').value,
        groupId:document.getElementById('rGroup').value,
        subject:'English'
      });

      if (r.success) {
        lastCode = r.code;
        document.getElementById('doneCode').textContent = r.code;
        document.getElementById('doneId').textContent = r.studentId;
        document.getElementById('regForm').style.display = 'none';
        document.getElementById('regDone').style.display = 'block';
      } else {
        ThemeManager.toast(r.message,'error');
      }
      return false;
    }

    function copyCode(){
      navigator.clipboard.writeText(lastCode).then(()=>ThemeManager.toast('تم نسخ الكود ✓','success'));
    }
  </script>
</body>
</html>
