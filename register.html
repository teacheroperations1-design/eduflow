<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل حساب - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>.reg-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;padding:16px}.reg-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;max-width:480px;width:100%;backdrop-filter:blur(20px);max-height:92vh;overflow-y:auto}</style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
  <div class="reg-wrap"><div class="reg-card">
    <div style="text-align:center;margin-bottom:16px;"><div style="font-size:40px;">🎓</div><h2 style="margin:8px 0;">تسجيل حساب جديد</h2><p class="text-sm text-muted">أدخل كود التفعيل اللي استلمته من المركز</p></div>

    <div class="form-group"><label>كود التفعيل</label>
      <div style="display:flex;gap:8px;"><input type="text" id="actCode" class="form-input" placeholder="ACT-XXXX"><button class="btn btn-secondary" onclick="checkCode()">تحقق</button></div>
    </div>
    <div id="roleBadge" style="display:none;margin-bottom:12px;" class="badge badge-success"></div>

    <form id="regForm" style="display:none" onsubmit="return doRegister(event)">
      <div class="form-group"><label>الاسم الكامل</label><input type="text" id="rName" class="form-input" required></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="rEmail" class="form-input" required></div>
      <div class="form-group"><label>رقم الموبايل</label><input type="tel" id="rPhone" class="form-input" required></div>
      <div class="form-group"><label>كلمة المرور (٨+)</label><input type="password" id="rPass" class="form-input" minlength="8" required></div>
      <div id="studentFields" style="display:none">
        <div class="form-group"><label>رقم ولي الأمر</label><input type="tel" id="rParent" class="form-input"></div>
        <div class="form-group"><label>كلمة مرور ولي الأمر (يدخل بيها يتابعك)</label><input type="text" id="rParentPass" class="form-input"></div>
      </div>
      <button class="btn btn-primary w-full btn-lg">✅ إنشاء الحساب</button>
    </form>
    <div class="text-center" style="margin-top:16px;"><span class="text-sm text-muted">عندك حساب؟</span> <a href="login.html" class="text-sm" style="color:var(--primary);font-weight:700;">سجّل دخول</a></div>
  </div></div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    const db = firebase.firestore();
    let currentRole = null;

    async function checkCode(){
      const code = document.getElementById('actCode').value.trim().toUpperCase();
      if(!code) return;
      const doc = await db.collection('activationCodes').doc(code).get();
      if(!doc.exists || doc.data().used){ ThemeManager.toast('الكود غير صالح أو مستخدم','error'); return; }
      currentRole = doc.data().role;
      document.getElementById('roleBadge').style.display='inline-block';
      document.getElementById('roleBadge').textContent = 'الدور: ' + ({teacher:'مدرس',student:'طالب',parent:'ولي أمر',assistant:'مساعد'}[currentRole]);
      document.getElementById('regForm').style.display='block';
      document.getElementById('studentFields').style.display = currentRole==='student' ? 'block':'none';
    }

    async function doRegister(e){
      e.preventDefault();
      const code = document.getElementById('actCode').value.trim().toUpperCase();
      const name = document.getElementById('rName').value.trim();
      const email = document.getElementById('rEmail').value.trim().toLowerCase();
      const pass = document.getElementById('rPass').value;
      try{
        // 1) اعمل حساب Firebase Auth (بيسجّل دخولك)
        const cred = await firebase.auth().createUserWithEmailAndPassword(email, pass);
        const uid = cred.user.uid;

        // 2) جهّز البروفايل
        const profile = { id:uid, uid, name, email, role:currentRole, phone:document.getElementById('rPhone').value, createdAt:new Date().toISOString() };
        if(currentRole==='student'){
          profile.studentId = 'STU-' + Date.now().toString().slice(-4);
          profile.code = 'EDU-' + Math.floor(1000+Math.random()*9000);
          profile.parentPhone = document.getElementById('rParent').value;
          profile.parentAccess = document.getElementById('rParentPass').value;
        }

        // 3) احفظ البروفايل
        await db.collection('users').doc(uid).set(profile);
        // 4) علّم الكود كمستخدم
        await db.collection('activationCodes').doc(code).update({ used:true, usedBy:uid });

        sessionStorage.setItem('eduflow_user', JSON.stringify(profile));
        ThemeManager.toast('تم إنشاء حسابك ✓','success');
        setTimeout(()=>AuthService.redirectToDashboard(currentRole),600);
      }catch(err){
        ThemeManager.toast('فشل التسجيل: '+err.code,'error');
      }
      return false;
    }
  </script>
</body>
</html>
