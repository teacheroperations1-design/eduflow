<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>بطاقة الطالب - EduFlow by Habbash Group</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
.child-hero{background:var(--grad);color:#fff;border-radius:var(--radius-xl);padding:20px;margin-bottom:16px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden}
.child-hero .teacher-photo{width:56px;height:56px;border-radius:50%;border:2px solid rgba(255,255,255,.3);object-fit:cover;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat-mini-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.stat-mini-value{font-size:18px;font-weight:800;color:var(--primary);font-family:var(--font-en)}
.stat-mini-label{font-size:10px;color:var(--text-muted);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab-btn{padding:8px 14px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-content{display:none}.tab-content.active{display:block}
.sub-row{padding:10px;background:var(--surface-hover);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sub-row.graded{border-right:3px solid var(--success)}
.sub-row.pending{border-right:3px solid var(--warning)}
.sub-row.due{border-right:3px solid var(--danger);background:rgba(239,68,68,.05)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.detail-box{background:var(--surface-hover);border-radius:10px;padding:12px}
.detail-box .lbl{font-size:11px;color:var(--text-muted);margin-bottom:4px}.detail-box .val{font-weight:700;font-size:13px}
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.quick-grade-section{background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(99,102,241,.08));border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
.quick-grade-section h3{margin:0 0 12px 0;font-size:14px;color:var(--primary);display:flex;align-items:center;gap:8px}
.grade-row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.grade-row .hw-info{flex:1;min-width:0}
.grade-row .hw-title{font-weight:700;font-size:13px;margin-bottom:2px}
.grade-row .hw-meta{font-size:11px;color:var(--text-muted)}
.grade-input-group{display:flex;gap:4px;align-items:center}
.grade-input{width:60px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:var(--font-en);text-align:center;font-weight:700}
.quick-btn{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:12px}
.quick-btn-primary{background:var(--primary);color:#fff}
.quick-btn-success{background:var(--success);color:#fff}
.quick-btn-warning{background:var(--warning);color:#fff}
.quick-btn-danger{background:var(--danger);color:#fff}

/* مودال أول مرة */
.first-time-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.first-time-card{background:var(--surface);border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:slideUp .4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.ft-icon{text-align:center;font-size:64px;margin-bottom:8px}
.ft-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.ft-sub{text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:18px}
.ft-info-box{background:var(--surface-hover);border-radius:12px;padding:16px;margin-bottom:12px}
.ft-info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.ft-info-row:last-child{border-bottom:none}
.ft-info-row .lbl{color:var(--text-muted);font-size:13px}
.ft-info-row .val{font-weight:800;font-family:var(--font-en);font-size:15px;color:var(--primary)}
.ft-warning{background:#fff3cd;border:1px solid #ffc107;border-radius:10px;padding:12px;margin-bottom:16px;font-size:12px;color:#856404;display:flex;gap:8px;align-items:flex-start}
.ft-btn{width:100%;padding:12px;background:var(--grad);color:#fff;border:none;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer}
.parent-company-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:9999px;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;font-size:11px;font-weight:700;margin-bottom:12px}

/* Alert للتحصيل */
.payment-alert{background:linear-gradient(135deg,#fee2e2,#fecaca);border:2px solid var(--danger);border-radius:12px;padding:14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.payment-alert .info{flex:1;min-width:200px}
.payment-alert .title{font-weight:800;color:var(--danger);margin-bottom:2px}
.payment-alert .amount{font-size:18px;font-weight:800;font-family:var(--font-en);color:var(--danger)}

@media(max-width:640px){
  .stat-mini{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
  .action-grid{grid-template-columns:1fr}
}
</style>
</head>
<body data-theme="dark">
<div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
<div style="max-width:760px;margin:0 auto;padding:16px;position:relative;z-index:1;">
  <div id="qrContent"><div class="card" style="text-align:center;padding:40px;"><div style="font-size:40px;" class="loading-spin">⏳</div><p>جاري قراءة الباركود...</p></div></div>
</div>

<!-- مودال أول مرة -->
<div id="firstTimeModal" class="first-time-overlay" style="display:none"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/drive-service.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/auth-service.js"></script>

<script>
// 🆕 Unified Helpers
const safeToast = (msg, type='info') => { try { if(typeof ThemeManager?.toast==='function') ThemeManager.toast(msg, type); } catch(e) {} };
window.driveThumb = function(url) { 
  try { 
    if(!url) return ''; 
    const u = String(url); 
    const m = u.match(/\/d\/([\w-]+)/) || u.match(/[?&]id=([\w-]+)/) || u.match(/^([\w-]{20,})$/); 
    return m ? ('https://drive.google.com/thumbnail?id='+m[1]+'&sz=w200') : u; 
  } catch(e) { return url || ''; } 
};

const DAYS=[{en:'Sunday',ar:'الأحد'},{en:'Monday',ar:'الإثنين'},{en:'Tuesday',ar:'الثلاثاء'},{en:'Wednesday',ar:'الأربعاء'},{en:'Thursday',ar:'الخميس'},{en:'Friday',ar:'الجمعة'},{en:'Saturday',ar:'السبت'}];
const dayAr=en=>(DAYS.find(d=>d.en===en)||{}).ar||en;
const T=tm=>DataService?.formatTime12?DataService.formatTime12(tm):tm;

let currentUser=null, student=null;

(async function boot(){
  try{
    if(typeof DataService?.init==='function') await DataService.init();
    currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
    const params=new URLSearchParams(location.search);
    const code=(params.get('code')||'').trim();
    const el=document.getElementById('qrContent');
    
    if(!code){
      el.innerHTML=`<div class="card" style="text-align:center;padding:30px;">
        <div style="font-size:40px;">📷</div>
        <h3>لا يوجد كود</h3>
        <p class="text-sm text-muted">امسح الباركود أو اكتب الكود يدوياً</p>
        <div class="form-group" style="margin-top:12px;"><input type="text" id="manualCode" class="form-input" placeholder="EDU-1234" style="text-align:center;font-family:var(--font-en);letter-spacing:2px;"></div>
        <button class="btn btn-primary w-full" onclick="window.goManual()">➡️ متابعة</button>
      </div>`;
      return;
    }
    
    student = typeof DataService?.findStudentByCode==='function' ? DataService.findStudentByCode(code) : null;
    if(!student){
      el.innerHTML=`<div class="card" style="text-align:center;padding:30px;">
        <div style="font-size:40px;">⚠️</div>
        <h3>الطالب غير موجود</h3>
        <p class="text-sm text-muted">الكود: <strong style="font-family:var(--font-en);">${code}</strong> غير مسجل في النظام</p>
        <button class="btn btn-secondary" style="margin-top:12px;" onclick="location.reload()">🔄 إعادة المحاولة</button>
      </div>`;
      return;
    }
    window.route();
  }catch(err){
    console.error('boot error',err);
    const el=document.getElementById('qrContent');
    if(el) el.innerHTML='<div class="card" style="text-align:center;padding:30px;">حدث خطأ: '+err.message+'</div>';
  }
})();

window.goManual=function(){
  const v=document.getElementById('manualCode')?.value.trim();
  if(v) location.href='student-qr.html?code='+encodeURIComponent(v);
};

// ===== 🆕 مودال أول مرة (للطالب فقط) =====
window.showFirstTimeModal=function(){
  const modal=document.getElementById('firstTimeModal');
  const s=student;
  modal.innerHTML=`
    <div class="first-time-card">
      <div class="parent-company-badge" style="margin:0 auto 12px;"><span>🏢</span><span>Habbash Group</span></div>
      <div class="ft-icon">👋</div>
      <div class="ft-title">أهلاً بك يا ${s.name}!</div>
      <div class="ft-sub">هذه بيانات دخولك الأولى - يرجى حفظها جيداً</div>
      <div class="ft-info-box">
        <div class="ft-info-row">
          <span class="lbl">🎫 كود الطالب:</span>
          <span class="val">${s.code}</span>
        </div>
        <div class="ft-info-row">
          <span class="lbl">🔑 كلمة المرور:</span>
          <span class="val">${s.password || '1234'}</span>
        </div>
      </div>
      <div class="ft-warning">
        <span style="font-size:16px;">⚠️</span>
        <div>
          <strong>مهم جداً:</strong> يرجى تغيير كلمة المرور فوراً من صفحة "حسابي" في لوحة التحكم لضمان أمان بياناتك.
        </div>
      </div>
      <button class="ft-btn" onclick="window.continueToDashboard()">✓ تمام، فهمت - ادخل الداشبورد</button>
    </div>
  `;
  modal.style.display='flex';
};

window.continueToDashboard=function(){
  localStorage.setItem('student_welcomed_'+student.id, 'true');
  sessionStorage.setItem('eduflow_user', JSON.stringify(student));
  location.replace('student-dashboard.html');
};

// ===== التوجيه الذكي حسب نوع المستخدم =====
window.route=function(){
  const role=currentUser?.role;
  
  // 1. مفيش جلسة → الطالب نفسه (دخول مباشر من الباركود لأول مرة)
  if(!currentUser){
    const welcomed=localStorage.getItem('student_welcomed_'+student.id);
    if(!welcomed){
      sessionStorage.setItem('eduflow_user', JSON.stringify(student));
      window.showFirstTimeModal();
      return;
    }
    sessionStorage.setItem('eduflow_user', JSON.stringify(student));
    location.replace('student-dashboard.html');
    return;
  }
  
  // 2. أدمن / مساعد / مدرس → عرض البروفايل الإداري الكامل
  if(role==='assistant' || role==='super_admin' || role==='teacher'){
    window.renderAdminProfile();
    return;
  }
  
  // 3. ولي الأمر → توجيه لصفحة ولي الأمر
  if(role==='parent'){
    location.replace('parent-dashboard.html?studentId='+student.id);
    return;
  }
  
  // 4. الطالب نفسه (مسجل دخول ومسح باركوده)
  if(currentUser.id===student.id){
    location.replace('student-dashboard.html');
    return;
  }
  
  // 5. طالب آخر مسح باركود طالب → استبدال الجلسة
  if(role==='student'){
    sessionStorage.setItem('eduflow_user', JSON.stringify(student));
    location.replace('student-dashboard.html');
    return;
  }
  
  // Fallback
  location.replace('student-dashboard.html');
};

// ===== بروفايل إداري (للمساعد/الأدمن/المدرس) =====
window.renderAdminProfile=function(){
  try{
    const s=student;
    const ts=DataService?.getStudentTeachers?DataService.getStudentTeachers(s.id):[];
    const groupIds=ts.map(t=>t.group?.id).filter(Boolean);
    
    // Stats Calculation
    const allAtt=DataService?.getAttendance?DataService.getAttendance():[];
    const att=allAtt.filter(a=>a.status==='approved' && groupIds.includes(a.groupId) && a.records?.some(r=>r.studentId===s.id));
    const pr=att.filter(a=>a.records?.find(r=>r.studentId===s.id)?.status==='present').length;
    const rate=att.length?Math.round((pr/att.length)*100):0;
    
    const subs=DataService?.getSubmissions?DataService.getSubmissions({studentId:s.id}):[];
    const gradedHw=subs.filter(x=>x.status==='graded');
    const avgHw=gradedHw.length?Math.round(gradedHw.reduce((a,x)=>a+(x.score||0),0)/gradedHw.length):0;
    
    const billing=(typeof Ops?.buildStudentBilling==='function')?Ops.buildStudentBilling(s.id):[];
    const totalDue=billing.reduce((a,x)=>a+(x.billing?.total||0),0);
    const totalPaid=billing.reduce((a,x)=>a+(x.payment?.paidAmount||0),0);
    const remaining=Math.max(0,totalDue-totalPaid);
    
    const attempts=DataService?.getExamAttempts?DataService.getExamAttempts({studentId:s.id}):[];
    const followups=(typeof Ops?.getFollowUps==='function')?Ops.getFollowUps({studentId:s.id}):[];
    const points=(typeof Ops?.getStudentPoints==='function')?Ops.getStudentPoints(s.id,null,'all'):0;

    // Ungraded Items for Quick Action
    const allHw=DataService?.getHomework?DataService.getHomework():[];
    const studentHw=allHw.filter(h=>groupIds.includes(h.groupId));
    const ungradedSubs=studentHw.filter(hw => {
      const sub=subs.find(x=>x.homeworkId===hw.id);
      return !sub || sub.status!=='graded';
    }).map(hw => ({hw, sub: subs.find(x=>x.homeworkId===hw.id)}));

    const allEx=DataService?.getExams?DataService.getExams():[];
    const studentEx=allEx.filter(e=>groupIds.includes(e.groupId));
    const ungradedAttempts=studentEx.filter(ex => {
      const att=attempts.find(a=>a.examId===ex.id);
      return !att || (att.status!=='approved' && att.status!=='graded');
    }).map(ex => ({ex, att: attempts.find(a=>a.examId===ex.id)}));

    const mainTeacher=ts[0]?.teacher;
    const teacherPhoto=window.driveThumb(mainTeacher?.photoUrl);

    document.getElementById('qrContent').innerHTML=`
    <div class="child-hero">
      ${teacherPhoto 
        ? `<img src="${teacherPhoto}" class="teacher-photo" onerror="this.style.display='none'">`
        : `<div class="teacher-photo">${(s.name||'؟').charAt(0)}</div>`}
      <div style="flex:1;min-width:0;">
        <div style="font-size:20px;font-weight:800;">${s.name}</div>
        <div style="opacity:.9;font-size:12px;">${EduFlowConfig?.educationLevels?.[s.stage]?.nameAr||'-'} - ${s.grade||''} · <span style="font-family:var(--font-en);">${s.code||''}</span></div>
        <div style="opacity:.9;font-size:11px;margin-top:4px;">👨‍🏫 ${ts.map(t=>t.teacher?.name).filter(Boolean).join('، ')||'غير محدد'}</div>
      </div>
    </div>

    ${remaining>0?`
    <div class="payment-alert">
      <div class="info">
        <div class="title">💰 عليه مستحقات متأخرة</div>
        <div>متبقي: <span class="amount">${remaining} ${EduFlowConfig?.billing?.currency||'ج.م'}</span></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        <button class="quick-btn quick-btn-success" onclick="window.quickPayFull('${s.id}')">✓ تحصيل كامل</button>
        <button class="quick-btn quick-btn-primary" onclick="window.quickPay('${s.id}')">💵 مبلغ مخصص</button>
      </div>
    </div>
    `:''}

    <div class="stat-mini">
      <div class="stat-mini-box"><div class="stat-mini-value">${rate}%</div><div class="stat-mini-label">الحضور</div></div>
      <div class="stat-mini-box"><div class="stat-mini-value">${avgHw}%</div><div class="stat-mini-label">الواجبات</div></div>
      <div class="stat-mini-box"><div class="stat-mini-value">${points}</div><div class="stat-mini-label">نقاط 🏆</div></div>
      <div class="stat-mini-box"><div class="stat-mini-value" style="color:${remaining>0?'var(--danger)':'var(--success)'}">${remaining}</div><div class="stat-mini-label">متبقي</div></div>
    </div>

    <div class="action-grid">
      <button class="btn btn-success" onclick="window.quickAttend('${s.id}')">📋 تسجيل حضور</button>
      <button class="btn btn-primary" onclick="window.quickPay('${s.id}')">💵 تسجيل دفعة</button>
      <button class="btn btn-secondary" onclick="window.quickFollowup('${s.id}')">📌 متابعة</button>
      <button class="btn btn-warning" onclick="window.quickEval('${s.id}')">⭐ تقييم تسميع</button>
      ${s.parentPhone?`<a class="btn btn-success" href="https://wa.me/2${s.parentPhone.replace(/\D/g,'')}" target="_blank">💬 واتساب</a>`:''}
      <a class="btn btn-secondary" href="parent-dashboard.html?studentId=${s.id}" target="_blank">👁️ عرض كولي أمر</a>
    </div>

    ${ungradedSubs.length>0?`
    <div class="quick-grade-section">
      <h3>⚡ تسجيل درجة واجب سريع (${ungradedSubs.length})</h3>
      <div id="ungradedHwList">
        ${ungradedSubs.map(({hw, sub})=>{
          const g=DataService?.getGroups?DataService.getGroups().find(gr=>gr.id===hw.groupId):null;
          const maxPoints=hw.totalPoints||100;
          return `
          <div class="grade-row" id="grade-hw-${hw.id}">
            <div class="hw-info">
              <div class="hw-title">${hw.paper?'📄':'📝'} ${hw.title}</div>
              <div class="hw-meta">${g?.name||''} · الدرجة من ${maxPoints}</div>
            </div>
            <div class="grade-input-group">
              <input type="number" class="grade-input" id="hw-score-${hw.id}" min="0" max="${maxPoints}" value="${sub?.score||''}" placeholder="--">
              <button class="quick-btn quick-btn-success" onclick="window.saveHwGrade('${s.id}','${hw.id}',${maxPoints})">✓</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    `:''}

    ${ungradedAttempts.length>0?`
    <div class="quick-grade-section">
      <h3>📝 تسجيل درجة امتحان سريع (${ungradedAttempts.length})</h3>
      <div id="ungradedExList">
        ${ungradedAttempts.map(({ex, att})=>{
          const g=DataService?.getGroups?DataService.getGroups().find(gr=>gr.id===ex.groupId):null;
          const maxPoints=ex.totalPoints||100;
          return `
          <div class="grade-row" id="grade-ex-${ex.id}">
            <div class="hw-info">
              <div class="hw-title">🎓 ${ex.title}</div>
              <div class="hw-meta">${g?.name||''} · الدرجة من ${maxPoints}</div>
            </div>
            <div class="grade-input-group">
              <input type="number" class="grade-input" id="ex-score-${ex.id}" min="0" max="${maxPoints}" value="${att?.score||''}" placeholder="--">
              <button class="quick-btn quick-btn-success" onclick="window.saveExGrade('${s.id}','${ex.id}',${maxPoints})">✓</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    `:''}

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" onclick="window.switchTab(event,'att')">📋 الحضور</button>
        <button class="tab-btn" onclick="window.switchTab(event,'hw')">📝 الواجبات</button>
        <button class="tab-btn" onclick="window.switchTab(event,'ex')">🎓 الامتحانات</button>
        <button class="tab-btn" onclick="window.switchTab(event,'pay')">💰 الدفعات</button>
        <button class="tab-btn" onclick="window.switchTab(event,'fu')">📌 المتابعات</button>
      </div>
      <div id="tab-att" class="tab-content active">${att.length?att.slice().reverse().map(a=>{const r=a.records?.find(r=>r.studentId===s.id);return `<div class="sub-row ${r?.status==='present'?'graded':'pending'}"><div><strong>${a.groupName||'-'}</strong><div class="text-xs text-muted">📅 ${a.date}</div></div><span class="badge ${r?.status==='present'?'badge-success':'badge-danger'}">${r?.status==='present'?'✓ حاضر':'✗ غائب'}</span></div>`;}).join(''):'<p class="text-muted" style="padding:10px;">لا سجلات حضور</p>'}</div>
      
      <div id="tab-hw" class="tab-content">${subs.length?subs.map(sub=>{const h=DataService?.getHomeworkById?DataService.getHomeworkById(sub.homeworkId):null;const pct=h&&h.totalPoints?Math.round((sub.score/h.totalPoints)*100):(sub.score||0);return `<div class="sub-row ${sub.status==='graded'?'graded':'pending'}"><div><strong>${h?.title||'-'}</strong>${h?.paper?'<span class="badge badge-info" style="margin-right:4px;">📄 ورقي</span>':''}</div><strong style="color:${sub.status==='graded'?'var(--success)':'var(--warning)'}">${sub.status==='graded'?pct+'%':'معلق'}</strong></div>`;}).join(''):'<p class="text-muted" style="padding:10px;">لا واجبات</p>'}</div>
      
      <div id="tab-ex" class="tab-content">${attempts.length?attempts.map(a=>{const e=DataService?.getExamById?DataService.getExamById(a.examId):null;const mx=a.maxScore||e?.totalPoints||100;return `<div class="sub-row ${a.status==='approved'||a.status==='graded'?'graded':'pending'}"><div><strong>${e?.title||'-'}</strong></div><strong style="color:${a.status==='approved'||a.status==='graded'?'var(--success)':'var(--warning)'}">${a.status==='approved'||a.status==='graded'?Math.round((a.score/mx)*100)+'%':'معلق'}</strong></div>`;}).join(''):'<p class="text-muted" style="padding:10px;">لا امتحانات</p>'}</div>
      
      <div id="tab-pay" class="tab-content">${billing.length?billing.map(x=>{const rem=Math.max(0,(x.billing?.total||0)-(x.payment?.paidAmount||0));return `<div class="sub-row ${rem>0?'due':'graded'}"><div><strong>${x.group?.name||'-'}</strong><div class="text-xs text-muted">شهر ${x.billing?.month||'-'}</div></div><div style="text-align:left;"><strong style="font-family:var(--font-en)">${x.payment?.paidAmount||0}/${x.billing?.total||0}</strong>${rem>0?`<div class="text-xs" style="color:var(--danger)">متبقي ${rem}</div>`:'<div class="text-xs" style="color:var(--success)">✓ مدفوع</div>'}</div></div>`;}).join(''):'<p class="text-muted" style="padding:10px;">لا مستحقات</p>'}</div>
      
      <div id="tab-fu" class="tab-content">${followups.length?followups.map(f=>`<div class="sub-row ${f.status==='resolved'?'graded':'pending'}"><div><strong>${f.title||f.reason||'-'}</strong><div class="text-xs text-muted">${f.startDate||''}</div></div><span class="badge ${f.status==='resolved'?'badge-success':'badge-warning'}">${f.status==='resolved'?'مغلقة':'مفتوحة'}</span></div>`).join(''):'<p class="text-muted" style="padding:10px;">لا متابعات</p>'}</div>
    </div>`;
  }catch(e){
    console.error('renderAdminProfile error',e);
    document.getElementById('qrContent').innerHTML='<div class="card" style="text-align:center;padding:30px;">خطأ في عرض البروفايل: '+e.message+'</div>';
  }
};

window.switchTab=function(ev,id){
  try{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    ev?.target?.classList.add('active');
    document.getElementById('tab-'+id)?.classList.add('active');
  }catch(e){}
};

// ===== إجراءات سريعة =====
window.quickAttend=async function(sid){
  try{
    const ts=DataService?.getStudentTeachers?DataService.getStudentTeachers(sid):[];
    if(!ts.length){ safeToast('لا توجد مجموعات لهذا الطالب', 'error'); return; }
    const g=ts[0].group;
    if(typeof DataService?.submitAttendance==='function'){
      await DataService.submitAttendance({groupId:g.id, groupName:g.name, submittedBy:currentUser?.id||'', records:[{studentId:sid, status:'present'}]});
      safeToast('✅ تم تسجيل الحضور بنجاح', 'success');
      window.renderAdminProfile();
    }
  }catch(e){ console.error(e); safeToast('خطأ في تسجيل الحضور', 'error'); }
};

window.quickPay=function(sid){
  try{
    const amt=prompt('أدخل المبلغ المدفوع:');
    if(amt===null) return;
    const num=parseFloat(amt);
    if(isNaN(num)||num<=0){ safeToast('مبلغ غير صحيح', 'error'); return; }
    window._doPayment(sid, num, 'cash');
  }catch(e){ console.error(e); }
};

window.quickPayFull=function(sid){
  try{
    const billing=(typeof Ops?.buildStudentBilling==='function')?Ops.buildStudentBilling(sid):[];
    const totalDue=billing.reduce((a,x)=>a+(x.billing?.total||0),0);
    const totalPaid=billing.reduce((a,x)=>a+(x.payment?.paidAmount||0),0);
    const remaining=Math.max(0,totalDue-totalPaid);
    if(remaining<=0){ safeToast('لا توجد مستحقات متبقية', 'info'); return; }
    window._doPayment(sid, remaining, 'cash_full');
  }catch(e){ console.error(e); }
};

window._doPayment=function(sid, amount, method){
  try{
    const billing=(typeof Ops?.buildStudentBilling==='function')?Ops.buildStudentBilling(sid):[];
    if(!billing.length){ safeToast('لا توجد مستحقات مسجلة', 'error'); return; }
    const d=DataService._getData(); d.payments=d.payments||[];
    const month=new Date().toISOString().slice(0,7);
    
    billing.forEach(({group, billing:b, payment:p})=>{
      let pay=d.payments.find(x=>x.studentId===sid && x.groupId===group.id && x.month===month);
      if(!pay){
        pay={id:'pay_'+Date.now()+'_'+group.id, studentId:sid, groupId:group.id, teacherId:group.teacherId, month, amount:b.total||0, paidAmount:0, status:'unpaid', history:[]};
        d.payments.push(pay);
      }
      pay.paidAmount+=amount;
      pay.status=pay.paidAmount>=pay.amount?'paid':'partial';
      pay.history=pay.history||[];
      pay.history.push({date:new Date().toISOString(), amount, method});
    });
    
    DataService._saveData(d);
    if(window.FirebaseService?.connected) FirebaseService.saveDoc('payments', 'pay_'+sid+'_'+month, d.payments.find(p=>p.studentId===sid&&p.month===month));
    safeToast(`💵 تم تسجيل الدفعة (${amount} ج.م)`, 'success');
    window.renderAdminProfile();
  }catch(e){ console.error(e); safeToast('خطأ في تسجيل الدفعة', 'error'); }
};

window.quickFollowup=async function(sid){

    const reason=prompt('سبب المتابعة:', 'متابعة عامة');

    if(typeof Ops?.addFollowUp==='function'){

window.saveHwGrade=async function(studentId, hwId, maxPoints){
  try{
    const input=document.getElementById('hw-score-'+hwId);
    if(!input) return;
    const score=parseInt(input.value);
    if(isNaN(score)||score<0||score>maxPoints){
      safeToast('درجة غير صحيحة', 'error'); return;
    }
    
    const hw=DataService?.getHomeworkById?DataService.getHomeworkById(hwId):null;
    if(!hw) return;
    
    const d=DataService._getData();
    d.submissions=d.submissions||[];
    let sub=d.submissions.find(s=>s.homeworkId===hwId && s.studentId===studentId);
    
    if(!sub){
      sub={
        id:'sub_'+Date.now(), homeworkId:hwId, studentId:studentId, answers:[],
        autoScore:0, totalAutoPoints:0, score:score, status:'graded',
        gradedBy:currentUser?.id||'', gradedAt:new Date().toISOString(), submittedAt:new Date().toISOString()
      };
      d.submissions.push(sub);
    }else{
      sub.score=score; sub.status='graded'; sub.gradedBy=currentUser?.id||''; sub.gradedAt=new Date().toISOString();
    }
    
    DataService._saveData(d);
    if(window.FirebaseService?.connected) await FirebaseService.saveDoc('submissions', sub.id, sub);
    
    const row=document.getElementById('grade-hw-'+hwId);
    if(row){ row.style.background='rgba(34,197,94,.1)'; row.style.borderRight='3px solid var(--success)'; }
    
    safeToast(`✓ تم تسجيل الدرجة: ${score}/${maxPoints}`, 'success');
    setTimeout(()=>window.renderAdminProfile(), 1500);
  }catch(e){ console.error(e); safeToast('خطأ في حفظ الدرجة', 'error'); }
};

window.saveExGrade=async function(studentId, exId, maxPoints){
  try{
    const input=document.getElementById('ex-score-'+exId);
    if(!input) return;
    const score=parseInt(input.value);
    if(isNaN(score)||score<0||score>maxPoints){

    if(!att){
      att={
        id:'eat_'+Date.now(), examId:exId, studentId:studentId, answers:[],

      };
