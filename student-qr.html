<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎓 بطاقة الطالب | Habbash Group</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Cairo',sans-serif;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  min-height:100vh;
  margin:0;padding:20px;
  display:flex;align-items:center;justify-content:center;
}
.qr-page{
  background:var(--surface,#fff);
  border-radius:24px;
  max-width:480px;width:100%;
  box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
  overflow:hidden;
  animation:slideUp .5s ease;
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.qr-header{
  background:linear-gradient(135deg,var(--primary,#6366f1),#8b5cf6);
  color:#fff;padding:24px;text-align:center;
}
.qr-header h1{margin:0;font-size:20px;font-weight:800}
.qr-header p{margin:6px 0 0;font-size:12px;opacity:.9}
.qr-body{padding:24px}

/* 🆕 كارت الترحيب */
.welcome-card{
  background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(5,150,105,.08));
  border:2px solid rgba(16,185,129,.3);
  border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;
}
.welcome-avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:800;margin:0 auto 12px;
  box-shadow:0 8px 24px rgba(16,185,129,.3);
}
.welcome-name{font-size:22px;font-weight:800;margin:0 0 4px;color:var(--text,#0f172a)}
.welcome-sub{font-size:12px;color:var(--text-muted,#94a3b8);margin:0}

/* 🆕 صندوق الباسورد */
.credentials-box{
  background:linear-gradient(135deg,#fef3c7,#fde68a);
  border:2px dashed #f59e0b;
  border-radius:14px;padding:16px;text-align:center;margin-bottom:16px;
}
.credentials-label{
  font-size:12px;color:#92400e;font-weight:800;margin-bottom:8px;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.credentials-value{
  font-family:'Fira Code',monospace;font-size:22px;font-weight:800;
  color:#78350f;background:#fff;padding:10px 20px;
  border-radius:10px;display:inline-block;letter-spacing:3px;
  border:2px solid #f59e0b;
}
.credentials-hint{
  font-size:11px;color:#92400e;margin-top:8px;font-weight:700;
}

.student-card{
  background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(139,92,246,.08));
  border:2px solid var(--primary-border,#e0e7ff);
  border-radius:16px;padding:20px;text-align:center;margin-bottom:16px;
}
.student-avatar{
  width:80px;height:80px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary,#6366f1),#8b5cf6);
  color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:800;margin:0 auto 12px;
  box-shadow:0 8px 24px rgba(99,102,241,.3);
}
.student-name{font-size:22px;font-weight:800;margin:0 0 8px;color:var(--text,#0f172a)}
.student-code{
  font-family:'Fira Code',monospace;font-size:18px;font-weight:700;
  color:var(--primary,#6366f1);letter-spacing:2px;
  background:var(--surface-hover,#f8fafc);padding:8px 16px;
  border-radius:99px;display:inline-block;margin-top:8px;
}
.info-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
}
.info-box{
  background:var(--surface-hover,#f8fafc);
  border:1px solid var(--border,#e2e8f0);
  border-radius:12px;padding:12px;text-align:center;
}
.info-label{font-size:11px;color:var(--text-muted,#94a3b8);margin-bottom:4px}
.info-value{font-size:14px;font-weight:700;color:var(--text,#0f172a)}
.groups-list{
  background:var(--surface-hover,#f8fafc);
  border:1px solid var(--border,#e2e8f0);
  border-radius:12px;padding:14px;margin-bottom:16px;
}
.groups-title{font-size:13px;font-weight:800;margin:0 0 10px;color:var(--text,#0f172a)}
.group-item{
  background:var(--surface,#fff);border:1px solid var(--border,#e2e8f0);
  border-radius:10px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:10px;
}
.group-item:last-child{margin-bottom:0}
.group-icon{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#10b981,#059669);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
}
.group-info{flex:1;min-width:0}
.group-name{font-size:13px;font-weight:700;margin:0;color:var(--text,#0f172a)}
.group-meta{font-size:11px;color:var(--text-muted,#94a3b8);margin-top:2px}

.action-btn{
  display:block;width:100%;padding:14px;border:none;border-radius:12px;
  font-weight:800;font-size:15px;cursor:pointer;margin-bottom:8px;
  transition:all .2s;text-decoration:none;text-align:center;
}
.action-btn:last-child{margin-bottom:0}
.action-btn-primary{
  background:linear-gradient(135deg,var(--primary,#6366f1),#8b5cf6);color:#fff;
  box-shadow:0 4px 12px rgba(99,102,241,.3);
}
.action-btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(99,102,241,.4)}
.action-btn-success{
  background:linear-gradient(135deg,#10b981,#059669);color:#fff;
  box-shadow:0 4px 12px rgba(16,185,129,.3);
}
.action-btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(16,185,129,.4)}
.action-btn-secondary{
  background:var(--surface-hover,#f8fafc);color:var(--text,#0f172a);
  border:1px solid var(--border,#e2e8f0);
}
.action-btn-secondary:hover{background:var(--border,#e2e8f0)}

.error-box{
  background:rgba(239,68,68,.1);border:2px solid rgba(239,68,68,.3);
  border-radius:16px;padding:24px;text-align:center;color:#dc2626;
}
.error-icon{font-size:48px;margin-bottom:12px}
.error-title{font-size:18px;font-weight:800;margin:0 0 8px}
.error-msg{font-size:13px;color:var(--text-secondary,#475569);margin:0}
.qr-footer{
  padding:16px 24px;background:var(--surface-hover,#f8fafc);
  border-top:1px solid var(--border,#e2e8f0);text-align:center;
}
.qr-footer-text{font-size:11px;color:var(--text-muted,#94a3b8);margin:0}
.loading-state{text-align:center;padding:40px 20px}
.loading-spinner{
  width:40px;height:40px;border:3px solid var(--border,#e2e8f0);
  border-top-color:var(--primary,#6366f1);border-radius:50%;
  animation:spin 1s linear infinite;margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 🆕 شاشة الدخول المباشر */
.direct-login-screen{
  text-align:center;padding:40px 20px;
}
.direct-login-icon{
  font-size:64px;margin-bottom:16px;
  animation:bounceIn .6s ease;
}
@keyframes bounceIn{
  0%{transform:scale(0);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}
.direct-login-title{
  font-size:22px;font-weight:800;margin:0 0 8px;color:var(--text,#0f172a);
}
.direct-login-sub{
  font-size:14px;color:var(--text-muted,#94a3b8);margin:0 0 20px;
}
.login-progress{
  width:60px;height:4px;background:var(--border,#e2e8f0);
  border-radius:2px;margin:0 auto;overflow:hidden;
}
.login-progress-bar{
  width:100%;height:100%;background:linear-gradient(90deg,var(--primary,#6366f1),#8b5cf6);
  animation:progressAnim 1.5s ease-in-out infinite;
}
@keyframes progressAnim{
  0%{transform:translateX(-100%);}
  100%{transform:translateX(100%);}
}
</style>
</head>
<body>
<div class="qr-page">
  <div class="qr-header">
    <h1>🎓 بطاقة الطالب</h1>
    <p id="brandName">Habbash Group</p>
  </div>
  <div class="qr-body" id="qrBody">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p style="color:var(--text-muted);margin:0">جاري التحقق...</p>
    </div>
  </div>
  <div class="qr-footer">
    <p class="qr-footer-text">© <span id="yearSpan"></span> <span id="footerBrand">Habbash Group</span></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>

<script>
// 🎯 الصفحة دي Public - مفيش أي auth check
(async function boot(){
  try{
    document.getElementById('yearSpan').textContent = new Date().getFullYear();
    
    // تحميل البراندنج
    try{
      if(typeof DataService?.init === 'function') await DataService.init();
      const branding = (typeof DataService?.getBranding === 'function') 
        ? DataService.getBranding() 
        : ((DataService?._getData && DataService._getData().branding) || {});
      if(branding?.name){
        document.getElementById('brandName').textContent = branding.name;
        document.getElementById('footerBrand').textContent = branding.name;
        document.title = '🎓 بطاقة الطالب | ' + branding.name;
      }
    }catch(e){ console.log('Branding load skipped'); }
    
    // جلب الكود من URL
    const params = new URLSearchParams(location.search);
    const code = params.get('code');
    
    if(!code){
      showError('كود غير موجود', 'الرابط غير صحيح — تأكد من مسح الباركود الصحيح');
      return;
    }
    
    // البحث عن الطالب بالكود (بدون أي auth)
    await DataService.init();
    const allUsers = DataService.getUsers ? DataService.getUsers() : [];
    const student = allUsers.find(u => 
      u.role === 'student' && 
      (u.code||'').toUpperCase() === code.toUpperCase()
    );
    
    if(!student){
      showError('طالب غير موجود', 'الكود "' + code + '" غير مسجل في النظام');
      return;
    }
    
    // 🎯 التحقق من أول مرة دخول
    const firstTimeKey = 'eduflow_first_visit_' + student.id;
    const hasVisited = localStorage.getItem(firstTimeKey);
    
    if(!hasVisited){
      // 🎉 أول مرة: اعرض البيانات والباسورد
      renderFirstTimeView(student, firstTimeKey);
    } else {
      // 🚀 مرات تانية: ادخل مباشرة للداشبورد
      directLoginToDashboard(student);
    }
    
  }catch(err){
    console.error('QR Page Error:', err);
    showError('خطأ في التحميل', err.message || 'حدث خطأ غير متوقع');
  }
})();

// 🎉 أول مرة دخول: اعرض البيانات والباسورد
function renderFirstTimeView(student, firstTimeKey){
  const body = document.getElementById('qrBody');
  
  const teachers = (typeof DataService?.getStudentTeachers === 'function') 
    ? DataService.getStudentTeachers(student.id) 
    : [];
  
  const stageLabel = (typeof EduFlowConfig !== 'undefined' && EduFlowConfig?.educationLevels?.[student.stage]?.nameAr) || '';
  
  // حساب الإحصائيات
  const d = (DataService._getData && DataService._getData()) || {};
  const attendance = (d.attendance||[]).filter(a => a.status==='approved' && a.records.some(r => r.studentId===student.id));
  const present = attendance.filter(a => a.records.find(r => r.studentId===student.id)?.status==='present').length;
  const attRate = attendance.length ? Math.round(present/attendance.length*100) : 0;
  
  let groupsHtml = '';
  if(teachers.length){
    groupsHtml = `
      <div class="groups-list">
        <h3 class="groups-title">👥 مجموعاتك (${teachers.length})</h3>
        ${teachers.map(t => `
          <div class="group-item">
            <div class="group-icon">📚</div>
            <div class="group-info">
              <div class="group-name">${t.group?.name || '-'}</div>
              <div class="group-meta">
                👨‍🏫 ${t.teacher?.name || '-'} 
                ${t.group?.center ? ' · 🏢 ' + t.group.center : ''}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  }
  
  body.innerHTML = `
    <div class="welcome-card">
      <div class="welcome-avatar">${(student.name||'?').charAt(0)}</div>
      <h2 class="welcome-name">أهلاً بيك يا ${student.name}! 🎉</h2>
      <p class="welcome-sub">تم التحقق من الباركود بنجاح</p>
    </div>
    
    <div class="credentials-box">
      <div class="credentials-label">
        <span>🔑</span>
        <span>كلمة المرور الخاصة بك</span>
      </div>
      <div class="credentials-value">${student.password || '1234'}</div>
      <div class="credentials-hint">
        ⚠️ احفظ الرقم ده — لن يظهر مرة تانية
      </div>
    </div>
    
    <div class="student-card" style="padding:14px;">
      <div class="student-code">${student.code}</div>
    </div>
    
    <div class="info-grid">
      <div class="info-box">
        <div class="info-label">🎓 المرحلة</div>
        <div class="info-value">${stageLabel || '-'}</div>
      </div>
      <div class="info-box">
        <div class="info-label">📚 الصف</div>
        <div class="info-value">${student.grade || '-'}</div>
      </div>
      <div class="info-box">
        <div class="info-label">📋 الحضور</div>
        <div class="info-value" style="color:${attRate>=75?'var(--success,#10b981)':'var(--warning,#f59e0b)'}">${attRate}%</div>
      </div>
      <div class="info-box">
        <div class="info-label">👥 المجموعات</div>
        <div class="info-value">${teachers.length}</div>
      </div>
    </div>
    
    ${groupsHtml}
    
    <button class="action-btn action-btn-success" onclick="window.markVisitedAndLogin('${student.id}', '${firstTimeKey}')">
      🚀 ادخل للداشبورد
    </button>
    
    <button class="action-btn action-btn-secondary" onclick="window.showChangePassword('${student.id}')">
      🔒 تغيير كلمة المرور
    </button>
  `;
}

// ✅ تسجيل الزيارة الأولى والدخول
window.markVisitedAndLogin = function(studentId, firstTimeKey){
  try{
    localStorage.setItem(firstTimeKey, 'true');
    localStorage.setItem('eduflow_first_visit_timestamp_' + studentId, new Date().toISOString());
    
    const allUsers = DataService.getUsers ? DataService.getUsers() : [];
    const student = allUsers.find(u => u.id === studentId);
    
    if(student){
      directLoginToDashboard(student);
    } else {
      alert('خطأ: بيانات الطالب غير موجودة');
    }
  }catch(e){
    console.error('Mark visited error:', e);
    alert('خطأ في تسجيل الزيارة');
  }
};

// 🚀 الدخول المباشر للداشبورد
function directLoginToDashboard(student){
  const body = document.getElementById('qrBody');
  
  // 1. عرض شاشة التحميل الجميلة
  body.innerHTML = `
    <div class="direct-login-screen">
      <div class="direct-login-icon">✅</div>
      <h2 class="direct-login-title">أهلاً ${student.name}!</h2>
      <p class="direct-login-sub">جاري فتح الداشبورد...</p>
      <div class="login-progress">
        <div class="login-progress-bar"></div>
      </div>
    </div>
  `;
  
  // 2. إنشاء session مؤقت
  try{
    const sessionData = {
      id: student.id,
      code: student.code,
      name: student.name,
      role: 'student',
      barcodeLogin: true,
      loginAt: Date.now(),
      expiresAt: Date.now() + (30 * 24 * 60 * 60 * 1000) // 30 يوم
    };
    
    // حفظ في localStorage
    localStorage.setItem('eduflow_user', JSON.stringify(student));
    localStorage.setItem('eduflow_session', JSON.stringify(sessionData));
    localStorage.setItem('eduflow_barcode_session', JSON.stringify(sessionData));
    
    // حفظ في sessionStorage كبديل
    try{
      sessionStorage.setItem('eduflow_user', JSON.stringify(student));
      sessionStorage.setItem('eduflow_session', JSON.stringify(sessionData));
    }catch(e){}
    
  }catch(e){
    console.error('Session save error:', e);
  }
  
  // 3. الانتقال للداشبورد بعد ثانية
  setTimeout(() => {
    const targetUrl = 'student-dashboard.html?barcode=' + encodeURIComponent(student.id) + '&direct=1';
    window.location.href = targetUrl;
  }, 1000);
}

// 🔒 تغيير كلمة المرور
window.showChangePassword = function(studentId){
  const newPass = prompt('اكتب كلمة المرور الجديدة (4 أرقام على الأقل):');
  if(!newPass || newPass.length < 4){
    alert('كلمة المرور لازم تكون 4 أرقام على الأقل');
    return;
  }
  
  try{
    const d = DataService._getData ? DataService._getData() : {};
    const user = (d.users || []).find(u => u.id === studentId);
    if(user){
      user.password = newPass;
      user.updatedAt = new Date().toISOString();
      if(typeof DataService._saveData === 'function'){
        DataService._saveData(d);
      }
      alert('✅ تم تغيير كلمة المرور بنجاح');
      // تحديث العرض
      const credValue = document.querySelector('.credentials-value');
      if(credValue) credValue.textContent = newPass;
    }
  }catch(e){
    console.error('Change password error:', e);
    alert('خطأ في تغيير كلمة المرور');
  }
};

function showError(title, msg){
  document.getElementById('qrBody').innerHTML = `
    <div class="error-box">
      <div class="error-icon">⚠️</div>
      <h3 class="error-title">${title}</h3>
      <p class="error-msg">${msg}</p>
      <a href="login.html" class="action-btn action-btn-primary" style="margin-top:16px;">
        🔐 تسجيل الدخول العادي
      </a>
    </div>
  `;
}
</script>
</body>
</html>
