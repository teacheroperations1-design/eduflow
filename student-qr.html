<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بروفايل الطالب - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .student-hero{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-radius:var(--radius-xl);padding:28px 20px;text-align:center;margin-bottom:20px;position:relative;overflow:hidden}
    .student-hero::before{content:'';position:absolute;top:-50%;right:-20%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);border-radius:50%}
    .student-hero h2{margin:0 0 6px;font-size:26px;font-weight:900;position:relative}
    .student-hero .code{font-family:var(--font-en);font-size:16px;opacity:.9;background:rgba(255,255,255,.15);display:inline-block;padding:6px 16px;border-radius:9999px;margin-top:8px;letter-spacing:2px;position:relative}
    .student-hero .meta{margin-top:10px;font-size:13px;opacity:.9;position:relative}
    .role-badge{position:absolute;top:14px;right:14px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:700;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff}
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
    .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;transition:all var(--t)}
    .stat-box:hover{border-color:var(--primary-border);transform:translateY(-2px)}
    .stat-value{font-size:28px;font-weight:800;color:var(--primary);font-family:var(--font-en)}
    .stat-label{font-size:12px;color:var(--text-muted);margin-top:4px}
    .action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
    .action-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center;cursor:pointer;transition:all var(--t);text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px}
    .action-btn:hover{border-color:var(--primary-border);background:var(--primary-soft);transform:translateY(-2px)}
    .action-btn .icon{font-size:26px}
    .action-btn .label{font-size:12px;font-weight:700}
    .action-btn.primary{background:var(--grad);color:#fff;border:none}
    .action-btn.primary:hover{transform:translateY(-2px) scale(1.02)}
    .action-btn.success{background:var(--success);color:#fff;border:none}
    .action-btn.warning{background:var(--warning);color:#fff;border:none}
    .homework-alert{background:linear-gradient(135deg,var(--warning),var(--danger));color:#fff;border-radius:var(--radius);padding:18px;margin-bottom:20px;border-right:4px solid var(--danger)}
    .homework-alert h3{margin:0 0 8px;font-size:17px}
    .timeline-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .timeline-item:last-child{border-bottom:none}
    .timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--primary);margin-top:6px;flex-shrink:0}
    .timeline-dot.success{background:var(--success)}
    .timeline-dot.warning{background:var(--warning)}
    .timeline-dot.danger{background:var(--danger)}
    .login-cta{background:var(--primary-soft);border:1px solid var(--primary-border);border-radius:var(--radius);padding:20px;text-align:center;margin-top:20px}
    .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
    .tab-btn{padding:8px 14px;background:none;border:none;color:var(--text-secondary);cursor:pointer;font-weight:700;font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
    .tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .sub-row{padding:10px;background:var(--surface-hover);border-radius:8px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .sub-row.graded{border-right:3px solid var(--success)}
    .sub-row.pending{border-right:3px solid var(--warning)}
    .sub-row.missing{border-right:3px solid var(--danger);opacity:.75}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .detail-box{background:var(--surface-hover);border-radius:10px;padding:12px}
    .detail-box .lbl{font-size:11px;color:var(--text-muted);margin-bottom:4px}
    .detail-box .val{font-weight:700;font-size:13px}
    .qr-scanner-hint{background:var(--info-bg);border:1px solid var(--info-border);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:12px;color:var(--info);text-align:center}
    @media(max-width:640px){.stat-grid{grid-template-columns:1fr 1fr}.action-grid{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div style="max-width:720px;margin:0 auto;padding:20px;position:relative;z-index:1;">
    <div style="text-align:center;margin-bottom:20px;">
      <div class="sidebar-logo" data-logo style="margin:0 auto;width:60px;height:60px;"></div>
      <h1 style="margin-top:10px;font-size:20px;">EduFlow</h1>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px;">بطاقة الطالب الرقمية</div>
    </div>

    <div id="studentData"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>
  <script src="js/admin-patch.js"></script>

  <script>
    const DAYS=[{en:'Sunday',ar:'الأحد'},{en:'Monday',ar:'الإثنين'},{en:'Tuesday',ar:'الثلاثاء'},{en:'Wednesday',ar:'الأربعاء'},{en:'Thursday',ar:'الخميس'},{en:'Friday',ar:'الجمعة'},{en:'Saturday',ar:'السبت'}];
    const dayAr=en=>(DAYS.find(d=>d.en===en)||{}).ar||en;
    const T=tm=>DataService?.formatTime12 ? DataService.formatTime12(tm) : tm;
    const db=()=>DataService?._getData() || {};
    const save=d=>DataService?._saveData(d);

    let student=null;
    let currentUser=null;
    let viewMode='public'; // 'admin' | 'student' | 'parent' | 'public'

    (async function boot(){
      try{
        if(typeof DataService?.init === 'function') await DataService.init();
        if(window.Ops && typeof Ops.init === 'function') await Ops.init();

        const params = new URLSearchParams(location.search);
        const code = params.get('code');

        if(!code){
          showError('❌ لا يوجد كود طالب في الرابط');
          return;
        }

        student = typeof DataService?.findStudentByCode === 'function' ? DataService.findStudentByCode(code) : null;
        if(!student){
          showError('⚠️ الطالب غير موجود — تأكد من الكود: '+code);
          return;
        }

        currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;

        // ====== التوجيه الذكي حسب المستخدم ======
        if(currentUser){
          if(currentUser.role === 'student'){
            // لو الطالب نفسه مسح الباركود → روح للداشبورد
            if(currentUser.id === student.id || currentUser.code === student.code){
              window.location.href = 'student-dashboard.html';
              return;
            }
            // طالب آخر → اعرض بروفايل عام فقط
            viewMode = 'public';
          } else if(currentUser.role === 'parent'){
            // ولي الأمر
            const parentStudentIds = currentUser.studentIds || [];
            const isParentOfThis = parentStudentIds.includes(student.id) || parentStudentIds.includes(student.studentId);
            if(isParentOfThis){
              window.location.href = 'student-dashboard.html?parent=1&studentId=' + student.id;
              return;
            }
            viewMode = 'public';
          } else if(currentUser.role === 'super_admin' || currentUser.role === 'assistant' || currentUser.role === 'teacher'){
            // أدمن / مساعد / مدرس → بروفايل إدارة كامل
            viewMode = 'admin';
          } else {
            viewMode = 'public';
          }
        } else {
          // زائر → عرض عام مع زر تسجيل دخول
          viewMode = 'public';
        }

        window.renderProfile();
      }catch(err){
        console.error('Boot error', err);
        showError('خطأ في التحميل: '+err.message);
      }
    })();

    function showError(msg){
      const el = document.getElementById('studentData');
      if(el){
        el.innerHTML = `
          <div class="card" style="text-align:center;padding:30px;">
            <div style="font-size:48px;margin-bottom:12px;">🚫</div>
            <h3 style="margin-bottom:8px;">تعذّر التحميل</h3>
            <p class="text-muted">${msg}</p>
            <div style="display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap;">
              <a href="login.html" class="btn btn-primary">🔐 تسجيل الدخول</a>
              <button class="btn btn-secondary" onclick="location.reload()">🔄 إعادة المحاولة</button>
            </div>
          </div>`;
      }
    }

    // ====== عرض البروفايل حسب نوع المستخدم ======
    window.renderProfile = function(){
      try{
        if(!student) return;

        // إحصائيات عامة (مشتركة بين كل الأنواع)
        const subs = typeof DataService?.getSubmissions === 'function' ? DataService.getSubmissions({studentId:student.id}) : [];
        const attempts = typeof DataService?.getExamAttempts === 'function' ? DataService.getExamAttempts({studentId:student.id}) : [];
        const gradedHw = subs.filter(s=>s.status==='graded');
        const gradedEx = attempts.filter(a=>a.status==='approved');
        const avgHw = gradedHw.length ? Math.round(gradedHw.reduce((a,x)=>a+(x.score||0),0)/gradedHw.length) : 0;
        const avgEx = gradedEx.length ? Math.round(gradedEx.reduce((a,x)=>a+(x.score||0),0)/gradedEx.length) : 0;

        const allAtt = typeof DataService?.getAttendance === 'function' ? DataService.getAttendance() : [];
        const att = allAtt.filter(a=>a.status==='approved'&&a.records.some(r=>r.studentId===student.id));
        const pr = att.filter(a=>a.records.find(r=>r.studentId===student.id)?.status==='present').length;
        const attRate = att.length ? Math.round(pr/att.length*100) : 0;

        const teachers = typeof DataService?.getStudentTeachers === 'function' ? DataService.getStudentTeachers(student.id) : [];
        const stageLabel = (typeof EduFlowConfig !== 'undefined' && EduFlowConfig?.educationLevels?.[student.stage]?.nameAr) || '';
        const groups = teachers.map(t=>t.group?.name).filter(Boolean).join('، ') || '-';
        const mainTeacher = teachers[0]?.teacher?.name || '-';

        // الواجبات المطلوبة (للطالب والزائر)
        const requiredHw = (typeof DataService?.getHomework === 'function' ? DataService.getHomework() : []).filter(h=>
          teachers.some(t=>t.group?.id===h.groupId) && !subs.find(s=>s.homeworkId===h.id)
        );

        // نقاط المسابقات
        const chPoints = (typeof DataService?.getStudentChallengePoints === 'function') ? DataService.getStudentChallengePoints(student.id,'all') : 0;

        // Role badge
        const roleLabels = {admin:'👑 عرض إداري', student:'🎓 حسابك', parent:'👨‍👩‍👧 ولي أمر', public:'👁️ عرض عام'};
        const roleBadge = `<div class="role-badge">${roleLabels[viewMode]}</div>`;

        let html = `
          <div class="student-hero">
            ${roleBadge}
            <div class="user-avatar" style="width:72px;height:72px;font-size:28px;background:rgba(255,255,255,.2);margin:0 auto 10px;">${student.name?.charAt(0)||'?'}</div>
            <h2>${student.name||'-'}</h2>
            <div class="code">${student.code||'-'}</div>
            <div class="meta">${stageLabel} ${student.grade?' - '+student.grade:''} · 👨‍🏫 ${mainTeacher}</div>
          </div>

          ${requiredHw.length>0 && viewMode!=='admin' ? `
            <div class="homework-alert">
              <h3>⚠️ فيه ${requiredHw.length} واجب مطلوب منك!</h3>
              ${requiredHw.slice(0,3).map(h=>{
                const g = DataService?.getGroups ? DataService.getGroups().find(x=>x.id===h.groupId) : null;
                const teacher = DataService?.getUserById ? DataService.getUserById(g?.teacherId) : null;
                return `<div style="margin-top:6px;font-size:13px;">• <strong>${h.title}</strong> — ${teacher?.name||'-'} (${g?.name||'-'})</div>`;
              }).join('')}
              ${requiredHw.length>3?`<div style="margin-top:6px;font-size:11px;opacity:.9;">+ ${requiredHw.length-3} واجبات أخرى</div>`:''}
            </div>
          `:''}

          <div class="stat-grid">
            <div class="stat-box"><div class="stat-value">${attRate}%</div><div class="stat-label">📋 الحضور</div></div>
            <div class="stat-box"><div class="stat-value">${avgHw}%</div><div class="stat-label">📝 الواجبات</div></div>
            <div class="stat-box"><div class="stat-value">${avgEx}%</div><div class="stat-label">🎓 الامتحانات</div></div>
            <div class="stat-box"><div class="stat-value">${chPoints}</div><div class="stat-label">🏆 نقاط المسابقات</div></div>
          </div>
        `;

        // ====== أزرار الإدارة للأدمن/المساعد/المدرس ======
        if(viewMode === 'admin'){
          html += window.renderAdminActions();
          html += window.renderAdminTabs();
        }
        // ====== عرض عام للزوار ======
        else {
          html += window.renderPublicView();
        }

        const el = document.getElementById('studentData');
        if(el) el.innerHTML = html;
      }catch(err){
        console.error('renderProfile error', err);
        showError(err.message);
      }
    };

    // ====== الأزرار الإدارية (للأدمن/المساعد/المدرس) ======
    window.renderAdminActions = function(){
      const billing = (typeof Ops?.buildStudentBilling === 'function') ? Ops.buildStudentBilling(student.id) : [];
      const totalDue = billing.reduce((a,x)=>a+(x.billing?.total||0),0);
      const totalPaid = billing.reduce((a,x)=>a+(x.payment?.paidAmount||0),0);
      const remaining = Math.max(0, totalDue - totalPaid);
      const hasPhone = !!(student.parentPhone || student.phone);

      return `
        <div class="action-grid">
          <div class="action-btn primary" onclick="window.quickCheckin('${student.id}')">
            <div class="icon">📋</div>
            <div class="label">تسجيل حضور سريع</div>
          </div>
          <div class="action-btn success" onclick="window.quickPayment('${student.id}')">
            <div class="icon">💵</div>
            <div class="label">تسجيل دفعة</div>
            <div style="font-size:10px;opacity:.8;">${remaining>0?`متبقي ${remaining}`:'مسدد'}</div>
          </div>
          <div class="action-btn" onclick="window.openGradeModal('${student.id}')">
            <div class="icon">📝</div>
            <div class="label">إضافة درجة واجب</div>
          </div>
          <div class="action-btn" onclick="window.openFollowupModal('${student.id}')">
            <div class="icon">📌</div>
            <div class="label">إضافة متابعة</div>
          </div>
          ${hasPhone?`<a class="action-btn" href="https://wa.me/2${(student.parentPhone||student.phone).replace(/\D/g,'')}" target="_blank" style="background:#25d366;color:#fff;">
            <div class="icon">💬</div>
            <div class="label">واتساب ولي الأمر</div>
          </a>`:''}
          <div class="action-btn" onclick="window.showStudentInDashboard('${student.id}')">
            <div class="icon">👁️</div>
            <div class="label">الملف الكامل</div>
          </div>
        </div>
      `;
    };

    // ====== التبويبات الكاملة للإدارة ======
    window.renderAdminTabs = function(){
      return `
        <div class="card">
          <div class="tabs">
            <button class="tab-btn active" onclick="window.switchQRTab(event,'info')">👤 البيانات</button>
            <button class="tab-btn" onclick="window.switchQRTab(event,'att')">📋 الحضور</button>
            <button class="tab-btn" onclick="window.switchQRTab(event,'hw')">📝 الواجبات</button>
            <button class="tab-btn" onclick="window.switchQRTab(event,'pay')">💰 الدفعات</button>
            <button class="tab-btn" onclick="window.switchQRTab(event,'fu')">📌 المتابعات</button>
          </div>
          <div id="qrtab-info" class="tab-content active">${window.renderInfoTab()}</div>
          <div id="qrtab-att" class="tab-content">${window.renderAttTab()}</div>
          <div id="qrtab-hw" class="tab-content">${window.renderHwTab()}</div>
          <div id="qrtab-pay" class="tab-content">${window.renderPayTab()}</div>
          <div id="qrtab-fu" class="tab-content">${window.renderFuTab()}</div>
        </div>
      `;
    };

    window.switchQRTab = function(ev, id){
      try{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
        ev?.target?.classList.add('active');
        document.getElementById('qrtab-'+id)?.classList.add('active');
      }catch(e){ console.error('switchQRTab error', e); }
    };

    window.renderInfoTab = function(){
      const teachers = typeof DataService?.getStudentTeachers === 'function' ? DataService.getStudentTeachers(student.id) : [];
      return `
        <div class="detail-grid">
          <div class="detail-box"><div class="lbl">الاسم الكامل</div><div class="val">${student.name}</div></div>
          <div class="detail-box"><div class="lbl">الكود</div><div class="val" style="font-family:var(--font-en);">${student.code||'-'}</div></div>
          <div class="detail-box"><div class="lbl">المرحلة</div><div class="val">${(EduFlowConfig?.educationLevels?.[student.stage]?.nameAr)||'-'}</div></div>
          <div class="detail-box"><div class="lbl">الصف</div><div class="val">${student.grade||'-'}</div></div>
          <div class="detail-box"><div class="lbl">الهاتف</div><div class="val" style="font-family:var(--font-en);">${student.phone||'-'}</div></div>
          <div class="detail-box"><div class="lbl">ولي الأمر</div><div class="val" style="font-family:var(--font-en);">${student.parentPhone||'-'}</div></div>
          <div class="detail-box"><div class="lbl">كلمة المرور</div><div class="val" style="font-family:var(--font-en);">${student.password||'-'}</div></div>
          <div class="detail-box"><div class="lbl">تاريخ التسجيل</div><div class="val">${student.createdAt?new Date(student.createdAt).toLocaleDateString('ar-EG'):'-'}</div></div>
        </div>
        <h4 class="text-sm" style="margin:14px 0 8px;">📚 الاشتراكات (${teachers.length}):</h4>
        ${teachers.length ? teachers.map(t=>`<div class="sub-row"><div><strong>${t.teacher?.name||'-'}</strong> — ${t.group?.name||'-'}<div class="text-xs text-muted">${dayAr(t.group?.day)} ${T(t.group?.time)}</div></div></div>`).join('') : '<p class="text-muted">لا اشتراكات</p>'}
      `;
    };

    window.renderAttTab = function(){
      const allAtt = typeof DataService?.getAttendance === 'function' ? DataService.getAttendance() : [];
      const att = allAtt.filter(a=>a.status==='approved'&&a.records.some(r=>r.studentId===student.id));
      return att.length ? att.slice().reverse().slice(0,20).map(a=>{
        const r = a.records.find(r=>r.studentId===student.id);
        return `<div class="sub-row ${r?.status==='present'?'graded':'pending'}">
          <div><strong>${a.groupName}</strong><div class="text-xs text-muted">📅 ${a.date}</div></div>
          <span class="badge ${r?.status==='present'?'badge-success':r?.status==='late'?'badge-warning':'badge-danger'}">${r?.status==='present'?'✓ حاضر':r?.status==='late'?'⏰ متأخر':'✗ غائب'}</span>
        </div>`;
      }).join('') : '<p class="text-muted">لا سجلات حضور</p>';
    };

    window.renderHwTab = function(){
      const subs = typeof DataService?.getSubmissions === 'function' ? DataService.getSubmissions({studentId:student.id}) : [];
      return subs.length ? subs.map(s=>{
        const h = DataService?.getHomeworkById ? DataService.getHomeworkById(s.homeworkId) : null;
        const maxScore = s.maxScore || h?.totalPoints || 100;
        const pct = h&&h.totalPoints ? Math.round(s.score/h.totalPoints*100) : (s.score||0);
        return `<div class="sub-row ${s.status==='graded'?'graded':'pending'}">
          <div><strong>${h?.title||'-'}</strong><div class="text-xs text-muted">${h?.deadline||''} ${h?.paper?'· 📝 ورقي':''}</div></div>
          <div style="text-align:left;"><strong style="color:${s.status==='graded'?'var(--success)':'var(--warning)'};">${s.status==='graded'?pct+'%':'معلق'}</strong>${s.status==='graded'?`<div class="text-xs text-muted">${s.score}/${maxScore}</div>`:''}</div>
        </div>`;
      }).join('') : '<p class="text-muted">لا واجبات مُسلّمة</p>';
    };

    window.renderPayTab = function(){
      const billing = (typeof Ops?.buildStudentBilling === 'function') ? Ops.buildStudentBilling(student.id) : [];
      return billing.length ? billing.map(x=>{
        const rem = Math.max(0, (x.billing?.total||0) - (x.payment?.paidAmount||0));
        return `<div class="sub-row ${rem>0?'pending':'graded'}">
          <div><strong>${x.group?.name||'-'}</strong><div class="text-xs text-muted">👨‍🏫 ${DataService?.getUserById ? DataService.getUserById(x.group?.teacherId)?.name||'' : ''}</div></div>
          <div style="text-align:left;"><strong>${x.payment?.paidAmount||0}/${x.billing?.total||0}</strong>${rem>0?`<div class="text-xs" style="color:var(--danger)">متبقي ${rem}</div>`:''}</div>
        </div>`;
      }).join('') : '<p class="text-muted">لا مستحقات</p>';
    };

    window.renderFuTab = function(){
      const fus = (typeof Ops?.getFollowUps === 'function') ? Ops.getFollowUps({studentId:student.id}) : [];
      return fus.length ? fus.map(f=>`<div class="sub-row ${f.status==='resolved'?'graded':'pending'}">
        <div><strong>${f.title||f.reason}</strong><div class="text-xs text-muted">${f.auto?'🤖 أوتوماتيك':'✍️ يدوي'} · ${f.startDate||''}</div></div>
        <span class="badge ${f.status==='resolved'?'badge-success':'badge-warning'}">${f.status}</span>
      </div>`).join('') : '<p class="text-muted">لا متابعات</p>';
    };

    // ====== العرض العام للزائر (مع تسجيل دخول) ======
    window.renderPublicView = function(){
      // آخر المستجدات
      const subs = typeof DataService?.getSubmissions === 'function' ? DataService.getSubmissions({studentId:student.id}) : [];
      const attempts = typeof DataService?.getExamAttempts === 'function' ? DataService.getExamAttempts({studentId:student.id}) : [];
      const allAtt = typeof DataService?.getAttendance === 'function' ? DataService.getAttendance() : [];
      const att = allAtt.filter(a=>a.status==='approved'&&a.records.some(r=>r.studentId===student.id));

      const timeline = [];
      subs.slice(-3).reverse().forEach(s=>{
        const h = DataService?.getHomeworkById ? DataService.getHomeworkById(s.homeworkId) : null;
        if(h) timeline.push({icon:'📝',title:`واجب: ${h.title}`,status:s.status==='graded'?'تم التصحيح':'بانتظار التصحيح',cls:s.status==='graded'?'success':'warning',date:s.submittedAt||s.gradedAt});
      });
      attempts.slice(-3).reverse().forEach(a=>{
        const e = DataService?.getExamById ? DataService.getExamById(a.examId) : null;
        if(e) timeline.push({icon:'🎓',title:`امتحان: ${e.title}`,status:a.status==='approved'?'تم الرصد':'بانتظار الرصد',cls:a.status==='approved'?'success':'warning',date:a.endTime||a.startTime});
      });
      att.slice(-3).reverse().forEach(a=>{
        const r = a.records.find(r=>r.studentId===student.id);
        timeline.push({icon:'📋',title:`حضور: ${a.groupName}`,status:r?.status==='present'?'حاضر':'غائب',cls:r?.status==='present'?'success':'danger',date:a.date});
      });

      return `
        <div class="card" style="margin-bottom:16px;">
          <div class="card-header"><h3 class="card-title">📜 آخر المستجدات</h3></div>
          ${timeline.length ? timeline.map(t=>`
            <div class="timeline-item">
              <div class="timeline-dot ${t.cls}"></div>
              <div style="flex:1;">
                <strong>${t.icon} ${t.title}</strong>
                <div class="text-xs text-muted">${t.status} · ${t.date?new Date(t.date).toLocaleDateString('ar-EG'):''}</div>
              </div>
            </div>`).join('') : '<p class="text-muted">لا أنشطة بعد</p>'}
        </div>

        <div class="login-cta">
          <div style="font-size:36px;margin-bottom:8px;">🔐</div>
          <h3 style="margin-bottom:6px;">تفاعل مع الداشبورد الكامل</h3>
          <p class="text-sm text-muted" style="margin-bottom:14px;">حل الواجبات · الامتحانات · المسابقات · الفيديوهات · إيه اللي اتاخد في الحصة</p>
          <button class="btn btn-primary w-full" style="margin-bottom:8px;" onclick="window.openStudentLogin('${student.code}')">🔑 دخول كطالب (باسورد 1234)</button>
          <a href="login.html" class="btn btn-secondary w-full">📥 تسجيل دخول عادي</a>
          <p class="text-xs text-muted" style="margin-top:10px;">لو ولي الأمر، تقدر تدخل برقمك أو كود الابن</p>
        </div>
      `;
    };

    // ====== مودال تسجيل الدخول السريع للطالب ======
    window.openStudentLogin = function(code){
      try{
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header">
              <h3 class="modal-title">🔑 دخول الطالب</h3>
              <button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button>
            </div>
            <div class="modal-body">
              <div class="filter-info" style="margin-bottom:12px;">
                👤 الطالب: <strong>${student.name}</strong> · الكود: <strong style="font-family:var(--font-en);">${student.code}</strong>
              </div>
              <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="qrLoginPass" class="form-input" placeholder="كلمة المرور (الافتراضي: 1234)" value="1234">
              </div>
              <button class="btn btn-primary w-full" onclick="window.doQRLogin()">💾 دخول</button>
              <p class="text-xs text-muted" style="margin-top:10px;text-align:center;">
                💡 كلمة المرور الافتراضية هي <strong style="font-family:var(--font-en);">1234</strong> — تقدر تغيرها من داخل الداشبورد
              </p>
            </div>
          `,'modal-sm');
          setTimeout(()=>document.getElementById('qrLoginPass')?.focus(),100);
        }
      }catch(e){ console.error('openStudentLogin error', e); }
    };

    window.doQRLogin = async function(){
      try{
        const passEl = document.getElementById('qrLoginPass');
        const pass = passEl ? passEl.value : '';
        if(!pass){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('اكتب كلمة المرور','error');
          return;
        }
        if(String(student.password) !== String(pass)){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('كلمة المرور غير صحيحة','error');
          return;
        }
        // حفظ الجلسة
        sessionStorage.setItem('eduflow_user', JSON.stringify(student));
        if(typeof ThemeManager?.closeModal === 'function') ThemeManager.closeModal();
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('🎉 أهلاً '+student.name,'success');
        setTimeout(()=>{
          window.location.href = 'student-dashboard.html';
        }, 500);
      }catch(e){
        console.error('doQRLogin error', e);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ في الدخول','error');
      }
    };

    // ====== الإجراءات السريعة للإدارة ======
    window.quickCheckin = function(sid){
      try{
        // نختار أول مجموعة مشتركة
        const teachers = typeof DataService?.getStudentTeachers === 'function' ? DataService.getStudentTeachers(sid) : [];
        if(teachers.length === 0){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('الطالب غير مشترك في أي مجموعة','error');
          return;
        }
        const today = new Date().toISOString().split('T')[0];
        // فحص لو في حضور مسجل بالفعل النهارده
        const allAtt = typeof DataService?.getAttendance === 'function' ? DataService.getAttendance() : [];
        const todayAtt = allAtt.find(a=>a.date===today && a.records.some(r=>r.studentId===sid));
        if(todayAtt){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('الطالب مسجل حضوره بالفعل اليوم','warning');
          return;
        }

        // اختيار المجموعة
        if(teachers.length === 1){
          doQuickCheckin(teachers[0].group.id, teachers[0].group.name, sid);
        }else{
          if(typeof ThemeManager?.openModal === 'function'){
            ThemeManager.openModal(`
              <div class="modal-header"><h3 class="modal-title">📋 اختر المجموعة</h3><button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button></div>
              <div class="modal-body">
                ${teachers.map(t=>`<div class="sub-row" style="cursor:pointer;" onclick="window.doQuickCheckin('${t.group.id}','${t.group.name}','${sid}')">
                  <div><strong>${t.group.name}</strong><div class="text-xs text-muted">${t.teacher.name} · ${dayAr(t.group.day)} ${T(t.group.time)}</div></div>
                  <span>→</span>
                </div>`).join('')}
              </div>
            `,'modal-md');
          }
        }
      }catch(e){ console.error('quickCheckin error', e); }
    };

    window.doQuickCheckin = async function(gid, gname, sid){
      try{
        if(typeof DataService?.submitAttendance === 'function'){
          await DataService.submitAttendance({
            groupId: gid,
            groupName: gname,
            submittedBy: currentUser?.id || 'qr',
            records: [{studentId: sid, status: 'present'}]
          });
        }
        if(typeof ThemeManager?.closeModal === 'function') ThemeManager.closeModal();
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم تسجيل حضور '+student.name,'success');
        window.renderProfile();
      }catch(e){
        console.error('doQuickCheckin error', e);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ','error');
      }
    };

    window.quickPayment = function(sid){
      try{
        const billing = (typeof Ops?.buildStudentBilling === 'function') ? Ops.buildStudentBilling(sid) : [];
        if(billing.length === 0){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد مستحقات','warning');
          return;
        }
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header"><h3 class="modal-title">💵 تسجيل دفعة لـ ${student.name}</h3><button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button></div>
            <div class="modal-body">
              <div class="form-group"><label>المجموعة</label>
                <select id="qpGroup" class="form-select">
                  ${billing.map(x=>{
                    const rem = Math.max(0, (x.billing?.total||0)-(x.payment?.paidAmount||0));
                    return `<option value="${x.group?.id||''}">${x.group?.name||'-'} (متبقي ${rem})</option>`;
                  }).join('')}
                </select>
              </div>
              <div class="form-group"><label>المبلغ</label><input type="number" id="qpAmt" class="form-input" placeholder="المبلغ"></div>
              <div class="form-group"><label>الطريقة</label>
                <select id="qpMethod" class="form-select">
                  <option value="cash">كاش</option>
                  <option value="vodafone">فودافون كاش</option>
                </select>
              </div>
              <button class="btn btn-success w-full" onclick="window.doQuickPayment('${sid}')">💵 تأكيد الدفع</button>
            </div>
          `,'modal-md');
        }
      }catch(e){ console.error('quickPayment error', e); }
    };

    window.doQuickPayment = async function(sid){
      try{
        const gid = document.getElementById('qpGroup')?.value;
        const amt = parseInt(document.getElementById('qpAmt')?.value) || 0;
        const method = document.getElementById('qpMethod')?.value || 'cash';
        if(!gid || amt <= 0){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('أكمل البيانات','error');
          return;
        }
        const g = DataService?.getGroups ? DataService.getGroups().find(x=>x.id===gid) : null;
        const d = db();
        d.payments = d.payments || [];
        const month = new Date().toISOString().slice(0,7);
        let pay = d.payments.find(p=>p.studentId===sid && p.groupId===gid && p.month===month);
        if(!pay){
          const id = 'pay_'+Date.now();
          pay = {id, studentId:sid, groupId:gid, teacherId:g?.teacherId, month, amount:g?.monthlyFee||amt, paidAmount:0, status:'unpaid', history:[]};
          d.payments.push(pay);
        }
        pay.paidAmount += amt;
        pay.status = pay.paidAmount >= pay.amount ? 'paid' : 'partial';
        pay.history = pay.history || [];
        pay.history.push({date:new Date().toISOString(), amount:amt, method});
        save(d);
        if(typeof ThemeManager?.closeModal === 'function') ThemeManager.closeModal();
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم تسجيل '+amt+' ج.م','success');
        window.renderProfile();
      }catch(e){
        console.error('doQuickPayment error', e);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ','error');
      }
    };

    window.openGradeModal = function(sid){
      try{
        const hws = (typeof DataService?.getHomework === 'function' ? DataService.getHomework() : []).filter(h=>{
          const teachers = typeof DataService?.getStudentTeachers === 'function' ? DataService.getStudentTeachers(sid) : [];
          return teachers.some(t=>t.group?.id===h.groupId);
        });
        if(hws.length === 0){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('لا توجد واجبات متاحة','warning');
          return;
        }
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header"><h3 class="modal-title">📝 إضافة درجة</h3><button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button></div>
            <div class="modal-body">
              <div class="form-group"><label>الواجب</label>
                <select id="grHw" class="form-select" onchange="window.updateGradeMax()">
                  ${hws.map(h=>`<option value="${h.id}" data-total="${h.totalPoints||100}">${h.title}</option>`).join('')}
                </select>
              </div>
              <div class="form-group"><label>الدرجة (<span id="grMax">100</span>)</label><input type="number" id="grVal" class="form-input" min="0"></div>
              <button class="btn btn-primary w-full" onclick="window.saveGradeFromQR('${sid}')">💾 حفظ الدرجة</button>
            </div>
          `,'modal-sm');
          window.updateGradeMax();
        }
      }catch(e){ console.error('openGradeModal error', e); }
    };

    window.updateGradeMax = function(){
      try{
        const sel = document.getElementById('grHw');
        const maxEl = document.getElementById('grMax');
        if(sel && maxEl){
          const opt = sel.options[sel.selectedIndex];
          maxEl.textContent = opt?.dataset.total || '100';
        }
      }catch(e){}
    };

    window.saveGradeFromQR = async function(sid){
      try{
        const hwId = document.getElementById('grHw')?.value;
        const score = parseInt(document.getElementById('grVal')?.value) || 0;
        const hw = DataService?.getHomeworkById ? DataService.getHomeworkById(hwId) : null;
        if(!hw){
          if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('الواجب غير موجود','error');
          return;
        }
        const d = db();
        d.submissions = d.submissions || [];
        let sub = d.submissions.find(s=>s.homeworkId===hwId && s.studentId===sid);
        if(sub){
          sub.score = score;
          sub.maxScore = hw.totalPoints || 100;
          sub.status = 'graded';
          sub.gradedBy = currentUser?.id || 'qr';
          sub.offline = true;
        }else{
          d.submissions.push({
            id:'sub_'+Date.now()+'_'+Math.random().toString(36).slice(2,5),
            homeworkId:hwId, studentId:sid,
            score, maxScore:hw.totalPoints||100,
            status:'graded', offline:true,
            gradedBy:currentUser?.id||'qr',
            answers:[], submittedAt:new Date().toISOString()
          });
        }
        save(d);
        if(typeof ThemeManager?.closeModal === 'function') ThemeManager.closeModal();
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم حفظ الدرجة','success');
        window.renderProfile();
      }catch(e){
        console.error('saveGradeFromQR error', e);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ','error');
      }
    };

    window.openFollowupModal = function(sid){
      try{
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header"><h3 class="modal-title">📌 متابعة لـ ${student.name}</h3><button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button></div>
            <div class="modal-body">
              <div class="form-group"><label>السبب</label>
                <select id="fuReason" class="form-select">
                  <option value="absence">غياب</option>
                  <option value="homework">واجب</option>
                  <option value="payment">دفعة</option>
                  <option value="behavior">سلوك</option>
                </select>
              </div>
              <div class="form-group"><label>ملاحظات (اختياري)</label>
                <textarea id="fuNotes" class="form-textarea" rows="2"></textarea>
              </div>
              <button class="btn btn-primary w-full" onclick="window.saveFollowup('${sid}')">💾 إضافة المتابعة</button>
            </div>
          `,'modal-sm');
        }
      }catch(e){ console.error('openFollowupModal error', e); }
    };

    window.saveFollowup = async function(sid){
      try{
        const reason = document.getElementById('fuReason')?.value || 'absence';
        const notes = document.getElementById('fuNotes')?.value || '';
        const titles = {absence:'غياب',homework:'واجب متأخر',payment:'دفعة متأخرة',behavior:'مشكلة سلوك'};
        if(typeof Ops?.addFollowUp === 'function'){
          await Ops.addFollowUp({
            studentId: sid,
            reason,
            title: titles[reason] || 'متابعة',
            notes,
            ownerAssistant: currentUser?.id || 'qr',
            status:'open'
          });
        }
        if(typeof ThemeManager?.closeModal === 'function') ThemeManager.closeModal();
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('✅ تم إضافة المتابعة','success');
        window.renderProfile();
      }catch(e){
        console.error('saveFollowup error', e);
        if(typeof ThemeManager?.toast === 'function') ThemeManager.toast('خطأ','error');
      }
    };

    window.showStudentInDashboard = function(sid){
      // لو عنده صفحة المساعد/الأدمن، يفتح البروفايل الكامل هناك
      if(currentUser?.role === 'super_admin'){
        window.location.href = 'admin-dashboard.html?student=' + sid;
      }else if(currentUser?.role === 'assistant'){
        window.location.href = 'assistant-dashboard.html?student=' + sid;
      }else{
        // عرض البروفايل هنا مودال
        if(typeof ThemeManager?.openModal === 'function'){
          ThemeManager.openModal(`
            <div class="modal-header">
              <h3 class="modal-title">👤 ${student.name}</h3>
              <button class="btn btn-ghost btn-icon" onclick="ThemeManager.closeModal()">✕</button>
            </div>
            <div class="modal-body">
              ${window.renderAdminTabs()}
            </div>
          `,'modal-lg');
        }
      }
    };

    // دعم فتح البروفايل مباشرة لو جينا من داشبورد أدمن/مساعد مع ?student=ID
    (function checkDirectStudent(){
      try{
        const params = new URLSearchParams(location.search);
        const sid = params.get('student');
        if(sid && !student && currentUser && (currentUser.role==='super_admin'||currentUser.role==='assistant')){
          const s = DataService?.getUserById ? DataService.getUserById(sid) : null;
          if(s && s.role==='student'){
            student = s;
            viewMode = 'admin';
            window.renderProfile();
          }
        }
      }catch(e){}
    })();
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
