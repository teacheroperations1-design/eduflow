<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ سبورة الألعاب — EduFlow</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
body{background:var(--bg,#0b0e1a);margin:0;min-height:100vh;}
.board-wrap{padding:16px;max-width:1200px;margin:0 auto;}
.board-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.board-head h1{margin:0;font-size:20px;font-weight:800;}
.board-head .sub{font-size:12px;color:var(--text-muted);}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
.board-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.board-card:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 8px 24px rgba(99,102,241,.2);}
.board-card .icon{font-size:54px;margin-bottom:10px;display:inline-block;}
.board-card .title{font-size:16px;font-weight:800;margin-bottom:6px;}
.board-card .meta{font-size:11px;color:var(--text-muted);}
.board-card .badge{position:absolute;top:8px;right:8px;font-size:10px;}
.board-card .tpl-anim{display:inline-block;}
.pv-heart{animation:fcPulse 1s infinite;}
.pv-bal{animation:fcFloat 2s infinite;}
.pv-wheel{animation:fcSpin 4s linear infinite;}
.pv-card{animation:fcFlipD 2.4s infinite;}
.pv-timer{display:inline-block;width:32px;height:10px;border-radius:99px;background:#22c55e;animation:fcRun 2s linear infinite;}
@keyframes fcFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes fcPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes fcSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes fcFlipD{0%,40%{transform:rotateY(0)}60%,100%{transform:rotateY(180deg)}}
@keyframes fcRun{0%{width:100%}100%{width:0}}
.empty{text-align:center;padding:60px 20px;color:var(--text-muted);}
.empty .big{font-size:64px;margin-bottom:12px;}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-row input,.filter-row select{flex:1;min-width:160px;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:inherit;font-family:inherit;font-size:14px;}
.qr-box{position:fixed;bottom:16px;left:16px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;font-size:11px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:180px;}
.qr-box .url{font-family:var(--font-en);word-break:break-all;margin-top:4px;font-weight:700;color:var(--primary);}
</style>
</head>
<body data-theme="dark">
<div class="board-wrap">
<div class="board-head">
<div>
<h1>🖥️ سبورة الألعاب</h1>
<div class="sub">اختر لعبة وافتحها على السبورة الذكية — بدون نقاط ولا تسجيل دخول</div>
</div>
<div style="display:flex;gap:8px;">
<button class="btn btn-ghost btn-sm" onclick="window.location.reload()">🔄</button>
<button class="btn btn-ghost btn-sm" onclick="document.body.setAttribute('data-theme',document.body.getAttribute('data-theme')==='dark'?'light':'dark')">🌓</button>
</div>
</div>
<div class="filter-row">
<input type="text" id="brdSearch" placeholder="🔍 ابحث في الألعاب..." oninput="renderBoard()">
<select id="brdFilter" onchange="renderBoard()">
<option value="">كل الألعاب</option>
<option value="published">المنشورة فقط</option>
<option value="draft">المسودات</option>
</select>
<select id="brdGrade" onchange="renderBoard()">
<option value="">كل الصفوف</option>
</select>
</div>
<div id="brdGrid" class="board-grid"></div>
</div>
<div id="brdQR" class="qr-box" style="display:none;"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/theme-manager.js"></script>
<script>window.__FC_BOARD=1;</script>
<script src="js/fun-center.js"></script>
<script>
(function(){
var TPL={hearts:{i:'❤️',pv:'pv-heart'},balloons:{i:'🎈',pv:'pv-bal'},race:{i:'⏱️',pv:'pv-timer'},flip:{i:'🃏',pv:'pv-card'},wheel:{i:'🎡',pv:'pv-wheel'}};
function go(){
if(!window.DataService||!DataService.init){setTimeout(go,300);return;}
DataService.init().then(renderBoard).catch(renderBoard);
}
function renderBoard(){
try{
var d=(DataService._getData)?DataService._getData():{};
var list=(d.gameBank||[]);
var grades={};list.forEach(function(g){if(g.grade)grades[g.grade]=1;});
var gSel=document.getElementById('brdGrade');
if(gSel&&!gSel.__filled){
gSel.__filled=1;
Object.keys(grades).sort().forEach(function(gr){var o=document.createElement('option');o.value=gr;o.textContent=gr;gSel.appendChild(o);});
}
var q=(document.getElementById('brdSearch')||{}).value||'';
var f=(document.getElementById('brdFilter')||{}).value||'';
var gr=(document.getElementById('brdGrade')||{}).value||'';
var filtered=list.filter(function(g){
if(f==='published'&&g.status!=='published')return false;
if(f==='draft'&&g.status!=='draft')return false;
if(gr&&g.grade!==gr)return false;
if(q&&(g.title||'').toLowerCase().indexOf(q.toLowerCase())<0)return false;
return true;
});
var grid=document.getElementById('brdGrid');
if(!grid)return;
if(!filtered.length){
grid.innerHTML='<div class="empty" style="grid-column:1/-1;"><div class="big">🏭</div><strong>مفيش ألعاب مطابقة</strong><div style="margin-top:6px;">غيّر الفلاتر أو أنشئ لعبة جديدة من لوحة المساعد</div></div>';
return;
}
grid.innerHTML=filtered.map(function(g){
var t=TPL[g.template]||{i:'🎮',pv:''};
var meta=(g.questions||[]).length+' سؤال · ❤️ '+g.lives+(g.timeLimit?' · ⏱️ '+g.timeLimit+'ث':' · مفتوح')+(g.grade?' · '+g.grade:'');
return '<div class="board-card" onclick="window.fcPlay(\''+g.id+'\',{board:true,score:false})">'+
(g.status==='draft'?'<span class="badge badge-muted">🔒 مسودة</span>':'<span class="badge badge-success">📢 منشور</span>')+
'<div class="icon tpl-anim '+t.pv+'">'+t.i+'</div>'+
'<div class="title">'+g.title+'</div>'+
'<div class="meta">'+meta+'</div>'+
'</div>';
}).join('');
}catch(e){console.error(e);}
}
window.renderBoard=renderBoard;
window.addEventListener('load',function(){setTimeout(go,500);});
/* QR box للينك الحالي */
try{
var qr=document.getElementById('brdQR');
if(qr){
qr.style.display='block';
qr.innerHTML='<div style="font-size:11px;font-weight:800;margin-bottom:4px;">📱 لينك السبورة</div><div class="url">'+window.location.href+'</div>';
}
}catch(e){}
})();
</script>
var m=window.location.search.match(/[?&]game=([^&]+)/);
if(m){setTimeout(function(){var g=(db().gameBank||[]).find(function(x){return x.id===m[1];});if(g)window.fcPlay(g.id,{board:true,score:false});},1500);}
</body>

</html>
