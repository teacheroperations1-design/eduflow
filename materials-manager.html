<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المواد والطلبات - EduFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header style="background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem;">
    <div class="container flex justify-between items-center">
      <div>
        <h2 style="font-size: 1.25rem; font-weight: 700; color: var(--primary);">EduFlow</h2>
        <span class="text-sm" style="color: var(--text-secondary);">إدارة المواد والطلبات</span>
      </div>
      <a href="assistant-dashboard.html" class="btn btn-outline text-sm">العودة للرئيسية</a>
    </div>
  </header>

  <div class="container" style="margin-top: 1.5rem;">
    <!-- Tabs -->
    <div class="flex gap-2" style="margin-bottom: 1.5rem; overflow-x: auto;">
      <button class="btn btn-primary tab-btn" data-tab="materials">📚 المواد</button>
      <button class="btn btn-outline tab-btn" data-tab="orders">📦 الطلبات</button>
    </div>

    <!-- Tab: Materials -->
    <div id="tab-materials" class="tab-content">
      <div class="card">
        <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
          <h3>قائمة المواد والملازم</h3>
          <button onclick="openAddMaterialModal()" class="btn btn-primary">+ إضافة مادة</button>
        </div>
        <div id="materialsList"></div>
      </div>
    </div>

    <!-- Tab: Orders -->
    <div id="tab-orders" class="tab-content hidden">
      <div class="card">
        <h3 style="margin-bottom: 1rem;">طلبات الطلاب</h3>
        <div id="ordersList"></div>
      </div>
    </div>
  </div>

  <!-- Modal: Add Material -->
  <div id="addMaterialModal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem;">
    <div class="card" style="width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
      <div class="flex justify-between items-center" style="margin-bottom: 1rem;">
        <h3>إضافة مادة جديدة</h3>
        <button onclick="closeMaterialModal()" class="btn btn-outline text-sm">✕</button>
      </div>
      <form id="materialForm">
        <div class="form-group">
          <label class="form-label">اسم المادة</label>
          <input type="text" id="matName" class="form-input" required placeholder="مثال: Grammar Revision Book">
        </div>
        <div class="form-group">
          <label class="form-label">الوصف</label>
          <textarea id="matDescription" class="form-input" rows="2"></textarea>
        </div>
        <div class="flex gap-2">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">المادة الدراسية</label>
            <input type="text" id="matSubject" class="form-input" required value="English">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">الصف الدراسي</label>
            <input type="text" id="matGrade" class="form-input" required value="Secondary 1">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">السعر (ج.م)</label>
          <input type="number" id="matPrice" class="form-input" required min="0">
        </div>
        <div class="form-group">
          <label class="form-label">الحالة</label>
          <select id="matAvailability" class="form-select">
            <option value="available">متوفر</option>
            <option value="out_of_stock">غير متوفر</option>
            <option value="coming_soon">قريباً</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">رابط الصورة (اختياري)</label>
          <input type="url" id="matImageUrl" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
          <label class="form-label">رابط الملف (اختياري)</label>
          <input type="url" id="matFileUrl" class="form-input" placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-primary btn-block">حفظ المادة</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/auth-service.js"></script>
  <script>
    if (!AuthService.requireRole(['super_admin', 'assistant'])) { /* redirected */ }

    const currentUser = AuthService.getCurrentUser();

    // --- Tabs ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('btn-primary', btn.dataset.tab === tabId);
        btn.classList.toggle('btn-outline', btn.dataset.tab !== tabId);
      });
      if (tabId === 'materials') loadMaterials();
      if (tabId === 'orders') loadOrders();
    }
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });

    // --- Materials ---
    function loadMaterials() {
      const materials = DataService.getMaterials();
      const container = document.getElementById('materialsList');

      if (materials.length === 0) {
        container.innerHTML = '<p class="text-center" style="padding: 2rem; color: var(--text-secondary);">لا توجد مواد مضافة.</p>';
        return;
      }

      container.innerHTML = materials.map(mat => {
        const orders = DataService.getOrders({ materialId: mat.id });
        const availabilityBadge = {
          'available': '<span class="badge badge-success">متوفر</span>',
          'out_of_stock': '<span class="badge badge-danger">غير متوفر</span>',
          'coming_soon': '<span class="badge badge-warning">قريباً</span>'
        }[mat.availability];

        return `
          <div class="card" style="margin-bottom: 1rem;">
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <div>
                <h4 style="font-size: 1.05rem;">${mat.name}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">${mat.subject} | ${mat.grade}</p>
              </div>
              <div style="text-align: left;">
                ${availabilityBadge}
                <div style="font-size: 1.25rem; font-weight: 700; color: var(--primary); margin-top: 0.25rem;">${mat.price} ج.م</div>
              </div>
            </div>
            <p class="text-sm" style="margin: 0.5rem 0;">${mat.description || 'لا يوجد وصف'}</p>
            <div class="flex gap-2 text-sm" style="margin-top: 0.5rem;">
              <span>📦 ${orders.length} طلب</span>
              <button onclick="deleteMaterial('${mat.id}')" class="btn btn-danger text-sm" style="padding: 0.25rem 0.5rem; margin-right: auto;">حذف</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openAddMaterialModal() {
      document.getElementById('addMaterialModal').classList.remove('hidden');
    }

    function closeMaterialModal() {
      document.getElementById('addMaterialModal').classList.add('hidden');
    }

    document.getElementById('materialForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const materialData = {
        name: document.getElementById('matName').value,
        description: document.getElementById('matDescription').value,
        subject: document.getElementById('matSubject').value,
        grade: document.getElementById('matGrade').value,
        price: parseInt(document.getElementById('matPrice').value),
        availability: document.getElementById('matAvailability').value,
        imageUrl: document.getElementById('matImageUrl').value,
        fileUrl: document.getElementById('matFileUrl').value,
        teacherId: currentUser.id,
        groupId: "",
        createdBy: currentUser.id
      };

      const result = DataService.addMaterial(materialData);
      if (result.success) {
        alert('تم إضافة المادة بنجاح.');
        closeMaterialModal();
        e.target.reset();
        loadMaterials();
      }
    });

    function deleteMaterial(id) {
      if (confirm('هل أنت متأكد من حذف هذه المادة وجميع طلباتها؟')) {
        DataService.deleteMaterial(id);
        loadMaterials();
      }
    }

    // --- Orders ---
    function loadOrders() {
      const orders = DataService.getOrders();
      const container = document.getElementById('ordersList');
      const data = DataService._getData();

      if (orders.length === 0) {
        container.innerHTML = '<p class="text-center" style="padding: 2rem; color: var(--text-secondary);">لا توجد طلبات.</p>';
        return;
      }

      container.innerHTML = orders.map(ord => {
        const material = DataService.getMaterialById(ord.materialId);
        const student = data.users.find(u => u.id === ord.studentId);
        const statusBadge = {
          'pending': '<span class="badge badge-warning">قيد الانتظار</span>',
          'preparing': '<span class="badge" style="background: #E0E7FF; color: #3730A3;">جاري التجهيز</span>',
          'ready': '<span class="badge badge-success">جاهز للاستلام</span>',
          'delivered': '<span class="badge badge-success">تم التسليم</span>',
          'cancelled': '<span class="badge badge-danger">ملغي</span>'
        }[ord.status];

        return `
          <div class="card" style="margin-bottom: 1rem; border-right: 4px solid var(--primary);">
            <div class="flex justify-between items-start" style="margin-bottom: 0.5rem;">
              <div>
                <h4>${student?.name || 'طالب'} - ${material?.name || 'مادة'}</h4>
                <p class="text-sm" style="color: var(--text-secondary);">${student?.studentId} | الكمية: ${ord.quantity}</p>
              </div>
              ${statusBadge}
            </div>
            <div class="flex gap-4 text-sm" style="margin: 0.5rem 0;">
              <span>السعر: <strong>${ord.totalPrice} ج.م</strong></span>
              <span>التاريخ: ${new Date(ord.createdAt).toLocaleDateString('ar-EG')}</span>
            </div>
            <div class="flex gap-2" style="margin-top: 0.5rem;">
              <select onchange="updateOrderStatus('${ord.id}', this.value)" class="form-select" style="flex: 1;">
                <option value="pending" ${ord.status === 'pending' ? 'selected' : ''}>قيد الانتظار</option>
                <option value="preparing" ${ord.status === 'preparing' ? 'selected' : ''}>جاري التجهيز</option>
                <option value="ready" ${ord.status === 'ready' ? 'selected' : ''}>جاهز</option>
                <option value="delivered" ${ord.status === 'delivered' ? 'selected' : ''}>تم التسليم</option>
                <option value="cancelled" ${ord.status === 'cancelled' ? 'selected' : ''}>ملغي</option>
              </select>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateOrderStatus(orderId, status) {
      const result = DataService.updateOrderStatus(orderId, status);
      if (result.success) {
        loadOrders();
      }
    }

    // Init
    loadMaterials();
  </script>
</body>
</html>
