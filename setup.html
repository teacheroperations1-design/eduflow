<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعداد المنصة - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .setup-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      z-index:1;
      padding:16px;
    }

    .setup-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:32px;
      max-width:440px;
      width:100%;
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      box-shadow:var(--shadow-lg);
    }

    .setup-loading{
      text-align:center;
      padding:32px 12px;
    }

    .spin{
      display:inline-block;
      width:26px;
      height:26px;
      border:3px solid var(--border);
      border-top-color:var(--primary);
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin-bottom:12px;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="setup-wrap">
    <div class="setup-card">

      <!-- Loading -->
      <div id="loadingBox" class="setup-loading">
        <span class="spin"></span>
        <p class="text-sm text-muted">جاري تجهيز المنصة...</p>
      </div>

      <!-- Setup Form -->
      <div id="setupBox" style="display:none;">
        <div style="text-align:center;margin-bottom:20px;">
          <div style="font-size:40px;">🚀</div>
          <h2 style="margin:8px 0;">إعداد المنصة لأول مرة</h2>
          <p class="text-sm text-muted">
            أنشئ حساب مدير النظام الأول
          </p>
        </div>

        <form onsubmit="return doSetup(event)">
          <div class="form-group">
            <label class="form-label">اسم الأدمن</label>
            <input type="text" id="setName" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" id="setEmail" class="form-input" required>
          </div>

          <div class="form-group">
            <label class="form-label">كلمة المرور</label>
            <input type="password" id="setPass" class="form-input" minlength="8" required>
          </div>

          <div class="form-group">
            <label class="form-label">تأكيد كلمة المرور</label>
            <input type="password" id="setPass2" class="form-input" minlength="8" required>
          </div>

          <button class="btn btn-primary w-full btn-lg" id="setupBtn">
            ✅ إنشاء الحساب والدخول
          </button>
        </form>
      </div>

    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <!-- App Scripts -->
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/theme-manager.js"></script>

  <script>
    async function bootSetupPage(){
      try {
        // مهم جداً بعد تحويل Firestore
        await DataService.init();

        // لو فيه أدمن بالفعل، روح للوجين
        if (DataService.hasAdmin()) {
          location.href = 'login.html';
          return;
        }

        document.getElementById('loadingBox').style.display = 'none';
        document.getElementById('setupBox').style.display = 'block';

      } catch (err) {
        console.error('Setup boot error:', err);
        document.getElementById('loadingBox').innerHTML =
          '<p style="color:var(--danger)">حصل خطأ أثناء تجهيز المنصة: ' + err.message + '</p>';
      }
    }

    async function doSetup(e){
      e.preventDefault();

      const name = document.getElementById('setName').value.trim();
      const email = document.getElementById('setEmail').value.trim();
      const pass = document.getElementById('setPass').value;
      const pass2 = document.getElementById('setPass2').value;
      const btn = document.getElementById('setupBtn');

      if (!name || !email || !pass) {
        ThemeManager.toast('اكتب كل البيانات المطلوبة', 'error');
        return false;
      }

      if (pass.length < 8) {
        ThemeManager.toast('كلمة المرور لازم تكون 8 خانات على الأقل', 'error');
        return false;
      }

      if (pass !== pass2) {
        ThemeManager.toast('كلمتا المرور غير متطابقتين', 'error');
        return false;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'جاري إنشاء الحساب...';

        // ✅ مهم: await
        const r = await DataService.createFirstAdmin(name, email, pass);

        if (r && r.success) {
          const admin = DataService.authenticate(email, pass);

          if (!admin) {
            ThemeManager.toast('تم إنشاء الأدمن لكن حصلت مشكلة في الدخول، جرّب تسجيل الدخول', 'warning');
            setTimeout(() => location.href = 'login.html', 900);
            return false;
          }

          sessionStorage.setItem('eduflow_user', JSON.stringify(admin));

          if (DataService.logActivity) {
            await DataService.logActivity(admin.id, admin.name, 'إنشاء أول أدمن', 'setup');
          }

          ThemeManager.toast('تم إنشاء حساب الأدمن بنجاح ✓', 'success');

          setTimeout(() => {
            location.href = 'admin-dashboard.html';
          }, 700);

        } else {
          ThemeManager.toast((r && r.message) ? r.message : 'لم يتم إنشاء الحساب', 'error');
          btn.disabled = false;
          btn.textContent = '✅ إنشاء الحساب والدخول';
        }

      } catch (err) {
        console.error('Setup error:', err);
        ThemeManager.toast(err.message || 'حصل خطأ أثناء إنشاء الحساب', 'error');
        btn.disabled = false;
        btn.textContent = '✅ إنشاء الحساب والدخول';
      }

      return false;
    }

    bootSetupPage();
  </script>
</body>
</html>
