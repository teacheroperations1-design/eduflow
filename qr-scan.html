<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسح باركود - EduFlow</title>
  <link rel="stylesheet" href="css/eduflow-theme.css">
  <style>
    .scan-wrap{max-width:520px;margin:30px auto;padding:16px;position:relative;z-index:1}
    .cam-box{position:relative;border-radius:var(--radius-xl);overflow:hidden;border:2px solid var(--primary);background:#000;aspect-ratio:1/1}
    .cam-box video{width:100%;height:100%;object-fit:cover}
    .scan-line{position:absolute;left:8%;right:8%;height:3px;background:var(--primary);box-shadow:0 0 12px var(--primary);animation:scan 2s infinite;border-radius:2px}
    @keyframes scan{0%,100%{top:12%}50%{top:86%}}
    .cam-corners::before,.cam-corners::after{content:'';position:absolute;width:34px;height:34px;border:4px solid var(--primary)}
    .cam-corners::before{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
    .cam-corners::after{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
  </style>
</head>
<body data-theme="dark">
  <div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
  <div class="scan-wrap">
    <div style="text-align:center;margin-bottom:16px;">
      <div class="sidebar-logo" data-logo style="margin:0 auto;width:56px;height:56px;"></div>
      <h2 style="margin-top:8px;">📱 مسح باركود</h2>
      <p class="text-sm text-muted">باركود طالب → بروفايل كامل · باركود حضور → تسجيل حضور</p>
    </div>
    <div class="cam-box"><video id="preview" muted playsinline></video><div class="scan-line"></div><div class="cam-corners"></div></div>
    <div id="scanStatus" class="filter-info" style="margin-top:12px;text-align:center;">🎥 تشغيل الكاميرا...</div>
    <div class="card" style="margin-top:16px;">
      <div class="form-group"><label>أو اكتب الكود يدوياً</label><input type="text" id="manualCode" class="form-input" placeholder="EDU-1234 أو كود الحضور"></div>
      <button class="btn btn-primary w-full" onclick="window.handleScan(document.getElementById('manualCode').value)">➡️ متابعة</button>
    </div>
    <div id="scanResult" style="margin-top:14px;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-service.js"></script>
  <script src="js/data-service.js"></script>
  <script src="js/operations-service.js"></script>
  <script src="js/ui-helpers.js"></script>
  <script src="js/drive-service.js"></script>
  <script src="js/theme-manager.js"></script>
  <script src="js/auth-service.js"></script>

  <script>
    let currentUser=null, stream=null, scanning=true, lastScan=0;
    const video=document.getElementById('preview');
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});

    (async function boot(){
      try{
        if(typeof DataService?.init==='function') await DataService.init();
        currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
        window.startCamera();
      }catch(e){ console.error(e); }
    })();

    window.startCamera=async function(){
      try{
        stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
        video.srcObject=stream;
        await video.play();
        document.getElementById('scanStatus').innerHTML='✅ الكاميرا شغالة — وجّه الباركود داخل الإطار';
        requestAnimationFrame(window.tick);
      }catch(e){
        document.getElementById('scanStatus').innerHTML='⚠️ الكاميرا مش متاحة — استخدم الإدخال اليدوي بالأسفل';
      }
    };

    window.tick=function(){
      try{
        if(scanning && video.readyState===video.HAVE_ENOUGH_DATA && window.jsQR){
          canvas.width=video.videoWidth; canvas.height=video.videoHeight;
          ctx.drawImage(video,0,0);
          const img=ctx.getImageData(0,0,canvas.width,canvas.height);
          const code=jsQR(img.data,img.width,img.height);
          if(code && code.data && (Date.now()-lastScan>2500)){
            lastScan=Date.now();
            if(navigator.vibrate) navigator.vibrate(120);
            window.handleScan(code.data);
          }
        }
      }catch(e){}
      requestAnimationFrame(window.tick);
    };

    // 🧠 التوجيه الذكي حسب نوع الباركود ونوع المستخدم
    window.handleScan=function(raw){
      try{
        raw=String(raw||'').trim();
        if(!raw) return;
        scanning=false;

        // 1) باركود حضور حصة
        if(raw.includes('EDUFLOW-ATT:')){
          const code=raw.split('EDUFLOW-ATT:')[1]||'';
          window.attendanceFlow(code);
          return;
        }
        // 2) استخراج كود الطالب
        let m=raw.match(/code=([A-Za-z]+-?\d+)/i)||raw.match(/(EDU-\d+)/i);
        const code=m?m[1].toUpperCase():raw.toUpperCase();

        const role=currentUser?.role;
        let target;
        if(role==='super_admin'||role==='assistant'||role==='teacher'){
          target='student-qr.html?code='+code; // بروفايل إدارة كامل
        }else if(role==='student'){
          target=(currentUser.code&&currentUser.code.toUpperCase()===code)?'student-dashboard.html':'student-qr.html?code='+code;
        }else if(role==='parent'){
          target='student-qr.html?code='+code; // بيوجّهه تلقائياً للداشبورد
        }else{
          target='student-qr.html?code='+code; // زائر: عرض عام + دخول
        }
        document.getElementById('scanResult').innerHTML=`<div class="card" style="text-align:center;"><div style="font-size:36px;">✅</div><strong>تم المسح: <span style="font-family:var(--font-en);">${code}</span></strong><p class="text-sm text-muted">ثانية واحدة وبنحوّلك...</p></div>`;
        setTimeout(()=>{ window.location.href=target; },900);
      }catch(e){
        console.error(e);
        scanning=true;
      }
    };

    // ✋ تسجيل حضور طالب بكود الحصة
    window.attendanceFlow=async function(code){
      try{
        const resEl=document.getElementById('scanResult');
        if(!currentUser || currentUser.role!=='student'){
          if(resEl) resEl.innerHTML='<div class="card" style="text-align:center;border-color:var(--warning);">⚠️ ده باركود <strong>حضور حصة</strong> — لازم تكون مسجل دخول كطالب الأول<br><a class="btn btn-primary btn-sm" style="margin-top:8px;" href="login.html">تسجيل دخول</a></div>';
          scanning=true; return;
        }
        const r = await DataService.checkInByCode(currentUser.id, code);
        if(resEl){
          resEl.innerHTML = r.success
            ? `<div class="card" style="text-align:center;border-color:var(--success);"><div style="font-size:40px;">✅</div><strong>تم تسجيل حضورك!</strong><div class="text-sm text-muted">مجموعة: ${r.groupName||''}</div></div>`
            : `<div class="card" style="text-align:center;border-color:var(--danger);">❌ ${r.message||'فشل التسجيل'}</div>`;
        }
        if(typeof ThemeManager?.toast==='function') ThemeManager.toast(r.success?'✅ تم الحضور':'❌ '+r.message, r.success?'success':'error');
        scanning=true;
      }catch(e){ scanning=true; console.error(e); }
    };

    window.addEventListener('beforeunload',()=>{ try{stream?.getTracks().forEach(t=>t.stop());}catch(e){} });
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
