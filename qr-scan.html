<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📷 مسح الباركود - EduFlow</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
body { background: #0a0a0f; }
.scan-container {
  position: relative; width: 100%; max-width: 500px; margin: 20px auto;
  border-radius: 16px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
#videoElement { width: 100%; display: block; background: #000; }
.scan-overlay { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: center; }
.scan-frame {
  width: 70%; height: 70%; border: 3px solid #6366f1; border-radius: 20px;
  position: relative; box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
}
.scan-frame::before, .scan-frame::after {
  content: ''; position: absolute; width: 30px; height: 30px; border: 4px solid #6366f1;
}
.scan-frame::before { top: -4px; left: -4px; border-right: none; border-bottom: none; border-top-left-radius: 20px; }
.scan-frame::after { top: -4px; right: -4px; border-left: none; border-bottom: none; border-top-right-radius: 20px; }
.scan-line {
  position: absolute; width: 100%; height: 3px;
  background: linear-gradient(90deg, transparent, #6366f1, transparent);
  animation: scanLine 2s infinite linear; top: 0;
}
@keyframes scanLine {
  0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; }
}
.scan-status {
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px; border-radius: 9999px;
  font-weight: 700; font-size: 13px; backdrop-filter: blur(10px);
  border: 1px solid rgba(99,102,241,0.5);
}
.manual-entry { max-width: 500px; margin: 20px auto; padding: 20px; }
.scanning-animation {
  display: inline-block; width: 16px; height: 16px; border: 2px solid #6366f1;
  border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;
  margin-inline-end: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body data-theme="dark">
<div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>

<div style="max-width:540px;margin:0 auto;padding:16px;">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div>
      <h1 style="font-size:20px;font-weight:800;margin:0;">📷 مسح الباركود</h1>
      <p style="font-size:12px;color:var(--text-muted);margin:4px 0 0;">وجّه الكاميرا نحو باركود الطالب</p>
    </div>
    <button class="btn btn-ghost btn-icon" onclick="window.closeScanner()" style="width:40px;height:40px;">✕</button>
  </header>

  <div class="scan-container">
    <video id="videoElement" autoplay muted playsinline></video>
    <div class="scan-overlay">
      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>
    </div>
    <div class="scan-status" id="scanStatus">🔍 جاري البحث عن باركود...</div>
  </div>

  <div class="manual-entry">
    <div style="text-align:center;margin-bottom:14px;">
      <span style="color:var(--text-muted);font-size:12px;">أو أدخل الكود يدوياً</span>
    </div>
    <div style="display:flex;gap:8px;">
      <input type="text" id="manualCode" class="form-input" placeholder="أدخل كود الطالب (مثال: EDU-1234 أو 1234)..." 
             style="flex:1;font-family:var(--font-en);font-weight:700;letter-spacing:2px;text-align:center;">
      <button class="btn btn-primary" onclick="window.handleBarcodeScan(document.getElementById('manualCode').value)">
        🔍 بحث
      </button>
    </div>
    <div class="filter-info" style="margin-top:10px;">
      💡 يمكنك كتابة الكود مع أو بدون <strong>EDU-</strong> — النظام هيفهمها تلقائياً
    </div>
  </div>

  <div style="text-align:center;margin-top:20px;">
    <button class="btn btn-ghost" onclick="window.closeScanner()">← العودة</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/drive-service.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/auth-service.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>
window.safeToast = function(msg, type='info') {
  try { if (typeof ThemeManager?.toast === 'function') ThemeManager.toast(msg, type); }
  catch(e) { console.log('[Toast]', type, msg); }
};

let currentUser = null;
let scanStream = null;
let scanTimer = null;
let lastScannedCode = null;
let isProcessing = false;

(async function boot() {
  try {
    if (typeof DataService?.init === 'function') await DataService.init();
    currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
    startCamera();
  } catch (e) {
    console.error('Boot error:', e);
    document.getElementById('scanStatus').textContent = '⚠️ استخدم الإدخال اليدوي';
  }
})();

async function startCamera() {
  try {
    if (!window.jsQR) {
      document.getElementById('scanStatus').textContent = '⚠️ مكتبة المسح غير محملة — استخدم الإدخال اليدوي';
      return;
    }
    const video = document.getElementById('videoElement');
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }, audio: false
    });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const tick = () => {
      if (!scanStream) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = window.jsQR(img.data, img.width, img.height);
        if (code && code.data && code.data !== lastScannedCode && !isProcessing) {
          lastScannedCode = code.data;
          if (navigator.vibrate) navigator.vibrate(150);
          window.handleBarcodeScan(code.data);
          setTimeout(() => { lastScannedCode = null; }, 3000);
        }
      }
      scanTimer = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) {
    console.error('Camera error:', e);
    document.getElementById('scanStatus').textContent = '❌ لا يمكن الوصول للكاميرا';
  }
}

window.closeScanner = function() {
  stopCamera();
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.location.href = 'login.html';
  }
};

function stopCamera() {
  if (scanTimer) cancelAnimationFrame(scanTimer);
  if (scanStream) {
    scanStream.getTracks().forEach(t => t.stop());
    scanStream = null;
  }
}

// 🧠 Parser ذكي للباركود - يفهم كل الصيغ
window.parseBarcode = function(rawCode) {
  if (!rawCode) return null;
  const code = String(rawCode).trim();
  
  // الصيغ المختلفة:
  // 1. EDU-1234 أو EDU:1234
  // 2. EDUFLOW-ATT:QR-1234 (QR code للحضور)
  // 3. https://site.com/?code=EDU-1234 (URL)
  // 4. 1234 (أرقام فقط)
  // 5. {"studentId":"xxx"} (JSON)
  
  let extracted = null;
  
  // محاولة 1: JSON
  try {
    const parsed = JSON.parse(code);
    if (parsed.studentId || parsed.id || parsed.code) {
      extracted = parsed.studentId || parsed.id || parsed.code;
    }
  } catch(e) {}
  
  // محاولة 2: URL parameter
  if (!extracted) {
    const urlMatch = code.match(/[?&]code=([A-Za-z0-9\-_]+)/i);
    if (urlMatch) extracted = urlMatch[1];
  }
  
  // محاولة 3: EDUFLOW-ATT:XXX (QR للحضور)
  if (!extracted) {
    const attMatch = code.match(/EDUFLOW-ATT:(.+)/i);
    if (attMatch) {
      // ده QR حضور، مش باركود طالب
      return { type: 'attendance', value: attMatch[1] };
    }
  }
  
  // محاولة 4: EDU-XXX أو EDU:XXX
  if (!extracted) {
    const eduMatch = code.match(/EDU[-:]([A-Za-z0-9\-_]+)/i);
    if (eduMatch) extracted = eduMatch[1];
  }
  
  // محاولة 5: أرقام/حروف فقط (كود مباشر)
  if (!extracted) {
    const cleanMatch = code.match(/^([A-Za-z0-9\-_]{3,30})$/);
    if (cleanMatch) extracted = cleanMatch[1];
  }
  
  // محاولة 6: أي نص بعد آخر : أو =
  if (!extracted) {
    const parts = code.split(/[:=]/);
    if (parts.length > 1) extracted = parts[parts.length - 1];
  }
  
  if (extracted) {
    return { type: 'student', value: extracted, raw: code };
  }
  
  return null;
};

// 🎯 معالجة الباركود الممسوح - الدخول الفوري
window.handleBarcodeScan = function(rawCode) {
  try {
    if (isProcessing) return;
    isProcessing = true;
    
    const status = document.getElementById('scanStatus');
    status.innerHTML = '<span class="scanning-animation"></span> جاري التحقق...';
    
    const parsed = window.parseBarcode(rawCode);
    if (!parsed) {
      status.textContent = '❌ باركود غير مفهوم';
      safeToast('❌ لم أستطع قراءة الباركود', 'error');
      isProcessing = false;
      return;
    }
    
    // لو QR حضور (مش باركود طالب)
    if (parsed.type === 'attendance') {
      // يمكن معالجة QR حضور هنا لاحقاً
      status.textContent = '⚠️ هذا QR حضور وليس باركود طالب';
      safeToast('⚠️ هذا QR لتسجيل الحضور', 'warning');
      isProcessing = false;
      return;
    }
    
    const codeValue = parsed.value.toUpperCase();
    
    // البحث عن الطالب
    const users = DataService?.getUsers ? DataService.getUsers() : [];
    const student = users.find(u => 
      u.role === 'student' && 
      ((u.code || '').toUpperCase() === codeValue || 
       u.id === codeValue ||
       (u.code || '').toUpperCase().replace(/^(EDU-|EDU:)/i, '') === codeValue.replace(/^(EDU-|EDU:)/i, ''))
    );
    
    if (!student) {
      status.textContent = '❌ طالب غير مسجل';
      safeToast('❌ الكود "' + parsed.value + '" غير مسجل', 'error');
      isProcessing = false;
      return;
    }
    
    status.innerHTML = '✅ مرحباً ' + student.name + '! جاري فتح الداشبورد...';
    stopCamera();
    
    // 🎯 الدخول الفوري - لا تسجيل دخول مطلوب!
    window.directLoginToStudent(student);
    
  } catch (e) {
    console.error('handleBarcodeScan error:', e);
    safeToast('خطأ في المعالجة: ' + e.message, 'error');
    isProcessing = false;
  }
};

// 🚀 الدخول الفوري للداشبورد بدون تسجيل دخول
window.directLoginToStudent = function(student) {
  try {
    // 1. حفظ الطالب كـ session مؤقت
    const sessionData = {
      id: student.id,
      code: student.code,
      name: student.name,
      role: student.role || 'student',
      barcodeLogin: true,
      loginAt: Date.now(),
      expiresAt: Date.now() + (24 * 60 * 60 * 1000) // 24 ساعة
    };
    
    // 2. حفظ في sessionStorage
    sessionStorage.setItem('eduflow_barcode_session', JSON.stringify(sessionData));
    sessionStorage.setItem('eduflow_user', JSON.stringify(student));
    sessionStorage.setItem('eduflow_viewas', JSON.stringify(student));
    
    // 3. حفظ في localStorage (بديل احتياطي)
    try {
      localStorage.setItem('eduflow_barcode_session', JSON.stringify(sessionData));
      localStorage.setItem('eduflow_user', JSON.stringify(student));
    } catch(e) {}
    
    // 4. تحديد الصفحة المستهدفة حسب الدور
    let targetPage = 'student-dashboard.html';
    if (student.role === 'parent') {
      targetPage = 'parent-dashboard.html';
    }
    
    // 5. إضافة parameter لتأكيد الدخول بالباركود
    const targetUrl = targetPage + '?barcode=' + encodeURIComponent(student.id) + '&direct=1';
    
    // 6. الانتقال المباشر
    safeToast('✅ أهلاً ' + student.name, 'success');
    
    setTimeout(() => {
      window.location.href = targetUrl;
    }, 500);
    
  } catch (e) {
    console.error('directLoginToStudent error:', e);
    safeToast('خطأ في الدخول', 'error');
    isProcessing = false;
  }
};

// Enter key للإدخال اليدوي
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('manualCode');
  if (input) {
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        window.handleBarcodeScan(input.value);
      }
    });
    input.focus();
  }
});
</script>
</body>
</html>
