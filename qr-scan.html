<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسح باركود - EduFlow by Habbash Group</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
.cam-wrap{max-width:520px;margin:20px auto;padding:16px;position:relative;z-index:1}
.cam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;transition:all .2s}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.brand-mini{display:flex;align-items:center;gap:8px}
.brand-mini-logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--glow)}
.brand-mini-text{font-size:14px;font-weight:800;color:var(--primary)}
.brand-mini-sub{font-size:10px;color:var(--text-muted);display:block;margin-top:2px}
.cam-box{position:relative;border-radius:var(--radius-xl);overflow:hidden;border:2px solid var(--primary);background:#000;aspect-ratio:1/1;box-shadow:0 8px 32px rgba(99,102,241,.25)}
.cam-box video{width:100%;height:100%;object-fit:cover}
.cam-box img.uploaded{width:100%;height:100%;object-fit:contain;background:#000}
.scan-line{position:absolute;left:8%;right:8%;height:3px;background:var(--primary);box-shadow:0 0 12px var(--primary);animation:scan 2s infinite;border-radius:2px}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
.cam-corners::before,.cam-corners::after{content:'';position:absolute;width:34px;height:34px;border:4px solid var(--primary)}
.cam-corners::before{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.cam-corners::after{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.cam-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cam-controls .btn{flex:1;min-width:120px}
.hint-box{background:var(--surface-hover);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--text-secondary);display:flex;gap:8px;align-items:flex-start}
.hint-box .icon{font-size:16px;flex-shrink:0}
.parent-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.15));border:1px solid rgba(251,191,36,.3);color:var(--text-secondary);font-size:10px;font-weight:700}
</style>
</head>
<body data-theme="dark">
<div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
<div class="cam-wrap">

<div class="cam-header">
  <a href="javascript:history.back()" class="back-btn">
    <span>←</span>
    <span>رجوع</span>
  </a>
  <div class="brand-mini">
    <div class="brand-mini-logo">🎓</div>
    <div>
      <div class="brand-mini-text">EduFlow</div>
      <span class="brand-mini-sub">by Habbash Group</span>
    </div>
  </div>
</div>

<h2 style="text-align:center;margin-bottom:6px;">📱 مسح باركود</h2>
<p class="text-sm text-muted" style="text-align:center;margin-bottom:16px;">
  وجّه الكاميرا على باركود الطالب أو الحصة
  <span class="parent-badge" style="margin-right:6px;">🏢 Habbash Group</span>
</p>

<div class="cam-box" id="camBox">
  <video id="preview" muted playsinline></video>
  <div class="scan-line" id="scanLine"></div>
  <div class="cam-corners"></div>
</div>

<div class="cam-controls">
  <button class="btn btn-secondary" onclick="window.toggleCamera()" id="flipBtn">
    🔄 تبديل الكاميرا
  </button>
  <button class="btn btn-secondary" onclick="document.getElementById('uploadInput').click()">
    🖼️ من الصورة
  </button>
  <input type="file" id="uploadInput" accept="image/*" style="display:none" onchange="window.handleUpload(event)">
</div>

<div id="scanStatus" class="filter-info" style="margin-top:12px;text-align:center;">🎥 تشغيل الكاميرا...</div>

<div class="hint-box">
  <span class="icon">💡</span>
  <div>
    <strong>نصيحة:</strong> وجّه الكاميرا على الباركود من مسافة 15-30 سم. لو في إضاءة ضعيفة، جرّب مسح الباركود من الصورة.
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <h3 style="font-size:14px;margin-bottom:10px;">⌨️ أو اكتب الكود يدوياً</h3>
  <div class="form-group">
    <label>الكود</label>
    <input type="text" id="manualCode" class="form-input" placeholder="EDU-1234 أو EDUFLOW-ATT:QR-XXXX" autocomplete="off">
  </div>
  <button class="btn btn-primary w-full" onclick="window.goManual()">➡️ فتح الملف / تسجيل الحضور</button>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/drive-service.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/auth-service.js"></script>

<script>
let currentUser=null, scanning=true, lastScan=0, stream=null;
let useFrontCamera=false;
const video=document.getElementById('preview');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

(async function boot(){
  try{
    if(typeof DataService?.init==='function') await DataService.init();
    currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
    if(!currentUser){ window.location.href='login.html'; return; }
    window.startCamera();
  }catch(e){ console.error(e); }
})();

window.startCamera=async function(){
  try{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:useFrontCamera?'user':'environment'},
      audio:false
    });
    video.srcObject=stream;
    video.style.display='block';
    const uploaded=document.querySelector('.cam-box img.uploaded');
    if(uploaded) uploaded.remove();
    const scanLine=document.getElementById('scanLine');
    if(scanLine) scanLine.style.display='block';
    await video.play();
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='✅ الكاميرا شغالة — امسح الباركود';
    scanning=true;
    requestAnimationFrame(window.tick);
  }catch(e){
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='⚠️ الكاميرا غير متاحة — استخدم الإدخال اليدوي أو رفع صورة';
    scanning=false;
  }
};

window.toggleCamera=async function(){
  useFrontCamera=!useFrontCamera;
  await window.startCamera();
  if(typeof ThemeManager?.toast==='function'){
    ThemeManager.toast(useFrontCamera?'📷 الكاميرا الأمامية':'📷 الكاميرا الخلفية','info');
  }
};

window.tick=function(){
  try{
    if(scanning && video.readyState===video.HAVE_ENOUGH_DATA && window.jsQR){
      canvas.width=video.videoWidth; 
      canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code && code.data && (Date.now()-lastScan>2500)){
        lastScan=Date.now();
        if(navigator.vibrate) navigator.vibrate(120);
        window.handleScan(code.data);
      }
    }
  }catch(e){}
  if(scanning) requestAnimationFrame(window.tick);
};

// 🆕 مسح باركود من صورة مرفوعة
window.handleUpload=async function(event){
  try{
    const file=event.target.files[0];
    if(!file) return;
    
    scanning=false;
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='🔍 جاري تحليل الصورة...';
    
    // عرض الصورة
    video.style.display='none';
    const scanLine=document.getElementById('scanLine');
    if(scanLine) scanLine.style.display='none';
    
    let uploadedImg=document.querySelector('.cam-box img.uploaded');
    if(!uploadedImg){
      uploadedImg=document.createElement('img');
      uploadedImg.className='uploaded';
      document.getElementById('camBox').appendChild(uploadedImg);
    }
    
    const reader=new FileReader();
    reader.onload=function(e){
      uploadedImg.src=e.target.result;
      const img=new Image();
      img.onload=function(){
        canvas.width=img.width;
        canvas.height=img.height;
        ctx.drawImage(img,0,0);
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        
        if(window.jsQR){
          const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'attemptBoth'});
          if(code && code.data){
            if(navigator.vibrate) navigator.vibrate([100,50,100]);
            if(st) st.innerHTML='✅ تم العثور على باركود في الصورة!';
            setTimeout(()=>window.handleScan(code.data),500);
          }else{
            if(st) st.innerHTML='❌ لم يتم العثور على باركود في الصورة — جرّب صورة أوضح';
            scanning=true;
          }
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }catch(e){
    console.error(e);
    if(typeof ThemeManager?.toast==='function') ThemeManager.toast('خطأ في قراءة الصورة','error');
  }
  event.target.value='';
};

window.goManual=function(){
  const v=document.getElementById('manualCode')?.value.trim();
  if(!v){
    if(typeof ThemeManager?.toast==='function') ThemeManager.toast('اكتب الكود الأول','warning');
    return;
  }
  window.handleScan(v);
};

// ✅ معالجة الباركود: طالب → بروفايل | حضور → تسجيل
window.handleScan=function(data){
  try{
    data=String(data||'').trim();
    if(!data){
      if(typeof ThemeManager?.toast==='function') ThemeManager.toast('باركود فارغ','error');
      return;
    }
    
    // 🆕 باركود حضور
    if(data.includes('EDUFLOW-ATT:')){
      const code=data.split('EDUFLOW-ATT:')[1]||'';
      if(currentUser?.role==='student'){
        (async()=>{
          const r=await DataService.checkInByCode(currentUser.id,code);
          if(typeof ThemeManager?.toast==='function'){
            ThemeManager.toast(r.success?'✅ تم تسجيل الحضور':r.message, r.success?'success':'error');
          }
          if(r.success){
            setTimeout(()=>{ window.location.href='student-dashboard.html'; },1200);
          }
        })();
      }else{
        // المساعد/Admin يمسح باركود حضور → يفتح صفحة الحضور للمجموعة
        if(typeof ThemeManager?.toast==='function'){
          ThemeManager.toast('📋 ده باركود حضور للطالب — يمسحه من داشبورده','warning');
        }
      }
      return;
    }
    
    // 🆕 باركود طالب
    const m=data.match(/code=([A-Za-z0-9-]+)/i)||data.match(/(EDU-[A-Z0-9-]+)/i);
    const code=m?m[1]:data;
    
    // لو المساعد/Admin → يفتح بروفايل الطالب
    if(currentUser?.role==='assistant'||currentUser?.role==='super_admin'||currentUser?.role==='teacher'){
      scanning=false;
      window.location.href='assistant-dashboard.html?openStudent='+encodeURIComponent(code);
    }else{
      // الطالب يمسح باركود طالب تاني؟ (مش شائع)
      scanning=false;
      window.location.href='student-qr.html?code='+encodeURIComponent(code);
    }
  }catch(e){
    console.error(e);
    if(typeof ThemeManager?.toast==='function') ThemeManager.toast('خطأ في معالجة الباركود','error');
  }
};

window.addEventListener('beforeunload',function(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }catch(e){}
});

// ✅ دعم اختصار Enter في حقل الإدخال اليدوي
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && document.activeElement?.id==='manualCode'){
    window.goManual();
  }
});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
