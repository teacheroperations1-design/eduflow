<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسح باركود - EduFlow by Habbash Group</title>
<link rel="stylesheet" href="css/eduflow-theme.css">
<style>
.cam-wrap{max-width:520px;margin:20px auto;padding:16px;position:relative;z-index:1}
.cam-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.back-btn{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;transition:all .2s}
.back-btn:hover{border-color:var(--primary);color:var(--primary)}
.brand-mini{display:flex;align-items:center;gap:8px}
.brand-mini-logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--glow)}
.brand-mini-text{font-size:14px;font-weight:800;color:var(--primary)}
.brand-mini-sub{font-size:10px;color:var(--text-muted);display:block;margin-top:2px}
.cam-box{position:relative;border-radius:var(--radius-xl);overflow:hidden;border:2px solid var(--primary);background:#000;aspect-ratio:1/1;box-shadow:0 8px 32px rgba(99,102,241,.25)}
.cam-box video{width:100%;height:100%;object-fit:cover}
.cam-box img.uploaded{width:100%;height:100%;object-fit:contain;background:#000}
.scan-line{position:absolute;left:8%;right:8%;height:3px;background:var(--primary);box-shadow:0 0 12px var(--primary);animation:scan 2s infinite;border-radius:2px}
@keyframes scan{0%,100%{top:12%}50%{top:86%}}
.cam-corners::before,.cam-corners::after{content:'';position:absolute;width:34px;height:34px;border:4px solid var(--primary)}
.cam-corners::before{top:10px;right:10px;border-left:none;border-bottom:none;border-radius:0 8px 0 0}
.cam-corners::after{bottom:10px;left:10px;border-right:none;border-top:none;border-radius:0 0 0 8px}
.cam-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cam-controls .btn{flex:1;min-width:120px}
.hint-box{background:var(--surface-hover);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;color:var(--text-secondary);display:flex;gap:8px;align-items:flex-start}
.hint-box .icon{font-size:16px;flex-shrink:0}
.parent-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:9999px;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.15));border:1px solid rgba(251,191,36,.3);color:var(--text-secondary);font-size:10px;font-weight:700}

/* 🆕 Smart Modal Styles */
.smart-modal-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(8px);}
.smart-modal-overlay.active{display:flex;}
.smart-modal-card{background:var(--surface); border:2px solid var(--primary); border-radius:20px; max-width:500px; width:100%; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.5); padding:24px; position:relative;}
.smart-student-header{background:var(--surface-hover); padding:16px; border-radius:12px; margin-bottom:20px; text-align:center; border:1px solid var(--border);}
.smart-student-name{font-size:24px; font-weight:900; color:var(--primary); margin-bottom:4px;}
.smart-action-box{background:var(--success-bg); border:1px solid var(--success); border-radius:12px; padding:14px; margin-bottom:16px;}
.smart-hw-box{background:var(--warning-bg); border:1px dashed var(--warning); border-radius:12px; padding:14px; margin-bottom:16px;}
</style>
</head>
<body data-theme="dark">
<div class="bg-grid"></div><div class="orb orb-1"></div><div class="orb orb-2"></div>
<div class="cam-wrap">

<div class="cam-header">
  <a href="javascript:history.back()" class="back-btn">
    <span>←</span>
    <span>رجوع</span>
  </a>
  <div class="brand-mini">
    <div class="brand-mini-logo">🎓</div>
    <div>
      <div class="brand-mini-text">EduFlow</div>
      <span class="brand-mini-sub">by Habbash Group</span>
    </div>
  </div>
</div>

<h2 style="text-align:center;margin-bottom:6px;">📱 مسح باركود</h2>
<p class="text-sm text-muted" style="text-align:center;margin-bottom:16px;">
  وجّه الكاميرا على باركود الطالب أو الحصة
  <span class="parent-badge" style="margin-right:6px;">🏢 Habbash Group</span>
</p>

<div class="cam-box" id="camBox">
  <video id="preview" muted playsinline></video>
  <div class="scan-line" id="scanLine"></div>
  <div class="cam-corners"></div>
</div>

<div class="cam-controls">
  <button class="btn btn-secondary" onclick="window.toggleCamera()" id="flipBtn">
    🔄 تبديل الكاميرا
  </button>
  <button class="btn btn-secondary" onclick="document.getElementById('uploadInput').click()">
    🖼️ من الصورة
  </button>
  <input type="file" id="uploadInput" accept="image/*" style="display:none" onchange="window.handleUpload(event)">
</div>

<div id="scanStatus" class="filter-info" style="margin-top:12px;text-align:center;">🎥 تشغيل الكاميرا...</div>

<div class="hint-box">
  <span class="icon">💡</span>
  <div>
    <strong>نصيحة:</strong> وجّه الكاميرا على الباركود من مسافة 15-30 سم. لو في إضاءة ضعيفة، جرّب مسح الباركود من الصورة.
  </div>
</div>

<div class="card" style="margin-top:16px;">
  <h3 style="font-size:14px;margin-bottom:10px;">⌨️ أو اكتب الكود يدوياً</h3>
  <div class="form-group">
    <label>الكود</label>
    <input type="text" id="manualCode" class="form-input" placeholder="EDU-1234 أو EDUFLOW-ATT:QR-XXXX" autocomplete="off">
  </div>
  <button class="btn btn-primary w-full" onclick="window.goManual()">➡️ فتح الملف / تسجيل الحضور</button>
</div>

</div>

<!-- 🆕 Smart Scan Modal (النظام الذكي للمساعد/الأدمن) -->
<div id="smartScanModal" class="smart-modal-overlay">
  <div class="smart-modal-card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h3 style="margin:0; color:var(--primary); display:flex; align-items:center; gap:8px;">⚡ إجراء سريع (النظام الذكي)</h3>
      <button class="btn btn-ghost btn-icon" onclick="window.closeSmartModal()">✕</button>
    </div>
    <div id="smartModalBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/firebase-service.js"></script>
<script src="js/data-service.js"></script>
<script src="js/operations-service.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/drive-service.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/auth-service.js"></script>

<script>
  /* 🆕 موحّد البحث عن الطالب بالكود (يقبل حروف كبيرة/صغيرة + مسافات + studentId احتياطي) */
window.normalizeCode=function(c){ return String(c||'').trim().toUpperCase().replace(/\s+/g,''); };
window.resolveStudentByCode=function(code){
  try{
    const nc=window.normalizeCode(code);
    const users=(DataService?.getUsers?DataService.getUsers():[])||[];
    return users.find(u=>u.role==='student' && window.normalizeCode(u.code)===nc)
        || users.find(u=>u.role==='student' && window.normalizeCode(u.studentId)===nc)
        || null;
  }catch(e){ return null; }
};
/* 🆕 إصلاح الطلاب اللي ملهمش كود (نفّذها مرة واحدة من console جهاز الإدارة) */
window.fixMissingCodes=function(){
  try{
    const d=DataService._getData(); const used=new Set((d.users||[]).map(u=>u.code).filter(Boolean));
    let n=0;
    (d.users||[]).forEach(u=>{
      if(u.role==='student' && !u.code){
        let c; do{ c='EDU-'+Math.floor(1000+Math.random()*9000); }while(used.has(c));
        u.code=c; used.add(c); n++;
      }
    });
    DataService._saveData(d);
    if(window.FirebaseService?.connected) FirebaseService.saveDoc('meta','codes_fixed',{at:new Date().toISOString(),fixed:n});
    alert('✅ تم توليد أكواد لـ '+n+' طالب — اطبع الباركودات تاني');
  }catch(e){ alert('خطأ: '+e.message); }
};
let currentUser=null, scanning=true, lastScan=0, stream=null;
let useFrontCamera=false;
const video=document.getElementById('preview');
const canvas=document.createElement('canvas');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

(async function boot(){
  try{
    if(typeof DataService?.init==='function') await DataService.init();
    currentUser = AuthService?.getCurrentUser ? AuthService.getCurrentUser() : null;
    if(!currentUser){ window.location.href='login.html'; return; }
    window.startCamera();
  }catch(e){ console.error(e); }
})();

window.startCamera=async function(){
  try{
    if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:useFrontCamera?'user':'environment'},
      audio:false
    });
    video.srcObject=stream;
    video.style.display='block';
    const uploaded=document.querySelector('.cam-box img.uploaded');
    if(uploaded) uploaded.remove();
    const scanLine=document.getElementById('scanLine');
    if(scanLine) scanLine.style.display='block';
    await video.play();
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='✅ الكاميرا شغالة — امسح الباركود';
    scanning=true;
    requestAnimationFrame(window.tick);
  }catch(e){
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='⚠️ الكاميرا غير متاحة — استخدم الإدخال اليدوي أو رفع صورة';
    scanning=false;
  }
};

window.toggleCamera=async function(){
  useFrontCamera=!useFrontCamera;
  await window.startCamera();
  if(typeof ThemeManager?.toast==='function'){
    ThemeManager.toast(useFrontCamera?'📷 الكاميرا الأمامية':'📷 الكاميرا الخلفية','info');
  }
};

window.tick=function(){
  try{
    if(scanning && video.readyState===video.HAVE_ENOUGH_DATA && window.jsQR){
      canvas.width=video.videoWidth; 
      canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
      if(code && code.data && (Date.now()-lastScan>2500)){
        lastScan=Date.now();
        if(navigator.vibrate) navigator.vibrate(120);
        window.handleScan(code.data);
      }
    }
  }catch(e){}
  if(scanning) requestAnimationFrame(window.tick);
};

window.handleUpload=async function(event){
  try{
    const file=event.target.files[0];
    if(!file) return;
    
    scanning=false;
    const st=document.getElementById('scanStatus');
    if(st) st.innerHTML='🔍 جاري تحليل الصورة...';
    
    video.style.display='none';
    const scanLine=document.getElementById('scanLine');
    if(scanLine) scanLine.style.display='none';
    
    let uploadedImg=document.querySelector('.cam-box img.uploaded');
    if(!uploadedImg){
      uploadedImg=document.createElement('img');
      uploadedImg.className='uploaded';
      document.getElementById('camBox').appendChild(uploadedImg);
    }
    
    const reader=new FileReader();
    reader.onload=function(e){
      uploadedImg.src=e.target.result;
      const img=new Image();
      img.onload=function(){
        canvas.width=img.width;
        canvas.height=img.height;
        ctx.drawImage(img,0,0);
        const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
        
        if(window.jsQR){
          const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'attemptBoth'});
          if(code && code.data){
            if(navigator.vibrate) navigator.vibrate([100,50,100]);
            if(st) st.innerHTML='✅ تم العثور على باركود في الصورة!';
            setTimeout(()=>window.handleScan(code.data),500);
          }else{
            if(st) st.innerHTML='❌ لم يتم العثور على باركود في الصورة — جرّب صورة أوضح';
            scanning=true;
          }
        }
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }catch(e){
    console.error(e);
    if(typeof ThemeManager?.toast==='function') ThemeManager.toast('خطأ في قراءة الصورة','error');
  }
  event.target.value='';
};

window.goManual=function(){
  const v=document.getElementById('manualCode')?.value.trim();
  if(!v){
    if(typeof ThemeManager?.toast==='function') ThemeManager.toast('اكتب الكود الأول','warning');
    return;
  }
  window.handleScan(v);
};

// ==========================================
// 🆕 النظام الذكي (Smart Modal Functions للمساعد/الأدمن)
// ==========================================
window.openSmartModal = function(student) {
    const teachers = DataService.getStudentTeachers ? DataService.getStudentTeachers(student.id) : [];
    if (!teachers.length) {
        ThemeManager.toast('هذا الطالب غير مسجل في أي مجموعة حالياً', 'error');
        return;
    }
    
    let groupsOptions = teachers.map(t => `<option value="${t.group.id}">${t.group.name} (${t.teacher.name})</option>`).join('');
    
    const gids = teachers.map(t => t.group.id);
    const allHw = DataService.getHomework ? DataService.getHomework() : [];
    const offlineHw = allHw.filter(h => gids.includes(h.groupId) && h.paper);
    
    let hwOptions = '<option value="">-- بدون تسجيل واجب ورقي --</option>' + 
        offlineHw.map(h => {
            const g = DataService.getGroups().find(gr => gr.id === h.groupId);
            return `<option value="${h.id}" data-max="${h.totalPoints || 10}">${h.title} (${g?.name || ''})</option>`;
        }).join('');

    const body = `
        <div class="smart-student-header">
            <div class="smart-student-name">${student.name}</div>
            <div class="text-sm text-muted">الكود: <strong style="font-family:var(--font-en);">${student.code}</strong> · ${student.grade || ''}</div>
        </div>
        
        <div class="smart-action-box">
            <label style="display:flex; align-items:center; gap:12px; cursor:pointer;">
                <input type="checkbox" id="smartAttend" checked style="width:24px; height:24px; accent-color:var(--success); flex-shrink:0;">
                <div>
                    <strong style="color:var(--success); font-size:15px;">✓ تسجيل حضور اليوم</strong>
                    <div class="text-xs text-muted" style="margin-top:2px;">سيتم احتساب الحصة ضمن حصص الشهر تلقائياً</div>
                </div>
            </label>
            <div class="form-group" style="margin-top:12px; margin-bottom:0;">
                <select id="smartGroup" class="form-select" ${teachers.length === 1 ? 'disabled' : ''}>
                    ${groupsOptions}
                </select>
            </div>
        </div>

        <div class="smart-hw-box">
            <label class="text-sm" style="font-weight:800; color:var(--warning); display:block; margin-bottom:8px;">📝 تسجيل درجة واجب ورقي (اختياري)</label>
            <div class="form-group" style="margin-bottom:8px;">
                <select id="smartHwSelect" class="form-select" onchange="window.updateSmartHwMax()">
                    ${hwOptions}
                </select>
            </div>
            <div class="form-group" id="smartHwGradeWrap" style="display:none; margin-bottom:0;">
                <div style="display:flex; gap:8px; align-items:center;">
                    <input type="number" id="smartHwGrade" class="form-input" min="0" step="0.5" placeholder="الدرجة">
                    <span class="text-sm" style="font-weight:800; color:var(--warning);" id="smartHwMaxLabel">/ 10</span>
                </div>
            </div>
        </div>

        <button class="btn btn-primary btn-lg w-full" onclick="window.submitSmartScan('${student.id}')" style="margin-top:8px; font-size:16px; padding:14px;">
            💾 حفظ الحضور والدرجة
        </button>
        <button class="btn btn-ghost w-full" onclick="window.closeSmartModal()" style="margin-top:8px;">إلغاء</button>
    `;
    
    document.getElementById('smartModalBody').innerHTML = body;
    document.getElementById('smartScanModal').classList.add('active');
    scanning = false;
    window.updateSmartHwMax();
};

window.updateSmartHwMax = function() {
    const sel = document.getElementById('smartHwSelect');
    const wrap = document.getElementById('smartHwGradeWrap');
    const lbl = document.getElementById('smartHwMaxLabel');
    if (!sel) return;
    const opt = sel.options[sel.selectedIndex];
    if (opt && opt.value) {
        wrap.style.display = 'block';
        const max = opt.getAttribute('data-max') || 10;
        lbl.textContent = '/ ' + max;
        document.getElementById('smartHwGrade').max = max;
    } else {
        wrap.style.display = 'none';
    }
};

window.closeSmartModal = function() {
    document.getElementById('smartScanModal').classList.remove('active');
    scanning = true;
    requestAnimationFrame(window.tick);
};

window.submitSmartScan = async function(studentId) {
    const attend = document.getElementById('smartAttend').checked;
    const groupId = document.getElementById('smartGroup').value;
    const hwId = document.getElementById('smartHwSelect').value;
    const hwGrade = document.getElementById('smartHwGrade').value;
    
    let successCount = 0;
    
    if (attend && groupId) {
        try {
            const group = DataService.getGroups().find(g => g.id === groupId);
            await DataService.submitAttendance({
                groupId: groupId,
                groupName: group?.name || '',
                submittedBy: currentUser.id,
                records: [{ studentId: studentId, status: 'present' }]
            });
            successCount++;
        } catch(e) { console.error('Att error', e); }
    }
    
    if (hwId && hwGrade) {
        try {
            const score = parseFloat(hwGrade);
            const hw = DataService.getHomeworkById ? DataService.getHomeworkById(hwId) : null;
            if (hw) {
                const d = DataService._getData();
                d.submissions = d.submissions || [];
                let sub = d.submissions.find(s => s.homeworkId === hwId && s.studentId === studentId);
                if (!sub) {
                    sub = {
                        id: 'sub_' + Date.now(),
                        homeworkId: hwId,
                        studentId: studentId,
                        score: score,
                        maxScore: hw.totalPoints || 10,
                        status: 'graded',
                        offline: true,
                        gradedBy: currentUser.id,
                        submittedAt: new Date().toISOString()
                    };
                    d.submissions.push(sub);
                } else {
                    sub.score = score;
                    sub.status = 'graded';
                    sub.offline = true;
                    sub.gradedBy = currentUser.id;
                }
                DataService._saveData(d);
                successCount++;
            }
        } catch(e) { console.error('HW error', e); }
    }
    
    if (successCount > 0) {
        ThemeManager.toast('✅ تم الحفظ بنجاح (الحضور + الدرجة)', 'success');
    } else {
        ThemeManager.toast('⚠️ لم يتم تحديد أي إجراء', 'warning');
    }
    
    window.closeSmartModal();
};
// ==========================================

// ✅ معالجة الباركود الشاملة (مع المنطق الصحيح للتوجيه)
window.handleScan = function(data) {
    try {
        data = String(data || '').trim();
        if (!data) return;

        // 1. باركود حضور (EDUFLOW-ATT) - يمسحه الطالب لتسجيل الحضور
        if (data.includes('EDUFLOW-ATT:')) {
            const code = data.split('EDUFLOW-ATT:')[1] || '';
            if (currentUser?.role === 'student') {
                (async () => {
                    const r = await DataService.checkInByCode(currentUser.id, code);
                    ThemeManager.toast(r.success ? '✅ تم تسجيل الحضور' : r.message, r.success ? 'success' : 'error');
                    if (r.success) setTimeout(() => { window.location.href = 'student-dashboard.html'; }, 1200);
                })();
            } else {
                ThemeManager.toast('📋 هذا باركود حضور، يجب أن يمسحه الطالب من هاتفه', 'warning');
            }
            return;
        }

        // 2. البحث عن كود (طالب أو ولي أمر)
        const m = data.match(/code=([A-Za-z0-9-]+)/i) || data.match(/(EDU-[A-Z0-9-]+)/i);
        const code = m ? m[1] : data;

        const allUsers = DataService.getUsers ? DataService.getUsers() : [];
        const student = allUsers.find(u => u.role === 'student' && (u.code === code || u.id === code));
        const parent = allUsers.find(u => u.role === 'parent' && (u.phone === code || u.id === code || u.parentPhone === code));

        if (!student && !parent) {
            ThemeManager.toast('❌ لم يتم العثور على طالب أو ولي أمر بهذا الكود', 'error');
            return;
        }

        // ==========================================
        // 🎯 التوجيه بناءً على صلاحية المستخدم الحالي:
        // ==========================================

        // A. الطالب يمسح الباركود
        if (currentUser?.role === 'student') {
            if (student && currentUser.id === student.id) {
                // ✅ الطالب يمسح باركوده الخاص → يوديه للدشابورد
                window.location.href = 'student-dashboard.html';
            } else {
                ThemeManager.toast('⚠️ لا يمكنك مسح باركود طالب آخر', 'error');
            }
            return;
        }

        // B. ولي الأمر يمسح الباركود
        if (currentUser?.role === 'parent') {
            if (parent && currentUser.id === parent.id) {
                // ✅ ولي الأمر يمسح باركوده الخاص
                window.location.href = 'parent-dashboard.html';
            } else if (student) {
                // ✅ ولي الأمر يمسح باركود ابنه → يتحقق من الربط ويوديه لدشابورد ولي الأمر
                const isMyChild = currentUser.studentIds?.includes(student.id) || 
                                  student.parentPhone === currentUser.phone ||
                                  student.parentPhone === currentUser.parentPhone;
                if (isMyChild) {
                    window.location.href = `parent-dashboard.html?studentId=${student.id}`;
                } else {
                    ThemeManager.toast('⚠️ هذا الطالب غير مرتبط بحسابك', 'error');
                }
            }
            return;
        }

        // C. مساعد / أدمن / مدرس → فتح النافذة الذكية
        if (currentUser?.role === 'assistant' || currentUser?.role === 'super_admin' || currentUser?.role === 'teacher') {
            if (student) {
                window.openSmartModal(student);
            } else if (parent) {
                ThemeManager.toast('ℹ️ هذا باركود ولي أمر، ابحث عن الطالب المرتبط به', 'info');
            }
            return;
        }

    } catch (e) {
        console.error(e);
        ThemeManager.toast('خطأ في معالجة الباركود', 'error');
    }
};

window.addEventListener('beforeunload',function(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
  }catch(e){}
});

document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && document.activeElement?.id==='manualCode'){
    window.goManual();
  }
});
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
