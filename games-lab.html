function cur(){try{return (typeof currentUser!=='undefined'&&currentUser)?currentUser:((window.AuthService&&AuthService.getCurrentUser)?AuthService.getCurrentUser():null);}catch(e){return null;}}
function cloud(g){try{if(window.FirebaseService&&FirebaseService._db)FirebaseService.saveDoc('gameBank',g.id,g);}catch(e){}}
function toast(m,t){try{if(window.safeToast)window.safeToast(m,t);}catch(e){}}
var TPLKEYS=['hearts','balloons','race','type','flip','wheel','match','sort','rush','path','target','maze','tower','boss'];
function mapTemplate(g){
  var t=String(g.template||g.lab||g.labId||g.type||'').toLowerCase();
  if(TPLKEYS.indexOf(t)>=0)return t;
  var n=String(g.name||g.title||'')+t;
  var map={'قلوب':'hearts','بالونات':'balloons','سباق':'race','اكتب':'type','كروت':'flip','عجل':'wheel','مطابق':'match','وصل':'match','ترتيب':'sort','نقاط':'rush','طريق':'path','قناص':'target','قنّاص':'target','متاه':'maze','برج':'tower','زعيم':'boss'};
  var k=Object.keys(map).find(function(x){return n.indexOf(x)>=0;});
  return k?map[k]:'hearts';
}
function mapQuestions(g){
  return (g.questions||g.qs||[]).map(function(q,i){
    var opts=q.options||q.choices||[];
    var txt=q.text||q.q||q.question||'';
    var cor=(q.correct!=null?q.correct:(q.correctIndex!=null?q.correctIndex:0))|0;
    if(opts.length===2&&/صح|خطأ|true|false/i.test(opts.join(' ')))return{id:'q'+i+'_'+(q.id||i),type:'tf',q:txt,options:['✅ صح','❌ خطأ'],correct:(/صح|true/i.test(String(opts[cor]))?0:1),img:''};
    return{id:'q'+i+'_'+(q.id||i),type:'mcq',q:txt,options:opts.slice(0,4),correct:Math.max(0,Math.min(cor,opts.length-1)),img:q.img||''};
  });
}
/* 🎯 التقاط أي حفظ من المعمل (أي مفتاح localStorage) */
try{
  var origSet=Storage.prototype.setItem;
  Storage.prototype.setItem=function(k,v){
    try{if(typeof v==='string'&&v.indexOf('"questions"')>=0){window.__GLLastRaw=v;window.__GLKey=k;}}catch(e){}
    return origSet.apply(this,arguments);
  };
}catch(e){}
function localGames(d){var u=cur();d.centerLocal=d.centerLocal||{};var cid=(u&&u.centerId)||'none';d.centerLocal[cid]=d.centerLocal[cid]||{games:[]};d.centerLocal[cid].games=d.centerLocal[cid].games||[];return d.centerLocal[cid].games;}
function scopeFor(meta){
  var u=cur()||{};
  if(u.role==='teacher')return{owner:u.id,teacherId:u.id,local:false};
  if(u.role==='assistant'){var t=null;try{t=window.getMyTeacherId?window.getMyTeacherId():null;}catch(e){}return{owner:u.id,teacherId:t||'',local:false};}
  if(u.role==='center')return{owner:u.id,teacherId:meta.teacherId||'',local:(meta.world==='local'),centerId:u.centerId||''};
  return{owner:u.id,teacherId:'',local:false};
}
window.GLPush=function(obj,meta){
  var u=cur();if(!u){toast('سجّل دخول الأول','error');return null;}
  meta=meta||window.__GLMeta||{};
  var questions=mapQuestions(obj);
  if(!questions.length){toast('مفيش أسئلة تتزامن','warning');return null;}
  var d=db();d.gameBank=d.gameBank||[];
  var ref=obj.id||obj.labId||((window.__GLKey||'')+'_'+(obj.name||obj.title||''));
  var scope=scopeFor(meta);
  var store=scope.local?localGames(d):d.gameBank;
  var g=store.find(function(x){return x.labRef===ref;});
  if(!g){g={id:'game_'+Date.now(),labRef:ref,createdAt:new Date().toISOString()};store.push(g);}
  g.title=obj.name||obj.title||'لعبة المعمل';
  g.template=mapTemplate(obj);
  g.questions=questions;
  g.targetGrades=(meta.grades||[]).slice();g.grade=(meta.grades||[])[0]||'';
  g.status=meta.status||'published';
  g.maxQ=obj.maxQ||10;g.lives=obj.lives||3;g.timeLimit=obj.timeLimit||0;g.pointsPer=obj.pointsPer||2;
  g.settings=Object.assign({lives:g.lives,perQ:g.timeLimit,per:g.pointsPer},obj.settings||{});
  g.visual=obj.visual||{theme:'classic',colors:''};
  g.gameplay=obj.gameplay||{difficulty:'medium'};
  g.owner=scope.owner;g.teacherId=scope.teacherId;g.local=scope.local;g.centerId=scope.centerId||'';g.labKey=window.__GLKey||'';
  g.updatedAt=new Date().toISOString();
  saveD(d);if(!scope.local)cloud(g);
  toast('🔄 "'+g.title+'" اتزامنت مع المنصة','success');
  return g;
};
function gradesForRole(){
  var u=cur()||{};var out=[];function push(g){if(g&&out.indexOf(g)<0)out.push(g);}
  var gs=(window.ScopedData&&ScopedData.groups)?ScopedData.groups():(DataService.getGroups?DataService.getGroups():[]);
  if(u.role==='admin'||u.role==='super_admin'){
    gs.forEach(function(g){push(g.grade);});
    var lv=(typeof EduFlowConfig!=='undefined'&&EduFlowConfig.educationLevels)?EduFlowConfig.educationLevels:{};
    Object.keys(lv).forEach(function(k){(lv[k].grades||[]).forEach(push);});
    return out;
  }
  if(u.role==='teacher'){gs.forEach(function(g){if(g.teacherId===u.id)push(g.grade);});return out;}
  if(u.role==='assistant'){var t=null;try{t=window.getMyTeacherId?window.getMyTeacherId():null;}catch(e){}gs.forEach(function(g){if(g.teacherId===t)push(g.grade);});return out;}
  var cn=u.centerName||'';if(!cn){var c=(db().centers||[]).find(function(x){return x.id===u.centerId;});cn=c?c.name:'';}
  gs.forEach(function(g){if(g.center===cn)push(g.grade);});
  (((db().centerLocal||{})[u.centerId||'none']||{}).groups||[]).forEach(function(g){push(g.grade);});
  return out;
}
window.__GLMeta={grades:[],status:'published',world:'platform',teacherId:''};
function fillTeachers(){
  var sel=document.getElementById('glTeacher');if(!sel)return;
  var u=cur()||{};var w=(document.getElementById('glWorld')||{}).value||'platform';var opts=[];
  if(w==='platform'){
    var cn=u.centerName||'';if(!cn){var c=(db().centers||[]).find(function(x){return x.id===u.centerId;});cn=c?c.name:'';}
    var tids={};(DataService.getGroups?DataService.getGroups():[]).forEach(function(g){if(g.center===cn&&g.teacherId)tids[g.teacherId]=1;});
    opts=(DataService.getTeachers?DataService.getTeachers():[]).filter(function(t){return tids[t.id];});
  }else{opts=(((db().centerLocal||{})[u.centerId||'none']||{}).teachers)||[];}
  sel.innerHTML=opts.length?opts.map(function(t){return '<option value="'+t.id+'">'+t.name+'</option>';}).join(''):'<option value="">لا أساتذة</option>';
}
function readMeta(){
  var m=window.__GLMeta;
  m.status=(document.getElementById('glStatus')||{}).value||'published';
  m.world=(document.getElementById('glWorld')||{}).value||'platform';
  m.teacherId=(document.getElementById('glTeacher')||{}).value||'';
  return m;
}
function refOf(o){ return o.id||o.labId||((window.__GLKey||'')+'_'+(o.name||o.title||'')); }
/* ========== 📦 سجل محفوظات لكل داخل (أدمن/أسست/أستاذ/سنتر) ========== */
function recKey(){ var u=cur(); return 'glRecord_'+((u&&u.id)||'anon'); }
function recList(){ try{ return JSON.parse(localStorage.getItem(recKey())||'[]'); }catch(e){ return []; } }
function recPush(g,meta,ref){
  var l=recList();
  var i=-1; for(var x=0;x<l.length;x++){ if(l[x].ref===ref){ i=x; break; } }
  var item={ref:ref,id:g.id,title:g.title,grades:(meta.grades||[]).slice(),world:meta.world||'platform',status:g.status,at:new Date().toISOString()};
  if(i>=0) l[i]=item; else l.unshift(item);
  try{ localStorage.setItem(recKey(),JSON.stringify(l.slice(0,30))); }catch(e){}
  renderRecord();
}
function renderRecord(){
  var box=document.getElementById('glRecord'); if(!box) return;
  var l=recList();
  box.innerHTML=l.length?l.slice(0,8).map(function(r){
    return '<div style="display:flex;gap:6px;align-items:center;justify-content:space-between;padding:4px 6px;border-radius:8px;background:rgba(255,255,255,.06);margin-bottom:4px;font-size:10px;">'+
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+(r.world==='local'?'🏢':'')+' '+r.title+' <span style="opacity:.7;">('+(r.grades.length?r.grades.join('،'):'كل الصفوف')+')</span></span>'+
      '<button type="button" style="background:none;border:none;color:#facc15;cursor:pointer;font-size:11px;" title="إعادة مزامنة" onclick="window.GLResync(\''+r.ref+'\')">🔄</button></div>';
  }).join(''):'<div style="font-size:10px;opacity:.6;text-align:center;">مفيش حفظات من الجهاز ده لسه</div>';
}
window.GLResync=function(ref){
  var r=recList().find(function(x){return x.ref===ref;});
  var o=lastObj(); if(!o){ toast('افتح اللعبة في المعمل الأول','warning'); return; }
  if(r){ window.__GLMeta.grades=r.grades.slice(); }
  var g=GLPush(o,readMeta()); if(g) recPush(g,readMeta(),ref);
};
function lastObj(){
  if(!window.__GLLastRaw)return null;
  try{var j=JSON.parse(window.__GLLastRaw);return Array.isArray(j)?(j[j.length-1]||null):j;}catch(e){return null;}
}
function buildPanel(){
  var u=cur();if(!u||u.role==='student'||u.role==='parent')return;
  if(document.getElementById('glBridgePanel'))return;
  var p=document.createElement('div');p.id='glBridgePanel';
  p.style.cssText='position:fixed;bottom:14px;inset-inline-start:14px;z-index:99999;width:272px;background:rgba(15,10,30,.93);border:1px solid rgba(139,92,246,.55);border-radius:16px;padding:12px;color:#fff;backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.55);font-family:inherit;';
  p.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><strong style="font-size:13px;">🌐 النشر للمنصة</strong><button id="glMin" style="background:none;border:none;color:#fff;cursor:pointer;font-size:14px;">—</button></div>'+
  '<div id="glBody">'+
  '<div style="font-size:11px;opacity:.85;margin-bottom:6px;">🎓 الصفوف المستهدفة (اختيار متعدد):</div>'+
  '<div id="glGrades" style="display:flex;gap:4px;flex-wrap:wrap;max-height:92px;overflow:auto;margin-bottom:8px;">'+(gradesForRole().map(function(g){return '<button type="button" class="glG" data-g="'+g+'" style="padding:4px 9px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;font-size:10px;font-weight:700;cursor:pointer;">'+g+'</button>';}).join('')||'<span style="font-size:10px;opacity:.6;">فاضي = كل الصفوف</span>')+'</div>'+
  ((cur()||{}).role==='center'?'<div style="display:grid;gap:6px;margin-bottom:8px;"><select id="glWorld" style="background:#1e1b36;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px;font-size:11px;"><option value="platform">🌐 طلاب المنصة</option><option value="local">🏢 سجلات السنتر (سبورة فقط)</option></select><select id="glTeacher" style="background:#1e1b36;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px;font-size:11px;"></select></div>':'')+
  '<select id="glStatus" style="width:100%;background:#1e1b36;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px;font-size:11px;margin-bottom:8px;"><option value="published">📢 منشور للطلاب</option><option value="draft">🔒 مسودة</option></select>'+
  '<button id="glPush" style="width:100%;padding:9px;border:none;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:800;font-size:12px;cursor:pointer;">🔄 مزامنة اللعبة الحالية</button>'+
  '<div id="glState" style="font-size:10px;opacity:.75;margin-top:6px;text-align:center;">بيستنى أول حفظ من المعمل…</div>'+
  '<div id="glScopeInfo" style="font-size:10px;opacity:.9;margin-top:6px;text-align:center;color:#a5b4fc;"></div>'+
  '<div style="margin-top:8px;"><div style="font-size:11px;font-weight:800;margin-bottom:4px;">📦 سجل حفظاتي</div><div id="glRecord" style="max-height:110px;overflow:auto;"></div></div>'+
  '</div>';
  document.body.appendChild(p);
  p.querySelector('#glMin').onclick=function(){var b=p.querySelector('#glBody');b.style.display=(b.style.display==='none')?'':'none';this.textContent=(b.style.display==='none')?'＋':'—';};
  p.querySelectorAll('.glG').forEach(function(b){b.onclick=function(){var on=!b.classList.contains('on');b.classList.toggle('on',on);b.style.background=on?'#8b5cf6':'rgba(255,255,255,.08)';var g=b.getAttribute('data-g');var arr=window.__GLMeta.grades;var i=arr.indexOf(g);if(on&&i<0)arr.push(g);if(!on&&i>=0)arr.splice(i,1);};});
  var wSel=p.querySelector('#glWorld');if(wSel)wSel.onchange=fillTeachers;
  p.querySelector('#glPush').onclick=function(){
    var o=lastObj(); if(!o){ toast('احفظ اللعبة من المعمل الأول','warning'); return; }
    var m=readMeta();
    if(m.status==='published'&&!m.grades.length){ toast('🎓 اختار الصف المستهدف الأول','warning'); return; }
    var g=GLPush(o,m); if(g) recPush(g,m,refOf(o));
  };
  fillTeachers(); renderRecord();
  var info=document.getElementById('glScopeInfo');
  if(info){ var uu=cur()||{}; var n=(window.fcGamesForRole?window.fcGamesForRole():[]).length; info.textContent='👤 '+(uu.name||'')+' · عندك '+n+' لعبة محفوظة مسبقاً في نطاقك'; }
}
/* 🔄 مزامنة تلقائية مع أي حفظ من المعمل */
var lastSnap='';var lastRef='';
setInterval(function(){
  var raw=window.__GLLastRaw||'';
  var st=document.getElementById('glState');
  if(raw&&raw!==lastSnap){
    lastSnap=raw;
    var list=null; try{ var j=JSON.parse(raw); list=Array.isArray(j)?j:[j]; }catch(e){}
    if(list){
      /* 🗑 مزامنة الحذف: لعبة اتبعتت من المعمل واتحذفت منه = تتحذف من المنصة */
      try{
        var refs={}; list.forEach(function(o){ if(o&&o.questions) refs[refOf(o)]=1; });
        var d=db(); var changed=false;
        (d.gameBank||[]).slice().forEach(function(g){
          if(g.labKey&&g.labKey===(window.__GLKey||'')&&g.labRef&&!refs[g.labRef]){
            d.gameBank=d.gameBank.filter(function(x){return x.id!==g.id;}); changed=true;
            try{ if(window.FirebaseService&&FirebaseService._db) FirebaseService.deleteDoc('gameBank',g.id); }catch(e){}
          }
        });
        if(changed){ saveD(d); if(st) st.textContent='🗑 تم مزامنة الحذف مع المنصة'; }
      }catch(e){}
      var o=list[list.length-1];
      if(o&&o.questions&&o.questions.length){
        var ref=refOf(o);
        if(ref!==lastRef){
          lastRef=ref;
          var p=document.getElementById('glBridgePanel');
          if(p){ p.style.display=''; var b=p.querySelector('#glBody'); if(b) b.style.display=''; }
          if(!(window.__GLMeta.grades||[]).length){
            toast('🎓 اللعبة دي للصف الكام؟ حدّد الصفوف قبل النشر','warning');
            var gw=document.getElementById('glGrades');
            if(gw){ gw.style.outline='3px solid #facc15'; setTimeout(function(){ gw.style.outline=''; },5000); }
          }
        }
        var m=readMeta();
        if(m.status==='published'&&!m.grades.length){ if(st) st.textContent='⚠️ اختار الصف الأول — أو حوّلها مسودة'; }
        else { var g=GLPush(o,m); if(g){ recPush(g,m,ref); if(st) st.textContent='✅ اتحفظت في سجلك: '+g.title; } }
      }
    }
  }
},2000);
function boot(){
  if(window.DataService&&DataService.init){DataService.init().then(function(){setTimeout(buildPanel,600);}).catch(function(){setTimeout(buildPanel,600);});}
  else setTimeout(boot,400);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
</body>
